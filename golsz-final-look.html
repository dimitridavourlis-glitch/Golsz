<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GOLSZ — Home + Plan, final look</title>
<style>
:root{
  --pitch:#0A0A0A;--card:#131519;--turf:#1C1E22;
  --chalk:#F7F4EA;--body:#ECE8DC;--slate:#8B96A8;
  --line:rgba(247,244,234,0.09);--line2:rgba(247,244,234,0.18);
  --lime:#D4AF37;--ink:#0D1210;--skel:rgba(247,244,234,0.07);--bad:#FF6B6B;--info:#5AA6FF;
  --limeSoft:rgba(212,175,55,.08);--limeBorder:rgba(212,175,55,.35);--shell:#16181c;
}
body.light{
  --pitch:#FDF9F2;--card:#FFFFFF;--turf:#ECE8DC;
  --chalk:#1B263B;--body:#1B263B;--slate:#5A6A7D;
  --line:#EAE4D7;--line2:#D5CDBC;--lime:#96700F;--ink:#FFFFFF;--skel:rgba(27,38,59,.07);--bad:#C0392B;--info:#1D6FD0;
  --limeSoft:rgba(150,112,15,.07);--limeBorder:rgba(150,112,15,.35);--shell:#cfc7b6;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:#050505;color:var(--body);
  font-family:'Archivo','Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.5;padding:18px 16px 60px;-webkit-font-smoothing:antialiased}
body.light{background:#E8E2D6}
button,input,select{font:inherit}
input,select{-webkit-appearance:none;appearance:none}

/* ---------- prototype chrome ---------- */
.controls{max-width:1240px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.cgroup{display:flex;gap:4px;background:var(--pitch);border:1px solid var(--line);border-radius:10px;padding:4px}
.cgroup button{border:none;background:none;color:var(--slate);font-size:12px;font-weight:700;
  padding:8px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.cgroup button[aria-pressed="true"]{background:var(--lime);color:var(--ink)}
.clabel{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--slate);align-self:center}
.note{max-width:1240px;margin:0 auto 18px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--lime);
  border-radius:13px;padding:14px 16px;font-size:12.5px;line-height:1.65;color:var(--slate)}
.note b{color:var(--chalk)}
.stage{max-width:1240px;margin:0 auto;display:flex;justify-content:center;gap:22px;flex-wrap:wrap}

/* ---------- device shells ---------- */
.phone{width:404px;max-width:100%;background:var(--pitch);border-radius:36px;border:9px solid var(--shell);
  box-shadow:0 26px 60px rgba(0,0,0,.45);overflow:hidden;position:relative;display:flex;flex-direction:column}
.desk{width:100%;max-width:1180px;background:var(--pitch);border-radius:18px;border:1px solid var(--line2);
  box-shadow:0 26px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;min-height:720px}
.rail{width:196px;flex:0 0 196px;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:3px}
.rail .wm{padding:0 10px 18px}
.rail button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;color:var(--slate);
  font-size:13px;font-weight:800;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;min-height:44px}
.rail button[aria-current="page"]{background:var(--limeSoft);color:var(--lime)}
.panes{flex:1;display:flex;min-width:0}
.pane{flex:1;min-width:0;padding:20px 20px 26px;overflow-y:auto;max-height:760px}
.pane+.pane{border-left:1px solid var(--line)}
.panehead{display:flex;align-items:baseline;gap:9px;margin-bottom:13px}
.panehead h2{font-size:15px;font-weight:900;color:var(--chalk);letter-spacing:-.01em}
.panehead span{font-size:10px;font-weight:800;letter-spacing:.13em;color:var(--slate);text-transform:uppercase}

.bar{height:52px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 18px 0}
.wm{font-size:15px;font-weight:900;letter-spacing:.055em;color:var(--chalk)}
.wm i{color:var(--lime);font-style:normal}
.scroll{flex:1;height:640px;overflow-y:auto;overflow-x:hidden;padding:8px 15px 20px;scrollbar-width:thin}
.scroll::-webkit-scrollbar{width:5px}
.scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.tabs{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--pitch);padding:6px 4px 10px}
.tabs button{flex:1;background:none;border:none;color:var(--slate);font-size:9.5px;font-weight:800;letter-spacing:.06em;
  cursor:pointer;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;text-transform:uppercase}
.tabs button[aria-current="page"]{color:var(--lime)}

/* ---------- shared primitives ---------- */
.eyebrow{font-size:9.5px;font-weight:900;letter-spacing:.15em;color:var(--slate);text-transform:uppercase;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:11px}
.card.owns{border-left:3px solid var(--lime)}      /* you can change this here */
.card.echo{border-left:2px solid var(--line2)}     /* this lives somewhere else */
.btn{border:1px solid var(--lime);background:var(--lime);color:var(--ink);font-size:13.5px;font-weight:800;
  padding:12px 15px;border-radius:11px;cursor:pointer;min-height:48px;display:flex;align-items:center;
  justify-content:center;gap:7px;width:100%}
.btn.quiet{background:none;border-color:var(--line2);color:var(--chalk)}
.btn.sm{min-height:42px;font-size:12.5px;padding:9px 12px;border-radius:10px}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn:active{transform:translateY(1px)}
.jump{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:none;
  border-top:1px solid var(--line);color:var(--lime);font-size:12px;font-weight:800;padding:12px 0 0;margin-top:12px;
  cursor:pointer;min-height:44px;text-align:left}
.ro{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--slate);text-transform:uppercase}
.hint{font-size:11.5px;color:var(--slate);line-height:1.5;margin-top:11px;display:flex;gap:7px;align-items:flex-start}
.hint svg{flex:0 0 auto;margin-top:2px}
.crumb{display:flex;align-items:center;gap:8px;border:1px dashed var(--limeBorder);border-radius:11px;padding:10px 12px;
  margin-bottom:10px;color:var(--lime);font-size:11.5px;font-weight:800}

/* identity */
.idrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.av{width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:var(--turf);border:1px solid var(--line2);
  display:grid;place-items:center;font-size:15px;font-weight:900;color:var(--lime)}
.idrow .n{font-size:16px;font-weight:900;color:var(--chalk);letter-spacing:-.01em;line-height:1.2}
.idrow .s{font-size:11.5px;color:var(--slate);margin-top:2px}

/* status rows (Home reports) */
.srow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-top:1px solid var(--line);
  padding:13px 0;cursor:pointer;text-align:left;min-height:54px;color:var(--body)}
.srow:first-of-type{border-top:none}
.srow .lbl{flex:1;min-width:0}
.srow .lbl b{display:block;font-size:13px;font-weight:800;color:var(--chalk)}
.srow .lbl span{display:block;font-size:11.5px;color:var(--slate);margin-top:2px}
.srow .val{font-size:15px;font-weight:900;flex:0 0 auto}

/* NEXT — Home owns it, computed, editable nowhere */
.next{border:1px solid var(--limeBorder);border-radius:14px;padding:16px;margin-bottom:11px;background:var(--limeSoft)}
.next .k{font-size:9.5px;font-weight:900;letter-spacing:.15em;color:var(--lime);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.next .lb{font-size:20px;font-weight:900;color:var(--chalk);line-height:1.24;letter-spacing:-.018em;margin:9px 0 5px;overflow-wrap:anywhere}
.next .sub{font-size:12.5px;color:var(--slate);line-height:1.5;margin-bottom:14px;overflow-wrap:anywhere}
.next .sub b{color:var(--lime)}
.next .sub b.over{color:var(--bad)}
.next .acts{display:flex;gap:8px}
.allDone{border:1px solid var(--limeBorder);border-radius:14px;padding:18px 16px;margin-bottom:11px;background:var(--limeSoft);text-align:center}
.allDone .lb{font-size:16px;font-weight:900;color:var(--chalk);margin:8px 0 4px}
.allDone .sub{font-size:12.5px;color:var(--slate);line-height:1.5}

/* conflict */
.conflict{border:1px solid var(--info);border-radius:12px;padding:12px 13px;margin-bottom:11px;
  font-size:12px;color:var(--chalk);line-height:1.5;display:flex;gap:9px;align-items:flex-start}
.conflict b{color:var(--info)}
.conflict .go{color:var(--info);font-weight:900;background:none;border:none;cursor:pointer;font-size:12px;padding:0;white-space:nowrap}

/* progress */
.prog{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.track{flex:1;display:block;height:7px;background:var(--skel);border-radius:4px;overflow:hidden}
.fill{display:block;height:100%;background:var(--lime);border-radius:4px;transition:width .25s ease}
.pnum{font-size:12px;font-weight:900;color:var(--chalk);flex:0 0 auto}

/* THE SPINE */
.stagegrp{margin-bottom:2px}
.sthead{display:flex;align-items:center;gap:11px;padding:12px 0 7px}
.stdot{width:14px;height:14px;flex:0 0 14px;border-radius:50%;border:2px solid var(--line2);background:var(--pitch)}
.stagegrp.done .stdot{background:var(--lime);border-color:var(--lime)}
.stagegrp.now .stdot{border-color:var(--lime);box-shadow:0 0 0 4px var(--limeSoft)}
.stname{font-size:12.5px;font-weight:900;color:var(--slate);letter-spacing:.03em;overflow-wrap:anywhere}
.stagegrp.now .stname{color:var(--chalk)}
.stmeta{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--slate);flex:0 0 auto;padding-left:8px}
.stbody{margin-left:6px;padding-left:19px;border-left:2px solid var(--line)}
.stagegrp.done .stbody,.stagegrp.now .stbody{border-left-color:var(--lime)}
.stagegrp:last-child .stbody{border-left-color:transparent}

.ms{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.ms.last{border-bottom:none}
.ms.drop{box-shadow:0 -2px 0 var(--lime)}
.ms.ghost{opacity:.35}
.tick{width:23px;height:23px;flex:0 0 23px;border-radius:7px;border:2px solid var(--line2);background:none;cursor:pointer;
  display:grid;place-items:center;margin-top:1px}
.tick.on{background:var(--lime);border-color:var(--lime)}
.mstx{flex:1;min-width:0}
.mslabel{font-size:14px;font-weight:700;color:var(--chalk);line-height:1.4;overflow-wrap:anywhere;cursor:pointer;
  background:none;border:none;text-align:left;padding:0;width:100%;display:block}
.ms.isdone .mslabel{color:var(--slate);text-decoration:line-through}
.msmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:11px;font-weight:800;border-radius:7px;padding:3px 8px;border:1px solid var(--line2);color:var(--slate);
  background:none;cursor:pointer;min-height:26px;display:inline-flex;align-items:center;gap:5px}
.chip.due{color:var(--lime);border-color:var(--limeBorder)}
.chip.over{color:var(--bad);border-color:var(--bad)}
.chip.none{border-style:dashed}
.chip.flat{border:none;padding:3px 0;cursor:default}
.grab{flex:0 0 30px;width:30px;min-height:30px;color:var(--slate);opacity:.45;cursor:grab;background:none;border:none;
  display:grid;place-items:center;touch-action:none;margin:-3px -6px 0 0}
.grab:hover{opacity:1}

.editor{border:1px solid var(--limeBorder);background:var(--limeSoft);border-radius:12px;padding:12px;margin:6px 0 10px}
.editor label{font-size:9.5px;font-weight:900;letter-spacing:.14em;color:var(--slate);text-transform:uppercase;display:block;margin-bottom:6px}
.fld{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:10px;color:var(--body);
  font-size:14px;padding:11px 12px;min-height:46px}
.fld:focus{outline:none;border-color:var(--lime)}
.datefld{color-scheme:dark}
body.light .datefld{color-scheme:light}
.eacts,.moverow{display:flex;gap:7px;margin-top:9px}
.eacts .btn,.moverow .btn{flex:1}

.addghost{display:flex;align-items:center;gap:9px;width:100%;background:none;border:1px dashed var(--line2);border-radius:10px;
  color:var(--slate);font-size:12.5px;font-weight:700;padding:10px 12px;min-height:44px;cursor:pointer;margin:9px 0 4px;text-align:left}
.addghost:hover{border-color:var(--lime);color:var(--lime)}
.addrow{display:flex;gap:7px;margin:9px 0 4px}
.addrow .fld{flex:1;min-width:0;font-size:13.5px}
.addrow button{background:none;border:1px solid var(--lime);color:var(--lime);border-radius:10px;padding:0 15px;min-height:46px;
  font-weight:800;font-size:13px;cursor:pointer;flex:0 0 auto}
.plus{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:1.5px solid var(--lime);color:var(--lime);
  display:grid;place-items:center;font-size:15px;font-weight:700;line-height:1}
.sugg{border:1px dashed var(--line2);border-radius:11px;padding:11px 13px;display:flex;align-items:center;gap:11px;
  margin-bottom:8px;cursor:pointer;background:none;width:100%;text-align:left;color:var(--chalk);min-height:54px}
.sugg:hover{border-color:var(--lime);border-style:solid}
.sugg .st{font-size:13.5px;font-weight:700;line-height:1.35;display:block}
.sugg .ss{font-size:11px;color:var(--slate);margin-top:2px;display:block}

.toast{position:absolute;left:14px;right:14px;bottom:78px;background:var(--turf);border:1px solid var(--line2);border-radius:12px;
  padding:11px 13px;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;color:var(--chalk);
  box-shadow:0 10px 26px rgba(0,0,0,.4);z-index:9}
.desk .toast{bottom:16px;left:auto;right:16px;width:300px}
.toast button{margin-left:auto;background:none;border:none;color:var(--lime);font-weight:900;font-size:12.5px;cursor:pointer;padding:6px 2px}
.stub{font-size:12.5px;color:var(--slate);line-height:1.55}
.pathstrip{display:flex;align-items:center;gap:5px;margin:11px 0 2px;flex-wrap:wrap}
.pnode{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--slate);
  border:1px solid var(--line2);border-radius:20px;padding:5px 10px;min-height:30px}
.pnode.on{color:var(--chalk);border-color:var(--lime)}
.pnode.fill{background:var(--limeSoft);color:var(--lime);border-color:var(--limeBorder)}
.pdash{color:var(--slate);font-size:11px}
</style>
</head>
<body>

<div class="controls">
  <span class="clabel">LAYOUT</span>
  <div class="cgroup" id="ly">
    <button data-v="phone" aria-pressed="true">Phone</button>
    <button data-v="desk" aria-pressed="false">Desktop</button>
  </div>
  <span class="clabel">DATA</span>
  <div class="cgroup" id="g">
    <button data-v="live" aria-pressed="true">Plan in progress</button>
    <button data-v="empty" aria-pressed="false">Empty plan</button>
  </div>
  <span class="clabel">THEME</span>
  <div class="cgroup" id="th">
    <button data-v="dark" aria-pressed="true">Dark</button>
    <button data-v="light" aria-pressed="false">Light</button>
  </div>
  <span class="clabel">LANG</span>
  <div class="cgroup" id="lg">
    <button data-v="en" aria-pressed="true">EN</button>
    <button data-v="el" aria-pressed="false">ΕΛ</button>
  </div>
</div>

<div class="note" id="note"></div>
<div class="stage" id="stage"></div>

  if(n<0){var a=-n;return {txt:(a<14?a+"d ":Math.round(a/7)+"w ")+t("overdue"),cls:"over"};}
  if(n===0) return {txt:t("today"),cls:"due"};
  if(n===1) return {txt:t("tomorrow"),cls:"due"};
  if(n<7) return {txt:dd.toLocaleDateString(loc,{weekday:"long"}),cls:"due"};

}

/* ---------------- actions ---------------- */
function addItem(stage,label,due){S.items.push({id:"m"+(++uid),stage:stage,label:label,due:due||null,done:false});}
function commitEdit(){
  if(!S.editing) return;
  var it=byId(S.editing);if(!it) return;
  var l=document.getElementById("ed_label"),d=document.getElementById("ed_date");
  if(l&&l.value.trim()) it.label=l.value.trim().slice(0,120);
  if(d) it.due=d.value||null;
  S.editing=null;
}
function move(id,dir){
  var it=byId(id),list=inStage(it.stage),ix=list.indexOf(it),j=ix+dir;
  if(j<0||j>=list.length) return;
  var a=S.items.indexOf(list[ix]),b=S.items.indexOf(list[j]);
  S.items[a]=list[j];S.items[b]=list[ix];
}
document.getElementById("stage").addEventListener("click",function(e){
  var nav=e.target.closest("[data-nav]");
  if(nav){ commitEdit(); S.page=nav.getAttribute("data-nav"); S.from=null; S.trash=null; render(); return; }
  var b=e.target.closest("[data-act]"); if(!b) return;
  var act=b.getAttribute("data-act"),id=b.getAttribute("data-id");
  if(act==="noop") return;
  if(act==="goplan"){ commitEdit(); S.page="plan"; S.from=b.getAttribute("data-from"); }
  else if(act==="tick"){ var it=byId(id); it.done=!it.done; if(S.editing===id) S.editing=null; }
  else if(act==="edit"){ commitEdit(); S.editing=id; S.adding=null; }
  else if(act==="save"){ commitEdit(); }
  else if(act==="cancel"){ S.editing=null; }
  else if(act==="del"){ var x=byId(id); S.trash={item:x,at:S.items.indexOf(x)};
    S.items.splice(S.items.indexOf(x),1); S.editing=null; }
  else if(act==="undo"){ S.items.splice(S.trash.at,0,S.trash.item); S.trash=null; }
  else if(act==="up"){ commitEdit(); move(id,-1); S.editing=id; }
  else if(act==="down"){ commitEdit(); move(id,1); S.editing=id; }
  else if(act==="addopen"){ commitEdit(); S.adding=id; }
  else if(act==="addsave"){ var f=document.getElementById("add_"+id);
    if(f&&f.value.trim()) addItem(id,f.value.trim().slice(0,120),null); S.adding=null; }
  else if(act==="addfree"){ var g=document.getElementById("add_free");
    if(g&&g.value.trim()) addItem("u19",g.value.trim().slice(0,120),null); }
  else if(act==="sugg"){ var m=[["u19",t("s1")],["sen",t("s2")],["u19",t("s3")]][+b.getAttribute("data-i")];
    addItem(m[0],m[1],null); }
  else if(act==="scout"){ DRAFT.forEach(function(x){addItem(x.s,x.l,x.d);}); }
  else if(act==="resolve"){ S.conflict=false; }
  if(act!=="del"&&act!=="undo") S.trash=null;
  render();
});
document.getElementById("stage").addEventListener("keydown",function(e){
  var id=e.target.id||"";
  if(e.key==="Enter"){
    if(id==="ed_label"||id==="ed_date"){ commitEdit(); render(); }
    else if(id.indexOf("add_")===0){
      var b=document.querySelector('[data-act="'+(id==="add_free"?"addfree":"addsave")+'"]'); if(b) b.click();
    }
  } else if(e.key==="Escape"){ S.editing=null; S.adding=null; render(); }
});
var stg=document.getElementById("stage");
stg.addEventListener("dragstart",function(e){
  var h=e.target.closest("[data-drag]"); if(!h) return;
  S.drag=h.getAttribute("data-drag");
  e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",S.drag);
});
stg.addEventListener("dragover",function(e){
  if(!S.drag) return; var r=e.target.closest("[data-row]"); if(!r) return;
  var a=byId(S.drag),b=byId(r.getAttribute("data-row"));
  if(!a||!b||a.stage!==b.stage||a===b) return;
  e.preventDefault();
  document.querySelectorAll(".ms.drop").forEach(function(x){x.classList.remove("drop");});
  r.classList.add("drop");
});
stg.addEventListener("drop",function(e){
  if(!S.drag) return; var r=e.target.closest("[data-row]"); if(!r) return;
  e.preventDefault();
  var a=byId(S.drag),b=byId(r.getAttribute("data-row"));
  if(a&&b&&a.stage===b.stage&&a!==b){ S.items.splice(S.items.indexOf(a),1); S.items.splice(S.items.indexOf(b),0,a); }
  S.drag=null; render();
});
stg.addEventListener("dragend",function(){ S.drag=null; render(); });
