   These are CSS custom properties (set in the CSS template below, values
   swapped per data-theme via useTheme()), NOT hardcoded hex — that's what
   makes the Settings > Background toggle able to reskin the whole app
   without touching every call site. C.ink is the one deliberate exception:
   it's the dark text color used on top of lime buttons/chips and must
   stay dark in both themes (a lime button with theme-following text would
   go illegible the moment lime gets darkened for the light theme), so it's
   a plain fixed hex, not a variable. Any NEW color added here should be a

/* ============ Supabase data helpers (Feed/Discover/Events/Messages) ============
   Everything here is always real data, fetched fresh on every visit — no
   hardcoded demo fallback anywhere anymore (the last of it, THREADS, was
   removed along with the rest: PASSPORT.media, FEED, PLAYERS, EVENTS).
   Screens show an explicit "Loading…" state while the fetch is in flight
   and an honest empty state when it resolves to nothing, rather than ever
   flashing or falling back to fake content. */
function useIsDesktop() {
  const [isDesktop, setIsDesktop] = useState(() => typeof window !== "undefined" && window.innerWidth >= 900);
  useEffect(() => {
    if (typeof window === "undefined" || !window.matchMedia) return;
    const mq = window.matchMedia("(min-width: 900px)");
    const handler = (e) => setIsDesktop(e.matches);
    if (mq.addEventListener) mq.addEventListener("change", handler); else mq.addListener(handler);
    setIsDesktop(mq.matches);
    return () => { if (mq.removeEventListener) mq.removeEventListener("change", handler); else mq.removeListener(handler); };
  }, []);
  return isDesktop;
}

/* ============ THEME (dark / light background) ============
   Persisted to localStorage + applied as a data-theme attribute on
   <html> (read synchronously by the inline script in <head>, before React
   even loads, so there's no flash of the wrong background on reload).
   Every color in C is a CSS var (see the CSS template below) so flipping
   this one attribute reskins the whole app — nothing else needs to know
   the theme exists. */
function useTheme() {
  const [theme, setThemeState] = useState(() => {
    try { return localStorage.getItem("golsz-theme") === "light" ? "light" : "dark"; } catch (e) { return "dark"; }
  });
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("golsz-theme", theme); } catch (e) {}
  }, [theme]);
  return [theme, setThemeState];
}

const LANGS = [["en", "English"], ["fr", "Français"], ["es", "Español"], ["el", "Ελληνικά"]];
const LangContext = React.createContext(null);
function useLang() {
  const ctx = useContext(LangContext);
  if (ctx) return ctx;
  return { lang: "en", setLang: () => {}, t: (k) => (I18N.en[k] || k) };
}
function LangProvider({ children }) {
  const [lang, setLang] = useState(() => {
    try { const saved = localStorage.getItem("golsz-lang"); if (saved && I18N[saved]) return saved; } catch (e) {}
    return "en";
  });
  useEffect(() => {
    try { localStorage.setItem("golsz-lang", lang); } catch (e) {}
  }, [lang]);
  const t = (key) => (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  return <LangContext.Provider value={{ lang, setLang, t }}>{children}</LangContext.Provider>;
}

/* ============ PUSH NOTIFICATIONS ============
   Real OS-level notifications (phone lock screen, laptop notification
   center) for new messages and new followers — sent server-side by
   api/send-push.js via Supabase Database Webhooks, not something the
   client can fake or simulate. This file only handles the subscribe/
   unsubscribe handshake and storing the subscription in push_subscriptions
   (migration 014); see api/send-push.js for what actually triggers a push. */
function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}
function pushSupported() {
  return typeof window !== "undefined" && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}
async function enablePushNotifications(uid) {
  if (!sb || !uid || !pushSupported()) return false;
  const permission = await Notification.requestPermission();
  if (permission !== "granted") return false;
  const reg = await navigator.serviceWorker.register("/sw.js");
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
  const json = sub.toJSON();
  const { error } = await sb.from("push_subscriptions").upsert(
    { user_id: uid, endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth },
    { onConflict: "endpoint" }
  );
  if (error) throw error;
  return true;
}
async function disablePushNotifications(uid) {
  if (!pushSupported()) return;
  const reg = await navigator.serviceWorker.getRegistration("/sw.js");
  const sub = reg && await reg.pushManager.getSubscription();
  if (sub) {
    if (sb && uid) await sb.from("push_subscriptions").delete().eq("endpoint", sub.endpoint);
    await sub.unsubscribe();
  }
}
function NotificationBell() {
  const { t } = useLang();
  const [uid, setUid] = useState(null);
  const [enabled, setEnabled] = useState(false);
  const [busy, setBusy] = useState(false);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  useEffect(() => {
    if (!sb || !pushSupported()) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) return;
        setUid(user.id);
        if (Notification.permission === "granted") {
          const reg = await navigator.serviceWorker.getRegistration("/sw.js");
          const sub = reg && await reg.pushManager.getSubscription();
          setEnabled(!!sub);
        }
      } catch (e) { console.error("GOLSZ push status check error:", e); }
    })();
    return () => { if (toastTimer.current) clearTimeout(toastTimer.current); };
  }, []);

  function showToast(msg) {
    setToast(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 4500);
  }

  async function toggle() {
    if (!uid || busy) return;
    setBusy(true);
    try {
      if (enabled) {
        await disablePushNotifications(uid);
        setEnabled(false);
        showToast(t("notif_off"));
      } else {
        const ok = await enablePushNotifications(uid);
        setEnabled(ok);
        showToast(ok ? t("notif_on") : t("notif_blocked"));
      }
    } catch (e) {
      console.error("GOLSZ push toggle error:", e);
      showToast(t("notif_error"));
    } finally { setBusy(false); }
  }

  if (!sb || !pushSupported()) return null;
  return (
    <span style={{ position: "relative", display: "inline-flex" }}>
      <button onClick={toggle} disabled={busy} title={enabled ? t("notif_title_on") : t("notif_title_off")}
        style={{ position: "relative", background: "none", border: "none", color: enabled ? C.lime : C.chalk, cursor: "pointer", padding: 4, opacity: busy ? 0.6 : 1 }}>
        <Bell size={22} />
        {enabled && <span style={{ position: "absolute", top: 3, right: 3, width: 7, height: 7, borderRadius: 99, background: C.lime, border: `2px solid ${C.pitch}` }} />}
      </button>
      {toast && (
        <div onClick={() => setToast(null)} style={{
          position: "absolute", top: "calc(100% + 10px)", right: 0, zIndex: 70, cursor: "pointer",
          background: C.card, border: `1px solid ${C.line2}`, borderRadius: 12, padding: "11px 13px",
          width: 230, fontSize: 12.5, lineHeight: 1.4, color: C.chalk,
          boxShadow: "0 14px 32px -14px rgba(0,0,0,0.75)",
        }} className="msg">
          <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
            <Bell size={14} color={enabled ? C.lime : C.slate} style={{ flexShrink: 0, marginTop: 1 }} />
            <span>{toast}</span>
          </div>
        </div>
      )}
    </span>
  );
}

function initials(name) {
  return (name || "").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?";
}
function timeAgo(iso) {
  const s = Math.max(1, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 3600) return Math.max(1, Math.floor(s / 60)) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}
/* A lightweight heuristic, not a real date parser — good enough to gate
   "save this message as an opportunity" on whether it actually mentions a
   date, rather than offering that on every single message. Matches month
   names, numeric dates, ISO dates, and day-of-week mentions. English-only
   (month/day names); numeric/ISO patterns still catch dates written in
   other languages since digits are universal. False negatives (a real
   date phrased in a way this misses) are the safe failure mode — the
   button just won't show, same as any message without a date. */
const DATE_MONTHS = "jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?";
const DATE_DAYS = "mon(?:day)?|tue(?:s(?:day)?)?|wed(?:nesday)?|thu(?:rs(?:day)?)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?";
const DATE_PATTERNS = [
  new RegExp(`\\b(${DATE_MONTHS})\\.?\\s+\\d{1,2}(st|nd|rd|th)?\\b`, "i"),
  new RegExp(`\\b\\d{1,2}(st|nd|rd|th)?\\s+(of\\s+)?(${DATE_MONTHS})\\b`, "i"),
  new RegExp(`\\b(next|this|coming)\\s+(${DATE_DAYS})\\b`, "i"),
  new RegExp(`\\b(${DATE_DAYS})\\b`, "i"),
  /\btomorrow\b/i,
  /\b\d{4}-\d{2}-\d{2}\b/,
  /\b\d{1,2}[\/\-.]\d{1,2}([\/\-.]\d{2,4})?\b/,
];
function hasDateMention(text) {
  return !!text && DATE_PATTERNS.some((re) => re.test(text));
}
const URL_RE_SPLIT = /(https?:\/\/[^\s]+)/g;
const URL_RE_TEST = /^https?:\/\/[^\s]+$/;
// Renders plain post text with any http(s) URL turned into a real link —
// this is the whole "links" half of Feed's photo/link attachment support:
// no separate link field, just paste a URL into the post and it's clickable.
// Two regexes deliberately: reusing one `g`-flagged RegExp for both
// .split() and .test() corrupts lastIndex between calls and silently
// drops every other match.
function Linkify({ text, color }) {
  if (!text) return null;
  const parts = text.split(URL_RE_SPLIT);
  return parts.map((part, i) => URL_RE_TEST.test(part)
    ? <a key={i} href={part} target="_blank" rel="noopener noreferrer" style={{ color: color || C.lime, wordBreak: "break-all" }}>{part}</a>
    : <span key={i}>{part}</span>
  );
}

/* ============ RESTRICTED MINOR BANNER ============
   Shown when the current user is a minor with no approved parent link —
   mirrors is_restricted_minor() in the database (the real enforcement is
   server-side RLS; this is just a visible explanation of why posting is
   blocked / why you don't show up in Discover). */
function RestrictedBanner() {
  const { t } = useLang();
  const [restricted, setRestricted] = useState(false);
  useEffect(() => {
    if (!sb) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) return;
        const { data: prof } = await sb.from("profiles").select("is_minor").eq("id", user.id).single();
        if (!prof || !prof.is_minor) return;
        const { data: approved } = await sb.from("parent_links").select("id").eq("athlete_id", user.id).not("approved_at", "is", null).limit(1);
        if (!approved || approved.length === 0) setRestricted(true);
      } catch (e) { console.error("GOLSZ restricted-check error:", e); }
    })();
  }, []);
  if (!restricted) return null;
  return (
    <div style={{ background: "#C89B3C1a", border: "1px solid #C89B3C44", borderRadius: 12, padding: "12px 14px", marginBottom: 12, display: "flex", alignItems: "center", gap: 10 }}>
      <span style={{ fontSize: 18 }}>🔒</span>
      <div style={{ fontSize: 12.5, color: C.chalk, lineHeight: 1.4 }}>
        <b style={{ color: C.amber }}>{t("restricted_title")}</b> {t("restricted_body")}
      </div>
    </div>
  );
}

/* ============ FEED ============ */
function Feed({ onMessage, onViewProfile }) {
  const { t } = useLang();
  const [posts, setPosts] = useState(null);
  const [query, setQuery] = useState("");
  const [liked, setLiked] = useState({});
  const [uid, setUid] = useState(null);
  const [blockedIds, setBlockedIds] = useState([]);
  const [reportedIds, setReportedIds] = useState({});
  const [following, setFollowing] = useState({});
  const [followedBy, setFollowedBy] = useState({});
  const [composeOpen, setComposeOpen] = useState(false);
  const [composeHeadline, setComposeHeadline] = useState("");
  const [composeBody, setComposeBody] = useState("");
  const [composeImageFile, setComposeImageFile] = useState(null);
  const [composeImagePreview, setComposeImagePreview] = useState(null);
  const [composeBusy, setComposeBusy] = useState(false);
  const [composeErr, setComposeErr] = useState("");
  const [savingEvent, setSavingEvent] = useState(null);
  const [sharedKey, setSharedKey] = useState(null);

  async function loadFeed() {
    if (!sb) return;
    try {
      const { data: { user } } = await sb.auth.getUser();
      if (user) setUid(user.id);

      let blocked = [];
      if (user) {
        const { data: blocks } = await sb.from("blocks").select("blocked_id").eq("blocker_id", user.id);
        blocked = (blocks || []).map((b) => b.blocked_id);
        setBlockedIds(blocked);
        const [{ data: myFollows }, { data: myFollowers }] = await Promise.all([
          sb.from("follows").select("followed_id").eq("follower_id", user.id),
          sb.from("follows").select("follower_id").eq("followed_id", user.id),
        ]);
        setFollowing(Object.fromEntries((myFollows || []).map((r) => [r.followed_id, true])));
        setFollowedBy(Object.fromEntries((myFollowers || []).map((r) => [r.follower_id, true])));
      }

      const { data, error } = await sb
        .from("posts")
        .select("id, author_id, kind, headline, body, image_url, likes_count, created_at")
        .order("created_at", { ascending: false })
        .limit(30);
      if (error) throw error;
      const visible = (data || []).filter((row) => !blocked.includes(row.author_id));
      if (visible.length) {
        // profiles has no public-read policy (dob is sensitive), so names come
        // from the public_profile_names view instead of an embed through profiles.
        const authorIds = [...new Set(visible.map((p) => p.author_id))];
        const [{ data: names }, { data: sports }] = await Promise.all([
          sb.from("public_profile_names").select("id, full_name").in("id", authorIds),
          sb.from("athletes").select("id, sport").in("id", authorIds),
        ]);
        const nameById = Object.fromEntries((names || []).map((r) => [r.id, r.full_name]));
        const sportById = Object.fromEntries((sports || []).map((r) => [r.id, r.sport]));
        setPosts(visible.map((row) => mapPost(row, nameById[row.author_id], sportById[row.author_id])));
        if (user) {
          const ids = visible.map((p) => p.id);
          const { data: mine } = await sb.from("post_likes").select("post_id").eq("profile_id", user.id).in("post_id", ids);
          if (mine) setLiked(Object.fromEntries(mine.map((r) => [r.post_id, true])));
        }
      } else {
        setPosts([]); // no real posts yet — honest empty state, no demo content
      }
    } catch (e) { console.error("GOLSZ feed fetch error:", e); setPosts((p) => p || []); }
  }
  useEffect(() => { loadFeed(); }, []);

  async function toggleLike(p, i) {
    if (!p.postId || !sb || !uid) {
      setLiked((l) => ({ ...l, [i]: !l[i] }));
      return;
    }
    const isLiked = !!liked[p.postId];
    setLiked((l) => ({ ...l, [p.postId]: !isLiked }));
    setPosts((ps) => ps.map((x) => x.postId === p.postId ? { ...x, likes: x.likes + (isLiked ? -1 : 1) } : x));
    try {
      const { error } = isLiked
        ? await sb.from("post_likes").delete().eq("post_id", p.postId).eq("profile_id", uid)
        : await sb.from("post_likes").insert({ post_id: p.postId, profile_id: uid });
      if (error) throw error;
    } catch (e) {
      console.error("GOLSZ like error:", e);
      setLiked((l) => ({ ...l, [p.postId]: isLiked })); // revert on failure
      setPosts((ps) => ps.map((x) => x.postId === p.postId ? { ...x, likes: x.likes + (isLiked ? 1 : -1) } : x));
    }
  }

  function pickImage(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // allow picking the same file again after removing it
    if (!file) return;
    if (!file.type.startsWith("image/")) { setComposeErr(t("feed_image_type_err")); return; }
    if (file.size > 8 * 1024 * 1024) { setComposeErr(t("feed_image_size_err")); return; }
    setComposeErr("");
    setComposeImageFile(file);
    setComposeImagePreview(URL.createObjectURL(file));
  }
  function clearImage() {
    if (composeImagePreview) URL.revokeObjectURL(composeImagePreview);
    setComposeImageFile(null);
    setComposeImagePreview(null);
  }

  async function createPost() {
    if (!sb || !uid || !composeHeadline.trim() || composeBusy) return;
    setComposeBusy(true); setComposeErr("");
    try {
      let imageUrl = null;
      if (composeImageFile) {
        const ext = (composeImageFile.name.split(".").pop() || "jpg").toLowerCase().slice(0, 5);
        const path = `${uid}/${Date.now()}.${ext}`;
        const { error: upErr } = await sb.storage.from("post-images").upload(path, composeImageFile);
        if (upErr) throw upErr;
        imageUrl = sb.storage.from("post-images").getPublicUrl(path).data.publicUrl;
      }
      const { error } = await sb.from("posts").insert({
        author_id: uid, kind: "post",
        headline: composeHeadline.trim().slice(0, 120),
        body: composeBody.trim() || null,
        image_url: imageUrl,
      });
      if (error) throw error;
      setComposeHeadline(""); setComposeBody(""); clearImage(); setComposeOpen(false);
      loadFeed();
    } catch (e) {
      console.error("GOLSZ create post error:", e);
      setComposeErr((e && e.message) ? e.message : t("feed_post_err"));
    } finally { setComposeBusy(false); }
  }

  async function sharePost(p, key) {
    const text = p.body ? `${p.who}: ${p.head} — ${p.body}` : `${p.who}: ${p.head}`;
    const url = `${window.location.origin}${window.location.pathname}?page=feed`;
    try {
      if (navigator.share) {
        await navigator.share({ title: "GOLSZ", text, url });
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(`${text}\n${url}`);
        setSharedKey(key);
        setTimeout(() => setSharedKey((k) => (k === key ? null : k)), 2000);
      }
    } catch (e) {
      if (e && e.name !== "AbortError") console.error("GOLSZ share error:", e);
    }
  }

  async function reportPost(p) {
    if (!sb || !uid || !p.postId || reportedIds[p.postId]) return;
    try {
      await sb.from("post_reports").insert({ post_id: p.postId, reporter_id: uid, reason: "reported from feed" });
      setReportedIds((r) => ({ ...r, [p.postId]: true }));
    } catch (e) { console.error("GOLSZ report error:", e); }
  }

  async function blockAuthor(p) {
    if (!sb || !uid || !p.authorId || p.authorId === uid) return;
    try {
      await sb.from("blocks").insert({ blocker_id: uid, blocked_id: p.authorId });
      loadFeed();
    } catch (e) { console.error("GOLSZ block error:", e); }
  }

  async function deletePost(p) {
    if (!sb || !uid || !p.postId || p.authorId !== uid) return;
    setPosts((ps) => ps.filter((x) => x.postId !== p.postId));
    try {
      const { error } = await sb.from("posts").delete().eq("id", p.postId);
      if (error) throw error;
    } catch (e) {
      console.error("GOLSZ delete post error:", e);
      loadFeed(); // revert the optimistic removal on failure
    }
  }

  async function toggleFollow(authorId) {
    if (!sb || !uid || !authorId || authorId === uid) return;
    const isFollowing = !!following[authorId];
    setFollowing((f) => ({ ...f, [authorId]: !isFollowing }));
    try {
      const { error } = isFollowing
        ? await sb.from("follows").delete().eq("follower_id", uid).eq("followed_id", authorId)
        : await sb.from("follows").insert({ follower_id: uid, followed_id: authorId });
      if (error) throw error;
    } catch (e) {
      console.error("GOLSZ follow error:", e);
      setFollowing((f) => ({ ...f, [authorId]: isFollowing })); // revert on failure
    }
  }

  const q = query.trim().toLowerCase();
  const visiblePosts = posts && (q ? posts.filter((p) => [p.who, p.head, p.body, p.sport].some((f) => (f || "").toLowerCase().includes(q))) : posts);

  return (
    <div style={{ padding: "8px 12px 16px" }}>
      <RestrictedBanner />
      <SectionTitle>{t("feed_title")}</SectionTitle>

      {sb && uid && !composeOpen && (
        <button onClick={() => setComposeOpen(true)} style={{
          ...card, width: "100%", display: "flex", alignItems: "center", gap: 10, cursor: "pointer",
          fontFamily: "inherit", textAlign: "left", padding: "10px 14px",
        }}>
          <Avatar size={30} init="+" />
          <span style={{ flex: 1, fontSize: 13.5, color: C.slate }}>{t("feed_share_update")}</span>
          <Plus size={17} color={C.lime} />
        </button>
      )}

      {sb && uid && composeOpen && (
        <div style={{ ...card, padding: 14 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
            <span style={{ fontSize: 11, letterSpacing: "0.12em", color: C.slate, fontWeight: 700 }}>{t("feed_new_post")}</span>
            <button onClick={() => { setComposeOpen(false); setComposeErr(""); clearImage(); }} style={iconBtn(C.slate)}><X size={16} /></button>
          </div>
          <input autoFocus value={composeHeadline} onChange={(e) => setComposeHeadline(e.target.value)} placeholder={t("feed_whats_happening")} maxLength={120}
            style={{ width: "100%", background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 10, color: C.chalk, padding: "10px 12px", fontSize: 14, fontFamily: "inherit", outline: "none", marginBottom: 8, boxSizing: "border-box" }} />
          <textarea value={composeBody} onChange={(e) => setComposeBody(e.target.value)} placeholder={t("feed_add_details")} rows={2}
            style={{ width: "100%", background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 10, color: C.chalk, padding: "10px 12px", fontSize: 13, fontFamily: "inherit", outline: "none", resize: "none", marginBottom: 8, boxSizing: "border-box" }} />
          {composeImagePreview && (
            <div style={{ position: "relative", marginBottom: 8, display: "inline-block" }}>
              <img src={composeImagePreview} style={{ maxHeight: 160, maxWidth: "100%", borderRadius: 10, display: "block" }} />
              <button onClick={clearImage} title={t("feed_remove_photo")} style={{
                position: "absolute", top: 6, right: 6, background: "#000000cc", border: "none", borderRadius: "50%",
                width: 24, height: 24, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: C.chalk,
              }}><X size={13} /></button>
            </div>
          )}
          {composeErr && <div style={{ fontSize: 11.5, color: C.amber, marginBottom: 8 }}>{composeErr}</div>}
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <label title={t("feed_add_photo")} style={{ display: "flex", alignItems: "center", cursor: "pointer", color: C.slate, padding: 6 }}>
              <input type="file" accept="image/*" onChange={pickImage} style={{ display: "none" }} />
              <ImageIcon size={19} />
            </label>
            <button onClick={createPost} disabled={!composeHeadline.trim() || composeBusy} style={{ background: C.lime, color: C.ink, border: "none", borderRadius: 9, padding: "9px 18px", fontWeight: 800, fontSize: 13, cursor: "pointer", fontFamily: "inherit", opacity: !composeHeadline.trim() || composeBusy ? 0.5 : 1 }}>
              {composeBusy ? t("feed_posting") : t("feed_post")}
            </button>
          </div>
        </div>
      )}

      {posts && posts.length > 0 && (
        <div style={{ position: "relative", marginBottom: 12, marginTop: 12 }}>
          <Search size={16} color={C.slate} style={{ position: "absolute", left: 13, top: "50%", transform: "translateY(-50%)" }} />
          <input
            value={query} onChange={(e) => setQuery(e.target.value)}
            placeholder={t("feed_search")}
            style={{
              width: "100%", background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 12,
              color: C.chalk, padding: "11px 14px 11px 38px", fontSize: 13.5, fontFamily: "inherit",
              outline: "none", boxSizing: "border-box",
            }}
          />
        </div>
      )}

      {posts === null && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "30px 0" }}>{t("loading")}</div>}
      {posts && posts.length === 0 && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "30px 0" }}>{t("feed_no_posts")}</div>}
      {posts && posts.length > 0 && visiblePosts.length === 0 && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "30px 0" }}>{t("feed_no_match")}</div>}
      {visiblePosts && visiblePosts.map((p, i) => {
        const key = p.postId || i;
        const isLiked = !!liked[key];
        return (
        <article key={key} style={card}>
          <div
            onClick={() => p.authorId && onViewProfile && onViewProfile(p.authorId)}
            style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 10, cursor: p.authorId ? "pointer" : "default" }}
          >
            <Avatar init={p.init} ring={C.lime} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ fontWeight: 700, fontSize: 14 }}>{p.who}</span>
                <span>{p.nat}</span>
              </div>
              <div style={{ fontSize: 11, color: C.slate, fontFamily: "'Space Mono', monospace" }}>{p.sport} · {p.ago}</div>
            </div>
            {p.kind !== "post" && (
              <div style={{
                width: 30, height: 30, borderRadius: "50%", flexShrink: 0, display: "flex",
                alignItems: "center", justifyContent: "center",
                background: p.kind === "perf" ? "#C89B3C1a" : "#C8F1351a",
                border: `1px solid ${p.kind === "perf" ? C.amber : C.lime}44`,
              }}>
                {p.kind === "commit" && <Trophy size={14} color={C.lime} />}
                {p.kind === "perf" && <Flame size={14} color={C.amber} />}
                {p.kind === "call" && <Radar size={14} color={C.lime} />}
                {p.kind === "clip" && <Video size={14} color={C.lime} />}
              </div>
            )}
          </div>
          <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 4 }}>{p.head}</div>
          {p.kind === "clip" && p.body ? (
            <a href={p.body} target="_blank" rel="noopener noreferrer" style={{ fontSize: 13.5, color: C.lime, lineHeight: 1.5, textDecoration: "none", display: "inline-flex", alignItems: "center", gap: 5 }}>
              <Video size={13} /> {t("highlights_watch")}
            </a>
          ) : (
            <div style={{ fontSize: 13.5, color: C.body, lineHeight: 1.5 }}><Linkify text={p.body} /></div>
          )}
          {p.image && (
            <img src={p.image} loading="lazy" style={{ width: "100%", maxHeight: 360, objectFit: "cover", borderRadius: 12, marginTop: 10, border: `1px solid ${C.line2}` }} />
          )}
          <div style={{ display: "flex", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
            {p.v.map((b) => <Badge key={b} label={b} />)}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 16, marginTop: 12, paddingTop: 10, borderTop: `1px solid ${C.line}` }}>
            <button onClick={() => toggleLike(p, i)}
              style={iconBtn(isLiked ? C.lime : C.slate)}>
              <Heart size={15} fill={isLiked ? C.lime : "none"} /> {p.likes + (isLiked && !p.postId ? 1 : 0)}
            </button>
            {p.postId && uid && p.authorId && p.authorId !== uid && (
              <button
                onClick={() => toggleFollow(p.authorId)}
                style={iconBtn(following[p.authorId] ? C.lime : C.slate)}
              >
                <Users size={15} fill={following[p.authorId] ? C.lime : "none"} /> {following[p.authorId] ? t("action_following") : t("action_follow")}
              </button>
            )}
            {p.postId && uid && p.authorId && p.authorId !== uid && (following[p.authorId] || followedBy[p.authorId]) && (
              <button onClick={() => onMessage && onMessage(p.authorId)} style={iconBtn(C.slate)}>
                <MessageSquare size={15} />
              </button>
            )}
            {p.postId && uid && (
              <button onClick={() => setSavingEvent(p)} style={iconBtn(C.slate)} title={t("messages_save_to_events")}>
                <CalendarPlus size={15} />
              </button>
            )}
            <button onClick={() => sharePost(p, key)} style={{ ...iconBtn(sharedKey === key ? C.lime : C.slate), marginLeft: "auto" }}>
              <ArrowUpRight size={15} /> {sharedKey === key ? t("action_copied") : t("action_share")}
            </button>
            {p.postId && uid && p.authorId !== uid && (
              <>
                <button onClick={() => reportPost(p)} style={{ ...iconBtn(reportedIds[p.postId] ? C.amber : C.slate), fontSize: 11 }}>
                  {reportedIds[p.postId] ? t("action_reported") : t("action_report")}
                </button>
                <button onClick={() => blockAuthor(p)} style={{ ...iconBtn(C.slate), fontSize: 11 }}>{t("action_block")}</button>
              </>
            )}
            {p.postId && uid && p.authorId === uid && (
              <button onClick={() => deletePost(p)} style={{ ...iconBtn(C.amber), fontSize: 11 }}><Trash2 size={13} /> {t("action_delete")}</button>
            )}
          </div>
        </article>
        );
      })}
      {savingEvent && (
        <AddToEventsModal
          initialTitle={savingEvent.head}
          initialNotes={savingEvent.body}
          onClose={() => setSavingEvent(null)}
          onSaved={() => setSavingEvent(null)}
        />
      )}
    </div>
  );
}

/* ============ DISCOVER (player database) ============ */

const GENDERS = [["All", "All"], ["M", "Male"], ["F", "Female"]];

// Real position lists per sport (used by ProfileEditor's position suggestions)
// and, where a sport actually has a handedness/footedness attribute scouts

  Hockey: ["Goalie", "Left Defense", "Right Defense", "Center", "Left Wing", "Right Wing"],

const SPORT_PREFERENCE = {

  Hockey: { label: "SHOOTS", options: ["Left", "Right"] },
  Basketball: { label: "DOMINANT HAND", options: ["Left", "Right", "Ambidextrous"] },

};

function Discover({ onMessage, onViewProfile }) {
  const { t } = useLang();
  const [query, setQuery] = useState("");
  const [players, setPlayers] = useState(null);
  const [uid, setUid] = useState(null);
  const [following, setFollowing] = useState({});
  const [followedBy, setFollowedBy] = useState({});

  useEffect(() => {
    if (!sb) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (user) {
          setUid(user.id);
          const [{ data: myFollows }, { data: myFollowers }] = await Promise.all([
            sb.from("follows").select("followed_id").eq("follower_id", user.id),
            sb.from("follows").select("follower_id").eq("followed_id", user.id),
          ]);
          setFollowing(Object.fromEntries((myFollows || []).map((r) => [r.followed_id, true])));
          setFollowedBy(Object.fromEntries((myFollowers || []).map((r) => [r.follower_id, true])));
        }
        const { data, error } = await sb
          .from("athletes")
          .select("id, sport, position, gender, grad_year, country")
          .limit(200);
        if (error) throw error;
        if (data && data.length) {
          const ids = data.map((r) => r.id);
          const { data: names } = await sb.from("public_profile_names").select("id, full_name").in("id", ids);
          const nameById = Object.fromEntries((names || []).map((r) => [r.id, r.full_name]));
          setPlayers(data.map((row) => mapAthlete(row, nameById[row.id])));
        } else {
          setPlayers([]); // no real athletes yet — honest empty state, no demo content
        }
      } catch (e) { console.error("GOLSZ discover fetch error:", e); setPlayers((p) => p || []); }
    })();
  }, []);

  async function toggleFollow(id) {
    if (!sb || !uid || !id || id === uid) return;
    const isFollowing = !!following[id];
    setFollowing((f) => ({ ...f, [id]: !isFollowing }));
    try {
      const { error } = isFollowing
        ? await sb.from("follows").delete().eq("follower_id", uid).eq("followed_id", id)
        : await sb.from("follows").insert({ follower_id: uid, followed_id: id });
      if (error) throw error;
    } catch (e) {
      console.error("GOLSZ follow error:", e);
      setFollowing((f) => ({ ...f, [id]: isFollowing }));
    }
  }

  const q = query.trim().toLowerCase();
  const results = (players || []).filter((p) =>
    !q || [p.n, p.sport, p.pos, p.country, p.g].some((f) => (f || "").toLowerCase().includes(q))
  );

  return (
    <div style={{ padding: "8px 12px 16px" }}>
      <SectionTitle>{t("discover_title")}</SectionTitle>
      <div style={{ position: "relative", marginBottom: 4 }}>
        <Search size={16} color={C.slate} style={{ position: "absolute", left: 13, top: "50%", transform: "translateY(-50%)" }} />
        <input

/* ============ EVENTS ============ */
/* Saving a post or message as "an opportunity" (a combine, a coach's trial
   offer, etc.) and manually adding one both go through this same modal —
   it always inserts a private events row (visibility: 'private'), reusing
   the public events table/schema rather than a parallel one. Only the
   owner (or an admin) can read a private row back, per events_read in
   migration 011. */
function AddToEventsModal({ initialTitle, initialNotes, onClose, onSaved }) {
  const { t } = useLang();
  const [title, setTitle] = useState(initialTitle || "");
  const [sport, setSport] = useState("");
  const [location, setLocation] = useState("");
  const [level, setLevel] = useState("");
  const [eventDate, setEventDate] = useState("");
  const [notes, setNotes] = useState(initialNotes || "");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const field = { width: "100%", background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 10, color: C.chalk, padding: "10px 12px", fontSize: 13.5, fontFamily: "inherit", outline: "none", boxSizing: "border-box" };
  const label = { fontSize: 9.5, letterSpacing: "0.1em", color: C.slate, fontWeight: 700, marginBottom: 5, display: "block" };

  async function save() {
    if (!sb || busy) return;
    if (!title.trim() || !eventDate) { setErr(t("events_err_title_date")); return; }
    setBusy(true); setErr("");
    try {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) throw new Error("Not signed in.");
      const { error } = await sb.from("events").insert({
        title: title.trim(), sport: sport || null, location: location.trim() || null,
        level: level.trim() || null, event_date: eventDate, notes: notes.trim() || null,
        created_by: user.id, visibility: "private",
      });
      if (error) throw error;
      onSaved();
    } catch (e) {
      console.error("GOLSZ add-to-events error:", e);
      setErr((e && e.message) || t("events_err_save"));
    } finally { setBusy(false); }
  }

  return (
    <div style={{ position: "fixed", inset: 0, background: "#000000cc", zIndex: 50, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div style={{ background: C.pitch, borderTop: `1px solid ${C.line2}`, borderRadius: "18px 18px 0 0", maxWidth: 480, width: "100%", maxHeight: "88vh", overflowY: "auto", padding: 18, boxSizing: "border-box" }} className="noscroll">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div style={{ fontWeight: 800, fontSize: 16 }}>{t("events_add_title")}</div>
          <button onClick={onClose} style={iconBtn(C.chalk)}><X size={18} /></button>
        </div>

        <div style={{ marginBottom: 12 }}>
          <span style={label}>{t("events_field_title")}</span>
          <input style={field} value={title} onChange={(e) => setTitle(e.target.value)} placeholder={t("events_title_ph")} />
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
          <div><span style={label}>{t("events_field_date")}</span>
            <input type="date" style={field} value={eventDate} onChange={(e) => setEventDate(e.target.value)} />
          </div>
          <div><span style={label}>{t("events_field_sport")}</span>
            <select style={field} value={sport} onChange={(e) => setSport(e.target.value)}>
              <option value="">—</option>
              {SPORTS.filter((s) => s !== "All").map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
          <div><span style={label}>{t("events_field_location")}</span>
            <input style={field} value={location} onChange={(e) => setLocation(e.target.value)} placeholder={t("events_location_ph")} />
          </div>
          <div><span style={label}>{t("events_field_level")}</span>
            <input style={field} value={level} onChange={(e) => setLevel(e.target.value)} placeholder={t("events_level_ph")} />
          </div>
        </div>

        <div style={{ marginBottom: 12 }}>
          <span style={label}>{t("events_field_notes")}</span>
          <textarea style={{ ...field, resize: "vertical", minHeight: 70 }} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder={t("events_notes_ph")} />
        </div>

        {err && <div style={{ color: C.amber, fontSize: 12, marginBottom: 10 }}>{err}</div>}
        <button onClick={save} disabled={busy} style={{
          width: "100%", background: C.lime, color: C.ink, border: "none", borderRadius: 12,
          padding: "13px", fontWeight: 800, fontSize: 15, fontFamily: "inherit",
          cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1,
        }}>{busy ? t("events_saving") : t("events_save")}</button>
      </div>
    </div>
  );

/* ============ MESSAGES ============ */
/* Real DMs: two profiles can message each other once one follows the
   other (either direction) — enforced server-side by can_message() in
   supabase-migration-007-messages.sql, not just hidden in the UI.
   `thread` is a real profile uuid (string) once a conversation is open,
   or null for the list view — always real data, no demo fallback. */
function Messages({ thread, setThread }) {
  const { t } = useLang();
  const [uid, setUid] = useState(null);
  const [conversations, setConversations] = useState(null);
  const [query, setQuery] = useState("");
  const [threadMsgs, setThreadMsgs] = useState([]);
  const [counterpart, setCounterpart] = useState(null);
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [savingEvent, setSavingEvent] = useState(null);
  const threadRef = useRef(thread);
  useEffect(() => { threadRef.current = thread; }, [thread]);

  useEffect(() => {
    if (!sb) return;
    (async () => {
      const { data: { user } } = await sb.auth.getUser();
      if (user) setUid(user.id);
    })();
  }, []);

  // live delivery: without this a conversation only ever refreshed on an
  // explicit action (opening it, hitting send) — postgres_changes respects
  // messages_read RLS, so this only ever fires for rows this user can
  // already see (see supabase-migration-015-realtime-messages.sql).
  useEffect(() => {
    if (!sb || !uid) return;
    const channel = sb
      .channel(`messages-inbox-${uid}`)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: `recipient_id=eq.${uid}` }, (payload) => {
        const m = payload.new;
        if (threadRef.current === m.sender_id) {
          setThreadMsgs((list) => (list.some((x) => x.id === m.id) ? list : [...list, m]));
          sb.from("messages").update({ read_at: new Date().toISOString() }).eq("id", m.id).then(() => {});
        }
        loadConversations();
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [uid]);

  async function loadConversations() {
    if (!sb || !uid) return;
    try {
      const { data, error } = await sb
        .from("messages")
        .select("id, sender_id, recipient_id, body, created_at, read_at")
        .or(`sender_id.eq.${uid},recipient_id.eq.${uid}`)
        .order("created_at", { ascending: false })
        .limit(300);
      if (error) throw error;
      const byCounterpart = new Map();
      for (const m of data || []) {
        const other = m.sender_id === uid ? m.recipient_id : m.sender_id;
        if (!byCounterpart.has(other)) byCounterpart.set(other, { last: m, unread: 0 });
        if (m.recipient_id === uid && !m.read_at) byCounterpart.get(other).unread += 1;
      }
      // a hidden conversation ("delete conversation") stays hidden until a
      // new message arrives after it was hidden — same as most DM apps'
      // delete/archive-thread behavior, without destroying any messages.
      const { data: hidden } = await sb.from("hidden_conversations").select("other_id, hidden_at").eq("user_id", uid);
      const hiddenAt = Object.fromEntries((hidden || []).map((h) => [h.other_id, h.hidden_at]));
      const ids = [...byCounterpart.keys()].filter((id) => {
        const h = hiddenAt[id];
        return !h || new Date(byCounterpart.get(id).last.created_at) > new Date(h);
      });
      let names = {};
      if (ids.length) {
        const { data: ppl } = await sb.from("public_profile_names").select("id, full_name").in("id", ids);
        names = Object.fromEntries((ppl || []).map((p) => [p.id, p.full_name]));
      }
      setConversations(ids.map((id) => {
        const { last, unread } = byCounterpart.get(id);
        const name = names[id] || "GOLSZ User";
        return { id, who: name, init: initials(name), last: last.body, ago: timeAgo(last.created_at), unread: unread > 0 };
      }));
    } catch (e) { console.error("GOLSZ messages load error:", e); setConversations([]); }
  }
  useEffect(() => { if (uid) loadConversations(); }, [uid]);

  async function hideConversation(otherId) {
    if (!sb || !uid) return;
    setConversations((list) => (list || []).filter((c) => c.id !== otherId));
    try {
      const { error } = await sb.from("hidden_conversations").upsert({ user_id: uid, other_id: otherId, hidden_at: new Date().toISOString() });
      if (error) throw error;
    } catch (e) {
      console.error("GOLSZ hide conversation error:", e);
      loadConversations(); // revert the optimistic removal on failure
    }
  }

  async function loadThread(otherId) {
    if (!sb || !uid || !otherId) return;
    try {
      const [{ data: ppl }, { data: msgs, error }] = await Promise.all([
        sb.from("public_profile_names").select("id, full_name").eq("id", otherId).maybeSingle(),
        sb.from("messages").select("id, sender_id, recipient_id, body, created_at, read_at")
          .or(`and(sender_id.eq.${uid},recipient_id.eq.${otherId}),and(sender_id.eq.${otherId},recipient_id.eq.${uid})`)
          .order("created_at", { ascending: true }),
      ]);
      if (error) throw error;
      setCounterpart({ id: otherId, name: (ppl && ppl.full_name) || "GOLSZ User" });
      setThreadMsgs(msgs || []);
      const unreadIds = (msgs || []).filter((m) => m.recipient_id === uid && !m.read_at).map((m) => m.id);
      if (unreadIds.length) {
        await sb.from("messages").update({ read_at: new Date().toISOString() }).in("id", unreadIds);
        loadConversations();
      }
    } catch (e) { console.error("GOLSZ thread load error:", e); }
  }
  useEffect(() => { if (typeof thread === "string" && uid) loadThread(thread); }, [thread, uid]);

  async function send() {
    if (!sb || !uid || typeof thread !== "string" || !text.trim() || busy) return;
    setBusy(true); setErr("");
    const body = text.trim().slice(0, 2000);
    try {
      const { error } = await sb.from("messages").insert({ sender_id: uid, recipient_id: thread, body });
      if (error) throw error;
      setText("");
      loadThread(thread);
      loadConversations();
    } catch (e) {
      console.error("GOLSZ send message error:", e);
      setErr(t("messages_cant_send"));
    } finally { setBusy(false); }
  }

  async function deleteMessage(id) {
    if (!sb || !uid) return;
    setThreadMsgs((list) => list.filter((m) => m.id !== id));
    try {
      const { error } = await sb.from("messages").delete().eq("id", id).eq("sender_id", uid);
      if (error) throw error;
    } catch (e) {
      console.error("GOLSZ delete message error:", e);
      loadThread(thread); // revert the optimistic removal on failure
    }
  }

  if (typeof thread === "string") {
    const name = (counterpart && counterpart.name) || "…";
    return (
      <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", borderBottom: `1px solid ${C.line}` }}>
          <button onClick={() => setThread(null)} style={iconBtn(C.chalk)}><ChevronLeft size={20} /></button>
          <Avatar init={initials(name)} size={36} />
          <div style={{ fontWeight: 700, fontSize: 14, color: C.msgName }}>{name}</div>
        </div>
        <div style={{ flex: 1, overflowY: "auto", padding: 14 }}>
          {threadMsgs.length === 0 && (
            <div style={{ textAlign: "center", color: C.slate, fontSize: 12.5, marginTop: 20 }}>
              {t("messages_say_hello_pre")}{name}{t("messages_say_hello_post")}
            </div>
          )}
          {threadMsgs.map((m) => (
            <div key={m.id} style={{ display: "flex", alignItems: "flex-end", gap: 6, marginBottom: 10, justifyContent: m.sender_id === uid ? "flex-end" : "flex-start" }}>
              {m.sender_id !== uid && hasDateMention(m.body) && (
                <button onClick={() => setSavingEvent(m)} title={t("messages_save_to_events")} style={{ background: "none", border: "none", color: C.slate, cursor: "pointer", padding: 4, flexShrink: 0 }}>
                  <CalendarPlus size={14} />
                </button>
              )}
              <div style={{
                maxWidth: "78%",
                background: m.sender_id === uid ? C.lime : C.turf, color: m.sender_id === uid ? C.ink : C.chalk,
                padding: "9px 12px", fontSize: 13.5, lineHeight: 1.45,
                borderRadius: m.sender_id === uid ? "12px 2px 12px 12px" : "2px 12px 12px 12px",
                border: m.sender_id === uid ? "none" : `1px solid ${C.line2}`, fontWeight: m.sender_id === uid ? 500 : 400,
              }}>{m.body}</div>
              {m.sender_id === uid && (
                <button onClick={() => deleteMessage(m.id)} title={t("messages_delete_msg")} style={{ background: "none", border: "none", color: C.slate, cursor: "pointer", padding: 4, flexShrink: 0 }}>
                  <Trash2 size={14} />
                </button>
              )}
            </div>
          ))}
        </div>
        {savingEvent && (
          <AddToEventsModal
            initialTitle={`${t("messages_opportunity_from")}${name}`}
            initialNotes={savingEvent.body}
            onClose={() => setSavingEvent(null)}
            onSaved={() => setSavingEvent(null)}
          />
        )}
        {err && <div style={{ padding: "0 12px 8px", color: C.amber, fontSize: 11.5 }}>{err}</div>}
        <div style={{ display: "flex", gap: 8, padding: "10px 12px", borderTop: `1px solid ${C.line}` }}>
          <input value={text} onChange={(e) => setText(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") send(); }}
            placeholder={t("messages_placeholder")} style={{
            flex: 1, background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 10,
            color: C.chalk, padding: "10px 12px", fontSize: 13.5, fontFamily: "inherit", outline: "none",
          }} />
          <button onClick={send} disabled={busy || !text.trim()} style={{
            background: C.lime, border: "none", borderRadius: 10, width: 44, color: C.ink,
            cursor: busy || !text.trim() ? "default" : "pointer", opacity: busy || !text.trim() ? 0.5 : 1,
          }}><Send size={16} /></button>
        </div>
      </div>
    );
  }

  const q = query.trim().toLowerCase();
  const visibleConversations = conversations && (q ? conversations.filter((t) => t.who.toLowerCase().includes(q)) : conversations);

  return (
    <div style={{ padding: "8px 12px 16px" }}>
      <SectionTitle>{t("messages_title")}</SectionTitle>
      {conversations && conversations.length > 0 && (
        <div style={{ position: "relative", marginBottom: 12 }}>
          <Search size={16} color={C.slate} style={{ position: "absolute", left: 13, top: "50%", transform: "translateY(-50%)" }} />
          <input
            value={query} onChange={(e) => setQuery(e.target.value)}
            placeholder={t("messages_search")}
            style={{

          {t("messages_empty")}
        </div>

        <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "30px 0" }}>{t("messages_no_match")}</div>

                <span style={{ marginLeft: "auto", fontSize: 10.5, color: C.slate }}>{conv.ago}</span>
              </div>

                {conv.last}

            <Trash2 size={16} />

        </div>
      ))}
    </div>
  );
}

/* ============ FAMILY & PARENT ACCESS ============
   Lets a parent (their own account) request access to a child's account by
   email, and lets the child approve/deny — the child is the only one who
   can set parent_links.approved_at (enforced server-side by RLS, see
   supabase-migration-003-parent-verification.sql). This is mutual in-app
   consent, not identity-verified parental consent. */
function FamilyAccess() {
  const { t } = useLang();
  const [uid, setUid] = useState(null);
  const [email, setEmail] = useState("");
  const [relationship, setRelationship] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [pending, setPending] = useState([]);
  const [grantedToMe, setGrantedToMe] = useState([]);
  const [myLinks, setMyLinks] = useState([]);

  async function load() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return;
    setUid(user.id);
    try {
      // real parent_links is (id, parent_id, athlete_id, relationship, approved_at, created_at) —
      // fetch both directions, then resolve counterpart names in a second pass instead of
      // embedding via a guessed FK constraint name.
      const [{ data: asChild }, { data: asParent }] = await Promise.all([
        sb.from("parent_links").select("id, relationship, approved_at, parent_id").eq("athlete_id", user.id),
        sb.from("parent_links").select("id, relationship, approved_at, athlete_id").eq("parent_id", user.id),
      ]);
      const otherIds = [...new Set([...(asChild || []).map((r) => r.parent_id), ...(asParent || []).map((r) => r.athlete_id)])];
      let names = {};
      if (otherIds.length) {
        const { data: ppl } = await sb.from("profiles").select("id, full_name").in("id", otherIds);
        if (ppl) names = Object.fromEntries(ppl.map((p) => [p.id, p.full_name]));
      }
      if (asChild) {
        const withNames = asChild.map((r) => ({ ...r, name: names[r.parent_id] }));
        setPending(withNames.filter((r) => !r.approved_at));
        setGrantedToMe(withNames.filter((r) => r.approved_at));
      }
      if (asParent) setMyLinks(asParent.map((r) => ({ ...r, name: names[r.athlete_id] })));
    } catch (e) { console.error("GOLSZ family load error:", e); }
  }
  useEffect(() => { if (sb) load(); }, []);

  async function requestLink() {
    if (!email.trim() || busy) return;
    setBusy(true); setMsg("");
    try {
      const { data, error } = await sb.rpc("request_parent_link", { p_child_email: email.trim(), p_relationship: relationship.trim() || null });
      if (error) throw error;
      setMsg(data ? t("family_sent_msg") : t("family_not_found_msg"));
      setEmail(""); setRelationship("");
      load();
    } catch (e) { setMsg(e.message || t("family_couldnt_send")); }
    finally { setBusy(false); }
  }
  async function approve(id) { try { await sb.from("parent_links").update({ approved_at: new Date().toISOString() }).eq("id", id); load(); } catch (e) { console.error("GOLSZ approve error:", e); } }
  async function remove(id) { try { await sb.from("parent_links").delete().eq("id", id); load(); } catch (e) { console.error("GOLSZ remove link error:", e); } }

  if (!sb || !uid) return null;
  const rowStyle = { display: "flex", alignItems: "center", gap: 8, padding: "6px 0" };
  const smallBtn = (outline) => ({ background: outline ? "transparent" : C.lime, color: outline ? C.slate : C.ink, border: outline ? `1px solid ${C.line2}` : "none", borderRadius: 7, padding: "5px 10px", fontSize: 11, fontWeight: 800, cursor: "pointer", fontFamily: "inherit" });

  return (
    <div style={{ ...card, marginBottom: 8 }}>
      <div style={{ fontSize: 9, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 10 }}>{t("family_title")}</div>

      {pending.length > 0 && (
        <div style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 11, color: C.amber, fontWeight: 700, marginBottom: 6 }}>{t("family_pending")}</div>
          {pending.map((r) => (
            <div key={r.id} style={rowStyle}>
              <span style={{ flex: 1, fontSize: 13 }}>{r.name || t("family_someone")}{t("family_wants_access")}{r.relationship ? ` (${r.relationship})` : ""}</span>
              <button onClick={() => approve(r.id)} style={smallBtn(false)}>{t("family_approve")}</button>
              <button onClick={() => remove(r.id)} style={smallBtn(true)}>{t("family_deny")}</button>
            </div>
          ))}
        </div>
      )}

      {grantedToMe.length > 0 && (
        <div style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 11, color: C.slate, fontWeight: 700, marginBottom: 6 }}>{t("family_granted_title")}</div>
          {grantedToMe.map((r) => (
            <div key={r.id} style={rowStyle}>
              <span style={{ flex: 1, fontSize: 13 }}>{r.name || t("family_parent_fallback")}{r.relationship ? ` · ${r.relationship}` : ""}</span>
              <button onClick={() => remove(r.id)} style={smallBtn(true)}>{t("family_revoke")}</button>
            </div>
          ))}
        </div>
      )}

      {myLinks.length > 0 && (
        <div style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 11, color: C.slate, fontWeight: 700, marginBottom: 6 }}>{t("family_mylinks_title")}</div>
          {myLinks.map((r) => (
            <div key={r.id} style={rowStyle}>
              <span style={{ flex: 1, fontSize: 13 }}>{r.name || t("family_athlete_fallback")}{r.relationship ? ` · ${r.relationship}` : ""}</span>
              <span style={{ fontSize: 10.5, color: r.approved_at ? C.lime : C.amber, fontWeight: 700 }}>{r.approved_at ? t("family_approved") : t("family_pending_status")}</span>
            </div>
          ))}
        </div>
      )}

      <div style={{ fontSize: 11, color: C.slate, fontWeight: 700, marginBottom: 6 }}>{t("family_request_title")}</div>
      <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
        <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder={t("family_email_ph")} style={{ flex: 1, background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 9, color: C.chalk, padding: "9px 11px", fontSize: 13, fontFamily: "inherit", outline: "none" }} />
      </div>
      <div style={{ display: "flex", gap: 6 }}>
        <input value={relationship} onChange={(e) => setRelationship(e.target.value)} placeholder={t("family_relationship_ph")} style={{ flex: 1, background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 9, color: C.chalk, padding: "9px 11px", fontSize: 13, fontFamily: "inherit", outline: "none" }} />
        <button onClick={requestLink} disabled={busy || !email.trim()} style={{ background: C.lime, color: C.ink, border: "none", borderRadius: 9, padding: "9px 14px", fontWeight: 800, fontSize: 12.5, cursor: "pointer", fontFamily: "inherit", opacity: busy || !email.trim() ? 0.5 : 1 }}>{t("family_send")}</button>
      </div>
      {msg && <div style={{ fontSize: 11.5, color: C.slate, marginTop: 8 }}>{msg}</div>}
      <div style={{ fontSize: 10.5, color: C.slate, marginTop: 10, lineHeight: 1.4 }}>
        {t("family_disclaimer")}
      </div>
    </div>
  );
}

/* ============ VERIFIED MEDIA (highlight reels) ============
   Link-based, not hosted video — athletes paste a link to footage already
   hosted elsewhere (YouTube, Veo, Hudl...). Stored in the athletes.highlights
   jsonb column. Always real data — no demo placeholders — and each entry
   only ever shows its title and link, nothing fabricated. */
function Highlights({ viewUserId }) {
  const { t } = useLang();
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [uid, setUid] = useState(null);
  const [title, setTitle] = useState("");
  const [url, setUrl] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const isOwner = !!(uid && (!viewUserId || viewUserId === uid));

  useEffect(() => {
    if (!sb) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) return;
        setUid(user.id);
        const targetId = viewUserId || user.id;
        const { data, error } = await sb.from("athletes").select("highlights").eq("id", targetId).single();
        if (error) throw error;
        setItems(Array.isArray(data && data.highlights) ? data.highlights : []);
        setLoaded(true);
      } catch (e) { console.error("GOLSZ highlights load error:", e); }
    })();
  }, [viewUserId]);

  async function saveList(list) {
    if (!sb || !uid || !isOwner) return;
    try { await sb.from("athletes").update({ highlights: list }).eq("id", uid); }
    catch (e) { console.error("GOLSZ highlights save error:", e); }
  }

  async function addHighlight() {
    if (!sb || !uid || !isOwner || !title.trim() || !url.trim() || busy) return;
    setBusy(true); setErr("");
    try {
      let parsed;
      try { parsed = new URL(url.trim()); } catch { throw new Error(t("highlights_invalid_url")); }
      const entry = {
        id: (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()),
        title: title.trim(), url: parsed.toString(),
      };
      const next = [...items, entry];
      await saveList(next);
      setItems(next);
      setTitle(""); setUrl("");
      // also share it to Feed as a clip post, same as any other post — the
      // 'clip' kind already existed in posts' schema and the original demo
      // Feed data for exactly this ("New defensive highlight reel is live")
      try { await sb.from("posts").insert({ author_id: uid, kind: "clip", headline: entry.title, body: entry.url }); }
      catch (e) { console.error("GOLSZ clip post error:", e); }
    } catch (e) {
      setErr((e && e.message) ? e.message : t("highlights_add_err"));
    } finally { setBusy(false); }
  }

  async function removeHighlight(id) {
    if (!sb || !uid || !isOwner) return;
    const next = items.filter((m) => m.id !== id);
    setItems(next);
    await saveList(next);
  }

  return (
    <div style={{ ...card }}>
      <div style={{ fontSize: 9, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 8 }}>{t("highlights_title")}</div>
      {loaded && items.length === 0 && (
        <div style={{ fontSize: 12.5, color: C.slate }}>{t("highlights_empty")}</div>
      )}
      {items.map((m, i) => (
        <div key={m.id || i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 0", borderBottom: i < items.length - 1 ? `1px solid ${C.line}` : "none" }}>
          <div style={{ width: 6, height: 6, borderRadius: 99, background: C.lime, flexShrink: 0 }} />
          {m.url ? (
            <a href={m.url} target="_blank" rel="noopener noreferrer" style={{ fontSize: 13, flex: 1, color: C.chalk, textDecoration: "none" }}>{m.title}</a>
          ) : (
            <span style={{ fontSize: 13, flex: 1 }}>{m.title}</span>
          )}
          {isOwner && m.id && (
            <button onClick={() => removeHighlight(m.id)} style={{ background: "none", border: "none", color: C.slate, cursor: "pointer", padding: 0, marginLeft: 4, display: "flex" }}><X size={13} /></button>
          )}
        </div>
      ))}
      {sb && isOwner && (
        <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.line}` }}>
          <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder={t("highlights_title_ph")}
            style={{ width: "100%", background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 9, color: C.chalk, padding: "9px 11px", fontSize: 12.5, fontFamily: "inherit", outline: "none", marginBottom: 6, boxSizing: "border-box" }} />
          <div style={{ display: "flex", gap: 6 }}>
            <input value={url} onChange={(e) => setUrl(e.target.value)} placeholder={t("highlights_link_ph")}
              style={{ flex: 1, background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 9, color: C.chalk, padding: "9px 11px", fontSize: 12.5, fontFamily: "inherit", outline: "none", boxSizing: "border-box" }} />
            <button onClick={addHighlight} disabled={!title.trim() || !url.trim() || busy} style={{ background: C.lime, color: C.ink, border: "none", borderRadius: 9, padding: "9px 14px", fontWeight: 800, fontSize: 12.5, cursor: "pointer", fontFamily: "inherit", opacity: (!title.trim() || !url.trim() || busy) ? 0.5 : 1 }}>
              {busy ? "…" : t("highlights_add")}
            </button>
          </div>
          {err && <div style={{ fontSize: 11.5, color: C.amber, marginTop: 6 }}>{err}</div>}
        </div>
      )}
    </div>
  );
}

/* ============ PROFILE — Digital Sports Passport (signature) ============ */
/* profiles.full_name + athletes(*) merged into the passport's shape. Real
   numeric/text fields fall back to "—" when unset rather than showing
   demo values — a half-real, half-fake profile would undermine trust in
   a recruiting tool. */
function toPassport(profile, ath, uid, t) {
  const name = (profile && profile.full_name) || t("passport_athlete_fallback");
  const dash = (v) => (v === null || v === undefined || v === "" ? "—" : v);
  const country = (ath && ath.country) || "";
  const shortId = uid ? uid.replace(/-/g, "").slice(0, 5).toUpperCase() : "00000";
  return {
    name, handle: "@" + name.trim().toLowerCase().replace(/[^a-z0-9]+/g, ".").replace(/^\.+|\.+$/g, ""),
    id: `GLS·${(country ? country.slice(0, 2) : "XX").toUpperCase()}·${dash(ath && ath.grad_year)}·${shortId}`,
    initials: initials(name), nat: `${flagFor(country)} ${dash(country)}`,
    sport: dash(ath && ath.sport), position: dash(ath && ath.position), club: dash(ath && ath.club_name),
    foot: dash(ath && ath.foot), prefLabel: (SPORT_PREFERENCE[ath && ath.sport] || {}).label || "FOOT",
    height: ath && ath.height_cm ? `${ath.height_cm} cm` : "—",
    grad: dash(ath && ath.grad_year), gpa: dash(ath && ath.gpa),
    weight: ath && ath.weight_kg ? `${ath.weight_kg} kg` : "—",
    status: dash(ath && ath.recruiting_status),
    bio: (ath && ath.bio) || t("passport_no_bio"),
  };
}

function ProfileEditor({ initial, onClose, onSaved }) {
  const { t } = useLang();
  const [form, setForm] = useState(initial);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const field = { width: "100%", background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 10, color: C.chalk, padding: "10px 12px", fontSize: 13.5, fontFamily: "inherit", outline: "none", boxSizing: "border-box" };
  const label = { fontSize: 9.5, letterSpacing: "0.1em", color: C.slate, fontWeight: 700, marginBottom: 5, display: "block" };
  const row = (children) => <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>{children}</div>;
  const group = (lbl, children) => <div style={{ marginBottom: 12 }}><span style={label}>{lbl}</span>{children}</div>;

  async function save() {
    if (!sb || busy) return;
    const name = (form.full_name || "").trim();
    if (!name) { setErr(t("editor_name_required")); return; }
    setBusy(true); setErr("");
    try {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) throw new Error("Not signed in.");
      const { error: e1 } = await sb.from("profiles").update({ full_name: name }).eq("id", user.id);
      if (e1) throw e1;
      const { error: e2 } = await sb.from("athletes").update({
        sport: form.sport || null,
        position: (form.position || "").trim() || null,
        gender: form.gender || null,
        grad_year: form.grad_year ? Number(form.grad_year) : null,
        gpa: form.gpa !== "" && form.gpa != null ? Number(form.gpa) : null,
        height_cm: form.height_cm ? Number(form.height_cm) : null,
        weight_kg: form.weight_kg ? Number(form.weight_kg) : null,
        foot: form.foot || null,
        recruiting_status: form.recruiting_status || null,
        country: (form.country || "").trim() || null,
        club_name: (form.club_name || "").trim() || null,
        bio: (form.bio || "").trim().slice(0, 600) || null,
      }).eq("id", user.id);
      if (e2) throw e2;
      onSaved();
    } catch (e) {
      console.error("GOLSZ profile save error:", e);
      setErr((e && e.message) || t("editor_save_err"));
    } finally { setBusy(false); }
  }

  return (
    <div style={{ position: "fixed", inset: 0, background: "#000000cc", zIndex: 50, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div style={{ background: C.pitch, borderTop: `1px solid ${C.line2}`, borderRadius: "18px 18px 0 0", maxWidth: 480, width: "100%", maxHeight: "88vh", overflowY: "auto", padding: 18, boxSizing: "border-box" }} className="noscroll">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div style={{ fontWeight: 800, fontSize: 16 }}>{t("editor_title")}</div>
          <button onClick={onClose} style={iconBtn(C.chalk)}><X size={18} /></button>
        </div>

        {group(t("editor_name_label"), <input style={field} value={form.full_name || ""} onChange={set("full_name")} placeholder={t("editor_name_ph")} />)}

        {row(<>
          <div><span style={label}>{t("editor_sport_label")}</span>
            <select style={field} value={form.sport || ""} onChange={set("sport")}>
              <option value="">{t("editor_select")}</option>
              {SPORTS.filter((s) => s !== "All").map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div><span style={label}>{t("editor_position_label")}</span>
            <input style={field} list="position-options" value={form.position || ""} onChange={set("position")} placeholder={form.sport ? `e.g. ${(SPORT_POSITIONS[form.sport] || POSITIONS)[0]}` : t("editor_position_pick_sport")} />
            <datalist id="position-options">{(SPORT_POSITIONS[form.sport] || POSITIONS.filter((p) => p !== "All")).map((p) => <option key={p} value={p} />)}</datalist>
          </div>
        </>)}

        {row(<>
          <div><span style={label}>{t("editor_gender_label")}</span>
            <select style={field} value={form.gender || ""} onChange={set("gender")}>
              <option value="">{t("editor_select")}</option>
              {GENDERS.filter((g) => g[0] !== "All").map(([v, l]) => <option key={v} value={v}>{l}</option>)}
            </select>
          </div>
          <div><span style={label}>{t("editor_grad_year_label")}</span>
            <input style={field} type="number" value={form.grad_year || ""} onChange={set("grad_year")} placeholder="2027" />
          </div>
        </>)}

        {row(<>
          <div><span style={label}>{t("editor_height_label")}</span>
            <input style={field} type="number" value={form.height_cm || ""} onChange={set("height_cm")} placeholder="180" />
          </div>
          <div><span style={label}>{t("editor_weight_label")}</span>
            <input style={field} type="number" value={form.weight_kg || ""} onChange={set("weight_kg")} placeholder="75" />
          </div>
        </>)}

        {(() => {
          const pref = SPORT_PREFERENCE[form.sport];
          return row(<>
            <div><span style={label}>{t("editor_gpa_label")}</span>
              <input style={field} type="number" step="0.01" min="0" max="5" value={form.gpa || ""} onChange={set("gpa")} placeholder="3.8" />
            </div>
            {pref ? (
              <div><span style={label}>{pref.label}</span>
                <select style={field} value={form.foot || ""} onChange={set("foot")}>
                  <option value="">—</option>
                  {pref.options.map((o) => <option key={o} value={o}>{o}</option>)}
                </select>
              </div>
            ) : <div />}
          </>);
        })()}

        {row(<>
          <div><span style={label}>{t("editor_country_label")}</span>
            <input style={field} list="country-options" value={form.country || ""} onChange={set("country")} placeholder={t("editor_country_ph")} />
            <datalist id="country-options">{COUNTRIES.filter((c) => c !== "All").map((c) => <option key={c} value={c} />)}</datalist>
          </div>
          <div><span style={label}>{t("editor_club_label")}</span>
            <input style={field} value={form.club_name || ""} onChange={set("club_name")} placeholder={t("editor_club_ph")} />
          </div>
        </>)}

        {group(t("editor_status_label"), (
          <select style={field} value={form.recruiting_status || ""} onChange={set("recruiting_status")}>
            <option value="">—</option>
            <option value="Open to offers">Open to offers</option>
            <option value="In contact">In contact</option>
            <option value="Committed">Committed</option>
            <option value="Signed">Signed</option>
          </select>
        ))}

        {group(t("editor_bio_label"), (
          <textarea style={{ ...field, resize: "vertical", minHeight: 80 }} maxLength={600} value={form.bio || ""} onChange={set("bio")} placeholder={t("editor_bio_ph")} />
        ))}

        {err && <div style={{ color: C.amber, fontSize: 12, marginBottom: 10 }}>{err}</div>}
        <button onClick={save} disabled={busy} style={{
          width: "100%", background: C.lime, color: C.ink, border: "none", borderRadius: 12,
          padding: "13px", fontWeight: 800, fontSize: 15, fontFamily: "inherit",
          cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1,
        }}>{busy ? t("editor_saving") : t("editor_save")}</button>
      </div>
    </div>
  );
}

function Passport({ onSignOut, autoEdit, onAutoEditConsumed, onOpenAdmin, viewUserId, onBack, onMessage, onViewProfile }) {
  const { t } = useLang();
  const [uid, setUid] = useState(null);
  const [profile, setProfile] = useState(null);
  const [athlete, setAthlete] = useState(null);
  const [editing, setEditing] = useState(false);
  const [following, setFollowing] = useState(false);
  const [followedByThem, setFollowedByThem] = useState(false);
  const [followers, setFollowers] = useState(null);
  const [followingList, setFollowingList] = useState(null);
  const [loaded, setLoaded] = useState(!sb); // no backend at all -> nothing to wait for, show demo immediately
  const real = !!uid;
  const viewingOther = !!(viewUserId && uid && viewUserId !== uid);

  async function load() {
    if (!sb) return;
    try {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return;
      setUid(user.id);
      const other = viewUserId && viewUserId !== user.id;
      const targetId = other ? viewUserId : user.id;
      if (other) {
        // profiles has no public-read policy (dob is sensitive), so the
        // viewed person's name comes from the public_profile_names view —
        // same pattern used in Feed/Discover/Messages.
        const [{ data: nameRow }, { data: ath }, { data: myFollow }, { data: theirFollow }] = await Promise.all([
          sb.from("public_profile_names").select("full_name").eq("id", viewUserId).maybeSingle(),
          sb.from("athletes").select("*").eq("id", viewUserId).maybeSingle(),
          sb.from("follows").select("followed_id").eq("follower_id", user.id).eq("followed_id", viewUserId).maybeSingle(),
          sb.from("follows").select("follower_id").eq("follower_id", viewUserId).eq("followed_id", user.id).maybeSingle(),
        ]);
        setProfile(nameRow ? { full_name: nameRow.full_name } : null);
        setAthlete(ath || null);
        setFollowing(!!myFollow);
        setFollowedByThem(!!theirFollow);
      } else {
        const [{ data: prof }, { data: ath }] = await Promise.all([
          sb.from("profiles").select("full_name, is_admin").eq("id", user.id).single(),
          sb.from("athletes").select("*").eq("id", user.id).single(),
        ]);
        setProfile(prof || null);
        setAthlete(ath || null);
        if (autoEdit) { setEditing(true); onAutoEditConsumed && onAutoEditConsumed(); }
      }

      const [{ data: followerRows }, { data: followingRows }] = await Promise.all([
        sb.from("follows").select("follower_id").eq("followed_id", targetId),
        sb.from("follows").select("followed_id").eq("follower_id", targetId),
      ]);
      const followerIds = (followerRows || []).map((r) => r.follower_id);
      const followingIds = (followingRows || []).map((r) => r.followed_id);
      const allIds = [...new Set([...followerIds, ...followingIds])];
      let nameById = {};
      if (allIds.length) {
        const { data: names } = await sb.from("public_profile_names").select("id, full_name").in("id", allIds);
        nameById = Object.fromEntries((names || []).map((r) => [r.id, r.full_name]));
      }
      setFollowers(followerIds.map((id) => ({ id, name: nameById[id] || "GOLSZ User" })));
      setFollowingList(followingIds.map((id) => ({ id, name: nameById[id] || "GOLSZ User" })));
    } catch (e) { console.error("GOLSZ passport load error:", e); }
    finally { setLoaded(true); }
  }
  useEffect(() => { load(); }, [viewUserId]);

  async function toggleFollowThis() {
    if (!sb || !uid || !viewUserId || viewUserId === uid) return;
    const was = following;
    setFollowing(!was);
    try {
      const { error } = was
        ? await sb.from("follows").delete().eq("follower_id", uid).eq("followed_id", viewUserId)
        : await sb.from("follows").insert({ follower_id: uid, followed_id: viewUserId });
      if (error) throw error;
    } catch (e) { console.error("GOLSZ passport follow error:", e); setFollowing(was); }
  }

  const p = real ? toPassport(profile, athlete, viewingOther ? viewUserId : uid, t) : PASSPORT;
  const mrz = real
    ? `${p.id.replace(/[·]/g, "<")}<${p.name.replace(/[^A-Za-z]/g, "").toUpperCase()}<<<<<<<<<<<<<<<<<<<<<<<<<<<<`
    : `GLS<CAN<${p.name.replace(/[^A-Za-z]/g, "").toUpperCase()}<<LEFTBACK<<<<<${p.id.replace(/[·]/g, "")}<2027CA`;
  const incomplete = !viewingOther && real && athlete && !athlete.sport;

  const editorInitial = () => ({
    full_name: (profile && profile.full_name) || "",
    sport: (athlete && athlete.sport) || "", position: (athlete && athlete.position) || "",
    gender: (athlete && athlete.gender) || "", grad_year: (athlete && athlete.grad_year) || "",
    gpa: (athlete && athlete.gpa) || "", height_cm: (athlete && athlete.height_cm) || "",
    weight_kg: (athlete && athlete.weight_kg) || "", foot: (athlete && athlete.foot) || "",
    recruiting_status: (athlete && athlete.recruiting_status) || "", country: (athlete && athlete.country) || "",
    club_name: (athlete && athlete.club_name) || "", bio: (athlete && athlete.bio) || "",
  });

  if (!loaded) return <div style={{ padding: "40px 20px", textAlign: "center", color: C.slate, fontSize: 13 }}>{t("loading")}</div>;

  return (
    <div style={{ padding: "8px 12px 20px", background: C.passportWash }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "4px 2px 10px" }}>
        <SectionTitle noMargin>{viewingOther ? t("passport_title_other") : t("passport_title_self")}</SectionTitle>
        {viewingOther ? (
          <button onClick={onBack} style={{ ...iconBtn(C.chalk), fontSize: 11.5 }}><ChevronLeft size={16} /> {t("back")}</button>
        ) : real ? (

      {viewingOther && (

          </button>
          {(following || followedByThem) && onMessage && (

      {incomplete && (

      {/* passport document */}

        <div style={{ display: "flex", gap: 14, padding: 16 }}>
