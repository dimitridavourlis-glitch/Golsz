/* ============ Supabase data helpers (Feed/Discover/Events) ============
   Each screen fetches real rows when `sb` is configured and falls back to
   the hardcoded arrays above when the query errors or returns nothing —
   so the app still looks alive pre-launch, before anyone has posted. */
function initials(name) {
  return (name || "").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?";
}
function timeAgo(iso) {
  const s = Math.max(1, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 3600) return Math.max(1, Math.floor(s / 60)) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}
const FLAGS = {
  canada: "🇨🇦", "united states": "🇺🇸", usa: "🇺🇸", england: "🏴", "united kingdom": "🏴",
  spain: "🇪🇸", germany: "🇩🇪", jamaica: "🇯🇲", japan: "🇯🇵", brazil: "🇧🇷", sweden: "🇸🇪",
  morocco: "🇲🇦", ghana: "🇬🇭",
};
function flagFor(country) { return FLAGS[(country || "").trim().toLowerCase()] || "🌍"; }

function mapPost(row) {
  const name = (row.profiles && row.profiles.full_name) || "GOLSZ Athlete";
  const verified = !!(row.profiles && row.profiles.athletes && row.profiles.athletes.verified);
  const sport = (row.profiles && row.profiles.athletes && row.profiles.athletes.sport) || "";
  return {
    postId: row.id, who: name, init: initials(name), nat: "", sport,
    v: verified ? ["Verified"] : [], kind: row.kind, head: row.headline,
    body: row.body || "", likes: row.likes_count || 0, ago: timeAgo(row.created_at),
  };
}
function mapAthlete(row) {
  const name = (row.profiles && row.profiles.full_name) || "GOLSZ Athlete";
  return {
    n: name, i: initials(name), sport: row.sport || "", pos: row.position || "",
    country: row.citizenship || "", flag: flagFor(row.citizenship), g: row.gender || "",
    grad: row.grad_year || "", v: row.verified ? 1 : 0,
  };
}
function mapEvent(row) {
  const d = new Date(row.event_date + "T00:00:00");
  return {
    m: d.toLocaleString("en-US", { month: "short" }).toUpperCase(), d: String(d.getDate()).padStart(2, "0"),
    t: row.title, sport: row.sport || "", loc: row.location || "", lvl: row.level || "", spots: row.spots_available ?? "—",
  };
}

/* ============ FEED ============ */
function Feed() {
  const [posts, setPosts] = useState(FEED);
  const [liked, setLiked] = useState({});
  const [uid, setUid] = useState(null);

  useEffect(() => {
    if (!sb) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (user) setUid(user.id);

        const { data, error } = await sb
          .from("posts")
          .select("id, kind, headline, body, likes_count, created_at, profiles(full_name, athletes(sport, verified))")
          .order("created_at", { ascending: false })
          .limit(30);
        if (error) throw error;
        if (data && data.length) {
          setPosts(data.map(mapPost));
          if (user) {
            const ids = data.map((p) => p.id);
            const { data: mine } = await sb.from("post_likes").select("post_id").eq("profile_id", user.id).in("post_id", ids);
            if (mine) setLiked(Object.fromEntries(mine.map((r) => [r.post_id, true])));
          }
        }
      } catch (e) { console.error("GOLSZ feed fetch error:", e); }
    })();
  }, []);

  async function toggleLike(p, i) {
    if (!p.postId || !sb || !uid) {
      setLiked((l) => ({ ...l, [i]: !l[i] }));
      return;
    }
    const isLiked = !!liked[p.postId];
    setLiked((l) => ({ ...l, [p.postId]: !isLiked }));
    setPosts((ps) => ps.map((x) => x.postId === p.postId ? { ...x, likes: x.likes + (isLiked ? -1 : 1) } : x));
    try {
      if (isLiked) await sb.from("post_likes").delete().eq("post_id", p.postId).eq("profile_id", uid);
      else await sb.from("post_likes").insert({ post_id: p.postId, profile_id: uid });
    } catch (e) { console.error("GOLSZ like error:", e); }
  }

  return (
    <div style={{ padding: "8px 12px 16px" }}>
      <SectionTitle>Your feed</SectionTitle>
      {posts.map((p, i) => {
        const key = p.postId || i;
        const isLiked = !!liked[key];
        return (
        <article key={key} style={card}>
          <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 10 }}>
            <Avatar init={p.init} ring={C.lime} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ fontWeight: 700, fontSize: 14 }}>{p.who}</span>
                <span>{p.nat}</span>
              </div>
              <div style={{ fontSize: 11, color: C.slate, fontFamily: "'Space Mono', monospace" }}>{p.sport} · {p.ago}</div>
            </div>
            {p.kind === "commit" && <Trophy size={16} color={C.lime} />}
            {p.kind === "perf" && <Flame size={16} color={C.amber} />}
            {p.kind === "call" && <Radar size={16} color={C.lime} />}
          </div>
          <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 4 }}>{p.head}</div>
          <div style={{ fontSize: 13.5, color: "#C9D6CD", lineHeight: 1.5 }}>{p.body}</div>
          <div style={{ display: "flex", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
            {p.v.map((b) => <Badge key={b} label={b} />)}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 16, marginTop: 12, paddingTop: 10, borderTop: `1px solid ${C.line}` }}>
            <button onClick={() => toggleLike(p, i)}
              style={iconBtn(isLiked ? C.lime : C.slate)}>
              <Heart size={15} fill={isLiked ? C.lime : "none"} /> {p.likes + (isLiked && !p.postId ? 1 : 0)}
            </button>
            <button style={iconBtn(C.slate)}><Users size={15} /> Follow</button>
            <button style={{ ...iconBtn(C.slate), marginLeft: "auto" }}><ArrowUpRight size={15} /> Share</button>
          </div>
        </article>
        );
      })}
    </div>
  );
}

/* ============ DISCOVER (player database) ============ */
const SPORTS = ["All", "Soccer", "Basketball", "Track", "Hockey", "Tennis"];
const GENDERS = [["All", "All"], ["M", "Male"], ["F", "Female"]];
const COUNTRIES = ["All", "Canada", "USA", "England", "Spain", "Germany", "Jamaica", "Japan", "Brazil", "Sweden", "Morocco"];
const POSITIONS = ["All", "Left Back", "Striker", "Midfielder", "Guard", "Forward", "Center", "Goalie", "Sprinter", "Distance", "Singles"];

function Discover() {
  const [sport, setSport] = useState("All");
  const [gender, setGender] = useState("All");
  const [country, setCountry] = useState("All");
  const [pos, setPos] = useState("All");
  const [players, setPlayers] = useState(PLAYERS);

  useEffect(() => {
    if (!sb) return;
    (async () => {
      try {
        const { data, error } = await sb
          .from("athletes")
          .select("profile_id, sport, position, gender, grad_year, citizenship, level, verified, profiles(full_name)")
          .limit(200);
        if (error) throw error;
        if (data && data.length) setPlayers(data.map(mapAthlete));
      } catch (e) { console.error("GOLSZ discover fetch error:", e); }
    })();
  }, []);

  const results = players.filter((p) =>
    (sport === "All" || p.sport === sport) &&
    (gender === "All" || p.g === gender) &&
    (country === "All" || p.country === country) &&
    (pos === "All" || p.pos === pos)
  );

  return (
    <div style={{ padding: "8px 12px 16px" }}>
      <SectionTitle>Discover players</SectionTitle>
      <div style={{ ...card, padding: 12 }}>
        <FilterRow label="Sport" opts={SPORTS} val={sport} set={setSport} />
        <FilterRow label="Gender" opts={GENDERS.map((g) => g[0])} labels={GENDERS} val={gender} set={setGender} />
        <FilterRow label="Country" opts={COUNTRIES} val={country} set={setCountry} />
        <FilterRow label="Position" opts={POSITIONS} val={pos} set={setPos} last />
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "14px 2px 8px" }}>
        <span style={{ fontSize: 11, color: C.slate, fontFamily: "'Space Mono', monospace" }}>
          {results.length} {results.length === 1 ? "ATHLETE" : "ATHLETES"} ON FILE
        </span>
        <span style={{ fontSize: 11, color: C.lime, display: "flex", alignItems: "center", gap: 4 }}>
          <SlidersHorizontal size={12} /> Verified first
        </span>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        {results.sort((a, b) => b.v - a.v).map((p) => (
          <div key={p.n} style={{ ...card, margin: 0, padding: 12 }}>

/* ============ AI SCOUT (live agent) ============ */
const SYS = `You are GOLSZ Scout, an AI sports agent. Tagline: "Every Goal Has a Path."
You are the personal agent for ONE athlete: learn who they are (age, sport, position, location, club/level, grad year, academics, budget, citizenship, goal), build a career roadmap, suggest realistic target programs (reach/match/safety, honest), and draft coach outreach emails on request (draft-only; the athlete sends them).
Be warm, direct, honest — never overpromise. If a target looks unrealistic, say so kindly and show the realistic path. If the athlete seems to be a minor, remind them once to involve a parent/guardian. Use web search for real current programs, coaches, showcases, and eligibility rules. Ask at most ONE question per reply. Keep replies tight for a phone screen.
OUTPUT ONLY valid JSON, no markdown fences: {"reply":"conversational text","profile_updates":{...only newly-learned fields or null}}
Allowed keys: name, age, sport, position, location, club, level, grad_year, gpa, budget, citizenship, goal. Do not repeat known fields.`;

const CHIPS = ["Build my target school list", "Create my career roadmap", "Draft an email to a coach", "What should I do this month?"];

function Scout() {
  const [msgs, setMsgs] = useState([{ role: "assistant", text: "I'm your GOLSZ Scout.\n\nTell me about yourself like you'd tell a scout — age, sport, position, where you play, and where you want to end up. I'll build your path from there." }]);
  const [profile, setProfile] = useState({});
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const endRef = useRef(null);
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs, busy]);

  async function send(text) {
    const content = text.trim(); if (!content || busy) return;
    setInput("");
    const next = [...msgs, { role: "user", text: content }];
    setMsgs(next); setBusy(true);
    try {
      const api = next.map((m) => ({ role: m.role, content: m.text }));
      api[api.length - 1] = { role: "user", content: `PROFILE SO FAR: ${JSON.stringify(profile)}\n\nATHLETE: ${content}` };
      let _hdr = { "Content-Type": "application/json" };
      try { if (typeof sb !== "undefined" && sb) { const _s = await sb.auth.getSession(); if (_s && _s.data && _s.data.session) _hdr["Authorization"] = "Bearer " + _s.data.session.access_token; } } catch (e) {}
      const _endpoint = (typeof SCOUT_ENDPOINT !== "undefined" && SCOUT_ENDPOINT) ? SCOUT_ENDPOINT : "https://api.anthropic.com/v1/messages";
      const res = await fetch(_endpoint, {
        method: "POST", headers: _hdr,
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, system: SYS, messages: api, tools: [{ type: "web_search_20250305", name: "web_search" }] }),
      });
      const data = await res.json();
      const raw = (data.content || []).map((b) => (b.type === "text" ? b.text : "")).filter(Boolean).join("\n");
      let reply = raw, updates = null;
      try {
        const clean = raw.replace(/```json|```/g, "").trim();
        const parsed = JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}") + 1));
        reply = parsed.reply || raw; updates = parsed.profile_updates || null;
      } catch { /* raw */ }
      if (updates && typeof updates === "object") setProfile((p) => ({ ...p, ...updates }));
      setMsgs((m) => [...m, { role: "assistant", text: reply }]);
    } catch {
      setMsgs((m) => [...m, { role: "assistant", text: "Connection dropped mid-play. Send that again and I'm on it." }]);
    } finally { setBusy(false); }
  }

  const known = Object.keys(profile).filter((k) => profile[k]);
  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      <div style={{ padding: "10px 14px", borderBottom: `1px solid ${C.line}`, display: "flex", alignItems: "center", gap: 8 }}>
        <Radar size={18} color={C.lime} />
        <span style={{ fontWeight: 800, letterSpacing: "0.04em" }}>AI SCOUT</span>
        <span style={{ marginLeft: "auto", fontSize: 10, color: C.slate, fontFamily: "'Space Mono', monospace" }}>
          {known.length ? `${known.length} FIELDS ON FILE` : "LIVE AGENT"}
        </span>
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: "14px 12px 6px" }}>
        {msgs.map((m, i) => (
          <div key={i} className="msg" style={m.role === "user" ? bubbleUser : bubbleAgent}>
            {m.role === "assistant" && <div style={{ fontSize: 9, letterSpacing: "0.22em", color: C.lime, fontWeight: 800, marginBottom: 4 }}>SCOUT</div>}
            <div style={{ whiteSpace: "pre-wrap" }}>{m.text}</div>
          </div>
        ))}
        {busy && <div style={bubbleAgent}><div className="running"><span /><span /><span /></div></div>}
        <div ref={endRef} />
      </div>
      <div style={{ display: "flex", gap: 8, overflowX: "auto", padding: "6px 12px", scrollbarWidth: "none" }} className="noscroll">
        {CHIPS.map((q) => <button key={q} onClick={() => send(q)} disabled={busy} style={{ flex: "0 0 auto", background: "transparent", border: `1px solid ${C.line2}`, color: C.lime, borderRadius: 999, padding: "7px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap" }}>{q}</button>)}
      </div>
      <div style={{ display: "flex", gap: 8, padding: "10px 12px 14px", borderTop: `1px solid ${C.line}` }}>
        <textarea rows={1} value={input} placeholder="Talk to your scout…" onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input); } }}
          style={{ flex: 1, background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 12, color: C.chalk, padding: "11px 13px", fontSize: 14, fontFamily: "inherit", resize: "none", outline: "none" }} />
        <button onClick={() => send(input)} disabled={busy || !input.trim()} style={{ background: C.lime, color: C.pitch, border: "none", borderRadius: 12, width: 46, cursor: "pointer", opacity: busy || !input.trim() ? 0.4 : 1 }}><Send size={17} /></button>
      </div>
    </div>
  );
}

    <div style={{ display: "flex", flexDirection: "column", height: "100vh", background: C.pitch, color: C.chalk, fontFamily: "'Archivo', system-ui, sans-serif", maxWidth: 480, margin: "0 auto", position: "relative" }}>
      <style>{CSS}</style>

      {/* top bar */}
      <header style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px 10px", borderBottom: `1px solid ${C.line}`, flexShrink: 0 }}>
        <a href="index.html" style={{ fontWeight: 900, fontSize: 24, letterSpacing: "0.03em", fontStretch: "expanded", color: "inherit", textDecoration: "none" }}>GOLSZ<span style={{ color: C.lime }}>.</span></a>
        <button onClick={() => { setPage("messages"); setThread(null); }} style={{ position: "relative", background: "none", border: "none", color: page === "messages" ? C.lime : C.chalk, cursor: "pointer", padding: 4 }}>
          <MessageSquare size={22} />
          <span style={{ position: "absolute", top: 2, right: 2, width: 8, height: 8, borderRadius: 99, background: C.lime, border: `2px solid ${C.pitch}` }} />
        </button>
      </header>

      {/* body */}
      <main style={{ flex: 1, overflowY: "auto", WebkitOverflowScrolling: "touch" }} className="noscroll">
        {page === "feed" && <Feed />}
        {page === "discover" && <Discover />}
        {page === "scout" && <Scout />}
        {page === "events" && <Events />}
        {page === "profile" && <Passport onSignOut={onSignOut} />}
        {page === "messages" && <Messages thread={thread} setThread={setThread} />}
      </main>

      {/* bottom nav */}
      <nav style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-around", padding: "8px 8px 12px", borderTop: `1px solid ${C.line}`, background: C.pitch, flexShrink: 0 }}>
        {NAV.map((n) => {
          const active = page === n.id;
          if (n.center) {
            return (
              <button key={n.id} onClick={() => go(n.id)} style={{
                background: C.lime, color: C.pitch, border: `3px solid ${C.pitch}`, borderRadius: "50%",
                width: 58, height: 58, marginTop: -22, boxShadow: `0 8px 20px -6px #C8F13566`,
                display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                cursor: "pointer", fontFamily: "inherit",
              }}>
                <n.icon size={22} strokeWidth={2.4} />
                <span style={{ fontSize: 8, fontWeight: 800, letterSpacing: "0.06em", marginTop: 1 }}>{n.label}</span>
              </button>
            );
          }
          return (
            <button key={n.id} onClick={() => go(n.id)} style={{
              background: "none", border: "none", cursor: "pointer", fontFamily: "inherit",
              display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
              color: active ? C.lime : C.slate, flex: 1, padding: "4px 0",
            }}>
              <n.icon size={21} strokeWidth={active ? 2.4 : 2} />
              <span style={{ fontSize: 9.5, fontWeight: active ? 800 : 600 }}>{n.label}</span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

const CSS = `
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400..900;125,400..900&family=Space+Mono:wght@400;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: ${C.pitch}; }
  .noscroll::-webkit-scrollbar { display: none; }
  .noscroll { -ms-overflow-style: none; scrollbar-width: none; }
  .msg { animation: rise .22s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .running { display: flex; gap: 5px; padding: 4px 0; }
  .running span { width: 6px; height: 6px; border-radius: 99px; background: ${C.lime}; animation: run 1s infinite; }
  .running span:nth-child(2){ animation-delay:.15s } .running span:nth-child(3){ animation-delay:.3s }
  @keyframes run { 0%,100%{opacity:.25;transform:translateY(0)} 50%{opacity:1;transform:translateY(-3px)} }
  @media (prefers-reduced-motion: reduce){ .msg,.running span{ animation:none } }
  textarea::placeholder, input::placeholder { color: #5C6E63; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid ${C.lime}; outline-offset: 2px; }
`;


/* ===== BACKEND CONFIG — fill these in to go live (leave blank to preview) ===== */
const SUPABASE_URL = "https://wachjqfhlbchcuovyewg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Po2PXFdCkqZ26mtkJEJ4fA_HHBy5i_s";
const SCOUT_ENDPOINT = "/api/scout";  // same-origin — works on any Vercel deploy + `vercel dev` locally
const STRIPE_LINKS = { pro: "", elite: "" };  // Stripe Payment Link URLs

const PLANS = [
  { id: "free",  name: "Starter", price: 0,  tag: "Free forever",    feats: ["Digital Sports Passport (basic)", "AI Scout: 5 school suggestions", "Browse players & events"] },
  { id: "pro",   name: "Pro",     price: 29, tag: "Most popular",     feats: ["Unlimited AI Scout agent", "Full verified passport", "Full target-school lists & roadmap", "Unlimited coach outreach drafts", "Priority combines & trials"] },
  { id: "elite", name: "Elite",   price: 79, tag: "Serious recruits", feats: ["Everything in Pro", "Priority scout visibility", "Human-reviewed highlight feedback", "Early access to showcases"] },
];

// Supabase client (null when not configured -> app runs in preview mode)
const sb = (SUPABASE_URL && SUPABASE_ANON_KEY && typeof window !== "undefined" && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

function Auth({ onDone }) {
  const [mode, setMode] = useState("signup");
  const [plan, setPlan] = useState("pro");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [dobDay, setDobDay] = useState("");
  const [dobMonth, setDobMonth] = useState("");
  const [dobYear, setDobYear] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [notice, setNotice] = useState("");
  const isSignup = mode === "signup";

  const dobNum = { d: parseInt(dobDay, 10), m: parseInt(dobMonth, 10), y: parseInt(dobYear, 10) };
  const dobOk = dobDay && dobMonth && dobYear
    && dobNum.d >= 1 && dobNum.d <= 31
    && dobNum.m >= 1 && dobNum.m <= 12
    && String(dobYear).length === 4 && dobNum.y >= 1900 && dobNum.y <= new Date().getFullYear();
  const dobIso = dobOk ? `${dobYear}-${String(dobNum.m).padStart(2, "0")}-${String(dobNum.d).padStart(2, "0")}` : "";
  const age = dobOk ? (() => {
    const today = new Date(); const b = new Date(dobIso);
    let a = today.getFullYear() - b.getFullYear();
    const notYet = (today.getMonth() < b.getMonth()) || (today.getMonth() === b.getMonth() && today.getDate() < b.getDate());
    if (notYet) a--;
    return a;
  })() : null;
  const isMinor = age !== null && age < 18;

  const ok = email.trim() && pw.trim() && (!isSignup || (name.trim() && dobOk));
  const selected = PLANS.find((p) => p.id === plan) || PLANS[1];
  const field = { width: "100%", background: C.turf, border: "1px solid " + C.line2, borderRadius: 12, color: C.chalk, padding: "13px 14px", fontSize: 15, fontFamily: "inherit", outline: "none", marginBottom: 12, boxSizing: "border-box" };
  const dobField = { ...field, marginBottom: 0, textAlign: "center" };

  async function submit() {
    if (!ok || busy) return;
    setErr("");
    setNotice("");
    // preview mode: no backend configured -> behave like the demo
    if (!sb) {
      if (isSignup && selected.price > 0 && STRIPE_LINKS[plan]) { window.location.href = STRIPE_LINKS[plan]; return; }
      onDone(); return;
    }
    setBusy(true);
    try {
      if (isSignup) {
        const { data, error } = await sb.auth.signUp({ email: email.trim(), password: pw, options: { data: { full_name: name.trim(), plan: selected.id, date_of_birth: dobIso } } });
        if (error) throw error;
        if (selected.price > 0 && STRIPE_LINKS[plan]) { window.location.href = STRIPE_LINKS[plan]; return; } // account exists -> pay
        if (data.session) { onDone(); } else { setNotice("Account created — check " + email.trim() + " for a confirmation link, then come back and log in."); }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
        if (error) throw error;
        onDone();
      }
    } catch (e) {
      console.error("GOLSZ auth error:", e);
      let msg = "Something went wrong. Try again.";
      if (e && typeof e.message === "string" && e.message.trim()) {
        msg = e.message;
      } else if (e instanceof TypeError) {
        msg = "Couldn't reach Supabase — check your internet connection, that the project isn't paused, and that this page is served over http(s), not opened as a local file.";
      } else if (e) {
        try { msg = "Unexpected error: " + JSON.stringify(e); } catch { msg = "Unexpected error (see browser console for details)."; }
      }
      setErr(msg);
    } finally {
      setBusy(false);
    }
  }

  const cta = busy ? "Working\u2026"
    : !isSignup ? "Log in"
    : selected.price === 0 ? "Create free account"
    : "Continue to payment \u2014 $" + selected.price + "/month";

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "28px 18px", background: "radial-gradient(1100px 560px at 50% -12%, #16241C, " + C.pitch + ")", fontFamily: "'Archivo', system-ui, sans-serif", color: C.chalk }}>
      <div style={{ width: "100%", maxWidth: 430 }}>
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <div style={{ fontWeight: 900, fontSize: 40, letterSpacing: "0.03em", fontStretch: "expanded" }}>GOLSZ<span style={{ color: C.lime }}>.</span></div>
          <div style={{ fontSize: 10, letterSpacing: "0.3em", color: C.slate, fontWeight: 700, marginTop: 4 }}>EVERY GOAL HAS A PATH</div>
        </div>

        <div style={{ display: "flex", background: C.card, border: "1px solid " + C.line, borderRadius: 12, padding: 4, marginBottom: 16 }}>
          {[["signup", "Sign up"], ["login", "Log in"]].map(([m, l]) => (
            <button key={m} onClick={() => { setMode(m); setErr(""); setNotice(""); }} style={{ flex: 1, padding: "10px", borderRadius: 9, border: "none", cursor: "pointer", fontFamily: "inherit", fontWeight: 700, fontSize: 14, background: mode === m ? C.lime : "transparent", color: mode === m ? C.pitch : C.slate }}>{l}</button>
          ))}
        </div>

        <div style={{ background: C.card, border: "1px solid " + C.line, borderRadius: 18, padding: 20 }}>
          {isSignup && (
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 10, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 10 }}>CHOOSE YOUR PLAN</div>
              {PLANS.map((pl) => {
                const on = plan === pl.id;
                return (
                  <button key={pl.id} onClick={() => setPlan(pl.id)} style={{ width: "100%", textAlign: "left", display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", marginBottom: 8, borderRadius: 12, cursor: "pointer", fontFamily: "inherit", background: on ? "#C8F1351a" : C.turf, border: "1.5px solid " + (on ? C.lime : C.line2) }}>
                    <div style={{ width: 18, height: 18, borderRadius: 99, border: "2px solid " + (on ? C.lime : C.line2), display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{on && <div style={{ width: 8, height: 8, borderRadius: 99, background: C.lime }} />}</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 14.5, fontWeight: 800 }}>{pl.name}</div>
                      <div style={{ fontSize: 11, color: C.slate, fontWeight: 600 }}>{pl.tag}</div>
                    </div>
                    <div style={{ textAlign: "right" }}>
                      <span style={{ fontSize: 19, fontWeight: 900, fontFamily: "'Space Mono', monospace" }}>{pl.price === 0 ? "Free" : "$" + pl.price}</span>
                      {pl.price > 0 && <span style={{ fontSize: 11, color: C.slate }}>/mo</span>}
                    </div>
                  </button>
                );
              })}
              <div style={{ background: C.turf, border: "1px solid " + C.line2, borderRadius: 12, padding: 14, marginTop: 4 }}>
                <div style={{ fontSize: 10, letterSpacing: "0.16em", color: C.lime, fontWeight: 800, marginBottom: 8 }}>{selected.name.toUpperCase()} INCLUDES</div>
                {selected.feats.map((f) => (
                  <div key={f} style={{ display: "flex", alignItems: "center", gap: 8, padding: "4px 0", fontSize: 12.5, color: "#C9D6CD" }}>
                    <BadgeCheck size={14} color={C.lime} /> {f}
                  </div>
                ))}
              </div>
            </div>
          )}

          {isSignup && <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Full name" style={field} />}
          <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Email" type="email" style={field} />
          <input value={pw} onChange={(e) => setPw(e.target.value)} placeholder="Password" type="password" style={{ ...field, marginBottom: isSignup ? 12 : 14 }} />

          {isSignup && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 11, color: C.slate, fontWeight: 700, marginBottom: 6 }}>Date of birth</div>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={dobDay} onChange={(e) => setDobDay(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} placeholder="DD" inputMode="numeric" maxLength={2} style={{ ...dobField, flex: 1 }} />
                <input value={dobMonth} onChange={(e) => setDobMonth(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} placeholder="MM" inputMode="numeric" maxLength={2} style={{ ...dobField, flex: 1 }} />
                <input value={dobYear} onChange={(e) => setDobYear(e.target.value.replace(/[^0-9]/g, "").slice(0, 4))} placeholder="YYYY" inputMode="numeric" maxLength={4} style={{ ...dobField, flex: 1.4 }} />
              </div>
              {isMinor && (
                <div style={{ fontSize: 11.5, color: C.amber, marginTop: 8, lineHeight: 1.4 }}>
                  Athletes under 18 need a parent or guardian to help manage their account. We'll follow up on that after signup.
                </div>
              )}
            </div>
          )}

          {notice && (
            <div style={{ background: "#C8F1351a", border: "1px solid #C8F13544", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
              <div style={{ fontSize: 10, letterSpacing: "0.12em", color: C.lime, fontWeight: 800, marginBottom: 4 }}>CHECK YOUR EMAIL</div>
              <div style={{ color: C.chalk, fontSize: 12.5, lineHeight: 1.4 }}>{notice}</div>
            </div>
          )}

          {err && (
            <div style={{ background: "#C89B3C1a", border: "1px solid #C89B3C44", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
              <div style={{ fontSize: 10, letterSpacing: "0.12em", color: C.amber, fontWeight: 800, marginBottom: 4 }}>{isSignup ? "COULDN'T COMPLETE SIGNUP" : "COULDN'T LOG IN"}</div>
              <div style={{ color: "#E7C56B", fontSize: 12.5, lineHeight: 1.4 }}>{err}</div>
            </div>
          )}

          <button disabled={!ok || busy} onClick={submit} style={{ width: "100%", background: C.lime, color: C.pitch, border: "none", borderRadius: 12, padding: "14px", fontWeight: 800, fontSize: 15, cursor: (!ok || busy) ? "default" : "pointer", opacity: (!ok || busy) ? 0.45 : 1, fontFamily: "inherit" }}>{cta}</button>

          {isSignup && selected.price > 0 && (
            <div style={{ textAlign: "center", marginTop: 10, fontSize: 11, color: C.slate }}>Secure checkout by Stripe \u00b7 billed monthly \u00b7 cancel anytime</div>
          )}

          <div style={{ textAlign: "center", marginTop: 14, fontSize: 13, color: C.slate }}>
            {isSignup ? "Already have an account? " : "New to GOLSZ? "}
            <span onClick={() => { setMode(isSignup ? "login" : "signup"); setErr(""); }} style={{ color: C.lime, fontWeight: 700, cursor: "pointer" }}>{isSignup ? "Log in" : "Sign up"}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function Root() {
  const paidReturn = typeof window !== "undefined" && /checkout=success/.test(window.location.search);
  const [authed, setAuthed] = useState(false);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    if (!sb) { setAuthed(paidReturn); setReady(true); return; }
    let subscription;
    sb.auth.getSession().then(({ data }) => { setAuthed(!!(data && data.session) || paidReturn); setReady(true); });
    const r = sb.auth.onAuthStateChange((_e, session) => { setAuthed(!!session); });
    subscription = r && r.data ? r.data.subscription : null;
    return () => { if (subscription) subscription.unsubscribe(); };
  }, []);

  async function signOut() { if (sb) { try { await sb.auth.signOut(); } catch (e) {} } setAuthed(false); }

  if (!ready) return React.createElement("div", { style: { minHeight: "100vh", background: C.pitch } });
  return authed
    ? React.createElement(GolszApp, { onSignOut: signOut })
    : React.createElement(Auth, { onDone: () => setAuthed(true) });
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Root));
