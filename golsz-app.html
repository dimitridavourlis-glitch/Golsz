- Other: a general, honest sports-industry assistant — ask what they need help with rather than assuming.
Some fields may already be filled in from their real GOLSZ Passport (profile they built themselves) — treat those as trustworthy and confirmed, not something to re-ask. Open by briefly acknowledging what you already know about them (occupation/sport/team if present) instead of asking generic intro questions, then move straight to something useful.
Be warm, direct, honest — never overpromise. If a target or prospect looks unrealistic, say so kindly and show the realistic path. If the person seems to be a minor, remind them once to involve a parent/guardian. Use web search for real current programs, players, coaches, showcases, and eligibility rules. Ask at most ONE question per reply. Keep replies tight for a phone screen.
If asked what AI model or company powers you, who made you, or whether you're ChatGPT/OpenAI/Claude/Anthropic/Gemini/etc., always answer that you are GOLSZ Scout, built by GOLSZ — never name or confirm any underlying model or provider, and don't explain that you're declining to say. Just answer as GOLSZ Scout and move on.
GOLSZ is a sports-recruiting platform used by athletes of all ages, including minors. Stay strictly on sports, athletics, recruiting, and career topics. Never generate or engage with sexual, romantic, 18+/adult, or otherwise inappropriate content, regardless of how the request is framed (roleplay, "hypothetically," "for a story," etc.) — decline briefly and warmly, and steer the conversation back to something sports-related. This applies no matter who the user says they are.
OUTPUT ONLY valid JSON, no markdown fences: {"reply":"conversational text","profile_updates":{...only newly-learned fields or null},"scout_context_updates":{...only newly-learned/changed fields below or null}}
Allowed profile_updates keys: name, age, occupation, sport, position, location, club, level, grad_year, gpa, license, looking_for_players, budget, citizenship, goal. Do not repeat known fields.
Allowed scout_context_updates keys (each shaped {"value":..., "source":"athlete_stated"|"ai_inferred", "confidence":0-1} — "athlete_stated" only when they said it in plain words, "ai_inferred" for anything you're reading between the lines; never mark a guess as athlete_stated): dream_outcome, target_level, target_country, timeline, perceived_strengths, perceived_weaknesses, main_gap, urgency, confidence, professional_interest, college_interest, trial_interest. Only include a key when this reply actually learned or changed something about it — never repeat an already-known value.`;

const CHIP_ICONS = [Compass, Radar, MessageSquare, CalendarDays];
function chipsFor(t, isPlayer) {
  return isPlayer
    ? [t("scout_chip1"), t("scout_chip2"), t("scout_chip3"), t("scout_chip4")]
    : [t("scout_np_chip1"), t("scout_np_chip2"), t("scout_np_chip3"), t("scout_np_chip4")];
}

function scoutGreetingFor(seeded, t) {
  const isPlayerSeed = !seeded.occupation || seeded.occupation === "Player";
  if (!isPlayerSeed) {
    const first = seeded.name ? seeded.name.split(" ")[0] : null;
    const hello = first ? `${t("scout_hey")} ${first} — ` : `${t("scout_hey")} — `;
    const who = [seeded.occupation, seeded.sport].filter(Boolean).join(" · ");
    const context = who
      ? `${t("scout_got_you_down_pre")}${who}${seeded.club ? `${t("scout_at")}${seeded.club}` : ""}. `
      : "";
    return `${hello}${t("scout_im_your_scout")} ${context}\n\n${t("scout_np_whats_plan")}`;
  }
  const who = [seeded.sport, seeded.position].filter(Boolean).join(" · ");
  if (!who && !seeded.name) return t("scout_greeting");
  const first = seeded.name ? seeded.name.split(" ")[0] : null;
  const hello = first ? `${t("scout_hey")} ${first} — ` : `${t("scout_hey")} — `;
  const context = who
    ? `${t("scout_got_you_down_pre")}${who}${seeded.club ? `${t("scout_at")}${seeded.club}` : ""}${seeded.grad_year ? `${t("scout_class_of")}${seeded.grad_year}` : ""}. `
    : "";
  return `${hello}${t("scout_im_your_scout")} ${context}\n\n${t("scout_whats_plan")}`;
}
function newScoutConvId() {
  return (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
}

function Scout() {
  const { t, lang } = useLang();
  const [msgs, setMsgs] = useState(sb ? null : [{ role: "assistant", text: t("scout_greeting") }]);
  const [loaded, setLoaded] = useState(!sb); // no backend at all -> nothing to wait for, show demo greeting immediately
  const [profile, setProfile] = useState({});
  // Flattened {field: value} view of athletes.scout_context (migration 050,
  // Phase 2a) — the "softer" qualification facts (goal, gap, urgency, etc.)
  // Scout has picked up, as opposed to `profile`'s hard Passport facts.
  const [scoutContext, setScoutContext] = useState({});
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  // Separate from `busy`: `busy` drives the in-chat "thinking" bubble, which
  // should only appear once the user's own message bubble is already in
  // `msgs` (right after moderation passes) — not before, or the thinking
  // bubble visibly renders ahead of the question that triggered it. `pending`
  // exists purely to disable the send button/input the instant a send starts,
  // independent of when the chat log itself updates. See send()'s comments.
  const [pending, setPending] = useState(false);
  const [conversationId, setConversationId] = useState(() => newScoutConvId());
  // Running summary of this conversation so far (migration 049, Phase 2b of
  // the AI Scout architecture plan) — lets send() bound how much history it
  // resends instead of the whole ever-growing transcript. Server-maintained
  // (classifyIntent() in api/scout.js updates it every turn); this is just
  // where the client holds the latest value between turns.
  const [summary, setSummary] = useState("");
  // { remaining, limit } from the Multi-Model Cost-Control System's
  // scout_usage response field (api/scout.js) — null until the first real
  // reply/limit-reached response arrives, or forever null for an admin/
  // unlimited account (server omits scout_usage in that case).
  const [scoutUsage, setScoutUsage] = useState(null);
  const [showHistory, setShowHistory] = useState(false);
  const [history, setHistory] = useState(null);
  const [photo, setPhoto] = useState(null); // { dataUrl, mediaType, data } — one pending attachment
  const [photoErr, setPhotoErr] = useState("");
  const [modErr, setModErr] = useState("");
  const uidRef = useRef(null);
  const endRef = useRef(null);
  const fileRef = useRef(null);
  const baseProfileRef = useRef({});
  const sendingRef = useRef(false);
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs, busy]);

  // Seed Scout's working profile from the athlete's real Passport data (so
  // it already knows who it's helping instead of re-asking basics the
  // athlete already filled in), then restore their most recent Scout
  // conversation, if any. Real scout_history is (id, user_id,
  // conversation_id, messages jsonb, created_at) — each transcript row's
  // `messages` is a one-element [{role,content}] array; metering rows
  // (written server-side by increment_scout_usage) are `[]` and flatten to
  // nothing here, so no separate filtering is needed. Only the latest
  // conversation is loaded on mount — older ones are reachable via
  // History, not auto-flattened into one ever-growing chat like before.
  useEffect(() => {
    if (!sb) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { setMsgs([{ role: "assistant", text: t("scout_greeting") }]); return; }
        uidRef.current = user.id;

        const [{ data: prof }, { data: ath }] = await Promise.all([
          sb.from("profiles").select("full_name, dob, occupation").eq("id", user.id).single(),
          sb.from("athletes").select("sport, position, grad_year, gpa, country, club_name, recruiting_status, license, looking_for_players, education_level, scout_context").eq("id", user.id).single(),
        ]);
        const seeded = {};
        if (prof && prof.full_name) seeded.name = prof.full_name;
        if (prof && prof.occupation) seeded.occupation = prof.occupation;
        if (prof && prof.dob) {
          const b = new Date(prof.dob), t = new Date();
          let a = t.getFullYear() - b.getFullYear();
          if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
          seeded.age = a;
        }
        if (ath) {
          if (ath.sport) seeded.sport = ath.sport;
          if (ath.position) seeded.position = ath.position;
          if (ath.country) { seeded.location = ath.country; seeded.citizenship = ath.country; }
          if (ath.club_name) seeded.club = ath.club_name;
          if (ath.recruiting_status) seeded.level = ath.recruiting_status;
          if (ath.grad_year) seeded.grad_year = ath.grad_year;
          if (ath.gpa) seeded.gpa = ath.gpa;
          if (ath.license) seeded.license = ath.license;
          if (ath.looking_for_players != null) seeded.looking_for_players = ath.looking_for_players;
          if (ath.education_level) seeded.education_level = ath.education_level;
        }
        baseProfileRef.current = seeded;
        if (Object.keys(seeded).length) setProfile((p) => ({ ...seeded, ...p }));

        // Flatten scout_context's {field: {value, source, confidence, updated_at}}
        // shape down to {field: value} for prompt purposes — the full shape
        // (migration 050) is what api/scout.js reads/writes; the client only
        // ever needs the plain values to give Scout visibility into what it
        // already knows, same role PROFILE SO FAR already plays for hard facts.
        if (ath && ath.scout_context && typeof ath.scout_context === "object") {
          const flatContext = {};
          for (const [k, entry] of Object.entries(ath.scout_context)) {
            if (k === "ai_meta") continue;
            const v = (entry && typeof entry === "object") ? entry.value : entry;
            if (v != null && v !== "") flatContext[k] = v;
          }
          if (Object.keys(flatContext).length) setScoutContext(flatContext);
        }

        const { data, error } = await sb
          .from("scout_history")
          .select("conversation_id, messages, created_at")
          .eq("user_id", user.id)
          .order("created_at", { ascending: true })
          .limit(1000);
        if (error) throw error;
        const rows = (data || []).filter((r) => Array.isArray(r.messages) && r.messages.length);
        if (rows.length) {
          const lastConvId = rows[rows.length - 1].conversation_id;
          const restored = rows.filter((r) => r.conversation_id === lastConvId).flatMap((r) => r.messages);
          setConversationId(lastConvId);
          setMsgs(restored.map((m) => ({ role: m.role, text: m.content })));
          try {
            const { data: summaryRow } = await sb.from("scout_conversation_summaries").select("summary").eq("conversation_id", lastConvId).maybeSingle();
            if (summaryRow && summaryRow.summary) setSummary(summaryRow.summary);
          } catch (e) { console.error("GOLSZ scout summary restore error:", e); }
        } else {
          setMsgs([{ role: "assistant", text: scoutGreetingFor(seeded, t) }]);
        }
      } catch (e) {
        console.error("GOLSZ scout history load error:", e);
        setMsgs((m) => m || [{ role: "assistant", text: t("scout_greeting") }]);
      } finally { setLoaded(true); }
    })();
  }, []);

  async function logTurn(role, text) {
    if (!sb || !uidRef.current) return;
    try { await sb.from("scout_history").insert({ user_id: uidRef.current, conversation_id: conversationId, messages: [{ role, content: text }] }); }
    catch (e) { console.error("GOLSZ scout history write error:", e); }
  }

  function newChat() {
    setMsgs([{ role: "assistant", text: scoutGreetingFor(baseProfileRef.current, t) }]);
    setProfile(baseProfileRef.current);
    setConversationId(newScoutConvId());
    setSummary("");
    setShowHistory(false);
  }

  async function loadHistoryList() {
    if (!sb || !uidRef.current) return;
    try {
      const { data, error } = await sb
        .from("scout_history")
        .select("conversation_id, messages, created_at")
        .eq("user_id", uidRef.current)
        .order("created_at", { ascending: true })
        .limit(1000);
      if (error) throw error;
      const byConv = new Map();
      for (const r of data || []) {
        if (!Array.isArray(r.messages) || !r.messages.length) continue;
        if (!byConv.has(r.conversation_id)) byConv.set(r.conversation_id, { lastAt: r.created_at, turns: 0, preview: "" });
        const entry = byConv.get(r.conversation_id);
        entry.lastAt = r.created_at;
        entry.turns += r.messages.length;
        if (!entry.preview) {
          const firstUser = r.messages.find((m) => m.role === "user");
          if (firstUser) entry.preview = firstUser.content.slice(0, 60);
        }
      }
      const list = [...byConv.entries()].map(([id, v]) => ({ id, ...v })).sort((a, b) => new Date(b.lastAt) - new Date(a.lastAt));
      setHistory(list);
    } catch (e) { console.error("GOLSZ scout history list error:", e); setHistory([]); }
  }

  function openHistory() {
    if (showHistory) { setShowHistory(false); return; }
    setShowHistory(true);
    loadHistoryList();
  }

  async function loadConversation(id) {
    if (!sb || !uidRef.current) return;
    try {
      const { data, error } = await sb
        .from("scout_history").select("messages, created_at")
        .eq("user_id", uidRef.current).eq("conversation_id", id)
        .order("created_at", { ascending: true });
      if (error) throw error;
      const restored = (data || []).flatMap((r) => Array.isArray(r.messages) ? r.messages : []);
      setMsgs(restored.length ? restored.map((m) => ({ role: m.role, text: m.content })) : [{ role: "assistant", text: t("scout_greeting") }]);
      setConversationId(id);
      setSummary("");
      try {
        const { data: summaryRow } = await sb.from("scout_conversation_summaries").select("summary").eq("conversation_id", id).maybeSingle();
        if (summaryRow && summaryRow.summary) setSummary(summaryRow.summary);
      } catch (e) { console.error("GOLSZ scout summary load error:", e); }
      setShowHistory(false);
    } catch (e) { console.error("GOLSZ scout load conversation error:", e); }
  }

  async function deleteConversation(id) {
    if (!sb || !uidRef.current) return;
    setHistory((h) => (h || []).filter((c) => c.id !== id));
    try {
      const { error } = await sb.from("scout_history").delete().eq("user_id", uidRef.current).eq("conversation_id", id);
      if (error) throw error;
      if (id === conversationId) {
        // the open conversation was deleted — reset to a fresh chat rather
        // than leaving the transcript on screen with nothing behind it
        const fresh = newScoutConvId();
        setConversationId(fresh);
        setProfile(baseProfileRef.current);
        setMsgs([{ role: "assistant", text: scoutGreetingFor(baseProfileRef.current, t) }]);
      }
    } catch (e) {
      console.error("GOLSZ delete conversation error:", e);
      loadHistoryList(); // reload the real list on failure, undoing the optimistic removal
    }
  }

  function pickPhoto() { fileRef.current?.click(); }

  function onPhotoChange(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // allow picking the same file again after removing it
    if (!file) return;
    if (!file.type.startsWith("image/")) { setPhotoErr(t("feed_image_type_err")); return; }
    if (file.size > 8 * 1024 * 1024) { setPhotoErr(t("feed_image_size_err")); return; }
    setPhotoErr("");
    const reader = new FileReader();
    reader.onload = () => {
      const m = /^data:([^;]+);base64,(.+)$/.exec(String(reader.result || ""));
      if (m) setPhoto({ dataUrl: reader.result, mediaType: m[1], data: m[2] });
    };
    reader.readAsDataURL(file);
  }
  function clearPhoto() { setPhoto(null); setPhotoErr(""); }

  async function send(text) {
    const content = text.trim(); if ((!content && !photo) || pending || !loaded || sendingRef.current) return;
    // React state (pending/busy) doesn't actually block a second call until
    // a re-render lands — and moderateContent() below awaits a real network
    // round-trip before either one ever gets set, leaving a real window
    // where a fast double-click/double-Enter fires send() twice, each one
    // passing the check above and going on to hit Scout's API separately.
    // That's what "answers back to back" actually was: two full replies to
    // one real question, not a formatting bug. sendingRef is a plain ref,
    // so setting it here takes effect immediately (not batched like state),
    // closing that window for any call that arrives before the first one
    // finishes — reset in the `finally` below.
    sendingRef.current = true;
    setModErr("");
    // Disables the button/input the instant a real send starts — separate
    // from `busy` (see its declaration above) specifically so this doesn't
    // wait on moderateContent()'s network round-trip below. Without this,
    // a real click looked completely unhandled during that gap (button
    // still enabled, nothing on screen yet), which is what made pressing
    // send again — sometimes a few times — feel necessary even though the
    // first press was already in flight.
    setPending(true);
    try {
    // Check before anything else touches state — a flagged message should
    // never clear the input, appear as a sent bubble, or reach Scout's own
    // conversation history at all, same as Feed/Messages/Passport below.
    if (content) {
      // No human recipient here (recipientId omitted) — Scout is a
      // private 1:1 exchange with an AI, which "direct_message" fits
      // more honestly than any of the other content types.
      const { decision } = await moderateContent({ text: content, contentType: "direct_message", surface: "private_thread" });
      if (decision === "block") { setModErr(t("moderation_blocked")); return; }
    }
    setInput("");
    const attached = photo; setPhoto(null);
    const next = [...(msgs || []), { role: "user", text: content, photo: attached ? attached.dataUrl : null }];
    // Set together, in the same render, so the user's own bubble and the
    // "thinking" bubble appear in the same update — never the thinking
    // bubble alone first (that was the bug: busy used to flip true back
    // where `pending` now does, before this message existed in `msgs`).
    setMsgs(next);
    setBusy(true);
    logTurn("user", content || "[photo]");
    try {
      // Only the last RECENT_TURNS messages go to the model — the running
      // `summary` (server-maintained, migration 049) covers everything
      // older instead of resending an ever-growing full transcript every
      // turn. See CLAUDE.md's AI Scout architecture note for why.
      const RECENT_TURNS = 6;
      const api = next.slice(-RECENT_TURNS).map((m) => ({ role: m.role, content: m.text }));
      const speakerLabel = profile.occupation && profile.occupation !== "Player" ? profile.occupation.toUpperCase() : "ATHLETE";
      const promptText = `PROFILE SO FAR: ${JSON.stringify(profile)}\n\nSCOUT CONTEXT SO FAR: ${JSON.stringify(scoutContext)}\n\nCONVERSATION SUMMARY SO FAR: ${summary || "(none yet)"}\n\n${speakerLabel}: ${content}`;
      api[api.length - 1] = attached
        ? { role: "user", content: [
            { type: "image", source: { type: "base64", media_type: attached.mediaType, data: attached.data } },
            { type: "text", text: promptText },
          ] }
        : { role: "user", content: promptText };
      let _hdr = { "Content-Type": "application/json" };
      try { if (typeof sb !== "undefined" && sb) { const _s = await sb.auth.getSession(); if (_s && _s.data && _s.data.session) _hdr["Authorization"] = "Bearer " + _s.data.session.access_token; } } catch (e) {}
      const _endpoint = (typeof SCOUT_ENDPOINT !== "undefined" && SCOUT_ENDPOINT) ? SCOUT_ENDPOINT : "https://api.anthropic.com/v1/messages";
      // requestId lets the server (api/scout.js) reject an exact duplicate
      // submission (double-click, retry-storm) without double-charging —
      // crypto.randomUUID() is available in every browser this app targets.
      const requestId = (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random();
      const res = await fetch(_endpoint, {
        method: "POST", headers: _hdr,
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 4096, system: SYS, messages: api, lang, conversationId, summary, requestId, tools: [{ type: "web_search_20250305", name: "web_search" }] }),
      });
      const data = await res.json();
      // scout_usage ({remaining, limit}) is present on both success and
      // limit-reached (402) responses — capture it either way so the
      // header's "questions left today" count updates even on a refusal.
      if (data && data.scout_usage && typeof data.scout_usage === "object") setScoutUsage(data.scout_usage);
      // A non-2xx response (rate limit, auth hiccup, upstream 5xx) still
      // arrives here as valid JSON — without this check data.content is
      // undefined, raw ends up "", and an empty assistant bubble gets
      // added with no visible error, which looked like Scout just never
      // replied. Throwing here routes it through the catch below instead.
      if (!res.ok) {
        const e = new Error((data && data.error) || t("scout_connection_dropped"));
        e.code = "SCOUT_HTTP_ERROR";
        throw e;
      }
      const raw = (data.content || []).map((b) => (b.type === "text" ? b.text : "")).filter(Boolean).join("\n");
      let reply = raw, updates = null, contextUpdates = null;
      try {
        const clean = raw.replace(/```json|```/g, "").trim();
        const parsed = JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}") + 1));
        reply = parsed.reply || raw; updates = parsed.profile_updates || null; contextUpdates = parsed.scout_context_updates || null;
      } catch { /* raw */ }
      if (updates && typeof updates === "object") setProfile((p) => ({ ...p, ...updates }));
      if (contextUpdates && typeof contextUpdates === "object") {
        // Same flatten-to-plain-value logic as the mount-time load above —
        // the server already validated/persisted the real {value,source,
        // confidence} shape via merge_scout_context(); this just keeps the
        // client's own working copy (used for the next prompt) in sync
        // without a second round-trip.
        setScoutContext((c) => {
          const next = { ...c };
          for (const [k, entry] of Object.entries(contextUpdates)) {
            const v = (entry && typeof entry === "object") ? entry.value : entry;
            if (v != null && v !== "") next[k] = v;
          }
          return next;
        });
      }
      if (typeof data.scout_summary === "string") setSummary(data.scout_summary);
      setMsgs((m) => [...m, { role: "assistant", text: reply }]);
      logTurn("assistant", reply);
    } catch (e) {
      const msg = e && e.code === "SCOUT_HTTP_ERROR" ? e.message : t("scout_connection_dropped");
      setMsgs((m) => [...m, { role: "assistant", text: msg }]);
    }
    } finally { setBusy(false); setPending(false); sendingRef.current = false; }
  }

  const known = Object.keys(profile).filter((k) => profile[k]);
  const isPlayerChat = !profile.occupation || profile.occupation === "Player";
  const CHIPS = chipsFor(t, isPlayerChat);
  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      <div style={{ padding: "10px 14px", borderBottom: `1px solid ${C.line}`, display: "flex", alignItems: "center", gap: 8 }}>
        <Radar size={18} color={C.lime} />
        <span style={{ fontWeight: 800, letterSpacing: "0.04em" }}>{t("scout_header")}</span>
        <span style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 12 }}>
          <span style={{ fontSize: 10, color: C.slate, fontFamily: "'Space Mono', monospace" }}>
            {scoutUsage ? `${scoutUsage.remaining} ${t("scout_questions_left")}` : known.length ? `${known.length} ${t("scout_fields_on_file")}` : t("scout_live_agent")}
          </span>
          <button onClick={openHistory} title={t("scout_history_title")} style={iconBtn(showHistory ? C.lime : C.slate)}><History size={16} /></button>
          <button onClick={newChat} title={t("scout_new_chat")} style={iconBtn(C.lime)}><Plus size={17} /></button>
        </span>
      </div>

      {showHistory ? (
        <div style={{ flex: 1, overflowY: "auto", padding: "14px 12px 6px" }}>
          {history === null && <div style={{ color: C.slate, fontSize: 13 }}>{t("loading")}</div>}
          {history && history.length === 0 && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "30px 0" }}>{t("scout_no_past")}</div>}
          {history && history.map((h) => (
            <div key={h.id} style={{
              ...card, display: "flex", alignItems: "center", gap: 8,
              border: `1px solid ${h.id === conversationId ? C.lime : C.line}`,
            }}>
              <button onClick={() => loadConversation(h.id)} style={{ flex: 1, minWidth: 0, textAlign: "left", background: "none", border: "none", cursor: "pointer", fontFamily: "inherit", padding: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 3, color: C.chalk }}>{h.preview || t("scout_new_conversation")}</div>
                <div style={{ fontSize: 10.5, color: C.slate, fontFamily: "'Space Mono', monospace" }}>{timeAgo(h.lastAt)} ago ·{t("scout_ago_messages")} {h.turns}</div>
              </button>
              <button onClick={() => deleteConversation(h.id)} title={t("scout_delete_conv")} style={{ background: "none", border: "none", color: C.slate, cursor: "pointer", padding: 4, flexShrink: 0, display: "flex" }}>
                <Trash2 size={15} />
              </button>
            </div>
          ))}
        </div>
      ) : (
        <div style={{ flex: 1, overflowY: "auto", padding: "14px 12px 6px" }}>
          {!loaded && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "30px 0" }}>{t("loading")}</div>}
          {msgs && msgs.map((m, i) => (
            <div key={i} className="msg" style={m.role === "user" ? bubbleUser : bubbleAgent}>
              {m.role === "assistant" && <div style={{ fontSize: 9, letterSpacing: "0.22em", color: C.lime, fontWeight: 800, marginBottom: 4 }}>{t("scout_scout_label")}</div>}
              {m.photo && <img src={m.photo} style={{ display: "block", maxWidth: "100%", borderRadius: 10, marginBottom: m.text ? 6 : 0 }} />}
              {m.text && <div style={{ whiteSpace: "pre-wrap" }}>{m.text}</div>}
            </div>
          ))}
          {loaded && !pending && msgs && msgs.length <= 1 && (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 6 }}>
              {CHIPS.map((q, i) => {
                const Icon = CHIP_ICONS[i];
                return (
                  <button key={q} onClick={() => send(q)} style={{
                    display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 8, textAlign: "left",
                    background: C.card, border: `1px solid ${C.line2}`, borderRadius: 12, padding: 12,
                    cursor: "pointer", fontFamily: "inherit", color: C.chalk,
                  }}>
                    <Icon size={17} color={C.lime} />
                    <span style={{ fontSize: 12.5, fontWeight: 700, lineHeight: 1.3 }}>{q}</span>
                  </button>
                );
              })}
            </div>
          )}
          {busy && <div style={bubbleAgent}><div className="running"><span /><span /><span /></div></div>}
          <div ref={endRef} />
        </div>
      )}

      {!showHistory && (
        <>
          {msgs && msgs.length > 1 && (
            <div style={{ display: "flex", gap: 8, overflowX: "auto", padding: "6px 12px", scrollbarWidth: "none" }} className="noscroll">
              {CHIPS.map((q) => <button key={q} onClick={() => send(q)} disabled={pending || !loaded} style={{ flex: "0 0 auto", background: "transparent", border: `1px solid ${C.line2}`, color: C.lime, borderRadius: 999, padding: "7px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap" }}>{q}</button>)}
            </div>
          )}
          {photoErr && <div style={{ fontSize: 11.5, color: C.amber, padding: "0 12px 6px" }}>{photoErr}</div>}
          {modErr && <div style={{ fontSize: 11.5, color: C.amber, padding: "0 12px 6px" }}>{modErr}</div>}
          {photo && (
            <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "0 12px 8px" }}>
              <div style={{ position: "relative", flexShrink: 0 }}>
                <img src={photo.dataUrl} style={{ width: 48, height: 48, objectFit: "cover", borderRadius: 10, border: `1px solid ${C.line2}`, display: "block" }} />
                <button onClick={clearPhoto} title={t("feed_remove_photo")} style={{ position: "absolute", top: -6, right: -6, background: "#000000cc", border: "none", borderRadius: "50%", width: 18, height: 18, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: C.chalk, padding: 0 }}>
                  <X size={11} />
                </button>
              </div>
              <span style={{ fontSize: 11, color: C.slate }}>{t("scout_photo_attached")}</span>
            </div>
          )}
          <div style={{ display: "flex", gap: 8, padding: "10px 12px 14px", borderTop: `1px solid ${C.line}` }}>
            <input ref={fileRef} type="file" accept="image/*" onChange={onPhotoChange} style={{ display: "none" }} />
            <button onClick={pickPhoto} disabled={pending || !loaded} title={t("scout_attach_photo")}
              style={{ flexShrink: 0, background: "none", border: `1px solid ${C.line2}`, borderRadius: 12, width: 46, color: C.lime, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", opacity: pending || !loaded ? 0.4 : 1 }}>
              <Plus size={19} />
            </button>
            <textarea rows={1} value={input} placeholder={t("scout_input_ph")} onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input); } }}
              style={{ flex: 1, background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 12, color: C.chalk, padding: "11px 13px", fontSize: 14, fontFamily: "inherit", resize: "none", outline: "none" }} />
            <button onClick={() => send(input)} disabled={pending || !loaded || (!input.trim() && !photo)} style={{ background: C.lime, color: C.ink, border: "none", borderRadius: 12, width: 46, cursor: "pointer", opacity: pending || !loaded || (!input.trim() && !photo) ? 0.4 : 1 }}><Send size={17} /></button>
          </div>
        </>
      )}
    </div>
  );
}

/* ============ shell ============ */
function SectionTitle({ children, noMargin }) {
  return <h2 style={{ fontSize: 13, fontWeight: 800, letterSpacing: "0.12em", color: C.slate, textTransform: "uppercase", margin: noMargin ? 0 : "6px 2px 10px" }}>{children}</h2>;
}
const card = { background: C.card, border: `1px solid ${C.line}`, borderRadius: 16, padding: 14, marginBottom: 12, boxShadow: "0 6px 18px -12px rgba(0,0,0,0.6)" };
const iconBtn = (color) => ({ display: "inline-flex", alignItems: "center", gap: 5, background: "none", border: "none", color, fontSize: 12.5, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", padding: 0 });
const bubbleAgent = { background: C.turf, border: `1px solid ${C.line2}`, borderRadius: "2px 14px 14px 14px", padding: "10px 13px", margin: "0 30px 12px 0", fontSize: 14, lineHeight: 1.55 };
const bubbleUser = { background: C.lime, color: C.ink, borderRadius: "14px 2px 14px 14px", padding: "10px 13px", margin: "0 0 12px 30px", fontSize: 14, lineHeight: 1.55, fontWeight: 500 };

function GolszApp({ onSignOut, startOnboarding }) {
  // A shared Passport link (?profile=<uid>, see Passport's sharePassport())
  // survives the sign-in/sign-up flow since it's untouched in the URL —
  // Root() renders Auth first for a signed-out visitor, then this reads
  // the same query string once GolszApp mounts post-login.
  const [page, setPage] = useState(() => {
    if (startOnboarding) return "profile";
    try {
      const params = new URLSearchParams(window.location.search);
      if (params.get("profile")) return "profile";
      const p = params.get("page");
      // Feed/Discover/Events/Messages are launch-scoped off the main nav
      // (kept fully intact in the code for a later update — see the "go"
      // function and the route list below, both untouched) — this just
      // narrows what a fresh page load can land on directly.
      const valid = ["scout", "profile", "admin"];
      return valid.includes(p) ? p : "scout";
    } catch (e) { return "scout"; }
  });
  const [thread, setThread] = useState(null);
  const [hasUnreadMsgs, setHasUnreadMsgs] = useState(false);
  const [onboarding, setOnboarding] = useState(!!startOnboarding);
  const [viewProfileId, setViewProfileId] = useState(() => {
    if (startOnboarding) return null; // finishing your own profile takes priority over a shared link
    try { return new URLSearchParams(window.location.search).get("profile") || null; }
    catch (e) { return null; }
  });
  // Stack of { page, viewProfileId } snapshots to restore on "back" out of a
  // viewed profile — e.g. opening a passport from a chat thread's header and
  // pressing back should land back in that same thread, not on your own
  // profile. Pushed in viewProfile(), popped in the Passport onBack handlers.
  const [profileStack, setProfileStack] = useState([]);
  // null = still checking, true/false once we know. Gates the rest of the
  // app behind finishing the Passport (see the "must complete profile"
  // effect below) — until athletes.sport is set, a brand-new (or
  // never-finished) account can only see Passport, no other tab.
  const [profileComplete, setProfileComplete] = useState(null);
  const isDesktop = useIsDesktop();
  const { t } = useLang();

  useEffect(() => {
    if (!sb) { setProfileComplete(true); return; } // preview mode, nothing to gate
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { setProfileComplete(true); return; }
        const { data } = await sb.from("athletes").select("sport").eq("id", user.id).single();
        setProfileComplete(!!(data && data.sport));
      } catch (e) {
        console.error("GOLSZ profile-complete check error:", e);
        setProfileComplete(true); // fail open — a fetch hiccup shouldn't lock someone out of their own app
      }
    })();
  }, []);

  const mustFinishProfile = profileComplete === false;
  useEffect(() => { if (mustFinishProfile) setPage("profile"); }, [mustFinishProfile]);

  // Feed/Discover/Events/Messages are launch-scoped off both nav bars —
  // see the "go" function and the route list below, both left fully
  // intact so re-adding a nav entry later is the only step needed.
  const NAV = [
    { id: "scout", icon: Radar, label: t("nav_scout") },
    { id: "profile", icon: User, label: t("nav_passport") },
  ];

  const SIDEBAR_NAV = [
    { id: "scout", icon: Radar, label: t("nav_ai_scout") },
    { id: "profile", icon: User, label: t("nav_profile") },
  ];

  const go = (id) => { if (mustFinishProfile && id !== "profile") return; setPage(id); if (id !== "messages") setThread(null); setViewProfileId(null); setProfileStack([]); };
  const openThread = (id) => { if (mustFinishProfile) return; setThread(id); setPage("messages"); setProfileStack([]); };
  const viewProfile = (id) => {
    if (mustFinishProfile) return;
    setProfileStack((s) => [...s, { page, viewProfileId }]);
    setViewProfileId(id);
    setPage("profile");
  };
  const backFromProfile = () => {
    setProfileStack((s) => {
      if (s.length === 0) { setViewProfileId(null); return s; }
      const prev = s[s.length - 1];
      setViewProfileId(prev.viewProfileId);
      setPage(prev.page);
      return s.slice(0, -1);
    });
  };

  useEffect(() => {
    if (!sb) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) return;
        const { count } = await sb.from("messages").select("id", { count: "exact", head: true }).eq("recipient_id", user.id).is("read_at", null);
        setHasUnreadMsgs((count || 0) > 0);
      } catch (e) { console.error("GOLSZ unread check error:", e); }
    })();
  }, [page]);

  // Time-on-app tracking (migration 031, admin-only aggregate view under
  // Analytics → Time on app). Rather than a precise session start/stop
  // (unreliable — tabs get killed, phones lock, there's no reliable
  // "unload" event on mobile Safari/PWAs), this just pings once a minute
  // while the tab is actually visible, and the server accumulates a
  // per-day minute count. GolszApp only mounts once signed in, so this
  // effect's cleanup naturally stops the pings on sign-out.
  useEffect(() => {
    if (!sb) return;
    const id = setInterval(() => {
      if (document.visibilityState !== "visible") return;
      sb.rpc("record_activity_ping", { p_minutes: 1 }).then(({ error }) => { if (error) console.error("GOLSZ activity ping error:", error); });
    }, 60000);
    return () => clearInterval(id);
  }, []);

  if (isDesktop) {
    return (
      <div style={{ display: "flex", minHeight: "100vh", background: C.pitch, color: C.chalk, fontFamily: "'Archivo', system-ui, sans-serif" }}>
        <style>{CSS}</style>

        {/* sidebar */}
        <aside style={{ width: 232, flexShrink: 0, borderRight: `1px solid ${C.line}`, display: "flex", flexDirection: "column", padding: "22px 14px", position: "sticky", top: 0, height: "100vh" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 10px", marginBottom: 26 }}>
            <a href="index.html" style={{ display: "flex", alignItems: "center", gap: 7, fontWeight: 900, fontSize: 22, letterSpacing: "0.03em", fontStretch: "expanded", color: "inherit", textDecoration: "none" }}>
              <img src="/assets/logo-mark.png" alt="" className="logo-mark" style={{ width: 24, height: 24 }} />
              GOLSZ<span style={{ color: C.lime }}>.</span>
            </a>
            <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
              <SettingsButton />
              <NotificationBell />
            </div>
          </div>
          <nav style={{ display: "flex", flexDirection: "column", gap: 2, flex: 1 }}>
            {SIDEBAR_NAV.map((n) => {
              const active = page === n.id;
              const locked = mustFinishProfile && n.id !== "profile";
              return (
                <button key={n.id} onClick={() => go(n.id)} style={{
                  display: "flex", alignItems: "center", gap: 12, padding: "10px 12px", borderRadius: 10,
                  background: active ? "#C8F1351a" : "transparent", border: "none", cursor: locked ? "default" : "pointer", fontFamily: "inherit",
                  color: active ? C.lime : C.chalk, fontSize: 14, fontWeight: active ? 700 : 600, textAlign: "left",
                  opacity: locked ? 0.35 : 1,
                }}>
                  <n.icon size={19} strokeWidth={active ? 2.4 : 2} />
                  {n.label}
                  {n.badge && <span style={{ width: 7, height: 7, borderRadius: 99, background: C.lime, marginLeft: "auto" }} />}
                </button>
              );
            })}
          </nav>
          <button onClick={onSignOut} style={{
            display: "flex", alignItems: "center", gap: 12, padding: "10px 12px", borderRadius: 10,
            background: "transparent", border: `1px solid ${C.line2}`, cursor: "pointer", fontFamily: "inherit",
            color: C.slate, fontSize: 13, fontWeight: 600, textAlign: "left", marginTop: 8,
          }}>{t("nav_signout")}</button>
        </aside>

        {/* main content */}
        <main style={{ flex: 1, overflowY: "auto" }} className="noscroll">
          <div style={{ maxWidth: 720, margin: "0 auto", padding: "28px 32px 60px" }}>
            {page === "feed" && <Feed onMessage={openThread} onViewProfile={viewProfile} />}
            {page === "discover" && <Discover onMessage={openThread} onViewProfile={viewProfile} />}
            {page === "scout" && <div style={{ height: "calc(100vh - 88px)", border: `1px solid ${C.line}`, borderRadius: 16, overflow: "hidden" }}><Scout /></div>}
            {page === "events" && <Events />}
            {page === "profile" && <Passport onSignOut={onSignOut} autoEdit={onboarding} onAutoEditConsumed={() => setOnboarding(false)} onProfileStatus={setProfileComplete} onOpenAdmin={() => setPage("admin")} viewUserId={viewProfileId} onBack={backFromProfile} onMessage={openThread} onViewProfile={viewProfile} />}
            {page === "messages" && <div style={{ height: "calc(100vh - 88px)", border: `1px solid ${C.line}`, borderRadius: 16, overflow: "hidden" }}><Messages thread={thread} setThread={setThread} onViewProfile={viewProfile} /></div>}
            {page === "admin" && <AdminPanel onBack={() => setPage("profile")} />}
          </div>
        </main>
      </div>
    );
  }

  return (
    <div className="app-shell" style={{ display: "flex", flexDirection: "column", background: C.pitch, color: C.chalk, fontFamily: "'Archivo', system-ui, sans-serif", maxWidth: 480, margin: "0 auto", position: "relative" }}>
      <style>{CSS}</style>

      {/* top bar */}
      <header style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "calc(12px + env(safe-area-inset-top, 0px)) 16px 10px", borderBottom: `1px solid ${C.line}`, flexShrink: 0 }}>
        <a href="index.html" style={{ display: "flex", alignItems: "center", gap: 7, fontWeight: 900, fontSize: 24, letterSpacing: "0.03em", fontStretch: "expanded", color: "inherit", textDecoration: "none" }}>
          <img src="/assets/logo-mark.png" alt="" className="logo-mark" style={{ width: 26, height: 26 }} />
          GOLSZ<span style={{ color: C.lime }}>.</span>
        </a>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        <SettingsButton />
        <NotificationBell />
        <button onClick={() => { if (mustFinishProfile) return; setPage("messages"); setThread(null); }} style={{ position: "relative", background: "none", border: "none", color: page === "messages" ? C.lime : C.chalk, cursor: mustFinishProfile ? "default" : "pointer", opacity: mustFinishProfile ? 0.35 : 1, padding: 4 }}>
          <MessageSquare size={22} />
          {hasUnreadMsgs && <span style={{ position: "absolute", top: 2, right: 2, width: 8, height: 8, borderRadius: 99, background: C.lime, border: `2px solid ${C.pitch}` }} />}
        </button>
        </div>
      </header>

      {/* body */}
      <main style={{ flex: 1, overflowY: "auto", WebkitOverflowScrolling: "touch" }} className="noscroll">
        {page === "feed" && <Feed onMessage={openThread} onViewProfile={viewProfile} />}
        {page === "discover" && <Discover onMessage={openThread} onViewProfile={viewProfile} />}
        {page === "scout" && <Scout />}
        {page === "events" && <Events />}
        {page === "profile" && <Passport onSignOut={onSignOut} autoEdit={onboarding} onAutoEditConsumed={() => setOnboarding(false)} onProfileStatus={setProfileComplete} onOpenAdmin={() => setPage("admin")} viewUserId={viewProfileId} onBack={backFromProfile} onMessage={openThread} onViewProfile={viewProfile} />}
        {page === "messages" && <Messages thread={thread} setThread={setThread} onViewProfile={viewProfile} />}
        {page === "admin" && <AdminPanel onBack={() => setPage("profile")} />}
      </main>

      {/* bottom nav */}
      <nav style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-around", padding: "8px 8px calc(12px + env(safe-area-inset-bottom, 0px))", borderTop: `1px solid ${C.line}`, background: C.pitch, flexShrink: 0 }}>
        {NAV.map((n) => {
          const active = page === n.id;
          const locked = mustFinishProfile && n.id !== "profile";
          if (n.center) {
            return (
              <button key={n.id} onClick={() => go(n.id)} style={{
                background: C.lime, color: C.ink, border: `3px solid ${C.pitch}`, borderRadius: "50%",
                width: 58, height: 58, marginTop: -22, boxShadow: `0 8px 20px -6px #C8F13566`,
                display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                cursor: locked ? "default" : "pointer", fontFamily: "inherit",
                opacity: locked ? 0.35 : 1,
              }}>
                <n.icon size={22} strokeWidth={2.4} />
                <span style={{ fontSize: 8, fontWeight: 800, letterSpacing: "0.06em", marginTop: 1 }}>{n.label}</span>
              </button>
            );
          }
          return (
            <button key={n.id} onClick={() => go(n.id)} style={{
              background: "none", border: "none", cursor: locked ? "default" : "pointer", fontFamily: "inherit",
              display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
              color: active ? C.lime : C.slate, flex: 1, padding: "4px 0",
              opacity: locked ? 0.35 : 1,
            }}>
              <n.icon size={21} strokeWidth={active ? 2.4 : 2} />
              <span style={{ fontSize: 9.5, fontWeight: active ? 800 : 600 }}>{n.label}</span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

const CSS = `
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400..900;125,400..900&family=Space+Mono:wght@400;700&display=swap');
  * { box-sizing: border-box; }

  /* GOLSZ theme tokens — dark is the default/fallback (:root), light
     overrides via [data-theme="light"] on <html> (see useTheme()). */
  :root {
    --pitch: #0D1210; --turf: #16241C; --card: #121D17; --lime: #C8F135;
    --chalk: #F2F5F0; --slate: #8DA396; --line: #1F2E25; --line2: #2C4033;
    --amber: #C89B3C; --body-text: #C9D6CD; --warn-text: #E7C56B; --msg-name: #4A9EFF;
    --lime-border: rgba(200,241,53,0.35); --amber-border: rgba(200,155,60,0.35);
    --elite: #4A9EFF; --elite-border: rgba(74,158,255,0.35);
    --passport-wash: transparent; --passport-strip: rgba(200,241,53,0.1);
  }
  html[data-theme="light"] {
    --pitch: #F5F7F3; --turf: #EDF0EA; --card: #FFFFFF; --lime: #6B9C1F;
    --chalk: #14201A; --slate: #5B6B62; --line: #E1E7DE; --line2: #CFD8CA;
    --amber: #8A6A22; --body-text: #33463A; --warn-text: #8A6A22; --msg-name: #1D5FC4;
    --lime-border: rgba(107,156,31,0.3); --amber-border: rgba(138,106,34,0.3);
    --elite: #1D5FC4; --elite-border: rgba(29,95,196,0.3);
    --passport-wash: linear-gradient(180deg, #E3F1D4 0%, #F5F7F3 340px);
    --passport-strip: #DCEDC7;
  }

  body { margin: 0; background: ${C.pitch}; }
  /* iOS Safari's address bar collapses/expands as you scroll, but 100vh
     is locked to the tallest (address-bar-hidden) case — the shell would
     render taller than the actually-visible viewport whenever the bar was
     showing, shoving the bottom nav off-screen and making the outer page
     rubber-band/scroll instead of just the inner .noscroll content area.
     100dvh tracks the real visible height; 100vh above is just the
     pre-dvh-support fallback (Safari < 15.4). */
  .app-shell { height: 100vh; height: 100dvh; }
  .noscroll::-webkit-scrollbar { display: none; }
  .noscroll { -ms-overflow-style: none; scrollbar-width: none; }
  .msg { animation: rise .22s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .running { display: flex; gap: 5px; padding: 4px 0; }
  .running span { width: 6px; height: 6px; border-radius: 99px; background: ${C.lime}; animation: run 1s infinite; }
  .running span:nth-child(2){ animation-delay:.15s } .running span:nth-child(3){ animation-delay:.3s }
  @keyframes run { 0%,100%{opacity:.25;transform:translateY(0)} 50%{opacity:1;transform:translateY(-3px)} }
  @media (prefers-reduced-motion: reduce){ .msg,.running span{ animation:none } }
  textarea::placeholder, input::placeholder { color: ${C.slate}; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid ${C.lime}; outline-offset: 2px; }
  /* logo-mark.png is baked at the dark-theme lime (#C8F135), which reads
     fine on a near-black background but washes out against the light
     theme's near-white one — darken/saturate it under data-theme="light"
     so it stays legible, mirroring how --lime itself darkens for that
     theme (see the CSS custom properties above). */
  html[data-theme="light"] img.logo-mark { filter: brightness(0.55) saturate(1.3); }
  @media (min-width: 900px) {
    .discover-grid { grid-template-columns: repeat(3, 1fr) !important; }
    .pricing-grid { grid-template-columns: repeat(3, 1fr) !important; }
    aside button:hover, main button:not(:disabled):hover { filter: brightness(1.12); }
  }
`;

// Supabase client (null when not configured -> app runs in preview mode)
const sb = (SUPABASE_URL && SUPABASE_ANON_KEY && typeof window !== "undefined" && window.supabase)

  : null;

// Client-side crash reporting (migration 036) — catches uncaught JS
// errors and unhandled promise rejections anywhere in the app and logs
// them via log_client_error(), a security-definer RPC that always
// stamps user_id from auth.uid() itself (never trusts the client) and
// is granted to anon as well as authenticated, since a crash can
// happen before someone's even signed in (e.g. on the signup screen).
// Surfaces in the Admin Panel's "Errors" tab. Best-effort only — if sb
// itself isn't configured (preview mode, no backend) there's nowhere
// to send this, so it just no-ops rather than erroring further.
if (typeof window !== "undefined") {
  const reportClientError = (message, detail) => {
    if (!sb) return;
    sb.rpc("log_client_error", { p_message: message || "Unknown error", p_detail: detail || null, p_url: window.location.href })
      .then(({ error }) => { if (error) console.error("GOLSZ client error log failed:", error); });
  };
  window.addEventListener("error", (event) => {
    reportClientError(
      (event.error && event.error.message) || event.message,
      { stack: event.error && event.error.stack ? String(event.error.stack).slice(0, 4000) : null }
    );
  });
  window.addEventListener("unhandledrejection", (event) => {
    const reason = event.reason;
    reportClientError(
      (reason && reason.message) || String(reason),
      { stack: reason && reason.stack ? String(reason.stack).slice(0, 4000) : null, unhandledRejection: true }
    );
  });
}

function Auth({ onDone, paidReturn }) {
  const isDesktop = useIsDesktop();
  const { t } = useLang();
  const [mode, setMode] = useState(paidReturn ? "login" : "signup");
  const [plan, setPlan] = useState("free");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [dobDay, setDobDay] = useState("");
  const [dobMonth, setDobMonth] = useState("");
  const [dobYear, setDobYear] = useState("");
  const [parentEmail, setParentEmail] = useState("");
  const [website, setWebsite] = useState(""); // honeypot — real users never see or fill this field, only bots that auto-fill every input do
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [notice, setNotice] = useState(paidReturn ? "Payment received! If this is the only tab open, log in below once you've confirmed your email. Otherwise close this tab and go back to where you signed up — it'll sign you in automatically the moment your email is confirmed, from whatever device you use to confirm it." : "");
  const [forgotMode, setForgotMode] = useState(false);
  const [resetSent, setResetSent] = useState(false);
  const [confirmPolling, setConfirmPolling] = useState(false);
  // Real production incident: a user signed up, never received Supabase's
  // confirmation email (its default sender is rate-limited and easily
  // lands in spam — see CLAUDE.md), and came back later to log in with no
  // way to recover. Login threw "Email not confirmed" with no path
  // forward. This tracks that specific failure so the error box can offer
  // a real fix (resend) instead of just restating the problem.
  const [unconfirmedEmail, setUnconfirmedEmail] = useState("");
  const [resendBusy, setResendBusy] = useState(false);
  const [resendSent, setResendSent] = useState(false);
  const pollRef = useRef(null);
  const isSignup = mode === "signup";

  useEffect(() => () => { if (pollRef.current) clearTimeout(pollRef.current); }, []);

  // Email confirmation links always authenticate whichever device opens
  // them, not necessarily the device that signed up — someone might sign
  // up on a laptop but confirm from their phone's mail app. Rather than
  // relying on that link to get THIS tab logged in, this tab just quietly
  // keeps retrying a real sign-in with the credentials already typed here
  // until Supabase reports the account confirmed, then drops straight into
  // the app — no matter where the confirmation actually happened.
  function startConfirmPolling(pollEmail, pollPw) {
    if (pollRef.current) return;
    setConfirmPolling(true);
    const deadline = Date.now() + 30 * 60 * 1000; // give up after 30 minutes
    let delay = 5000;
    const tick = async () => {
      try {
        const { data, error } = await sb.auth.signInWithPassword({ email: pollEmail, password: pollPw });
        if (!error && data && data.session) {
          pollRef.current = null;
          setConfirmPolling(false);
          onDone(true);
          return;
        }
        // Supabase rate-limits repeated sign-in attempts — back off harder
        // instead of hammering it on a fixed schedule for 30 minutes straight.
        if (error && (error.status === 429 || /rate limit/i.test(error.message || ""))) {
          delay = Math.min(delay * 2, 60000);
        }
      } catch (e) { /* network hiccup — just retry on the same schedule */ }
      if (Date.now() > deadline) { pollRef.current = null; setConfirmPolling(false); return; }
      pollRef.current = setTimeout(tick, delay);
    };
    pollRef.current = setTimeout(tick, delay);
  }

  async function sendReset() {
    if (!sb || !email.trim() || busy) return;
    setBusy(true); setErr("");
    try {
      const { error } = await sb.auth.resetPasswordForEmail(email.trim(), {
        redirectTo: window.location.origin + window.location.pathname,
      });
      if (error) throw error;
      setResetSent(true);
    } catch (e) {
      setErr((e && e.message) || "Couldn't send reset email.");
    } finally { setBusy(false); }
  }

  // Self-service recovery for the exact incident this was built for: a
  // signup whose confirmation email never arrived. Resends it, then
  // starts the same quiet auto-login polling signup already uses (see
  // startConfirmPolling above) — the moment the athlete confirms from
  // whatever device they open the new email on, this tab logs them in
  // with no need to come back and log in by hand a second time.
  async function resendConfirmation() {
    if (!sb || !unconfirmedEmail || resendBusy) return;
    // Deliberately doesn't clear `err` here — the original "hasn't been
    // confirmed" explanation stays visible alongside the new "sent" line
    // below rather than the whole box vanishing when the message resets.
    setResendBusy(true);
    try {
      const { error } = await sb.auth.resend({ type: "signup", email: unconfirmedEmail });
      if (error) throw error;
      setResendSent(true);
      startConfirmPolling(unconfirmedEmail, pw);
    } catch (e) {
      setErr((e && e.message) || "Couldn't resend the confirmation email. Try again in a minute.");
    } finally { setResendBusy(false); }
  }

  const dobNum = { d: parseInt(dobDay, 10), m: parseInt(dobMonth, 10), y: parseInt(dobYear, 10) };
  const dobOk = dobDay && dobMonth && dobYear
    && dobNum.d >= 1 && dobNum.d <= 31
    && dobNum.m >= 1 && dobNum.m <= 12
    && String(dobYear).length === 4 && dobNum.y >= 1900 && dobNum.y <= new Date().getFullYear();
  const dobIso = dobOk ? `${dobYear}-${String(dobNum.m).padStart(2, "0")}-${String(dobNum.d).padStart(2, "0")}` : "";
  const age = dobOk ? (() => {
    const today = new Date(); const b = new Date(dobIso);
    let a = today.getFullYear() - b.getFullYear();
    const notYet = (today.getMonth() < b.getMonth()) || (today.getMonth() === b.getMonth() && today.getDate() < b.getDate());
    if (notYet) a--;
    return a;
  })() : null;
  const isMinor = age !== null && age < 18;
  const parentEmailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(parentEmail.trim());

  const ok = email.trim() && pw.trim() && (!isSignup || (name.trim() && dobOk && (!isMinor || parentEmailOk)));
  const selected = PLANS.find((p) => p.id === plan) || PLANS[0];
  const field = { width: "100%", background: C.turf, border: "1px solid " + C.line2, borderRadius: 12, color: C.chalk, padding: "13px 14px", fontSize: 15, fontFamily: "inherit", outline: "none", marginBottom: 12, boxSizing: "border-box" };
  const dobField = { ...field, marginBottom: 0, textAlign: "center" };

  async function submit() {
    if (!ok || busy || confirmPolling) return;
    // Honeypot: a real user never sees or fills this field, so anything in
    // it means an automated script filled every input on the page. Trust &
    // Safety Moderation System pass: this used to silently no-op the whole
    // signup client-side — real, but a client-only gate a bot hitting
    // Supabase's signup API directly (skipping this component entirely)
    // trivially bypasses. Now the signup still proceeds (so a bot gets no
    // signal telling it apart from a real submission, same as before) but
    // the honeypot's value is passed through in signup metadata below, and
    // handle_new_user() (server-side, migration 063) sets a rock-bottom
    // trust_score on the new account when it arrives non-empty — additive
    // and non-blocking, never risks rejecting a real signup outright.
    setErr("");
    setNotice("");
    setUnconfirmedEmail("");
    setResendSent(false);
    // preview mode: no backend configured -> behave like the demo
    if (!sb) {
      if (isSignup && selected.price > 0 && STRIPE_LINKS[plan]) { window.location.href = STRIPE_LINKS[plan]; return; }
      onDone(); return;
    }
    // Open a blank tab synchronously, before any `await` — browsers only
    // allow window.open() without treating it as a blocked popup when it's
    // called directly inside the click's call stack, and signUp() below is
    // async so we don't have the real checkout URL yet. We point this tab
    // at the real URL once signUp() resolves. Keeping checkout in a
    // separate tab (instead of navigating this one away) is what lets this
    // tab stay alive and keep polling for email confirmation the whole time.
    let checkoutTab = null;
    if (isSignup && selected.price > 0 && STRIPE_LINKS[plan]) {
      checkoutTab = window.open("", "_blank");
    }
    setBusy(true);
    try {
      if (isSignup) {
        const signupEmail = email.trim();
        const signupPw = pw;
        const { data, error } = await sb.auth.signUp({ email: signupEmail, password: signupPw, options: { data: {
          full_name: name.trim(), plan: selected.id, date_of_birth: dobIso,
          parent_email: isMinor ? parentEmail.trim() : "",
          hp: website.trim(),
        } } });
        if (error) throw error;
        if (selected.price > 0 && STRIPE_LINKS[plan] && data.user) {
          // attribute the checkout back to this account for the Stripe webhook
          const checkoutUrl = new URL(STRIPE_LINKS[plan]);
          checkoutUrl.searchParams.set("client_reference_id", data.user.id);
          checkoutUrl.searchParams.set("prefilled_email", signupEmail);
          if (checkoutTab) {
            try { checkoutTab.location.href = checkoutUrl.toString(); }
            catch (e) { checkoutTab = null; }
          }
          if (!checkoutTab) {
            // popup blocked or the tab got closed — fall back to the old
            // same-tab redirect; checkout still works, this tab just won't
            // be around afterward to auto-detect confirmation.
            window.location.href = checkoutUrl.toString();
            return;
          }
          if (data.session) {
            onDone(true);
          } else {
            setNotice("Complete your payment in the new tab. This page will sign you in automatically the moment your email is confirmed — from whatever device you use to confirm it.");
            startConfirmPolling(signupEmail, signupPw);
          }
          return;
        }
        if (data.session) {
          onDone(true);
        } else {
          setNotice("Account created — check " + signupEmail + " for a confirmation link. This page will sign you in automatically once you confirm it — no need to come back and log in by hand.");
          startConfirmPolling(signupEmail, signupPw);
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
        if (error) throw error;
        onDone();
      }
    } catch (e) {
      if (checkoutTab) { try { checkoutTab.close(); } catch (e2) {} }
      console.error("GOLSZ auth error:", e);
      let msg = "Something went wrong. Try again.";
      // The exact failure a real user hit: signed up, the confirmation
      // email never arrived, came back later to log in and got stuck with
      // no way forward. Supabase surfaces this as code "email_not_confirmed"
      // (checked first — message text has changed across supabase-js
      // versions, the code hasn't) or the message "Email not confirmed".
      // Give a real recovery path here instead of just showing the error.
      const isUnconfirmed = e && (e.code === "email_not_confirmed" || /email.*not.*confirmed/i.test(e.message || ""));
      if (isUnconfirmed) {
        setUnconfirmedEmail(email.trim());
        msg = "Your email address hasn't been confirmed yet, so we can't sign you in. This usually means the confirmation email never reached your inbox — resend it below.";
      } else if (e && typeof e.message === "string" && e.message.trim()) {
        msg = e.message;
      } else if (e instanceof TypeError) {
        msg = "Couldn't reach Supabase — check your internet connection, that the project isn't paused, and that this page is served over http(s), not opened as a local file.";
      } else if (e) {
        try { msg = "Unexpected error: " + JSON.stringify(e); } catch { msg = "Unexpected error (see browser console for details)."; }
      }
      setErr(msg);
    } finally {
      setBusy(false);
    }
  }

  const cta = confirmPolling ? "Waiting for you to confirm your email…"
    : busy ? t("auth_working")
    : !isSignup ? t("auth_login")
    : selected.price === 0 ? t("auth_create_free")
    : t("auth_continue_payment") + "$" + selected.price + t("auth_per_month");

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "calc(28px + env(safe-area-inset-top, 0px)) 18px 28px", background: "radial-gradient(1100px 560px at 50% -12%, " + C.turf + ", " + C.pitch + ")", fontFamily: "'Archivo', system-ui, sans-serif", color: C.chalk }}>
      <style>{CSS}</style>
      <div style={{ width: "100%", maxWidth: (isSignup && !forgotMode && isDesktop) ? 920 : 430 }}>
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <img src="/assets/logo-mark.png" alt="" className="logo-mark" style={{ width: 56, height: 56, marginBottom: 8 }} />
          <div style={{ fontWeight: 900, fontSize: 40, letterSpacing: "0.03em", fontStretch: "expanded" }}>GOLSZ<span style={{ color: C.lime }}>.</span></div>
          <div style={{ fontSize: 10, letterSpacing: "0.3em", color: C.slate, fontWeight: 700, marginTop: 4 }}>{t("auth_tagline")}</div>
        </div>

        <div style={{ display: "flex", background: C.card, border: "1px solid " + C.line, borderRadius: 12, padding: 4, marginBottom: 16 }}>
          {[["signup", t("auth_signup")], ["login", t("auth_login")]].map(([m, l]) => (
            <button key={m} onClick={() => { setMode(m); setErr(""); setNotice(""); }} style={{ flex: 1, padding: "10px", borderRadius: 9, border: "none", cursor: "pointer", fontFamily: "inherit", fontWeight: 700, fontSize: 14, background: mode === m ? C.lime : "transparent", color: mode === m ? C.ink : C.slate }}>{l}</button>
          ))}
        </div>

        <div style={{ background: C.card, border: "1px solid " + C.line, borderRadius: 18, padding: 20 }}>
          {forgotMode ? (
            resetSent ? (
              <>
                <div style={{ background: "#C8F1351a", border: "1px solid #C8F13544", borderRadius: 10, padding: "10px 12px", marginBottom: 14 }}>
                  <div style={{ fontSize: 10, letterSpacing: "0.12em", color: C.lime, fontWeight: 800, marginBottom: 4 }}>{t("auth_check_email")}</div>
                  <div style={{ color: C.chalk, fontSize: 12.5, lineHeight: 1.4 }}>{t("auth_reset_sent_pre")}{email.trim()}{t("auth_reset_sent_post")}</div>
                </div>
                <button onClick={() => { setForgotMode(false); setResetSent(false); setErr(""); }} style={{ width: "100%", background: "transparent", border: `1px solid ${C.line2}`, color: C.chalk, borderRadius: 12, padding: "13px", fontWeight: 700, fontSize: 14, cursor: "pointer", fontFamily: "inherit" }}>{t("auth_back_to_login")}</button>
              </>
            ) : (
              <>
                <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 6 }}>{t("auth_reset_title")}</div>
                <div style={{ fontSize: 12.5, color: C.slate, marginBottom: 14, lineHeight: 1.4 }}>{t("auth_reset_desc")}</div>
                <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder={t("auth_email")} type="email" style={field} />
                {err && (
                  <div style={{ background: "#C89B3C1a", border: "1px solid #C89B3C44", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
                    <div style={{ color: C.warnText, fontSize: 12.5, lineHeight: 1.4 }}>{err}</div>
                  </div>
                )}
                <button disabled={!email.trim() || busy} onClick={sendReset} style={{ width: "100%", background: C.lime, color: C.ink, border: "none", borderRadius: 12, padding: "14px", fontWeight: 800, fontSize: 15, cursor: (!email.trim() || busy) ? "default" : "pointer", opacity: (!email.trim() || busy) ? 0.45 : 1, fontFamily: "inherit" }}>{busy ? t("auth_sending") : t("auth_send_reset")}</button>
                <div style={{ textAlign: "center", marginTop: 14, fontSize: 13, color: C.slate }}>
                  <span onClick={() => { setForgotMode(false); setErr(""); }} style={{ color: C.lime, fontWeight: 700, cursor: "pointer" }}>{t("auth_back_to_login")}</span>
                </div>
              </>
            )
          ) : (
          <>
          {isSignup && (
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 10, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 10 }}>{t("auth_choose_plan")}</div>
              <div className="pricing-grid" style={{ display: "grid", gridTemplateColumns: "1fr", gap: 10 }}>
                {PLANS.map((pl) => {
                  const on = plan === pl.id;
                  return (
                    <button key={pl.id} onClick={() => setPlan(pl.id)} style={{
                      textAlign: "left", cursor: "pointer", fontFamily: "inherit", position: "relative",
                      background: on ? "#C8F1351a" : C.turf, border: `1.5px solid ${on ? C.lime : C.line2}`,
                      borderRadius: 14, padding: 16, display: "flex", flexDirection: "column", gap: 10,
                    }}>
                      {pl.id === "pro" && (
                        <span style={{ position: "absolute", top: -10, left: 14, background: C.lime, color: C.ink, fontSize: 9, fontWeight: 800, letterSpacing: "0.06em", padding: "3px 9px", borderRadius: 999 }}>{t("auth_most_popular")}</span>
                      )}
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                        <span style={{ fontSize: 15, fontWeight: 800, color: C.chalk }}>{pl.name}</span>
                        <div style={{ width: 18, height: 18, borderRadius: 99, border: `2px solid ${on ? C.lime : C.line2}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                          {on && <div style={{ width: 8, height: 8, borderRadius: 99, background: C.lime }} />}
                        </div>
                      </div>
                      <div>
                        <span style={{ fontSize: 24, fontWeight: 900, fontFamily: "'Space Mono', monospace", color: C.chalk }}>{pl.price === 0 ? "Free" : "$" + pl.price}</span>
                        {pl.price > 0 && <span style={{ fontSize: 12, color: C.slate }}> /mo</span>}
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 2 }}>
                        {t(`plan_${pl.id}_tag`) && (
                          <div style={{ fontSize: 11.5, color: C.slate, fontStyle: "italic" }}>{t(`plan_${pl.id}_tag`)}</div>

                        {pl.featKeys.map((fk) => (
                          <div key={fk} style={{ display: "flex", alignItems: "flex-start", gap: 7, fontSize: 12, color: C.body, lineHeight: 1.35 }}>
                            <BadgeCheck size={13} color={C.lime} style={{ flexShrink: 0, marginTop: 1 }} /> {t(fk)}
                          </div>
                        ))}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {isSignup && (
            <input
              value={website} onChange={(e) => setWebsite(e.target.value)}
              name="website" autoComplete="off" tabIndex={-1} aria-hidden="true"
              style={{ position: "absolute", left: "-9999px", width: 1, height: 1, opacity: 0 }}
            />
          )}
          {isSignup && <input value={name} onChange={(e) => setName(e.target.value)} placeholder={t("auth_full_name")} style={field} />}
          <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder={t("auth_email")} type="email" style={field} />
          <input value={pw} onChange={(e) => setPw(e.target.value)} placeholder={t("auth_password")} type="password" style={{ ...field, marginBottom: isSignup ? 12 : 4 }} />
          {!isSignup && (
            <div style={{ textAlign: "right", marginBottom: 10 }}>
              <span onClick={() => { setForgotMode(true); setErr(""); setResetSent(false); }} style={{ color: C.slate, fontSize: 12, cursor: "pointer" }}>{t("auth_forgot")}</span>
            </div>
          )}

          {isSignup && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 11, color: C.slate, fontWeight: 700, marginBottom: 6 }}>{t("auth_dob")}</div>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={dobDay} onChange={(e) => setDobDay(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} placeholder="DD" inputMode="numeric" maxLength={2} style={{ ...dobField, flex: 1 }} />
                <input value={dobMonth} onChange={(e) => setDobMonth(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} placeholder="MM" inputMode="numeric" maxLength={2} style={{ ...dobField, flex: 1 }} />
                <input value={dobYear} onChange={(e) => setDobYear(e.target.value.replace(/[^0-9]/g, "").slice(0, 4))} placeholder="YYYY" inputMode="numeric" maxLength={4} style={{ ...dobField, flex: 1.4 }} />
              </div>
              {isMinor && (
                <div style={{ marginTop: 10 }}>
