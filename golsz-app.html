              <button onClick={() => setExpandedId(expandedId === it.id ? null : it.id)} style={{ ...iconBtn(C.slate), flexShrink: 0 }}>{expandedId === it.id ? <ChevronUp size={15} /> : <ChevronDown size={15} />}</button>
              <button onClick={() => removeTarget(it.id)} style={{ background: "none", border: "none", color: C.slate, cursor: "pointer", padding: 0, display: "flex", flexShrink: 0 }}><X size={14} /></button>
            </div>
            {expandedId === it.id && (
              <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.line}` }}>
                <textarea defaultValue={it.fit_reasoning || ""} onBlur={(e) => updateTarget(it.id, { fit_reasoning: e.target.value })} placeholder={t("targets_fit_reasoning_ph")}
                  style={{ width: "100%", minHeight: 40, resize: "vertical", marginBottom: 8, ...inputStyle }} />
                <textarea defaultValue={it.notes || ""} onBlur={(e) => updateTarget(it.id, { notes: e.target.value })} placeholder={t("targets_notes_ph")}
                  style={{ width: "100%", minHeight: 50, resize: "vertical", marginBottom: 8, ...inputStyle }} />
                <textarea defaultValue={it.draft_email || ""} onBlur={(e) => updateTarget(it.id, { draft_email: e.target.value })} placeholder={t("targets_draft_ph")}
                  style={{ width: "100%", minHeight: 80, resize: "vertical", ...inputStyle }} />
              </div>
            )}
          </div>
        ))}
      </CollapsibleRow>
    </div>
  );
}

// Development/preparedness plan (migration 075) — brief §5's scope:
// training/strength/speed/conditioning/recovery/sleep/hydration/nutrition
// focus areas an athlete is actively working on, never a prescribed
// protocol. Private to the owner, same viewUserId convention as
// Benchmarks — never fetched for another athlete's viewed Passport.
const DEV_FOCUS_AREAS = ["training", "strength", "speed", "conditioning", "recovery", "sleep", "hydration", "nutrition", "other"];
const DEV_STATUSES = ["active", "done", "paused"];
function DevelopmentPlan({ viewUserId, manageId }) {
  const { t } = useLang();
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [uid, setUid] = useState(null);
  const [focusArea, setFocusArea] = useState(DEV_FOCUS_AREAS[0]);
  const [goal, setGoal] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [expandedId, setExpandedId] = useState(null);

  useEffect(() => {
    if (!sb || viewUserId) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) return;
        // manageId = the under-16 athlete a parent is managing (P0-4).
        setUid(manageId || user.id);
        const { data, error } = await sb.from("development_plan_items").select("id, focus_area, goal, status, notes, created_at").eq("user_id", manageId || user.id).order("created_at", { ascending: false });
        if (error) throw error;
        setItems(data || []);
      } catch (e) { console.error("GOLSZ development plan load error:", e); }
      setLoaded(true);
    })();
  }, [viewUserId, manageId]);

  async function addItem() {
    if (!sb || !uid || !goal.trim() || busy) return;
    setBusy(true); setErr("");
    try {
      const { data, error } = await sb.from("development_plan_items").insert({
        user_id: uid, focus_area: focusArea, goal: goal.trim().slice(0, 200),
      }).select("id, focus_area, goal, status, notes, created_at").single();
      if (error) throw error;
      setItems((prev) => [data, ...prev]);
      setGoal("");
    } catch (e) {
      setErr((e && e.message) || t("dev_plan_add_err"));
    } finally { setBusy(false); }
  }

  async function updateItem(id, updates) {
    setItems((prev) => prev.map((it) => (it.id === id ? { ...it, ...updates } : it)));
    try { await sb.from("development_plan_items").update({ ...updates, updated_at: new Date().toISOString() }).eq("id", id).eq("user_id", uid); }
    catch (e) { console.error("GOLSZ development plan update error:", e); }
  }

  async function removeItem(id) {
    setItems((prev) => prev.filter((it) => it.id !== id));
    try { await sb.from("development_plan_items").delete().eq("id", id).eq("user_id", uid); }
    catch (e) { console.error("GOLSZ development plan delete error:", e); }
  }

  if (viewUserId) return null;
  if (!loaded) return <SkeletonCard height={232} />;

  const inputStyle = { background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 9, color: C.chalk, padding: "9px 11px", fontSize: 12.5, fontFamily: "inherit", outline: "none", boxSizing: "border-box" };

  return (
    <div style={{ ...card }}>
      <div style={{ fontSize: 9, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 8 }}>{t("dev_plan_title")}</div>
      {items.length === 0 && <div style={{ fontSize: 12.5, color: C.slate, marginBottom: 10 }}>{t("dev_plan_empty")}</div>}
      {items.map((it) => (
        <div key={it.id} style={{ padding: "8px 0", borderBottom: `1px solid ${C.line}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 9, letterSpacing: "0.1em", color: C.lime, fontWeight: 700, marginBottom: 2 }}>{t("dev_plan_focus_" + it.focus_area)}</div>
              <div style={{ fontSize: 13, fontWeight: 700, color: C.chalk, textDecoration: it.status === "done" ? "line-through" : "none", opacity: it.status === "done" ? 0.6 : 1 }}>{it.goal}</div>
            </div>
            <select value={it.status} onChange={(e) => updateItem(it.id, { status: e.target.value })} style={{ background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 8, color: C.chalk, padding: "6px 8px", fontSize: 11, fontFamily: "inherit", flexShrink: 0 }}>
              {DEV_STATUSES.map((s) => <option key={s} value={s}>{t("dev_plan_status_" + s)}</option>)}
            </select>
            <button onClick={() => setExpandedId(expandedId === it.id ? null : it.id)} style={{ ...iconBtn(C.slate), flexShrink: 0 }}>{expandedId === it.id ? <ChevronUp size={15} /> : <ChevronDown size={15} />}</button>
            <button onClick={() => removeItem(it.id)} style={{ background: "none", border: "none", color: C.slate, cursor: "pointer", padding: 0, display: "flex", flexShrink: 0 }}><X size={14} /></button>
          </div>
          {expandedId === it.id && (
            <textarea defaultValue={it.notes || ""} onBlur={(e) => updateItem(it.id, { notes: e.target.value })} placeholder={t("dev_plan_notes_ph")}
              style={{ width: "100%", minHeight: 50, resize: "vertical", marginTop: 8, ...inputStyle }} />
          )}
        </div>
      ))}
      {sb && (
        <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.line}` }}>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            <select value={focusArea} onChange={(e) => setFocusArea(e.target.value)} style={{ ...inputStyle, flex: "0 0 auto" }}>
              {DEV_FOCUS_AREAS.map((f) => <option key={f} value={f}>{t("dev_plan_focus_" + f)}</option>)}
            </select>
            <input value={goal} onChange={(e) => setGoal(e.target.value)} placeholder={t("dev_plan_goal_ph")} style={{ flex: "1 1 160px", ...inputStyle }} />
            <button onClick={addItem} disabled={!goal.trim() || busy} style={{ background: C.lime, color: C.ink, border: "none", borderRadius: 9, padding: "9px 14px", fontWeight: 800, fontSize: 12.5, cursor: "pointer", fontFamily: "inherit", opacity: (!goal.trim() || busy) ? 0.5 : 1 }}>
              {busy ? "…" : t("dev_plan_add")}
            </button>
          </div>
          {err && <div style={{ fontSize: 11.5, color: C.amber, marginTop: 6 }}>{err}</div>}
        </div>
      )}
    </div>
  );
}

// Master UX/UI redesign §10 — sport-specific pathway STAGES (the visual
// map's spine), deliberately separate from PATHWAY_TYPES below (the
// athlete's own stated GOAL/destination, e.g. "ncaa" or "professional").
// A stage sequence is what's typical for that sport; pathway_type is
// where THIS athlete says they're headed — the map shows both: the real
// stage spine plus the athlete's chosen goal as its own highlighted node,
// with an alternate branch (almost always NCAA) where that's a genuinely
// common parallel route for the sport, not the only one. Client-side
// lookup, not a new table (§7 of the original architecture review:
// reversible, no schema risk) — covers the 10 CORE sports named in the
// sports table (migration 094); everything else falls through to
// __default, a generic 3-stage arc that stays honest rather than
// pretending equal depth for a sport GOLSZ hasn't built real pathway
// content for yet.
const SPORT_PATHWAY_STAGES = {
  "Soccer": { stages: ["academy", "u19_u21", "senior", "professional"], altBranch: "ncaa" },
  "Futsal": { stages: ["academy", "u19_u21", "senior_futsal", "professional_futsal"], altBranch: null },
  "American Football": { stages: ["high_school", "ncaa_football", "professional_football"], altBranch: null },
  "Baseball": { stages: ["academy_hs", "ncaa_juco", "minor_league", "professional_baseball"], altBranch: null },
  "Basketball": { stages: ["academy_hs", "ncaa_basketball", "professional_basketball"], altBranch: null },
  "Tennis": { stages: ["junior", "itf", "challenger", "pro_tour"], altBranch: "ncaa" },
  "Golf": { stages: ["junior_golf", "college_golf", "developmental_tour", "professional_golf"], altBranch: null },
  "Lacrosse": { stages: ["club_hs", "ncaa_lacrosse", "professional_lacrosse"], altBranch: null },
  "Handball": { stages: ["youth_club", "senior_club", "professional_handball"], altBranch: null },
  "Volleyball": { stages: ["club_hs", "ncaa_volleyball", "professional_volleyball"], altBranch: null },
  "__default": { stages: ["developing", "competing", "advancing"], altBranch: null },
};
// Heuristic current-stage index — real signals already on the athlete
// record (recruiting_status, club_name), never invented. Deliberately
// coarse (3-4 buckets, not a precise index) since GOLSZ doesn't track a
// literal "which stage" field — see the directive's own note that a
// perfectly precise corporate flowchart isn't the goal here.
function currentStageIndex(athlete, stageCount) {
  const status = (athlete && athlete.recruiting_status) || "";
  if (status === "Signed") return stageCount - 1;
  if (status === "Committed" || status === "In contact") return Math.min(stageCount - 2, Math.max(1, stageCount - 2));
  if (athlete && athlete.club_name) return Math.min(1, stageCount - 1);
  return 0;
}

// The visual pathway map itself (§8/§9 — "the visual showpiece") — nodes
// and connecting lines for the sport's real stage sequence, the athlete's
// current position highlighted, and their stated goal (pathway_type) as
// its own gold "target" node, with an alt-branch chip (e.g. NCAA) shown
// alongside when the sport has one and the athlete's goal isn't already
// that branch. Presentational only — PathwayPlan below still owns all
// the actual data/save logic; this just gives it a real map to sit under
// instead of a dropdown being the first thing an athlete sees.
// Icon per stage-sequence position: first = Home (starting point), last
// real stage before the athlete's own goal = Trophy (top of the generic
// pipeline), everything between = Shield (club/organization). Purely
// presentational, same SPORT_PATHWAY_STAGES data as before.
function stageIcon(i, total) {
  if (i === 0) return Home;
  if (i === total - 1) return Trophy;
  return Shield;
}
function PathwayMap({ sport, athlete, pathwayType, t, onEditGoal }) {
  const config = SPORT_PATHWAY_STAGES[sport] || SPORT_PATHWAY_STAGES.__default;
  const stages = config.stages;
  const curIdx = currentStageIndex(athlete, stages.length);
  const hasGoal = !!pathwayType;
  const showAltBranch = config.altBranch && pathwayType !== config.altBranch;
  // Per-node sub-label: real detail under each stage where GOLSZ actually
  // knows it (the athlete's own club at their current stage, their grad
  // year at the goal) — blank rather than invented anywhere else.
  const gradYear = athlete && athlete.grad_year;
  const subFor = (i) => {
    if (i === curIdx && athlete && athlete.club_name) return athlete.club_name;
    if (i === curIdx) return t("home_path_now");
    return "";
  };
  // Ascending diagonal (mockup): each node sits a step higher than the last
  // so the path reads as progression rather than a flat corporate flowchart.
  // Capped so a 4-stage sport doesn't push the last node off the card.
  const RISE = 16;
  const lift = (i) => -Math.min(i, 3) * RISE;
  const total = stages.length;
  return (
    <div style={{ ...card, position: "relative", overflow: "hidden" }}>
      {/* Faint pitch marking — a centre-circle arc, purely atmospheric, so
          the map reads as "on a pitch" without a raster asset. */}
      <div aria-hidden="true" style={{ position: "absolute", left: "50%", top: 6, width: 118, height: 118, marginLeft: -59, borderRadius: "50%", border: `1px solid ${C.line}`, opacity: 0.28, pointerEvents: "none" }} />
      <div style={{ position: "relative", display: "flex", alignItems: "flex-start", paddingTop: Math.min(total - 1, 3) * RISE + 4, paddingBottom: 4 }}>
        {stages.map((stageKey, i) => {
          const reached = i <= curIdx;
          const Icon = stageIcon(i, total);
          return (
            <React.Fragment key={stageKey}>
              <div style={{ transform: `translateY(${lift(i)}px)`, flex: "1 1 0", minWidth: 0 }}>
                <PathNode Icon={Icon} label={t("pathway_stage_" + stageKey)} sub={subFor(i)} filled={reached} current={i === curIdx} />
              </div>
              {i < total - 1 && (
                <div style={{ width: 10, flexShrink: 0, height: 2, marginTop: 15, background: i < curIdx ? C.lime : C.line2, transform: `translateY(${lift(i) - RISE / 2}px) rotate(-${RISE / 3}deg)` }} />
              )}
            </React.Fragment>
          );
        })}
        <div style={{ width: 10, flexShrink: 0, height: 2, marginTop: 15, background: C.line2, transform: `translateY(${lift(total) - RISE / 2}px) rotate(-${RISE / 3}deg)` }} />
        <div style={{ transform: `translateY(${lift(total)}px)`, flex: "1 1 0", minWidth: 0 }}>
          <PathNode Icon={Star} label={hasGoal ? t("pathway_type_" + pathwayType) : t("home_path_goal_placeholder")} sub={hasGoal && gradYear ? String(gradYear) : ""} filled={hasGoal} onClick={onEditGoal} />
        </div>
      </div>
      {/* Alternate route (usually NCAA) — drawn in blue, branching DOWN and
          away from the gold spine, so it reads as a genuinely different
          door rather than another step on the same one.
          It is captioned. Unlabelled, this node claimed nothing and therefore
          implied everything: an athlete could read it as a stage they were on,
          a goal they had set, or a step still to come. It is none of those —
          it is a route this sport has, which they have not chosen. The
          "SECONDARY GOAL" card that used to sit above the map is gone unless
          they actually stated one, so this caption is now the only thing
          explaining the node. */}
      {showAltBranch && (
        <div style={{ position: "relative", display: "flex", justifyContent: "flex-end", alignItems: "flex-start", marginTop: -2, paddingRight: 4 }}>
          <div aria-hidden="true" style={{ width: 34, height: 22, marginRight: 12, marginTop: -2, borderLeft: `2px dashed ${C.info}`, borderBottom: `2px dashed ${C.info}`, borderBottomLeftRadius: 14 }} />
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 8, letterSpacing: "0.08em", color: C.slate, fontWeight: 700, marginBottom: 2 }}>{t("home_path_also_possible")}</div>
            <PathNode Icon={GraduationCap} label={t("pathway_type_" + config.altBranch)} sub={gradYear ? String(gradYear) : ""} filled color={C.info} onClick={onEditGoal} size={28} />
          </div>
        </div>
      )}
    </div>
  );
}

// Pathway plan (migration 076) — brief §7: GOLSZ must never brand itself
// NCAA-only, so pathway_type spans the full set the brief lists. One row
// per athlete (not a list) — this is THE stated pathway, upserted rather
// than inserted-many like Targets/Benchmarks/DevelopmentPlan. Private to
// the owner, same viewUserId convention as those.
const PATHWAY_TYPES = ["ncaa", "naia", "juco", "canadian_university", "academy", "european_club", "professional", "development", "agent_representation", "trainer_performance", "other"];
function PathwayPlan({ viewUserId, onChange }) {
  const { t } = useLang();
  const [uid, setUid] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [athlete, setAthlete] = useState(null);
  const [pathwayType, setPathwayType] = useState(PATHWAY_TYPES[0]);
  const [timeline, setTimeline] = useState("");
  const [notes, setNotes] = useState("");
  const [milestones, setMilestones] = useState([]);
  const [newMilestone, setNewMilestone] = useState("");
  const [exists, setExists] = useState(false);
  const [busy, setBusy] = useState(false);
  // Mirrors this component's own state up to Targets (the "Pathway/Plan"
  // page) for the goal-summary cards and the Season milestone counter,
  // without lifting the actual fetch/save logic out of this component —
  // avoids a second, independently-fetched (and therefore staleness-prone)
  // copy of the same pathway_plan row.
  useEffect(() => { if (onChange) onChange({ pathwayType: exists ? pathwayType : null, milestones, athlete }); }, [pathwayType, milestones, exists, athlete]);
  // Master UX/UI redesign §8/§9 — the map is the primary surface now, the
  // dropdown/timeline/notes controls that used to be the WHOLE component
  // are collapsed behind this toggle. Starts open only when there's
  // nothing to show a map for yet (no pathway saved), so a first-time
  // athlete lands straight in the controls instead of an empty map with
  // no obvious way to set a goal.
  const [editingGoal, setEditingGoal] = useState(false);

  useEffect(() => {
    if (!sb || viewUserId) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) return;
        setUid(user.id);
        const [{ data }, { data: ath }] = await Promise.all([
          sb.from("pathway_plan").select("pathway_type, target_timeline, milestones, notes").eq("user_id", user.id).maybeSingle(),
          sb.from("athletes").select("sport, club_name, recruiting_status").eq("id", user.id).single(),
        ]);
        setAthlete(ath || null);
        if (data) {
          setExists(true);
          setPathwayType(data.pathway_type);
          setTimeline(data.target_timeline || "");
          setNotes(data.notes || "");
          setMilestones(Array.isArray(data.milestones) ? data.milestones : []);
        } else {
          setEditingGoal(true);
        }
      } catch (e) { console.error("GOLSZ pathway plan load error:", e); }
      setLoaded(true);
    })();
  }, [viewUserId]);

  async function save(overrides) {
    if (!sb || !uid || busy) return;
    setBusy(true);
    const next = {
      pathway_type: pathwayType, target_timeline: timeline.trim().slice(0, 100) || null,
      notes: notes.trim().slice(0, 1000) || null, milestones,
      ...overrides,
    };
    try {
      const { error } = await sb.from("pathway_plan").upsert({ user_id: uid, ...next, updated_at: new Date().toISOString() });
      if (error) throw error;
      setExists(true);
      if (next.milestones) setMilestones(next.milestones);
    } catch (e) { console.error("GOLSZ pathway plan save error:", e); }
    finally { setBusy(false); }
  }

  function addMilestone() {
    if (!newMilestone.trim()) return;
    const next = [...milestones, { id: (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()), label: newMilestone.trim().slice(0, 120), done: false }];
    setNewMilestone("");
    save({ milestones: next });
  }

  function toggleMilestone(id) {
    const next = milestones.map((m) => (m.id === id ? { ...m, done: !m.done } : m));
    save({ milestones: next });
  }

  function removeMilestone(id) {
    const next = milestones.filter((m) => m.id !== id);
    save({ milestones: next });
  }

  if (viewUserId) return null;
  if (!loaded) return null;

  const inputStyle = { background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 9, color: C.chalk, padding: "9px 11px", fontSize: 12.5, fontFamily: "inherit", outline: "none", boxSizing: "border-box" };

  return (
    <>
      <PathwayMap sport={athlete && athlete.sport} athlete={athlete} pathwayType={exists ? pathwayType : null} t={t} onEditGoal={() => setEditingGoal((v) => !v)} />

      {editingGoal ? (

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
            <div style={{ fontSize: 9, letterSpacing: "0.16em", color: C.slate, fontWeight: 700 }}>{t("pathway_plan_title")}</div>
            {exists && <button onClick={() => setEditingGoal(false)} style={{ ...iconBtn(C.slate), fontSize: 11 }}>{t("pathway_collapse")}</button>}

          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
            <select value={pathwayType} onChange={(e) => { setPathwayType(e.target.value); }} onBlur={() => save({ pathway_type: pathwayType })} style={{ flex: "1 1 160px", ...inputStyle }}>
              {PATHWAY_TYPES.map((p) => <option key={p} value={p}>{t("pathway_type_" + p)}</option>)}
            </select>
            <input value={timeline} onChange={(e) => setTimeline(e.target.value)} onBlur={() => save({})} placeholder={t("pathway_timeline_ph")} style={{ flex: "1 1 140px", ...inputStyle }} />
          </div>
          {/* select's onChange alone won't fire a save (no blur on
              programmatic value change) — this button covers the common
              case of just changing the dropdown without touching timeline. */}
          <button onClick={() => save({})} disabled={busy} style={{ background: C.lime, color: C.ink, border: "none", borderRadius: 9, padding: "8px 14px", fontWeight: 800, fontSize: 12, cursor: "pointer", fontFamily: "inherit", marginBottom: 10 }}>{t("pathway_save")}</button>
          <textarea value={notes} onChange={(e) => setNotes(e.target.value)} onBlur={() => save({})} placeholder={t("pathway_notes_ph")}
            style={{ width: "100%", minHeight: 50, resize: "vertical", ...inputStyle }} />
        </div>
      ) : (
        <button onClick={() => setEditingGoal(true)} style={{ ...iconBtn(C.lime), fontSize: 12, margin: "0 0 12px 2px" }}><Pencil size={12} /> {t("pathway_edit_goal")}</button>
      )}

      <div style={{ ...card }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: C.chalk, marginBottom: 6 }}>{t("pathway_milestones_title")}{milestones.length > 0 ? ` · ${milestones.filter((m) => m.done).length}/${milestones.length}` : ""}</div>
        {milestones.length === 0 && <div style={{ fontSize: 12, color: C.slate, marginBottom: 6 }}>{t("pathway_milestones_empty")}</div>}
        {milestones.map((m) => (
          <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "4px 0" }}>
            <input type="checkbox" checked={!!m.done} onChange={() => toggleMilestone(m.id)} style={{ flexShrink: 0 }} />
            <div style={{ flex: 1, fontSize: 12.5, color: C.chalk, textDecoration: m.done ? "line-through" : "none", opacity: m.done ? 0.6 : 1 }}>{m.label}</div>
            <button onClick={() => removeMilestone(m.id)} style={{ background: "none", border: "none", color: C.slate, cursor: "pointer", padding: 0, display: "flex", flexShrink: 0 }}><X size={13} /></button>
          </div>
        ))}
        <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
          <input value={newMilestone} onChange={(e) => setNewMilestone(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addMilestone(); }} placeholder={t("pathway_milestone_ph")} style={{ flex: 1, ...inputStyle }} />
          <button onClick={addMilestone} disabled={!newMilestone.trim()} style={{ background: C.turf, color: C.chalk, border: `1px solid ${C.line2}`, borderRadius: 9, padding: "8px 12px", fontWeight: 700, fontSize: 12, cursor: "pointer", fontFamily: "inherit", opacity: !newMilestone.trim() ? 0.5 : 1 }}>{t("pathway_milestone_add")}</button>
        </div>
      </div>
    </>
  );
}

// Detects that a new build has been deployed while this tab was open.
//
// There is no build step and therefore no fingerprinted filename, so a
// returning athlete can keep running cached JavaScript against an API that
// has moved on — which is exactly the shape of the 2026-08-08 outages, and
// was visible in the wild: a tab still rendering a label removed hours
// earlier. /api/geo reports the deployment's commit SHA (see that file for
// why the version lives there and not on its own endpoint).
//
// Checked on mount and whenever the app comes back to the foreground
// (throttled), plus a slow interval. Deliberately NOT a tight poll: on a
// PWA the foreground event is the moment that actually matters, and every
// check is a serverless invocation.
//
// It never reloads on its own. An athlete mid-sentence in Scout losing what
// they typed is a worse bug than the one this is fixing.
function useBuildVersion() {
  const seen = React.useRef(null);
  const lastCheck = React.useRef(0);
  const [updateAvailable, setUpdateAvailable] = React.useState(false);

  React.useEffect(() => {
    let cancelled = false;

    async function check() {
      const now = Date.now();
      if (now - lastCheck.current < 5 * 60000) return;
      lastCheck.current = now;
      try {
        // /api/geo, not /api/version: the Hobby plan caps a deployment at
        // 12 Serverless Functions and this project is at 12, so the version
        // is reported by the endpoint the app already calls. See api/geo.js.
        const r = await fetch("/api/geo", { cache: "no-store" });
        if (!r.ok) return;
        const { version } = await r.json();
        if (cancelled || !version) return;
        if (seen.current === null) { seen.current = version; return; }
        if (version !== seen.current) setUpdateAvailable(true);
      } catch { /* offline or the endpoint is down — never block the app */ }
    }

    check();
    const onVisible = () => { if (document.visibilityState === "visible") check(); };
    document.addEventListener("visibilitychange", onVisible);
    const id = setInterval(check, 30 * 60000);
    return () => { cancelled = true; document.removeEventListener("visibilitychange", onVisible); clearInterval(id); };
  }, []);

  return updateAvailable;
}

function GolszApp({ onSignOut, startOnboarding }) {
  const buildUpdateAvailable = useBuildVersion();
  const [updateDismissed, setUpdateDismissed] = useState(false);
  const showUpdateBar = buildUpdateAvailable && !updateDismissed;
  // Shared Passport links are handled entirely by Root() (?public=<uid> ->
  // PublicPassport, no login required, no GolszApp/session state touched —
  // see Passport's sharePassport()) so this component never needs to parse
  // a shared-profile id out of the URL at all.
  const [page, setPage] = useState(() => {
    if (startOnboarding) return "profile";
    try {
      const params = new URLSearchParams(window.location.search);
      const p = params.get("page");
      // Feed/Discover/Events/Messages are launch-scoped off the main nav
      // (kept fully intact in the code for a later update — see the "go"
      // function and the route list below, both untouched) — this just
      // narrows what a fresh page load can land on directly.
      const valid = ["home", "scout", "profile", "targets", "admin"];
      // The nav labels and the internal ids disagree: the tab an athlete sees
      // as "Plan" is id "targets", and "Passport" is id "profile". So
      // ?page=plan and ?page=passport — the URLs an athlete would guess, and
      // the words Scout uses when it says "open your Plan" — both fell
      // through to "home" silently. Deep-linking to the Plan was impossible,
      // which quietly broke the one hand-off from Scout into the rest of the
      // product. Alias the user-facing names rather than renaming the ids,
      // which would touch every onNavigate() call site.
      const ALIAS = { plan: "targets", pathway: "targets", passport: "profile" };
      const resolved = ALIAS[p] || p;
      return valid.includes(resolved) ? resolved : "home";
    } catch (e) { return "home"; }
  });
  const [thread, setThread] = useState(null);
  const [hasUnreadMsgs, setHasUnreadMsgs] = useState(false);
  const [onboarding, setOnboarding] = useState(!!startOnboarding);
  const [viewProfileId, setViewProfileId] = useState(null);
  // Stack of { page, viewProfileId } snapshots to restore on "back" out of a
  // viewed profile — e.g. opening a passport from a chat thread's header and
  // pressing back should land back in that same thread, not on your own
  // profile. Pushed in viewProfile(), popped in the Passport onBack handlers.
  const [profileStack, setProfileStack] = useState([]);
  // null = still checking, true/false once we know. Gates the rest of the
  // app behind finishing the Passport (see the "must complete profile"
  // effect below) — until athletes.sport is set, a brand-new (or
  // never-finished) account can only see Passport, no other tab.
  const [profileComplete, setProfileComplete] = useState(null);
  const isDesktop = useIsDesktop();
  const { t } = useLang();

  // Corrected pre-launch directive: parent-signup mode (Auth) can't always
  // call createChildAccount() synchronously — if the parent's own email
  // needed confirmation first, the athlete's info was stashed in
  // sessionStorage instead (see Auth's submit()). Picked up here, once,
  // the first time this parent is actually signed in and mounted. Also
  // loads any already-linked children (from this or an earlier session)
  // so the "My Athletes" entry point below always reflects real state.
  const [linkedChildren, setLinkedChildren] = useState(null);
  const [isParentAccount, setIsParentAccount] = useState(false);
  // P0-4. Which linked athlete the parent is currently managing: { id, name },
  // or null when they are on their own account. Nothing about this is trusted
  // server-side — api/scout.js re-verifies the parent_links row on every
  // request (api/_acting-for.js), and RLS gates every direct Supabase read
  // and write independently. This state only decides what the UI shows and
  // which id it asks for.
  const [actingFor, setActingFor] = useState(null);
  function manageAthlete(child) {
    setActingFor({ id: child.id, name: child.full_name || "" });
    setViewProfileId(null);
    setProfileStack([]);
    setPage("home");
  }
  function exitManaging() {
    setActingFor(null);
    setViewProfileId(null);
    setProfileStack([]);
    setPage("home");
  }
  useEffect(() => {
    if (!sb) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) return;
        let pending = null;
        try { const raw = sessionStorage.getItem("golsz_pending_child"); if (raw) pending = JSON.parse(raw); } catch (e) {}
        if (pending && pending.childName && pending.childDobIso) {
          try { await createChildAccount(pending.childName, pending.childDobIso); }
          catch (e) { console.error("GOLSZ pending child creation error:", e); }
          finally { try { sessionStorage.removeItem("golsz_pending_child"); } catch (e2) {} }
        }
        // P1-4. A "Parent" occupation used to be a dead end: ProfileEditor
        // hides every athlete field for them and pointed at a Family & Parent
        // Access section that was defined but never rendered anywhere. Knowing
        // the occupation is what lets Home show FamilyAccess instead of an
        // empty athlete dashboard.
        try {
          const { data: me } = await sb.from("profiles").select("occupation").eq("id", user.id).single();
          setIsParentAccount(!!(me && me.occupation === "Parent"));
        } catch (e) { console.error("GOLSZ parent-account check error:", e); }
        const { data: links } = await sb.from("parent_links").select("athlete_id").eq("parent_id", user.id).not("approved_at", "is", null);
        if (links && links.length) {
          const ids = links.map((l) => l.athlete_id);
          const { data: childProfiles } = await sb.from("profiles").select("id, full_name").in("id", ids);
          setLinkedChildren(childProfiles || []);
        } else {
          setLinkedChildren([]);
        }
      } catch (e) { console.error("GOLSZ linked-children load error:", e); }
    })();
  }, []);

  useEffect(() => {
    if (!sb) { setProfileComplete(true); return; } // preview mode, nothing to gate
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { setProfileComplete(true); return; }
        const { data } = await sb.from("athletes").select("sport").eq("id", user.id).single();
        setProfileComplete(!!(data && data.sport));
      } catch (e) {
        console.error("GOLSZ profile-complete check error:", e);
        setProfileComplete(true); // fail open — a fetch hiccup shouldn't lock someone out of their own app
      }
    })();
  }, []);

  const mustFinishProfile = profileComplete === false;
  useEffect(() => { if (mustFinishProfile) setPage("profile"); }, [mustFinishProfile]);

  // Guided-onboarding conversion moment ("we've learned enough about you —
  // let's build your plan"): fires once, for free-plan accounts only.
  // GOLSZ Final Product directive §4 is explicit about the two real
  // conditions — "Once the Passport is sufficiently complete AND Scout
  // understands the athlete's stated goal" (profile_complete && goal_defined)
  // — goal_defined (migration 093) is now the primary, spec-mandated gate;
  // free_ai_lifetime_used >= 3 stays as an additional light floor so this
  // can't fire off a single very-fast first message, not as the primary
  // signal it was before goal_defined existed. onboarding_conversion_shown
  // (migration 069) makes this a true one-time nudge per account, not a
  // once-per-session popup.
  const [showConversion, setShowConversion] = useState(false);
  const [conversionUid, setConversionUid] = useState(null);
  // Plan-gating (brief §13, see featureUnlocked()/featureLocked() above): the athlete's own uid
  // + plan, fetched once alongside the conversion check (same query already
  // reads profiles.plan) and threaded down to Home/Scout/Targets/Passport
  // so gated features can check featureUnlocked(userPlan, "...") at render time.
  // null means "not loaded yet", and featureLocked() stays false for it, so no
  // gated surface can render an upsell before the subscription is known.
  const [userUid, setUserUid] = useState(null);
  const [userPlan, setUserPlan] = useState(null);
  // Direct-to-Elite accelerated onboarding (directive §8): "a user must not
  // have to purchase Free -> Basic -> Pro sequentially... no artificial
  // paywall interruptions" — someone who bought Elite before ever finishing
  // their Passport gets one welcome moment, then drops straight into the
  // SAME existing intake flow everyone uses (mustFinishProfile already
  // forces the Passport page below; this doesn't add a new flow, just a
  // one-time Elite-flavored welcome in front of the existing one). Fetched
  // independently of the conversion-check effect below, which deliberately
  // only runs once profileComplete is already true — this needs plan
  // BEFORE that's known, so it can't share that effect.
  const [showEliteWelcome, setShowEliteWelcome] = useState(false);
  const [eliteWelcomeDismissed, setEliteWelcomeDismissed] = useState(false);
  useEffect(() => {
    if (!sb) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) return;
        const { data } = await sb.from("profiles").select("plan").eq("id", user.id).single();
        if (data && data.plan === "elite") setShowEliteWelcome(true);
      } catch (e) { console.error("GOLSZ elite-welcome check error:", e); }
    })();
  }, []);
  useEffect(() => {
    if (!sb || profileComplete !== true) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) return;
        setUserUid(user.id);
        const [{ data }, { data: ath }] = await Promise.all([
          sb.from("profiles").select("plan, onboarding_conversion_shown, free_ai_lifetime_used, goal_defined").eq("id", user.id).single(),
          sb.from("athletes").select("scout_context").eq("id", user.id).single(),
        ]);
        if (!data) return;
        setUserPlan(data.plan || "free");
        // Canonical readiness (Prompt #1): api/scout.js's isAssessmentReady()
        // is the ONE definition of "GOLSZ knows enough to assess", and it
        // writes its verdict to scout_context.ai_meta.assessment_ready on
        // every Scout message. Reading it here replaces the old
        // profileComplete test, which was only ever `!!athletes.sport` — an
        // athlete who had picked a sport and nothing else read as ready.
        // Not recomputed client-side on purpose: a second implementation is
        // a second thing to drift.
        //
        // The profileComplete !== true guard above STAYS. It means something
        // different (onboarding finished / has a sport) and still gates the
        // rest of the app; only the readiness judgement moved.
        //
        // Every commercial condition is unchanged: free plan, one-time
        // display, goal_defined, and the >= 3 message floor all still apply.
        const aiMeta = (ath && ath.scout_context && ath.scout_context.ai_meta) || null;
        const assessmentReady = !!(aiMeta && aiMeta.assessment_ready);
        if (data.plan === "free" && !data.onboarding_conversion_shown && data.goal_defined && assessmentReady && (data.free_ai_lifetime_used || 0) >= 3) {
          setConversionUid(user.id);
          setShowConversion(true);
        }
      } catch (e) { console.error("GOLSZ conversion-screen check error:", e); }
    })();
  }, [profileComplete]);
  const dismissConversion = () => {
    setShowConversion(false);
    if (conversionUid) sb.from("profiles").update({ onboarding_conversion_shown: true }).eq("id", conversionUid).then(({ error }) => { if (error) console.error("GOLSZ dismiss-conversion error:", error); });
  };
  // Manual "Upgrade" trigger for gated-feature CTAs (distinct from the
  // one-time auto conversion nudge above — dismissing this never touches
  // onboarding_conversion_shown, since the athlete didn't just finish the
  // guided assessment, they just tapped a locked feature).
  const [upgradeUid, setUpgradeUid] = useState(null);
  const openUpgrade = () => { if (userUid) setUpgradeUid(userUid); };
  // "Account" (brief §14's nav concept) opens the existing Settings modal
  // rather than being a real page — it was previously reachable only via
  // the header's gear icon. openSignal is a counter SettingsButton watches
  // (see its own comment) so a nav tap can open it without lifting all of
  // Settings' internal state out of that component.
  const [accountOpenSignal, setAccountOpenSignal] = useState(0);

  // Feed/Discover/Events/Messages are launch-scoped off both nav bars —
  // see the "go" function and the route list below, both left fully
  // intact so re-adding a nav entry later is the only step needed.
  // Account tab removed from both nav bars — Settings/account is still
  // reachable via the header's own gear icon (SettingsButton renders it
  // independently of these arrays), so this only drops the duplicate
  // nav-bar entry point, not the feature itself.
  const NAV = [
    { id: "home", icon: Home, label: t("nav_home") },
    { id: "scout", icon: Radar, label: t("nav_scout") },
    { id: "targets", icon: Share, label: t("nav_plan") },
    { id: "profile", icon: User, label: t("nav_passport") },
  ];

  const SIDEBAR_NAV = [
    { id: "home", icon: Home, label: t("nav_home") },
    { id: "scout", icon: Radar, label: t("nav_ai_scout") },
    { id: "targets", icon: Share, label: t("nav_plan") },
    { id: "profile", icon: User, label: t("nav_passport") },   // the page is titled SPORTS PASSPORT — match it
  ];

  const go = (id) => {
    if (mustFinishProfile && id !== "profile") return;
    if (id === "account") { setAccountOpenSignal((s) => s + 1); return; }
    setPage(id); if (id !== "messages") setThread(null); setViewProfileId(null); setProfileStack([]);
  };
  const openThread = (id) => { if (mustFinishProfile) return; setThread(id); setPage("messages"); setProfileStack([]); };
  const viewProfile = (id) => {
    if (mustFinishProfile) return;
    setProfileStack((s) => [...s, { page, viewProfileId }]);
    setViewProfileId(id);
    setPage("profile");
  };
  const backFromProfile = () => {
    setProfileStack((s) => {
      if (s.length === 0) { setViewProfileId(null); return s; }
      const prev = s[s.length - 1];
      setViewProfileId(prev.viewProfileId);
      setPage(prev.page);
      return s.slice(0, -1);
    });
  };

  useEffect(() => {
    if (!sb) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) return;
        const { count } = await sb.from("messages").select("id", { count: "exact", head: true }).eq("recipient_id", user.id).is("read_at", null);
        setHasUnreadMsgs((count || 0) > 0);
      } catch (e) { console.error("GOLSZ unread check error:", e); }

// Brief §11's exact scripted first-conversion flow: goal -> Passport

const GUIDED_STEPS = ["goal", "passport", "missing", "readiness", "next_move", "ready"];
function GuidedAssessment({ uid, onDismiss }) {
  const { t } = useLang();
  const [step, setStep] = useState(0);
  const [loaded, setLoaded] = useState(false);
  const [goal, setGoal] = useState("");
  const [quality, setQuality] = useState(null);
  const [verified, setVerified] = useState(false);
  const [nextMove, setNextMove] = useState(null);
  const [showPlans, setShowPlans] = useState(false);

  useEffect(() => {
    if (!sb || !uid) { setLoaded(true); return; }
    (async () => {
      try {
        const [{ data: prof }, { data: ath }] = await Promise.all([
          sb.from("profiles").select("full_name, occupation, avatar_url, identity_verified").eq("id", uid).single(),
          sb.from("athletes").select("sport, position, club_name, grad_year, country, recruiting_status, bio, highlights, timeline, scout_context").eq("id", uid).single(),
        ]);
        setQuality(computeProfileQuality(ath, prof));
        setVerified(!!(prof && prof.identity_verified));
        const ctx = ath && ath.scout_context;
        if (ctx && typeof ctx === "object") {
          const dreamOutcome = ctx.dream_outcome;
          const goalVal = (dreamOutcome && typeof dreamOutcome === "object") ? dreamOutcome.value : dreamOutcome;
          if (goalVal) setGoal(String(goalVal));
          const aiMeta = ctx.ai_meta;
          if (aiMeta && aiMeta.next_best_action && typeof aiMeta.next_best_action === "object") setNextMove(aiMeta.next_best_action);
        }
      } catch (e) { console.error("GOLSZ guided assessment load error:", e); }
      setLoaded(true);
    })();
  }, [uid]);

  // Auto-advances through the reveal; stops at the last step ("ready") and
  // waits for CONTINUE MY JOURNEY instead of auto-showing plans, so the
  // athlete always sees the locked-features moment before any pricing.
  useEffect(() => {
    if (!loaded || step >= GUIDED_STEPS.length - 1) return;
    const id = setTimeout(() => setStep((s) => s + 1), 1800);
    return () => clearTimeout(id);
  }, [loaded, step]);

  const stepKey = GUIDED_STEPS[Math.min(step, GUIDED_STEPS.length - 1)];
  // Readiness here is deliberately just Profile Quality + Verification
  // averaged (not the full 5-sub-score Home composite) — Performance/
  // Development/Pathway are near-certainly untouched by an athlete only
  // 3 real Scout messages in, and averaging in three zeros this early
  // would understate things dishonestly rather than "initial."
  const readinessScore = quality ? Math.round((quality.score + (verified ? 100 : 0)) / 2) : 0;
  const LOCKED_TILES = [
    { icon: BadgeCheck, key: "readiness" }, { icon: Radar, key: "next_move" },
    { icon: Target, key: "targets" }, { icon: Trophy, key: "benchmarks" },
  ];

  return ReactDOM.createPortal(
    <div className="fixed-sheet" style={{ position: "fixed", inset: 0, background: "#000000a6", backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)", zIndex: 70, display: "flex", alignItems: "center", justifyContent: "center", padding: 18 }}>
      <div className="noscroll" style={{ background: C.pitch, border: `1px solid ${C.line2}`, borderRadius: 18, maxWidth: 440, width: "100%", maxHeight: "calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 48px)", overflowY: "auto", padding: 22, boxSizing: "border-box", boxShadow: "0 24px 60px -20px rgba(0,0,0,0.8)" }}>
        {!loaded ? (
          <div style={{ textAlign: "center", padding: "30px 0", color: C.slate, fontSize: 13 }}>{t("loading")}</div>
        ) : !showPlans ? (
          <>
            <div style={{ textAlign: "center", marginBottom: 14 }}><Radar size={26} color={C.lime} /></div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: stepKey === "ready" ? 18 : 6 }}>
              {GUIDED_STEPS.slice(0, stepKey === "ready" ? 5 : step + 1).map((s, i) => (
                <div key={s} style={{ display: "flex", alignItems: "flex-start", gap: 10, opacity: i === step && stepKey !== "ready" ? 1 : 0.55 }}>
                  <BadgeCheck size={15} color={C.lime} style={{ marginTop: 1, flexShrink: 0 }} />
                  <div style={{ fontSize: 13, color: C.chalk, lineHeight: 1.45 }}>
                    {s === "goal" && (goal ? t("guided_step_goal").replace("{goal}", goal) : t("guided_step_goal_fallback"))}
                    {s === "passport" && t("guided_step_passport").replace("{score}", quality ? quality.score : 0)}
                    {s === "missing" && (quality && quality.missing.length ? t("guided_step_missing").replace("{list}", quality.missing.slice(0, 3).join(", ")) : t("guided_step_missing_none"))}
                    {s === "readiness" && t("guided_step_readiness").replace("{score}", readinessScore)}
                    {s === "next_move" && (nextMove ? t("guided_step_next_move").replace("{label}", nextMove.label) : t("guided_step_next_move_generic"))}
                  </div>
                </div>
              ))}
            </div>
            {stepKey === "ready" && (
              <>
                <div style={{ fontSize: 17, fontWeight: 900, textAlign: "center", marginBottom: 6, lineHeight: 1.3 }}>{t("guided_ready_title")}</div>
                <div style={{ fontSize: 12.5, color: C.slate, textAlign: "center", marginBottom: 16, lineHeight: 1.5 }}>{t("guided_ready_body")}</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 18 }}>
                  {LOCKED_TILES.map(({ icon: Icon, key }) => (
                    <div key={key} style={{ background: C.turf, border: `1px dashed ${C.line2}`, borderRadius: 12, padding: "12px 10px", textAlign: "center", display: "flex", flexDirection: "column", alignItems: "center", gap: 5 }}>
                      <Lock size={13} color={C.slate} />
                      <span style={{ fontSize: 10.5, fontWeight: 700, color: C.slate }}>{t("guided_locked_" + key)}</span>
                    </div>
                  ))}
                </div>
                <button onClick={() => setShowPlans(true)} style={{ width: "100%", background: C.lime, color: C.ink, border: "none", borderRadius: 12, padding: "13px 14px", fontWeight: 800, fontSize: 13.5, cursor: "pointer", fontFamily: "inherit", marginBottom: 10 }}>{t("guided_continue_cta")}</button>
                <div style={{ textAlign: "center", fontSize: 11, color: C.slate, marginTop: 6 }}>{t("prices_currency_note")}</div>
        <button onClick={onDismiss} style={{ width: "100%", textAlign: "center", background: "none", border: "none", color: C.slate, fontSize: 12.5, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", padding: 8 }}>{t("conversion_dismiss")}</button>
              </>
            )}
          </>
        ) : (
          <>
            <div style={{ textAlign: "center", marginBottom: 8 }}><Radar size={26} color={C.lime} /></div>
            <div style={{ fontSize: 18, fontWeight: 900, textAlign: "center", marginBottom: 8, lineHeight: 1.3 }}>{t("conversion_title")}</div>
            <div style={{ fontSize: 13, color: C.slate, textAlign: "center", marginBottom: 20, lineHeight: 1.5 }}>{t("conversion_body")}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
              {PLANS.filter((pl) => pl.id !== "free").map((pl) => (
                <button key={pl.id} onClick={() => {
                  const link = stripeLinkFor(pl.id);
                  if (!link || !uid) return;
                  const checkoutUrl = new URL(link);
                  checkoutUrl.searchParams.set("client_reference_id", uid);
                  window.location.href = checkoutUrl.toString();
                }} style={{
                  textAlign: "left", cursor: "pointer", fontFamily: "inherit",
                  background: C.turf, border: `1.5px solid ${C.line2}`, borderRadius: 12,
                  padding: "12px 14px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10,
                }}>
                  <div style={{ fontSize: 13.5, fontWeight: 800, color: C.chalk }}>{pl.name}</div>
                  <div style={{ fontSize: 12.5, color: C.lime, fontWeight: 700 }}>{planPrice(pl.price)}/mo</div>
                </button>
              ))}

  const today = new Date(); const b = new Date(dobIso);
