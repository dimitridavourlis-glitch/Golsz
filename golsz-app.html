/* ============ PROFILE — Digital Sports Passport (signature) ============ */
/* profiles.full_name + athletes(*) merged into the passport's shape. Real
   numeric/text fields fall back to "—" when unset rather than showing
   demo values — a half-real, half-fake profile would undermine trust in
   a recruiting tool. */
function toPassport(profile, ath, uid, t) {
  const name = (profile && profile.full_name) || t("passport_athlete_fallback");
  const dash = (v) => (v === null || v === undefined || v === "" ? "—" : v);
  const country = (ath && ath.country) || "";
  const shortId = uid ? uid.replace(/-/g, "").slice(0, 5).toUpperCase() : "00000";
  return {
    name, occupation: (profile && profile.occupation) || "",
    verifiedTier: (profile && profile.verified_tier) || "none",
    avatarUrl: (profile && profile.avatar_url) || null,
    handle: "@" + name.trim().toLowerCase().replace(/[^a-z0-9]+/g, ".").replace(/^\.+|\.+$/g, ""),
    id: `GLS·${(country ? country.slice(0, 2) : "XX").toUpperCase()}·${dash(ath && ath.grad_year)}·${shortId}`,
    initials: initials(name), nat: `${flagFor(country)} ${dash(country)}`,
    sport: dash(ath && ath.sport), position: dash(ath && ath.position), club: dash(ath && ath.club_name),
    foot: dash(ath && ath.foot), prefLabel: (SPORT_PREFERENCE[ath && ath.sport] || {}).label || "FOOT",
    height: ath && ath.height_cm ? `${ath.height_cm} cm` : "—",
    grad: [ath && ath.grad_year, ath && ath.education_level].filter(Boolean).join(" · ") || "—",
    gpa: dash(ath && ath.gpa),
    weight: ath && ath.weight_kg ? `${ath.weight_kg} kg` : "—",
    status: dash(ath && ath.recruiting_status),
    license: dash(ath && ath.license),
    lookingForPlayers: ath && ath.looking_for_players === true ? t("yes") : ath && ath.looking_for_players === false ? t("no") : "—",
    bio: (ath && ath.bio) || t("passport_no_bio"),
  };
}

/* ============ PUBLIC PASSPORT (shareable, no account required) ============
   Reached via ?public=<id> (see Root()), which short-circuits the whole
   auth flow — this renders before Auth/GolszApp even mount, so someone
   without a GOLSZ account can open a shared link. Backed entirely by
   get_public_passport() (migration 046), a narrow anon-readable RPC —
   never a direct table select — so it can never accidentally expose more
   than that RPC deliberately returns, and returns null outright for a
   restricted (unapproved) minor, same gate as everywhere else in the app. */
function PublicPassport({ userId }) {
  const { t } = useLang();
  const [state, setState] = useState("loading"); // loading | ok | private | error
  const [p, setP] = useState(null);

  useEffect(() => {
    if (!sb || !userId) { setState("error"); return; }
    (async () => {
      try {
        const { data, error } = await sb.rpc("get_public_passport", { p_user: userId });
        if (error) throw error;
        if (!data) { setState("private"); return; }
        setP(data);
        setState("ok");
      } catch (e) { console.error("GOLSZ public passport error:", e); setState("error"); }
    })();
  }, [userId]);

  const dash = (v) => (v === null || v === undefined || v === "" ? "—" : v);

  return (
    <div style={{ minHeight: "100vh", background: C.pitch, color: C.chalk, fontFamily: "'Archivo', system-ui, sans-serif", padding: "28px 16px" }}>
      <div style={{ maxWidth: 420, margin: "0 auto" }}>
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <img src="/assets/logo-mark.png" alt="" style={{ width: 40, height: 40, marginBottom: 6 }} />
          <div style={{ fontWeight: 900, fontSize: 24, letterSpacing: "0.03em", fontStretch: "expanded" }}>GOLSZ<span style={{ color: C.lime }}>.</span></div>
        </div>

        {state === "loading" && <div style={{ textAlign: "center", color: C.slate, fontSize: 13, padding: "40px 0" }}>{t("loading")}</div>}
        {state === "error" && <div style={{ textAlign: "center", color: C.slate, fontSize: 13, padding: "40px 0" }}>{t("public_passport_not_found")}</div>}
        {state === "private" && <div style={{ textAlign: "center", color: C.slate, fontSize: 13, padding: "40px 0" }}>{t("public_passport_private")}</div>}

        {state === "ok" && p && (
          <div style={{
            background: `linear-gradient(160deg, ${C.card}, ${C.turf})`,
            border: `1px solid ${C.line2}`, borderRadius: 16, overflow: "hidden",
            boxShadow: `0 0 0 1px ${C.pitch}, 0 20px 40px -20px #000`,
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", borderBottom: `1px dashed ${C.line2}`, background: C.passportStrip }}>
              <span style={{ fontSize: 10, letterSpacing: "0.22em", fontWeight: 800, color: C.lime }}>DIGITAL SPORTS PASSPORT</span>
              <span style={{ fontSize: 9.5, color: C.slate, fontFamily: "'Space Mono', monospace" }}>{flagFor(p.country)} {dash(p.country)}</span>
            </div>
            <div style={{ display: "flex", gap: 14, padding: 16 }}>
              <div style={{
                width: 84, height: 100, borderRadius: 10, flexShrink: 0,
                background: p.avatar_url ? undefined : `linear-gradient(135deg, ${C.turf}, ${C.line2})`,
                border: `1px solid ${C.lime}`, display: "flex", alignItems: "center", justifyContent: "center",
                overflow: "hidden", fontFamily: "'Space Mono', monospace", fontWeight: 800, fontSize: 34, color: C.lime,
              }}>
                {p.avatar_url ? <img src={p.avatar_url} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : initials(p.full_name || "?")}
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 5, flexWrap: "wrap" }}>
                  <div style={{ fontSize: 20, fontWeight: 900, lineHeight: 1.05, fontStretch: "expanded" }}>{p.full_name || t("passport_athlete_fallback")}</div>
                  {p.verified_tier && p.verified_tier !== "none" && (
                    <BadgeCheck size={17} color={C.pitch} fill={p.verified_tier === "elite" ? C.elite : C.lime} strokeWidth={2.5} />
                  )}
                </div>
                {p.occupation && (
                  <span style={{ fontSize: 9.5, fontWeight: 800, letterSpacing: "0.06em", color: C.lime, border: `1px solid ${C.limeBorder}`, borderRadius: 999, padding: "2px 8px", display: "inline-block", marginTop: 4 }}>{p.occupation.toUpperCase()}</span>
                )}
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px 10px", marginTop: 10, fontSize: 11.5 }}>
                  <div><span style={{ color: C.slate }}>{t("passport_sport")}: </span>{dash(p.sport)}</div>
                  <div><span style={{ color: C.slate }}>{t("passport_position")}: </span>{dash(p.position)}</div>
                  <div><span style={{ color: C.slate }}>{t("passport_club")}: </span>{dash(p.club_name)}</div>
                  <div><span style={{ color: C.slate }}>{t("passport_grad")}: </span>{dash(p.grad_year)}</div>
                  <div><span style={{ color: C.slate }}>{t("passport_status")}: </span>{dash(p.recruiting_status)}</div>
                  <div><span style={{ color: C.slate }}>{t("passport_foot")}: </span>{dash(p.foot)}</div>
                </div>
              </div>
            </div>
            {p.bio && (
              <div style={{ padding: "0 16px 16px", fontSize: 12.5, color: C.body, lineHeight: 1.5 }}>{p.bio}</div>
            )}
            {Array.isArray(p.highlights) && p.highlights.length > 0 && (
              <div style={{ padding: "0 16px 16px" }}>
                <div style={{ fontSize: 9, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 8, borderTop: `1px dashed ${C.line2}`, paddingTop: 14 }}>{t("highlights_title")}</div>
                {p.highlights.map((m, i) => (
                  <a key={m.id || i} href={m.url} target="_blank" rel="noopener noreferrer" style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 0", color: C.chalk, textDecoration: "none", borderBottom: i < p.highlights.length - 1 ? `1px solid ${C.line}` : "none" }}>
                    <Video size={13} color={C.lime} style={{ flexShrink: 0 }} />
                    <span style={{ fontSize: 12.5 }}>{m.title}</span>
                  </a>
                ))}
              </div>
            )}
          </div>
        )}

        <div style={{ textAlign: "center", marginTop: 20 }}>
          <a href="/" style={{ fontSize: 12, color: C.slate, textDecoration: "none" }}>{t("public_passport_cta")}</a>
        </div>
      </div>
    </div>
  );
}

function ProfileEditor({ initial, locked, onClose, onSaved }) {
  const { t } = useLang();
  const [form, setForm] = useState(initial);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const field = { width: "100%", background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 10, color: C.chalk, padding: "10px 12px", fontSize: 13.5, fontFamily: "inherit", outline: "none", boxSizing: "border-box" };
  const label = { fontSize: 9.5, letterSpacing: "0.1em", color: C.slate, fontWeight: 700, marginBottom: 5, display: "block" };
  const row = (children) => <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>{children}</div>;
  const group = (lbl, children) => <div style={{ marginBottom: 12 }}><span style={label}>{lbl}</span>{children}</div>;
  const isPlayer = !form.occupation || form.occupation === "Player";
  // A parent isn't an athlete themselves — nothing athlete-shaped
  // (sport/position/club/stats) applies to their own account at all.
  // Their real "profile" is the Family & Parent Access section below
  // (request a link to their child by email), not a sport pick.
  const isParent = form.occupation === "Parent";

  async function save() {
    if (!sb || busy) return;
    const name = (form.full_name || "").trim();
    if (!name) { setErr(t("editor_name_required")); return; }
    if (!form.occupation) { setErr(t("auth_occupation_required")); return; }
    if (!isParent) {
      if (!form.sport) { setErr(t("editor_sport_required")); return; }
      if (!isPlayer && !(form.club_name || "").trim()) { setErr(t("editor_team_required")); return; }
    }
    setBusy(true); setErr("");
    try {
      const { decision } = await moderateContent({ text: form.bio || "", contentType: "profile_field", surface: "profile" });
      if (decision === "block") { setErr(t("moderation_blocked")); setBusy(false); return; }
      const { data: { user } } = await sb.auth.getUser();
      if (!user) throw new Error("Not signed in.");
      const { error: e1 } = await sb.from("profiles").update({ full_name: name, occupation: form.occupation || null }).eq("id", user.id);
      if (e1) throw e1;
      const { error: e2 } = await sb.from("athletes").update({
        sport: form.sport || null,
        position: (form.position || "").trim() || null,
        gender: form.gender || null,
        grad_year: form.grad_year ? Number(form.grad_year) : null,
        gpa: form.gpa !== "" && form.gpa != null ? Number(form.gpa) : null,
        height_cm: form.height_cm ? Number(form.height_cm) : null,
        weight_kg: form.weight_kg ? Number(form.weight_kg) : null,
        foot: form.foot || null,
        recruiting_status: form.recruiting_status || null,
        education_level: form.education_level || null,
        country: (form.country || "").trim() || null,
        club_name: (form.club_name || "").trim() || null,
        license: (form.license || "").trim() || null,
        looking_for_players: form.looking_for_players === "" || form.looking_for_players == null ? null : form.looking_for_players === "true",
        bio: (form.bio || "").trim().slice(0, 600) || null,
      }).eq("id", user.id);
      if (e2) throw e2;
      onSaved();
    } catch (e) {
      console.error("GOLSZ profile save error:", e);
      setErr((e && e.message) || t("editor_save_err"));
    } finally { setBusy(false); }
  }

  return (
    <div style={{ position: "fixed", inset: 0, background: "#000000cc", zIndex: 50, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div style={{ background: C.pitch, borderTop: `1px solid ${C.line2}`, borderRadius: "18px 18px 0 0", maxWidth: 480, width: "100%", maxHeight: "92vh", overflowY: "auto", padding: "16px 18px calc(18px + env(safe-area-inset-bottom, 0px))", boxSizing: "border-box" }} className="noscroll">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: locked ? 4 : 16, gap: 8 }}>
          <div style={{ fontWeight: 800, fontSize: 15, flex: 1, minWidth: 0, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{t("editor_title")}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
            <button onClick={save} disabled={busy} style={{
              background: C.lime, color: C.ink, border: "none", borderRadius: 9, padding: "6px 12px",
              fontWeight: 800, fontSize: 12, fontFamily: "inherit", cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1, whiteSpace: "nowrap",
            }}>{busy ? t("editor_saving") : t("editor_save")}</button>
            {!locked && <button onClick={onClose} style={{ ...iconBtn(C.chalk), padding: 4 }}><X size={17} /></button>}
          </div>
        </div>
        {locked && <div style={{ fontSize: 12, color: C.lime, marginBottom: 14 }}>{t("editor_locked_notice")}</div>}
        {err && <div style={{ color: C.amber, fontSize: 12, marginBottom: 14 }}>{err}</div>}

        {group(t("editor_name_label"), <input style={field} value={form.full_name || ""} onChange={set("full_name")} placeholder={t("editor_name_ph")} />)}

        {group(t("auth_occupation"), (
          <select style={field} value={form.occupation || ""} onChange={set("occupation")}>
            <option value="">{t("editor_select")}</option>
            {OCCUPATIONS.map((o) => <option key={o} value={o}>{o}</option>)}
          </select>
        ))}

        {!isParent && row(<>
          <div><span style={label}>{t("editor_sport_label")}</span>
            <select style={field} value={form.sport || ""} onChange={set("sport")}>
              <option value="">{t("editor_select")}</option>
              {(isPlayer ? SPORTS.filter((s) => s !== "All") : NON_PLAYER_SPORTS).map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          {isPlayer ? (
            <div><span style={label}>{t("editor_position_label")}</span>
              <input style={field} list="position-options" value={form.position || ""} onChange={set("position")} placeholder={form.sport ? `e.g. ${(SPORT_POSITIONS[form.sport] || POSITIONS)[0]}` : t("editor_position_pick_sport")} />
              <datalist id="position-options">{(SPORT_POSITIONS[form.sport] || POSITIONS.filter((p) => p !== "All")).map((p) => <option key={p} value={p} />)}</datalist>
            </div>
          ) : <div />}
        </>)}

        {isPlayer && row(<>
          <div><span style={label}>{t("editor_gender_label")}</span>
            <select style={field} value={form.gender || ""} onChange={set("gender")}>
              <option value="">{t("editor_select")}</option>
              {GENDERS.filter((g) => g[0] !== "All").map(([v, l]) => <option key={v} value={v}>{l}</option>)}
            </select>
          </div>
          <div><span style={label}>{t("editor_grad_year_label")}</span>
            <input style={field} type="number" value={form.grad_year || ""} onChange={set("grad_year")} placeholder="2027" />
          </div>
        </>)}

        {isPlayer && row(<>
          <div><span style={label}>{t("editor_school_level_label")}</span>
            <select style={field} value={form.education_level || ""} onChange={set("education_level")}>
              <option value="">—</option>
              {SCHOOL_LEVELS.map((l) => <option key={l} value={l}>{l}</option>)}
            </select>
          </div>
          <div />
        </>)}

        {isPlayer && row(<>
          <div><span style={label}>{t("editor_height_label")}</span>
            <input style={field} type="number" value={form.height_cm || ""} onChange={set("height_cm")} placeholder="180" />
          </div>
          <div><span style={label}>{t("editor_weight_label")}</span>
            <input style={field} type="number" value={form.weight_kg || ""} onChange={set("weight_kg")} placeholder="75" />
          </div>
        </>)}

        {isPlayer && (() => {
          const pref = SPORT_PREFERENCE[form.sport];
          return row(<>
            <div><span style={label}>{t("editor_gpa_label")}</span>
              <input style={field} type="number" step="0.01" min="0" max="5" value={form.gpa || ""} onChange={set("gpa")} placeholder="3.8" />
            </div>
            {pref ? (
              <div><span style={label}>{pref.label}</span>
                <select style={field} value={form.foot || ""} onChange={set("foot")}>
                  <option value="">—</option>
                  {pref.options.map((o) => <option key={o} value={o}>{o}</option>)}
                </select>
              </div>
            ) : <div />}
          </>);
        })()}

        {!isPlayer && !isParent && group(t("editor_license_label"), (
          <input style={field} value={form.license || ""} onChange={set("license")} placeholder={t("editor_license_ph")} />
        ))}

        {!isPlayer && !isParent && group(t("editor_looking_label"), (
          <select style={field} value={form.looking_for_players || ""} onChange={set("looking_for_players")}>
            <option value="">—</option>
            <option value="true">{t("yes")}</option>
            <option value="false">{t("no")}</option>
          </select>
        ))}

        {!isParent && row(<>
          <div><span style={label}>{t("editor_country_label")}</span>
            <input style={field} list="country-options" value={form.country || ""} onChange={set("country")} placeholder={t("editor_country_ph")} />
            <datalist id="country-options">{COUNTRIES.filter((c) => c !== "All").map((c) => <option key={c} value={c} />)}</datalist>
          </div>
          <div><span style={label}>{t("editor_club_label")}</span>
            <input style={field} value={form.club_name || ""} onChange={set("club_name")} placeholder={t("editor_club_ph")} />
          </div>
        </>)}

        {isPlayer && group(t("editor_status_label"), (
          <select style={field} value={form.recruiting_status || ""} onChange={set("recruiting_status")}>
            <option value="">—</option>
            <option value="Open to offers">Open to offers</option>
            <option value="In contact">In contact</option>
            <option value="Committed">Committed</option>
            <option value="Signed">Signed</option>
          </select>
        ))}

        {group(t("editor_bio_label"), (
          <textarea style={{ ...field, resize: "vertical", minHeight: 80 }} maxLength={600} value={form.bio || ""} onChange={set("bio")} placeholder={t("editor_bio_ph")} />
        ))}
      </div>
    </div>
  );
}

function Passport({ onSignOut, autoEdit, onAutoEditConsumed, onProfileStatus, onOpenAdmin, viewUserId, onBack, onMessage, onViewProfile }) {
  const { t } = useLang();
  const [uid, setUid] = useState(null);
  const [profile, setProfile] = useState(null);
  const [athlete, setAthlete] = useState(null);
  const [editing, setEditing] = useState(false);
  const [following, setFollowing] = useState(false);
  const [followedByThem, setFollowedByThem] = useState(false);
  const [followers, setFollowers] = useState(null);
  const [followingList, setFollowingList] = useState(null);
  const [avatarBusy, setAvatarBusy] = useState(false);
  const [avatarErr, setAvatarErr] = useState("");
  const [loaded, setLoaded] = useState(!sb); // no backend at all -> nothing to wait for, show demo immediately
  const [shareMsg, setShareMsg] = useState("");
  const [reportedProfile, setReportedProfile] = useState(false);
  const real = !!uid;
  const viewingOther = !!(viewUserId && uid && viewUserId !== uid);

  // Sharing sends an authenticated deep link (?profile=<uid>) rather than
  // the old no-login public-passport link — a recipient needs a (free)
  // GOLSZ account to open it, same as viewing any other athlete's Passport
  // in-app already requires (athletes_read already allows any signed-in
  // user to read a non-restricted, non-banned athlete's row). Uses the
  // native OS share sheet (Messages/Messenger/Mail/etc.) when available,
  // falling back to a clipboard copy on desktop browsers without it.
  async function sharePassport() {
    if (!uid) return;
    const url = `${window.location.origin}${window.location.pathname}?profile=${uid}`;
    if (navigator.share) {
      try { await navigator.share({ title: t("passport_share_title"), text: t("passport_share_text"), url }); return; }
      catch (e) { if (e && e.name === "AbortError") return; /* fall through to clipboard on real errors */ }
    }
    try { await navigator.clipboard.writeText(url); setShareMsg(t("passport_share_copied")); }
    catch (e) { setShareMsg(url); }
    setTimeout(() => setShareMsg(""), 4000);
  }

  async function makePassportPrivate() {
    if (!uid) return;
    try { await sb.from("profiles").update({ passport_public: false }).eq("id", uid); setProfile((p) => ({ ...p, passport_public: false })); }
    catch (e) { console.error("GOLSZ passport-private error:", e); }
  }

  // Same validate-then-upload-as-ArrayBuffer pattern Feed's post-image
  // upload already uses (raw File uploads can arrive empty on some
  // mobile browsers) — just a different bucket (avatars vs post-images)
  // and it writes straight to profiles.avatar_url instead of a post row.
  function pickAvatar(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file || !sb || !uid) return;
    if (!file.type.startsWith("image/")) { setAvatarErr(t("passport_photo_type_err")); return; }
    if (file.size > 8 * 1024 * 1024) { setAvatarErr(t("passport_photo_size_err")); return; }
    setAvatarErr("");
    (async () => {
      setAvatarBusy(true);
      try {
        const ext = (file.name.split(".").pop() || "jpg").toLowerCase().slice(0, 5);
        const path = `${uid}/${Date.now()}.${ext}`;
        const bytes = await file.arrayBuffer();
        const { error: upErr } = await sb.storage.from("avatars").upload(path, bytes, { contentType: file.type || "image/jpeg" });
        if (upErr) throw upErr;
        const avatarUrl = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
        const { error } = await sb.from("profiles").update({ avatar_url: avatarUrl }).eq("id", uid);
        if (error) throw error;
        setProfile((p) => (p ? { ...p, avatar_url: avatarUrl } : p));
      } catch (err) {
        console.error("GOLSZ avatar upload error:", err);
        setAvatarErr((err && err.message) || t("passport_photo_err"));
      } finally { setAvatarBusy(false); }
    })();
  }

  // Just clears profiles.avatar_url back to null — doesn't delete the
  // file out of the avatars Storage bucket (harmless: it's keyed under
  // this user's own folder, never linked from anywhere once the column
  // is cleared, and re-uploading always writes a fresh timestamped
  // filename anyway, so nothing stale can ever be shown by accident).
  // Passport already falls back to initials whenever avatarUrl is falsy.
  async function removeAvatar() {
    if (!sb || !uid || avatarBusy) return;
    setAvatarBusy(true); setAvatarErr("");
    try {
      const { error } = await sb.from("profiles").update({ avatar_url: null }).eq("id", uid);
      if (error) throw error;
      setProfile((p) => (p ? { ...p, avatar_url: null } : p));
    } catch (err) {
      console.error("GOLSZ avatar remove error:", err);
      setAvatarErr((err && err.message) || t("passport_photo_err"));
    } finally { setAvatarBusy(false); }
  }

  async function load() {
    if (!sb) return;
    try {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return;
      setUid(user.id);
      const other = viewUserId && viewUserId !== user.id;
      const targetId = other ? viewUserId : user.id;
      if (other) {
        // profiles has no public-read policy (dob is sensitive), so the
        // viewed person's name comes from the public_profile_names view —
        // same pattern used in Feed/Discover/Messages.
        const [{ data: nameRow }, { data: ath }, { data: myFollow }, { data: theirFollow }] = await Promise.all([
          sb.from("public_profile_names").select("full_name, occupation, verified_tier, avatar_url").eq("id", viewUserId).maybeSingle(),
          sb.from("athletes").select("*").eq("id", viewUserId).maybeSingle(),
          sb.from("follows").select("followed_id").eq("follower_id", user.id).eq("followed_id", viewUserId).maybeSingle(),
          sb.from("follows").select("follower_id").eq("follower_id", viewUserId).eq("followed_id", user.id).maybeSingle(),
        ]);
        setProfile(nameRow ? { full_name: nameRow.full_name, occupation: nameRow.occupation, verified_tier: nameRow.verified_tier, avatar_url: nameRow.avatar_url } : null);
        setAthlete(ath || null);
        setFollowing(!!myFollow);
        setFollowedByThem(!!theirFollow);
      } else {
        const [{ data: prof }, { data: ath }] = await Promise.all([
          sb.from("profiles").select("full_name, is_admin, occupation, verified_tier, plan, avatar_url, passport_public").eq("id", user.id).single(),
          sb.from("athletes").select("*").eq("id", user.id).single(),
        ]);
        setProfile(prof || null);
        setAthlete(ath || null);
        if (autoEdit) { setEditing(true); onAutoEditConsumed && onAutoEditConsumed(); }
      }

      const [{ data: followerRows }, { data: followingRows }] = await Promise.all([
        sb.from("follows").select("follower_id").eq("followed_id", targetId),
        sb.from("follows").select("followed_id").eq("follower_id", targetId),
      ]);
      const followerIds = (followerRows || []).map((r) => r.follower_id);
      const followingIds = (followingRows || []).map((r) => r.followed_id);
      const allIds = [...new Set([...followerIds, ...followingIds])];
      let nameById = {};
      if (allIds.length) {
        const { data: names } = await sb.from("public_profile_names").select("id, full_name").in("id", allIds);
        nameById = Object.fromEntries((names || []).map((r) => [r.id, r.full_name]));
      }
      setFollowers(followerIds.map((id) => ({ id, name: nameById[id] || "GOLSZ User" })));
      setFollowingList(followingIds.map((id) => ({ id, name: nameById[id] || "GOLSZ User" })));
    } catch (e) { console.error("GOLSZ passport load error:", e); }
    finally { setLoaded(true); }
  }
  useEffect(() => { load(); }, [viewUserId]);

  // Keeps GolszApp's app-wide lock (see mustFinishProfile there) in sync
  // with the real, live state of this athlete's own profile — fires once
  // on initial load and again after every save, so the rest of the app
  // unlocks the moment a sport gets saved, without needing a full reload.
  useEffect(() => {
    if (!loaded || viewingOther || !onProfileStatus) return;
    onProfileStatus(!!(athlete && athlete.sport));
  }, [loaded, athlete, viewingOther]);

  async function toggleFollowThis() {
    if (!sb || !uid || !viewUserId || viewUserId === uid) return;
    const was = following;
    setFollowing(!was);
    try {
      const { error } = was
        ? await sb.from("follows").delete().eq("follower_id", uid).eq("followed_id", viewUserId)
        : await sb.from("follows").insert({ follower_id: uid, followed_id: viewUserId });
      if (error) throw error;
    } catch (e) { console.error("GOLSZ passport follow error:", e); setFollowing(was); }
  }

  // Trust & Safety Moderation System — generalized report path (migration
  // 060, content_reports), same pattern as Messages' reportThread().
  async function reportProfile() {
    if (!sb || !uid || !viewUserId || viewUserId === uid || reportedProfile) return;
    try {
      await sb.from("content_reports").insert({ reporter_id: uid, target_type: "profile", target_id: viewUserId, reason: "reported from profile" });
      setReportedProfile(true);
    } catch (e) { console.error("GOLSZ profile report error:", e); }
  }

  const p = real ? toPassport(profile, athlete, viewingOther ? viewUserId : uid, t) : PASSPORT;
  const mrz = real
    ? `${p.id.replace(/[·]/g, "<")}<${p.name.replace(/[^A-Za-z]/g, "").toUpperCase()}<<<<<<<<<<<<<<<<<<<<<<<<<<<<`
    : `GLS<CAN<${p.name.replace(/[^A-Za-z]/g, "").toUpperCase()}<<LEFTBACK<<<<<${p.id.replace(/[·]/g, "")}<2027CA`;
  const occupationSet = !!(profile && profile.occupation);
  const isPlayerProfile = !occupationSet || profile.occupation === "Player";
  const isParentProfile = occupationSet && profile.occupation === "Parent";
  // A parent's own account has no sport/club to fill in at all — see
  // ProfileEditor's isParent branch — so "done onboarding" for them just
  // means occupation is set. Without this exception they'd stay stuck in
  // the locked editor forever, since athlete.sport can never become true
  // for an account that never shows that field.
  const incomplete = !viewingOther && real && profile && athlete && (
    !occupationSet || (!isParentProfile && (!athlete.sport || (!isPlayerProfile && !athlete.club_name)))
  );

  const editorInitial = () => ({
    full_name: (profile && profile.full_name) || "", occupation: (profile && profile.occupation) || "",
    sport: (athlete && athlete.sport) || "", position: (athlete && athlete.position) || "",
    gender: (athlete && athlete.gender) || "", grad_year: (athlete && athlete.grad_year) || "",
    gpa: (athlete && athlete.gpa) || "", height_cm: (athlete && athlete.height_cm) || "",
    weight_kg: (athlete && athlete.weight_kg) || "", foot: (athlete && athlete.foot) || "",
    recruiting_status: (athlete && athlete.recruiting_status) || "", education_level: (athlete && athlete.education_level) || "",
    country: (athlete && athlete.country) || "",
    club_name: (athlete && athlete.club_name) || "", bio: (athlete && athlete.bio) || "",
    license: (athlete && athlete.license) || "",
    looking_for_players: athlete && athlete.looking_for_players === true ? "true" : athlete && athlete.looking_for_players === false ? "false" : "",
  });

  if (!loaded) return <div style={{ padding: "40px 20px", textAlign: "center", color: C.slate, fontSize: 13 }}>{t("loading")}</div>;

  return (
    <div style={{ padding: "8px 12px 20px", background: C.passportWash }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "4px 2px 10px" }}>
        <SectionTitle noMargin>{viewingOther ? t("passport_title_other") : t("passport_title_self")}</SectionTitle>
        {viewingOther ? (
          <button onClick={onBack} style={{ ...iconBtn(C.chalk), fontSize: 11.5 }}><ChevronLeft size={16} /> {t("back")}</button>
        ) : real ? (
          <div style={{ display: "flex", gap: 14 }}>
            <button onClick={sharePassport} style={{ ...iconBtn(C.chalk), fontSize: 11.5 }}><Share2 size={13} /> {t("passport_share")}</button>
            <button onClick={() => setEditing(true)} style={{ ...iconBtn(C.lime), fontSize: 11.5 }}><Pencil size={13} /> {t("passport_edit")}</button>
          </div>
        ) : (
          <span style={{ fontSize: 9.5, color: C.slate, fontFamily: "'Space Mono', monospace" }}>GOLSZ · GLOBAL</span>
        )}
      </div>
      {/* passport_public (migration 047) is off by default — sharing is an
          explicit choice, not an always-public account. This banner only
          ever shows once the athlete has actually clicked Share. */}
      {!viewingOther && real && profile && profile.passport_public && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "#C8F1351a", border: `1px solid ${C.limeBorder}`, borderRadius: 10, padding: "8px 12px", marginBottom: 10, gap: 10 }}>
          <span style={{ fontSize: 12, color: C.chalk }}>{t("passport_is_public")}</span>
          <button onClick={makePassportPrivate} style={{ ...iconBtn(C.amber), fontSize: 11 }}>{t("passport_make_private")}</button>
        </div>
      )}
      {shareMsg && (
        <div style={{ background: "#C8F1351a", border: `1px solid ${C.limeBorder}`, borderRadius: 10, padding: "8px 12px", marginBottom: 10, fontSize: 12, color: C.chalk, wordBreak: "break-all" }}>{shareMsg}</div>
      )}

      {viewingOther && (
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          <button onClick={toggleFollowThis} style={{
            flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            padding: "10px 14px", borderRadius: 10, fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit",
            background: following ? C.lime : "transparent", color: following ? C.ink : C.chalk,
            border: `1px solid ${following ? C.lime : C.line2}`,
          }}>
            <Users size={15} fill={following ? C.lime : "none"} /> {following ? t("passport_following") : t("passport_follow")}
          </button>
          {onMessage && (
            <button onClick={() => onMessage(viewUserId)} style={{
              flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
              padding: "10px 14px", borderRadius: 10, fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit",
              background: "transparent", color: C.chalk, border: `1px solid ${C.line2}`,
            }}>
              <MessageSquare size={15} /> {t("passport_message")}
            </button>
          )}
          <button onClick={reportProfile} style={{ ...iconBtn(reportedProfile ? C.amber : C.slate), fontSize: 11 }}>
            {reportedProfile ? t("action_reported") : t("action_report")}
          </button>
        </div>
      )}

      {viewingOther && p.occupation && p.occupation !== "Player" && p.verifiedTier === "none" && (
        <div style={{ background: "#C89B3C1a", border: `1px solid ${C.amberBorder}`, borderRadius: 12, padding: "12px 14px", marginBottom: 12, display: "flex", alignItems: "flex-start", gap: 10 }}>
          <ShieldAlert size={16} color={C.amber} style={{ flexShrink: 0, marginTop: 1 }} />
          <div style={{ fontSize: 12, color: C.chalk, lineHeight: 1.45 }}>
            {t("passport_unverified_warning").replace("{occupation}", p.occupation)}
          </div>
        </div>
      )}

      {incomplete && (
        <div onClick={() => setEditing(true)} style={{ background: "#C8F1351a", border: `1px solid ${C.limeBorder}`, borderRadius: 12, padding: "12px 14px", marginBottom: 12, cursor: "pointer", display: "flex", alignItems: "center", gap: 10 }}>
          <Pencil size={16} color={C.lime} />
          <div style={{ fontSize: 12.5, color: C.chalk, lineHeight: 1.4 }}>
            <b style={{ color: C.lime }}>{t("passport_finish_bold")}</b>{t("passport_finish_rest")}
          </div>
        </div>
      )}

      {(editing || incomplete) && (
        <ProfileEditor
          initial={editorInitial()}
          locked={incomplete}
          onClose={() => setEditing(false)}
          onSaved={() => { setEditing(false); load(); }}
        />
      )}

      {/* Family & Parent Access is launch-scoped off Passport for now —
          <FamilyAccess /> itself is untouched, just not rendered here or
          in its usual spot below (see the other disabled call near
          RestrictedBanner/BlockedAccounts). */}

      {/* passport document */}
      <div style={{
        background: `linear-gradient(160deg, ${C.card}, ${C.turf})`,
        border: `1px solid ${C.line2}`, borderRadius: 16, overflow: "hidden",
        boxShadow: `0 0 0 1px ${C.pitch}, 0 20px 40px -20px #000`,
      }}>
        {/* header strip */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", borderBottom: `1px dashed ${C.line2}`, background: C.passportStrip }}>
          <span style={{ fontSize: 10, letterSpacing: "0.22em", fontWeight: 800, color: C.lime }}>DIGITAL SPORTS PASSPORT</span>
          <span style={{ fontSize: 9.5, color: C.slate, fontFamily: "'Space Mono', monospace" }}>{p.nat}</span>
        </div>

        <div style={{ display: "flex", gap: 14, padding: 16 }}>
          <div>
            <div style={{ position: "relative", width: 84, height: 100 }}>
              <div style={{
                width: 84, height: 100, borderRadius: 10,
                background: p.avatarUrl ? undefined : `linear-gradient(135deg, ${C.turf}, ${C.line2})`,
                border: `1px solid ${C.lime}`, display: "flex", alignItems: "center", justifyContent: "center",
                overflow: "hidden",
                fontFamily: "'Space Mono', monospace", fontWeight: 800, fontSize: 34, color: C.lime,
              }}>
                {p.avatarUrl ? (
                  <img src={p.avatarUrl} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                ) : p.initials}
              </div>
              {!viewingOther && real && (
                <label style={{
                  position: "absolute", bottom: -6, right: -6, width: 26, height: 26, borderRadius: 99,
                  background: C.lime, border: `2px solid ${C.pitch}`, display: "flex", alignItems: "center", justifyContent: "center",
                  cursor: avatarBusy ? "default" : "pointer", opacity: avatarBusy ? 0.6 : 1,
                }}>
                  <Camera size={13} color={C.ink} />
                  <input type="file" accept="image/*" onChange={pickAvatar} disabled={avatarBusy} style={{ display: "none" }} />
                </label>
              )}
              {!viewingOther && real && p.avatarUrl && (
                <button onClick={removeAvatar} disabled={avatarBusy} title={t("passport_photo_remove")} style={{
                  position: "absolute", top: -6, right: -6, width: 22, height: 22, borderRadius: 99, padding: 0,
                  background: C.pitch, border: `2px solid ${C.amber}`, display: "flex", alignItems: "center", justifyContent: "center",
                  cursor: avatarBusy ? "default" : "pointer", opacity: avatarBusy ? 0.6 : 1,
                }}>
                  <X size={12} color={C.amber} />
                </button>
              )}
            </div>
            <div style={{ textAlign: "center", fontSize: 8.5, color: C.slate, marginTop: 5, fontFamily: "'Space Mono', monospace" }}>{real ? t("passport_member") : "VERIFIED PHOTO"}</div>
            {!viewingOther && real && (
              <div style={{ fontSize: 9, color: C.slate, marginTop: 6, maxWidth: 84, textAlign: "center", lineHeight: 1.3 }}>{t("passport_photo_tip")}</div>
            )}
            {!viewingOther && avatarErr && (
              <div style={{ fontSize: 9, color: C.amber, marginTop: 4, maxWidth: 84, textAlign: "center", lineHeight: 1.3 }}>{avatarErr}</div>
            )}
          </div>

/* ============ BLOCKED ACCOUNTS ============
   Blocking someone (Feed's Block button) silently drops their posts from
   your feed with no way back — this is the way back. blocks_delete RLS
   (blocker_id = auth.uid()) already allows unblocking; there was just no
   UI for it before now. */
function BlockedAccounts() {
  const { t } = useLang();
  const [uid, setUid] = useState(null);
  const [blocked, setBlocked] = useState(null);
  const [removingId, setRemovingId] = useState(null);

  async function load() {
    if (!sb) return;
    try {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return;
      setUid(user.id);
      const { data: rows, error } = await sb.from("blocks").select("blocked_id").eq("blocker_id", user.id);
      if (error) throw error;
      const ids = (rows || []).map((r) => r.blocked_id);
      let nameById = {};
      if (ids.length) {
        const { data: names } = await sb.from("public_profile_names").select("id, full_name").in("id", ids);
        nameById = Object.fromEntries((names || []).map((r) => [r.id, r.full_name]));
      }
      setBlocked(ids.map((id) => ({ id, name: nameById[id] || "GOLSZ User" })));
    } catch (e) { console.error("GOLSZ blocked-accounts load error:", e); setBlocked((b) => b || []); }
  }
  useEffect(() => { load(); }, []);

  async function unblock(id) {
    if (!sb || !uid || removingId) return;
    setRemovingId(id);
    try {
      const { error } = await sb.from("blocks").delete().eq("blocker_id", uid).eq("blocked_id", id);
      if (error) throw error;
      setBlocked((list) => (list || []).filter((b) => b.id !== id));
    } catch (e) { console.error("GOLSZ unblock error:", e); }
    finally { setRemovingId(null); }
  }

  if (!sb) return null;
  const count = blocked === null ? null : blocked.length;

  return (
    <div style={{ ...card, border: `1px solid ${count ? C.amber + "44" : C.line}` }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Ban size={16} color={count ? C.amber : C.slate} />
        <span style={{ fontSize: 13.5, fontWeight: 800, color: C.chalk }}>{t("blocked_title")}</span>
        {count > 0 && (
          <span style={{ fontSize: 11, fontWeight: 800, color: C.ink, background: C.amber, borderRadius: 999, padding: "1px 8px" }}>{count}</span>
        )}
      </div>
      {blocked === null && <div style={{ fontSize: 12.5, color: C.slate }}>{t("loading")}</div>}
      {blocked && blocked.length === 0 && <div style={{ fontSize: 12.5, color: C.slate }}>{t("blocked_empty")}</div>}
      {blocked && blocked.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
          {blocked.map((b) => (
            <div key={b.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 0" }}>
              <Avatar init={initials(b.name)} size={30} />
              <span style={{ fontSize: 13, fontWeight: 600, flex: 1 }}>{b.name}</span>
              <button onClick={() => unblock(b.id)} disabled={removingId === b.id} style={{
                fontSize: 11, fontWeight: 700, padding: "5px 10px", borderRadius: 999, cursor: "pointer",
                fontFamily: "inherit", background: "transparent", color: C.lime, border: `1px solid ${C.limeBorder}`,
                opacity: removingId === b.id ? 0.5 : 1,
              }}>{removingId === b.id ? "…" : t("blocked_unblock")}</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// Trust & Safety Moderation System — self-service identity verification
// (migration 058, verification_requests). Revives the design drafted once
// around migration 024 and dropped before shipping. Scoped to the
// occupations that already exist as real profile roles.
const VERIFIABLE_OCCUPATIONS = ["Player", "Scout", "Agent", "Coach", "Physio"];
function VerificationRequest({ occupation }) {
  const { t } = useLang();
  const [uid, setUid] = useState(null);
  const [verified, setVerified] = useState(false);
  const [pending, setPending] = useState(false);
  const [proofUrl, setProofUrl] = useState("");
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(false);

  async function load() {
    if (!sb) return;
    try {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return;
      setUid(user.id);
      const [{ data: prof }, { data: reqs }] = await Promise.all([
        sb.from("profiles").select("identity_verified").eq("id", user.id).single(),
        sb.from("verification_requests").select("status").eq("user_id", user.id).order("created_at", { ascending: false }).limit(1),
      ]);
      setVerified(!!(prof && prof.identity_verified));
      setPending(!!(reqs && reqs[0] && reqs[0].status === "pending"));
    } catch (e) { console.error("GOLSZ verification load error:", e); }
  }
  useEffect(() => { load(); }, []);

  async function submit() {
    if (!sb || !uid || busy) return;
    setBusy(true);
    try {
      await sb.from("verification_requests").insert({ user_id: uid, occupation, proof_url: proofUrl.trim() || null });
      setDone(true); setPending(true);
    } catch (e) { console.error("GOLSZ verification submit error:", e); }
    setBusy(false);
  }

  if (!sb || !occupation || !VERIFIABLE_OCCUPATIONS.includes(occupation) || verified) return null;

  return (
    <div style={{ ...card, marginBottom: 8 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <BadgeCheck size={16} color={C.slate} />
        <span style={{ fontSize: 13.5, fontWeight: 800, color: C.chalk }}>{t("verify_title")}</span>
      </div>
      {pending ? (
        <div style={{ fontSize: 12.5, color: C.slate }}>{t("verify_pending")}</div>
      ) : done ? (
        <div style={{ fontSize: 12.5, color: C.lime }}>{t("verify_submitted")}</div>
      ) : (
        <React.Fragment>
          <div style={{ fontSize: 12.5, color: C.slate, marginBottom: 10, lineHeight: 1.5 }}>{t("verify_desc")}</div>
          <input value={proofUrl} onChange={(e) => setProofUrl(e.target.value)} placeholder={t("verify_proof_placeholder")}
            style={{ width: "100%", background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 10, color: C.chalk, padding: "10px 12px", fontSize: 13, fontFamily: "inherit", boxSizing: "border-box", marginBottom: 10 }} />
          <button onClick={submit} disabled={busy} style={{
            width: "100%", background: "transparent", color: C.lime, border: `1px solid ${C.limeBorder}`, borderRadius: 10,
            padding: "10px 14px", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", opacity: busy ? 0.6 : 1,
          }}>{t("verify_submit")}</button>
        </React.Fragment>
      )}
    </div>
  );
}

/* Dependency-free vertical bar sparkline — this codebase deliberately
   has no charting library (no build step, fixed CDN scripts only), so
   this is plain divs sized by percentage of the max value, same
   hand-rolled-UI spirit as the svg() icon helper above. */
function Bars({ data, color }) {

/* Average hours per active user over a window — minutes/60 divided by
   how many distinct users actually had any activity in that window (not
   total signups), so someone who never opened the app doesn't drag the
   number toward zero. See migration 031 / admin_analytics_counts(). */
function avgHours(counts, minutesKey, usersKey) {
  if (!counts) return 0;
  const users = counts[usersKey] || 0;
  if (!users) return 0;
  return Math.round(((counts[minutesKey] || 0) / 60 / users) * 10) / 10;
}

/* ============ ADMIN PANEL ============
   Gated entirely by server-side RLS (is_admin(), migration 009) — every
   query and mutation here only succeeds if the signed-in user's own
   profiles.is_admin is true, regardless of how this component is reached.
   The UI check below (authorized state) is just for a clean "not
   authorized" message instead of a wall of empty/failed queries. */
function AdminPanel({ onBack }) {
  const { t } = useLang();
  const [authorized, setAuthorized] = useState(null);
  const [myUid, setMyUid] = useState(null);
  // Reports and the AI auto-moderation queue are both "content needing
  // review," and the audit log + error log are both low-frequency ops/
  // developer visibility — grouping each pair under one top-level tab
  // (same sub-nav pattern Analytics already uses below) took the top bar
  // from 6 tabs down to 4, which is what actually made it hard to
  // navigate: a 4-wide bar fits without horizontal scrolling, a 6-wide one
  // didn't and was easy to mis-tap or scroll past.
  const [tab, setTab] = useState("moderation");
  const [moderationView, setModerationView] = useState("reports"); // "reports" | "queue"
  const [systemView, setSystemView] = useState("audit"); // "audit" | "errors"
  const [stats, setStats] = useState(null);
  const [reports, setReports] = useState(null);
  const [users, setUsers] = useState(null);
  const [userQuery, setUserQuery] = useState("");
  const [events, setEvents] = useState(null);
  const [evTitle, setEvTitle] = useState(""); const [evSport, setEvSport] = useState("Soccer");
  const [evLoc, setEvLoc] = useState(""); const [evLevel, setEvLevel] = useState("");
  const [evDate, setEvDate] = useState(""); const [evSpots, setEvSpots] = useState("");
  const [analytics, setAnalytics] = useState(null);
  const [analyticsView, setAnalyticsView] = useState("overview"); // "overview" | "community" | "scoutai" — sub-nav within the Analytics tab, see below
  const [showEventsManager, setShowEventsManager] = useState(false);
  const [auditLog, setAuditLog] = useState(null);
  const [moderationQueue, setModerationQueue] = useState(null);
  const [verificationRequests, setVerificationRequests] = useState(null);
  const [appeals, setAppeals] = useState(null);
  const [errorLog, setErrorLog] = useState(null);
  const [faqMisses, setFaqMisses] = useState(null);
  const [expandedActivityId, setExpandedActivityId] = useState(null);
  const [userActivity, setUserActivity] = useState({}); // userId -> { perDay: [{label, value}], today, week, month }

  async function loadStats() {
    try {
      const [{ count: userCount }, { count: postCount }, { count: eventCount }, { count: pendingReports }] = await Promise.all([
        sb.from("profiles").select("id", { count: "exact", head: true }),
        sb.from("posts").select("id", { count: "exact", head: true }),
        sb.from("events").select("id", { count: "exact", head: true }),
        sb.from("post_reports").select("id", { count: "exact", head: true }).is("resolved_at", null),
      ]);
      setStats({ userCount: userCount || 0, postCount: postCount || 0, eventCount: eventCount || 0, pendingReports: pendingReports || 0 });
    } catch (e) { console.error("GOLSZ admin stats error:", e); }
  }

  async function loadReports() {
    try {
      const { data, error } = await sb.from("post_reports").select("id, post_id, reporter_id, reason, created_at, resolved_at").order("created_at", { ascending: false }).limit(100);
      if (error) throw error;
      const postIds = [...new Set((data || []).map((r) => r.post_id))];
      const { data: posts } = postIds.length ? await sb.from("posts").select("id, author_id, headline, body").in("id", postIds) : { data: [] };
      const postById = Object.fromEntries((posts || []).map((p) => [p.id, p]));
      const peopleIds = [...new Set([...(data || []).map((r) => r.reporter_id), ...(posts || []).map((p) => p.author_id)])];
      const { data: names } = peopleIds.length ? await sb.from("public_profile_names").select("id, full_name").in("id", peopleIds) : { data: [] };
      const nameById = Object.fromEntries((names || []).map((n) => [n.id, n.full_name]));
      setReports((data || []).map((r) => {
        const post = postById[r.post_id];
        return { ...r, post, reporterName: nameById[r.reporter_id] || "Unknown", authorName: post ? (nameById[post.author_id] || "Unknown") : "(post deleted)" };
      }));
    } catch (e) { console.error("GOLSZ admin reports error:", e); setReports([]); }
  }
  // Fire-and-forget — logging failing silently shouldn't block the admin
  // action itself from succeeding. See migration 030: this RPC always
  // stamps admin_id as the real caller (auth.uid()), never whatever the
  // client passes, so the log stays trustworthy even from a compromised
  // admin session.
  function logAdmin(action, targetId, detail) {
    sb.rpc("log_admin_action", { p_action: action, p_target_id: targetId || null, p_detail: detail || null })
      .then(({ error }) => { if (error) console.error("GOLSZ admin audit log error:", error); });

  // daily_activity_admin_read (migration 032) lets admins read this table
  // directly — unlike messages/scout_history, a row here is just "N
  // minutes active on this date," no more sensitive than the plan/ban/
  // joined-date fields already shown per user above. Fetched on demand
  // (per user, on expand) rather than for the whole list, so opening the
  // Users tab with 100 rows doesn't fire 100 activity queries.
  async function toggleUserActivity(userId) {
    if (expandedActivityId === userId) { setExpandedActivityId(null); return; }
    setExpandedActivityId(userId);
    if (userActivity[userId]) return; // already loaded
    try {
      // Fetch a real 30-day window so "month" below is an actual 30-day
      // sum, not just whatever the sparkline happens to show — the
      // sparkline only renders the most recent 14 of those 30 days.
      const since = new Date(); since.setDate(since.getDate() - 29);
      const sinceIso = since.toISOString().slice(0, 10);
      const { data, error } = await sb.from("daily_activity").select("activity_date, minutes").eq("user_id", userId).gte("activity_date", sinceIso).order("activity_date", { ascending: true });
      if (error) throw error;
      const byDate = new Map((data || []).map((r) => [r.activity_date, r.minutes]));
      const last30Days = Array.from({ length: 30 }, (_, i) => {
        const d = new Date(); d.setDate(d.getDate() - (29 - i));
        return d.toISOString().slice(0, 10);
      });
      const last14Days = last30Days.slice(16);
      const perDay = last14Days.map((d) => ({ label: d.slice(5), value: Math.round(((byDate.get(d) || 0) / 60) * 10) / 10 }));
      const todayIso = last30Days[29];
      const weekAgoIso = last30Days[23]; // last30Days[23..29] = trailing 7 days incl. today
      const todayMin = byDate.get(todayIso) || 0;
      let weekMin = 0, monthMin = 0;
      last30Days.forEach((d) => { const m = byDate.get(d) || 0; monthMin += m; if (d >= weekAgoIso) weekMin += m; });
      setUserActivity((prev) => ({ ...prev, [userId]: {
        perDay,
        today: Math.round((todayMin / 60) * 10) / 10,
        week: Math.round((weekMin / 60) * 10) / 10,
        month: Math.round((monthMin / 60) * 10) / 10,
      } }));
    } catch (e) { console.error("GOLSZ admin user activity error:", e); setUserActivity((prev) => ({ ...prev, [userId]: false })); }
  }
