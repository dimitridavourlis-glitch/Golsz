  // Everything here is either already admin-readable directly
  // (profiles/posts/follows all have an admin-or-public select policy)
  // or comes from admin_analytics_counts() (migration 028) — a
  // security-definer RPC that returns only pre-aggregated numbers for
  // messages/scout_history, since those hold real private content and
  // are never exposed row-by-row to an admin. Aggregation happens here
  // in JS against a capped row set, which is fine at today's scale but
  // would need real SQL aggregation if the user base grows a lot.
  async function loadAnalytics() {
    try {
      // posts/follows are no longer fetched here — Feed/Follow are
      // launch-scoped off the nav (see NAV in GolszApp), so the cards that
      // used to read them (Top Followed, the posts-per-day chart,
      // totalFollows) were permanently stuck at 0 and just added clutter +
      // two unused queries every load. See task from the admin-panel
      // revamp pass — removed along with those cards, not just hidden,
      // since there's no plausible future where this specific query comes
      // back without the cards themselves coming back first.
      const [{ data: profRows }, { data: athleteRows }, { data: counts, error: countsErr }, { data: modelMix }, { data: costSummary }, { data: cacheStats }, { data: marginSummary }, { data: moderationStats }] = await Promise.all([
        sb.from("profiles").select("plan, occupation, verified_tier, is_banned, is_minor, created_at").order("created_at", { ascending: false }).limit(2000),
        sb.from("athletes").select("sport, gender, country").limit(2000),
        sb.rpc("admin_analytics_counts"),
        // migration 039 — real counts of which model actually answered each
        // Scout question (haiku/sonnet/database), logged from api/scout.js
        // on every reply. `database` stays 0 until DB-first search (clubs/
        // coaches/opportunities) replaces some of Sonnet's tool-use calls.
        sb.rpc("admin_scout_model_mix"),
        // migration 040 — this calendar month's real Scout AI spend,
        // estimated from Anthropic's own per-reply usage numbers (not a
        // bill — Anthropic's invoice is the source of truth, but this
        // tracks closely since it's the same real token counts).
        sb.rpc("admin_scout_cost_summary"),
        // migration 056 — Multi-Model Cost-Control System's dashboard
        // extensions: cache hit rate, and cost-as-%-of-revenue per plan
        // (the warning thresholds from the approved plan: Basic/Pro
        // <10%, Elite <15% of that plan's monthly revenue).
        sb.rpc("admin_scout_cache_stats"),
        sb.rpc("admin_scout_margin_summary"),
        // Trust & Safety Moderation System (migration 064) — moderation-
        // specific stats, folded into this same existing dashboard rather
        // than a new one.
        sb.rpc("admin_moderation_stats"),
      ]);
      if (countsErr) throw countsErr;

      const dayKey = (iso) => iso.slice(0, 10);
      const last14Days = Array.from({ length: 14 }, (_, i) => {
        const d = new Date(); d.setDate(d.getDate() - (13 - i));
        return d.toISOString().slice(0, 10);
      });
      const bucketByDay = (rows) => {
        const map = new Map(last14Days.map((d) => [d, 0]));
        (rows || []).forEach((r) => { const k = dayKey(r.created_at); if (map.has(k)) map.set(k, map.get(k) + 1); });
        return last14Days.map((d) => ({ label: d.slice(5), value: map.get(d) }));
      };

      const profiles = profRows || [];
      const today = new Date().toISOString().slice(0, 10);
      const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
      const signupsToday = profiles.filter((p) => dayKey(p.created_at) === today).length;
      const signupsWeek = profiles.filter((p) => dayKey(p.created_at) >= weekAgo).length;

      const planCounts = { free: 0, starter: 0, pro: 0, elite: 0 };
      const occCounts = { Player: 0, Scout: 0, Agent: 0, Coach: 0, Physio: 0, Other: 0 };
      const tierCounts = { none: 0, pro: 0, elite: 0 };
      let bannedCount = 0;
      profiles.forEach((p) => {
        if (planCounts[p.plan] !== undefined) planCounts[p.plan]++;
        const occ = p.occupation || "Player";
        if (occCounts[occ] !== undefined) occCounts[occ]++;
        const tier = p.verified_tier || "none";
        if (tierCounts[tier] !== undefined) tierCounts[tier]++;
        if (p.is_banned) bannedCount++;
      });


      // Sport/gender/country all live on `athletes`, not `profiles` — set
      // by anyone who's filled in their Passport, any occupation, not
      // just Player (see ProfileEditor). `country` is free text (a
      // datalist suggests values, doesn't restrict), so unlike sport/
      // gender it's an open-ended tally, not a small fixed set — top 5
      // rather than every distinct value.
      const athletes = athleteRows || [];
      const notSetLabel = t("admin_not_set");
      const sportCounts = {};
      SPORTS.filter((s) => s !== "All").forEach((s) => { sportCounts[s] = 0; });
      let sportUnset = 0;
      const genderCounts = { Male: 0, Female: 0 };
      let genderUnset = 0;
      const countryTally = new Map();
      athletes.forEach((a) => {
        if (a.sport && sportCounts[a.sport] !== undefined) sportCounts[a.sport]++; else sportUnset++;
        if (a.gender === "M") genderCounts.Male++; else if (a.gender === "F") genderCounts.Female++; else genderUnset++;
        const country = (a.country || "").trim();
        if (country) countryTally.set(country, (countryTally.get(country) || 0) + 1);
      });
      const topCountries = [...countryTally.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5)
        .map(([country, count]) => ({ country, count }));

      setAnalytics({
        totalUsers: profiles.length,
        signupsToday, signupsWeek,
        bannedCount,
        // Basic is a paid tier, so it counts toward MRR too — this used to
        // only count pro/elite from when Basic (then "Starter") was a free
        // loss-leader. Reads the amounts straight out of PLANS rather than
        // repeating them: they were hardcoded as 6/14/30 and silently went
        // stale the moment pricing changed, under-reporting MRR by about
        // 60%. Denominated in EUR, matching PLANS above and PLAN_CATALOG in
        // api/_plan-catalog.js.
        mrrEstimate: Math.round(
          PLANS.reduce((sum, pl) => sum + pl.price * (planCounts[pl.id] || 0), 0) * 100,
        ) / 100,
        signupsPerDay: bucketByDay(profiles),
        planCounts, occCounts, tierCounts,
        // Real identity verification (migration 058) — distinct from
        // tierCounts above, which is verified_tier, a subscription badge
        // auto-set from plan (see protect_profile_columns()), not proof
        // anyone actually verified who they are. The Community tab's
        // "Verification mix" card reads this now, not tierCounts.
        identityVerifiedCount: (counts && counts.identity_verified_count) || 0,
        // Lifetime free AI budget funnel (migration 068/073) — the core
        // metric for "GOLSZ sells athlete progression, not AI questions":
        // how many free accounts exist, how much of their lifetime budget
        // they've used on average, and how many have hit the cap (the
        // moment the conversion screen becomes relevant to them). 40 is
        // FREE_LIFETIME_LIMIT's own server-side default — see this RPC's
        // own comment in supabase-schema.sql if that env var ever changes.
        freeAi: {
          usersTotal: (counts && counts.free_ai_users_total) || 0,
          avgUsed: (counts && counts.free_ai_avg_used) || 0,
          exhaustedCount: (counts && counts.free_ai_exhausted_count) || 0,
        },
        // Guided-onboarding conversion screen (migration 069) — how many
        // free accounts have been shown it, and of those, how many are no
        // longer on the free plan (a proxy for "converted after seeing
        // it," not a precise before/after since there's no shown_at
        // timestamp — see this RPC's own comment).
        conversion: {
          shownCount: (counts && counts.conversion_shown_count) || 0,
          nowPaidCount: (counts && counts.conversion_now_paid_count) || 0,
        },
        // Benchmarks (071) + Targets (072) — real usage of the two newest
        // BUILD/MOVE-phase features, previously invisible to admins.
        benchmarks: {
          total: (counts && counts.benchmarks_total) || 0,
          users: (counts && counts.benchmarks_users) || 0,
        },
        targets: {
          total: (counts && counts.targets_total) || 0,
          users: (counts && counts.targets_users) || 0,
          byStatus: (counts && counts.targets_by_status) || {},
        },
        // SQL approximation of computeProfileQuality() — see this RPC's
        // own comment in supabase-schema.sql for exactly which checks it
        // does/doesn't replicate.
        profileQualityAvg: (counts && counts.profile_quality_avg) || 0,
        totalAthletes: athletes.length,
        sportCounts, sportUnset, notSetLabel,
        genderCounts, genderUnset,
        topCountries,
        messagesTotal: (counts && counts.messages_total) || 0,
        messages7d: (counts && counts.messages_7d) || 0,
        scoutConversations: (counts && counts.scout_conversations_total) || 0,
        scoutUsers: (counts && counts.scout_users_total) || 0,
        pushSubscribers: (counts && counts.push_subscribers_total) || 0,
        modelMix: {
          total: (modelMix && modelMix.total) || 0,
          haiku: (modelMix && modelMix.haiku) || 0,
          sonnet: (modelMix && modelMix.sonnet) || 0,
          database: (modelMix && modelMix.database) || 0,
        },
        scoutMessagesMonth: (costSummary && costSummary.message_count_month) || 0,
        scoutCostMonth: (costSummary && costSummary.total_cost_month) || 0,
        scoutAvgCostPerMessage: (costSummary && costSummary.avg_cost_per_message_month) || 0,
        // Multi-Model Cost-Control System (migration 056) additions.
        scoutCacheAnswers: (cacheStats && cacheStats.cached_answers) || 0,
        scoutCacheHits: (cacheStats && cacheStats.total_hits) || 0,
        // Target thresholds from the approved plan: Basic/Pro AI cost
        // should stay under 10% of that plan's monthly revenue, Elite
        // under 15% — flagged in the UI, not enforced automatically.
        scoutMarginByPlan: (marginSummary || []).map((r) => ({
          plan: r.plan,
          subscribers: Number(r.subscriber_count) || 0,
          revenue: Number(r.monthly_revenue) || 0,
          cost: Number(r.ai_cost) || 0,
          costPct: Number(r.ai_cost_pct) || 0,
          overTarget: (r.plan === "elite" ? Number(r.ai_cost_pct) > 15 : (r.plan === "starter" || r.plan === "pro") && Number(r.ai_cost_pct) > 10),
        })),
        // Avg hours per active user, not per total signups — someone who
        // never opened the app in a given window shouldn't drag the
        // average toward zero and hide how engaged actual users are.
        avgHoursWeek: avgHours(counts, "activity_minutes_7d", "activity_users_7d"),
        avgHoursMonth: avgHours(counts, "activity_minutes_30d", "activity_users_30d"),
        avgHoursYear: avgHours(counts, "activity_minutes_365d", "activity_users_365d"),
        activeUsersWeek: (counts && counts.activity_users_7d) || 0,
        activeUsersMonth: (counts && counts.activity_users_30d) || 0,
        activeUsersYear: (counts && counts.activity_users_365d) || 0,
        moderation: {
          itemsToday: (moderationStats && moderationStats.moderation_items_today) || 0,
          blockedToday: (moderationStats && moderationStats.blocked_today) || 0,
          spamBlockedTotal: (moderationStats && moderationStats.spam_blocked_total) || 0,
          scamBlockedTotal: (moderationStats && moderationStats.scam_blocked_total) || 0,
          avgResolutionMinutes: (moderationStats && moderationStats.avg_resolution_minutes) || 0,
          appealsPending: (moderationStats && moderationStats.appeals_pending) || 0,
          appealsUpheld: (moderationStats && moderationStats.appeals_upheld) || 0,
          appealsOverturned: (moderationStats && moderationStats.appeals_overturned) || 0,
          verificationPending: (moderationStats && moderationStats.verification_pending) || 0,
          verificationApproved: (moderationStats && moderationStats.verification_approved) || 0,
          eventsFlaggedTotal: (moderationStats && moderationStats.events_flagged_total) || 0,
          trustScoreBuckets: (moderationStats && moderationStats.trust_score_buckets) || {},
        },
      });
    } catch (e) { console.error("GOLSZ admin analytics error:", e); setAnalytics(false); }
  }

  useEffect(() => {
    if (!sb) { setAuthorized(false); return; }
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { setAuthorized(false); return; }
        setMyUid(user.id);
        const { data: prof } = await sb.from("profiles").select("is_admin").eq("id", user.id).single();
        const ok = !!(prof && prof.is_admin);
        setAuthorized(ok);
        // loadReports()/loadEvents() are skipped here — their tabs
        // (Reports, Manage events) are launch-scoped off below, so
        // there's no UI these would populate right now.
        if (ok) { loadStats(); loadUsers(); loadAnalytics(); loadAuditLog(); loadModerationQueue(); loadVerificationRequests(); loadAppeals(); loadKnowledge(); loadErrorLog(); loadFaqMisses(); }
      } catch (e) { console.error("GOLSZ admin auth-check error:", e); setAuthorized(false); }
    })();
  }, []);

  const field = { background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 9, color: C.chalk, padding: "8px 10px", fontSize: 13, fontFamily: "inherit", outline: "none" };
  const tabBtn = (id, label) => (
    <button onClick={() => setTab(id)} style={{
      flex: 1, padding: "9px 0", borderRadius: 9, border: "none", cursor: "pointer", fontFamily: "inherit",
      fontSize: 12.5, fontWeight: 700, background: tab === id ? C.lime : "transparent", color: tab === id ? C.ink : C.slate,
    }}>{label}</button>
  );

  // Shared sub-nav row for a tab that groups a couple of related views
  // (Moderation: Reports/Auto Queue, System: Audit log/Errors, Analytics:
  // Overview/Community/Scout AI/Common Questions) — one visual pattern
  // instead of three copies of the same button row.
  const subNav = (items, current, setter) => (
    <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
      {items.map(([id, label]) => (
        <button key={id} onClick={() => setter(id)} style={{
          flex: 1, padding: "8px 0", borderRadius: 9, cursor: "pointer", fontFamily: "inherit",
          fontSize: 11.5, fontWeight: 700, border: `1px solid ${current === id ? C.lime : C.line2}`,
          background: current === id ? C.lime : "transparent", color: current === id ? C.ink : C.slate,
        }}>{label}</button>
      ))}
    </div>
  );

  if (authorized === null) return <div style={{ padding: 20, color: C.slate, fontSize: 13 }}>{t("admin_checking")}</div>;
  if (!authorized) return (
    <div style={{ padding: 20 }}>
      <div style={{ fontSize: 13, color: C.slate }}>{t("admin_only")}</div>
      <button onClick={onBack} style={{ ...iconBtn(C.lime), marginTop: 10 }}><ChevronLeft size={16} /> {t("back")}</button>
    </div>
  );

  return (
    <div style={{ padding: "8px 12px 20px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "4px 2px 12px" }}>
        <button onClick={onBack} style={iconBtn(C.chalk)}><ChevronLeft size={20} /></button>
        <SectionTitle noMargin>{t("admin_title")}</SectionTitle>
      </div>

      {stats && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginBottom: 14 }}>
          {[["users", t("admin_stat_users"), stats.userCount], ["verified", t("admin_stat_verified"), stats.verifiedCount], ["pendingVerification", t("admin_stat_pending_verification"), stats.pendingVerification], ["pendingAppeals", t("admin_stat_pending_appeals"), stats.pendingAppeals]].map(([id, label, v]) => (
            <div key={id} style={{ ...card, margin: 0, padding: "10px 8px", textAlign: "center" }}>
              <div style={{ fontSize: 18, fontWeight: 900, fontFamily: "'Space Mono', monospace", color: id.startsWith("pending") && v > 0 ? C.amber : C.lime }}>{v}</div>
              <div style={{ fontSize: 9, letterSpacing: "0.08em", color: C.slate, fontWeight: 700 }}>{label}</div>
            </div>
          ))}
        </div>
      )}

      {/* 4 tabs at flex:1 fit one row on a phone screen with no scrolling
          needed — the old 6-wide version needed overflowX scroll, which is
          exactly what made it easy to mis-tap or scroll past a tab. */}
      <div style={{ display: "flex", gap: 4, background: C.turf, borderRadius: 11, padding: 4, marginBottom: 14 }}>
        {tabBtn("moderation", t("admin_tab_moderation"))}
        {tabBtn("users", t("admin_tab_users"))}
        {tabBtn("analytics", t("admin_tab_analytics"))}
        {tabBtn("system", t("admin_tab_system"))}
      </div>

      {tab === "moderation" && (
        <div>
          {/* Reports (post_reports, Feed-specific) is launch-scoped off —
              its own code below is untouched, just not reachable from
              this sub-nav for now. */}
          {subNav([
            ["queue", t("admin_view_auto_queue")],
            ["verification", t("admin_view_verification")],
            ["appeals", t("admin_view_appeals")],
            ["knowledge", t("admin_view_knowledge")],
          ], moderationView, setModerationView)}

          {moderationView === "reports" && (
            <div>
              {reports === null && <div style={{ color: C.slate, fontSize: 13 }}>{t("loading")}</div>}
              {reports && reports.length === 0 && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "20px 0" }}>{t("admin_no_reports")}</div>}
              {reports && reports.map((r) => (
                <div key={r.id} style={{ ...card, opacity: r.resolved_at ? 0.5 : 1 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10.5, color: C.slate, marginBottom: 6 }}>
                    <span>{t("admin_reported_by")}{r.reporterName}{r.reason ? ` — "${r.reason}"` : ""}</span>
                    <span>{timeAgo(r.created_at)}</span>
                  </div>
                  {r.post ? (
                    <div style={{ fontSize: 13, marginBottom: 8 }}>
                      <b>{r.authorName}:</b> {r.post.headline}{r.post.body ? ` — ${r.post.body}` : ""}
                    </div>
                  ) : <div style={{ fontSize: 13, color: C.slate, marginBottom: 8, fontStyle: "italic" }}>{t("admin_post_removed")}</div>}
                  {!r.resolved_at ? (
                    <div style={{ display: "flex", gap: 8 }}>
                      {r.post && (
                        <button onClick={() => deleteReportedPost(r.post_id, r.id)} style={{ ...iconBtn(C.amber), fontSize: 11.5 }}><Trash2 size={13} /> {t("admin_delete_post")}</button>
                      )}
                      <button onClick={() => resolveReport(r.id)} style={{ ...iconBtn(C.slate), fontSize: 11.5 }}>{t("admin_dismiss")}</button>
                    </div>
                  ) : <div style={{ fontSize: 10.5, color: C.lime }}>{t("admin_resolved")}</div>}
                </div>
              ))}
            </div>
          )}

          {moderationView === "queue" && (
            <div>
              {moderationQueue === null && <div style={{ color: C.slate, fontSize: 13 }}>{t("loading")}</div>}
              {moderationQueue && moderationQueue.length === 0 && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "20px 0" }}>{t("admin_no_moderation_items")}</div>}
              {moderationQueue && moderationQueue.map((m) => {
                const isBlock = m.decision === "block";
                const dColor = isBlock ? C.amber : C.lime;
                const dBorder = isBlock ? C.amberBorder : C.limeBorder;
                return (
                  <div key={m.id} style={{ ...card, opacity: m.resolved_at ? 0.5 : 1 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 10.5, color: C.slate, marginBottom: 6, flexWrap: "wrap", gap: 6 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                        <span style={{ fontSize: 9.5, fontWeight: 800, letterSpacing: "0.06em", color: dColor, border: `1px solid ${dBorder}`, borderRadius: 999, padding: "2px 8px" }}>{m.decision.toUpperCase()}</span>
                        {m.minor_safety_triggered && <span style={{ fontSize: 9.5, fontWeight: 800, letterSpacing: "0.06em", color: C.amber, border: `1px solid ${C.amberBorder}`, borderRadius: 999, padding: "2px 8px" }}>{t("admin_minor_safety")}</span>}
                        <span>{m.authorName} · {m.content_type}</span>
                      </div>
                      <span>{timeAgo(m.created_at)}</span>
                    </div>
                    {m.text && <div style={{ fontSize: 13, marginBottom: 6, whiteSpace: "pre-wrap" }}>{m.text}</div>}
                    <div style={{ fontSize: 11, color: C.slate, marginBottom: m.resolved_at ? 0 : 8 }}>
                      <b>{m.primary_reason_code}</b>{m.rationale ? ` — ${m.rationale}` : ""} · {t("admin_confidence")} {Math.round((m.confidence || 0) * 100)}%
                    </div>
                    {!m.resolved_at && (
                      <button onClick={() => resolveModerationItem(m.id)} style={{ ...iconBtn(C.slate), fontSize: 11.5 }}>{t("admin_dismiss")}</button>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {moderationView === "verification" && (
            <div>
              {verificationRequests === null && <div style={{ color: C.slate, fontSize: 13 }}>{t("loading")}</div>}
              {verificationRequests && verificationRequests.length === 0 && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "20px 0" }}>{t("admin_no_verification_requests")}</div>}
              {verificationRequests && verificationRequests.map((v) => {
                const isPending = v.status === "pending";
                const dColor = v.status === "approved" ? C.lime : v.status === "denied" ? C.amber : C.slate;
                const dBorder = v.status === "approved" ? C.limeBorder : v.status === "denied" ? C.amberBorder : C.line2;
                return (
                  <div key={v.id} style={{ ...card, opacity: isPending ? 1 : 0.6 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 10.5, color: C.slate, marginBottom: 6, flexWrap: "wrap", gap: 6 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                        <span style={{ fontSize: 9.5, fontWeight: 800, letterSpacing: "0.06em", color: dColor, border: `1px solid ${dBorder}`, borderRadius: 999, padding: "2px 8px" }}>{v.status.toUpperCase()}</span>
                        <span>{v.userName} · {v.occupation}</span>
                      </div>
                      <span>{timeAgo(v.created_at)}</span>
                    </div>
                    {v.proof_url && <div style={{ fontSize: 12.5, marginBottom: 8, wordBreak: "break-all" }}><a href={safeHref(v.proof_url)} target="_blank" rel="noopener noreferrer" style={{ color: C.lime }}>{v.proof_url}</a></div>}
                    {isPending && (
                      <div style={{ display: "flex", gap: 8 }}>
                        <button onClick={() => reviewVerification(v.id, true)} style={{ ...iconBtn(C.lime), fontSize: 11.5 }}>{t("admin_approve")}</button>
                        <button onClick={() => reviewVerification(v.id, false)} style={{ ...iconBtn(C.amber), fontSize: 11.5 }}>{t("admin_deny")}</button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {moderationView === "appeals" && (
            <div>
              {appeals === null && <div style={{ color: C.slate, fontSize: 13 }}>{t("loading")}</div>}
              {appeals && appeals.length === 0 && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "20px 0" }}>{t("admin_no_appeals")}</div>}
              {appeals && appeals.map((a) => {
                const isPending = a.status === "pending";
                const dColor = a.status === "overturned" ? C.lime : a.status === "upheld" ? C.amber : C.slate;
                const dBorder = a.status === "overturned" ? C.limeBorder : a.status === "upheld" ? C.amberBorder : C.line2;
                return (
                  <div key={a.id} style={{ ...card, opacity: isPending ? 1 : 0.6 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 10.5, color: C.slate, marginBottom: 6, flexWrap: "wrap", gap: 6 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                        <span style={{ fontSize: 9.5, fontWeight: 800, letterSpacing: "0.06em", color: dColor, border: `1px solid ${dBorder}`, borderRadius: 999, padding: "2px 8px" }}>{a.status.toUpperCase()}</span>
                        {a.ban_related && <span style={{ fontSize: 9.5, fontWeight: 800, letterSpacing: "0.06em", color: C.amber, border: `1px solid ${C.amberBorder}`, borderRadius: 999, padding: "2px 8px" }}>{t("admin_ban_related")}</span>}
                        <span>{a.userName}</span>
                      </div>
                      <span>{timeAgo(a.created_at)}</span>
                    </div>
                    <div style={{ fontSize: 13, marginBottom: isPending ? 8 : 0, whiteSpace: "pre-wrap" }}>{a.reason}</div>
                    {isPending && (
                      <div style={{ display: "flex", gap: 8 }}>
                        <button onClick={() => reviewAppeal(a.id, true)} style={{ ...iconBtn(C.lime), fontSize: 11.5 }}>{t("admin_overturn")}</button>
                        <button onClick={() => reviewAppeal(a.id, false)} style={{ ...iconBtn(C.amber), fontSize: 11.5 }}>{t("admin_uphold")}</button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {/* P1-9. Scout's own research findings, awaiting a human decision.
              Nothing is promoted automatically: a candidate is invisible to
              every athlete and to Scout itself until an admin reads it,
              checks the source, and approves. Rejected rows are kept, not
              deleted — knowing what was refused is worth more than the row
              costs. */}
          {moderationView === "knowledge" && (
            <div>
              {knowledge === null && <div style={{ color: C.slate, fontSize: 13 }}>{t("loading")}</div>}
              {knowledge && knowledge.length === 0 && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "20px 0" }}>{t("admin_no_knowledge")}</div>}
              {knowledge && knowledge.map((k) => (
                <div key={k.id} style={{ ...card }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 10.5, color: C.slate, marginBottom: 6, flexWrap: "wrap", gap: 6 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                      <span style={{ fontSize: 9.5, fontWeight: 800, letterSpacing: "0.06em", color: C.amber, border: `1px solid ${C.amberBorder}`, borderRadius: 999, padding: "2px 8px" }}>{String(k.verification_status).toUpperCase()}</span>
                      <span style={{ fontSize: 9.5, fontWeight: 800, letterSpacing: "0.06em", color: C.slate, border: `1px solid ${C.line2}`, borderRadius: 999, padding: "2px 8px" }}>{k.category}</span>
                      {k.sport && <span>{k.sport}</span>}
                      {k.country && <span>· {k.country}</span>}
                    </div>
                    <span>{timeAgo(k.discovered_at)}</span>
                  </div>
                  <div style={{ fontSize: 13, fontWeight: 800, color: C.chalk, marginBottom: 4 }}>{k.subject}</div>
                  <div style={{ fontSize: 12.5, whiteSpace: "pre-wrap", lineHeight: 1.5, marginBottom: 8 }}>{k.content}</div>
                  {/* Provenance is the whole basis for the decision — an
                      admin cannot responsibly approve a claim they can't
                      check, so the source is shown, not summarized. */}
                  <div style={{ fontSize: 11, color: C.slate, marginBottom: 8, wordBreak: "break-all" }}>
                    {t("admin_knowledge_source")}: {k.source_url
                      ? <a href={k.source_url} target="_blank" rel="noopener noreferrer" style={{ color: C.info }}>{k.source_url}</a>
                      : t("admin_knowledge_no_source")}
                    {" · "}{t("admin_knowledge_confidence")} {Math.round((Number(k.confidence) || 0) * 100)}%
                    {k.recheck_after && <> · {t("admin_knowledge_recheck")} {new Date(k.recheck_after).toLocaleDateString()}</>}
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => reviewKnowledge(k.id, true)} disabled={!k.source_url} title={!k.source_url ? t("admin_knowledge_no_source") : undefined} style={{ ...iconBtn(k.source_url ? C.lime : C.slate), fontSize: 11.5, opacity: k.source_url ? 1 : 0.5 }}>{t("admin_knowledge_approve")}</button>
                    <button onClick={() => reviewKnowledge(k.id, false)} style={{ ...iconBtn(C.amber), fontSize: 11.5 }}>{t("admin_knowledge_reject")}</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {tab === "users" && (
        <div>
          <input value={userQuery} onChange={(e) => setUserQuery(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") loadUsers(userQuery); }}
            placeholder={t("admin_search_name")} style={{ ...field, width: "100%", boxSizing: "border-box", marginBottom: 10 }} />
          {users === null && <div style={{ color: C.slate, fontSize: 13 }}>{t("loading")}</div>}
          {users && users.map((u) => (
            <div key={u.id} style={{ ...card, display: "flex", flexWrap: "wrap", alignItems: "center", gap: 10, opacity: u.is_banned ? 0.6 : 1 }}>
              <div style={{ flex: 1, minWidth: 140 }}>
                <div style={{ fontWeight: 700, fontSize: 13.5, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                  {u.full_name || t("admin_no_name")}
                  {u.is_minor && <span style={{ fontSize: 9, color: C.amber, border: `1px solid ${C.amberBorder}`, borderRadius: 5, padding: "1px 5px" }}>{t("admin_minor")}</span>}
                  {u.is_admin && <span style={{ fontSize: 9, color: C.lime, border: `1px solid ${C.limeBorder}`, borderRadius: 5, padding: "1px 5px" }}>{t("admin_admin")}</span>}
                  {u.is_banned && <span style={{ fontSize: 9, color: C.amber, border: `1px solid ${C.amberBorder}`, borderRadius: 5, padding: "1px 5px" }}>{t("admin_banned")}</span>}
                  {u.ai_unlimited && <span style={{ fontSize: 9, color: C.elite, border: `1px solid ${C.eliteBorder}`, borderRadius: 5, padding: "1px 5px" }}>{t("admin_ai_unlimited_badge")}</span>}
                  {u.occupation && u.occupation !== "Player" && (
                    <span style={{
                      fontSize: 9,
                      color: u.verified_tier === "elite" ? C.elite : u.verified_tier === "pro" ? C.lime : C.amber,
                      border: `1px solid ${u.verified_tier === "elite" ? C.eliteBorder : u.verified_tier === "pro" ? C.limeBorder : C.amberBorder}`,
                      borderRadius: 5, padding: "1px 5px",
                    }}>
                      {u.occupation.toUpperCase()}
                      {u.verified_tier === "elite" ? ` · ${t("admin_tier_elite")}` : u.verified_tier === "pro" ? "" : ` · ${t("admin_unverified")}`}
                    </span>
                  )}
                  {(!u.occupation || u.occupation === "Player") && u.verified_tier && u.verified_tier !== "none" && (
                    <span style={{
                      fontSize: 9, display: "inline-flex", alignItems: "center", gap: 3,
                      color: u.verified_tier === "elite" ? C.elite : C.lime,
                      border: `1px solid ${u.verified_tier === "elite" ? C.eliteBorder : C.limeBorder}`,
                      borderRadius: 5, padding: "1px 5px",
                    }}>
                      <BadgeCheck size={10} /> {u.verified_tier === "elite" ? t("admin_tier_elite") : t("admin_tier_pro")}
                    </span>
                  )}
                </div>
                <div style={{ fontSize: 10.5, color: C.slate, fontFamily: "'Space Mono', monospace" }}>{t("admin_joined")}{timeAgo(u.created_at)}{t("admin_ago")}</div>
              </div>
              {/* Only the two controls actually changed often (plan, verified
                  tier) stay on the default row. Make/revoke admin, ban, and
                  delete are rarer and more consequential — they used to sit
                  in the same row as everything else, which made this the
                  single busiest, easiest-to-mis-tap row in the whole panel.
                  They now live behind the same expand toggle activity
                  already used, so the row's default state is calm and the
                  serious actions take one deliberate extra tap to reach. */}
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, justifyContent: "flex-end" }}>
                <select value={u.plan} onChange={(e) => setUserPlan(u.id, e.target.value)} style={{ ...field, padding: "5px 7px", fontSize: 11.5 }}>
                  <option value="free">free</option><option value="starter">basic</option><option value="pro">pro</option><option value="elite">elite</option>
                </select>
                <div style={{ display: "flex", gap: 4 }}>
                  {["none", "pro", "elite"].map((tier) => {
                    const active = (u.verified_tier || "none") === tier;
                    const tierColor = tier === "elite" ? C.elite : tier === "pro" ? C.lime : C.slate;
                    const tierBg = tier === "elite" ? "#415A771a" : tier === "pro" ? "#D4AF371a" : "transparent";

/* ============ AI SCOUT (live agent) ============ */

const CHIP_ICONS = [Compass, Radar, MessageSquare, CalendarDays];
function chipsFor(t, isPlayer) {
  return isPlayer
    ? [t("scout_chip1"), t("scout_chip2"), t("scout_chip3"), t("scout_chip4")]
    : [t("scout_np_chip1"), t("scout_np_chip2"), t("scout_np_chip3"), t("scout_np_chip4")];
}

function scoutGreetingFor(seeded, t) {
  const isPlayerSeed = !seeded.occupation || seeded.occupation === "Player";
  if (!isPlayerSeed) {
    const first = seeded.name ? seeded.name.split(" ")[0] : null;
    const hello = first ? `${t("scout_hey")} ${first} — ` : `${t("scout_hey")} — `;
    const who = [seeded.occupation, seeded.sport].filter(Boolean).join(" · ");
    const context = who
      ? `${t("scout_got_you_down_pre")}${who}${seeded.club ? `${t("scout_at")}${seeded.club}` : ""}. `
      : "";
    return `${hello}${t("scout_im_your_scout")} ${context}\n\n${t("scout_np_whats_plan")}`;
  }
  const who = [seeded.sport, seeded.position].filter(Boolean).join(" · ");
  if (!who && !seeded.name) return t("scout_greeting");
  const first = seeded.name ? seeded.name.split(" ")[0] : null;
  const hello = first ? `${t("scout_hey")} ${first} — ` : `${t("scout_hey")} — `;
  const context = who
    ? `${t("scout_got_you_down_pre")}${who}${seeded.club ? `${t("scout_at")}${seeded.club}` : ""}${seeded.grad_year ? `${t("scout_class_of")}${seeded.grad_year}` : ""}. `
    : "";
  return `${hello}${t("scout_im_your_scout")} ${context}\n\n${t("scout_whats_plan")}`;
}
function newScoutConvId() {
  return (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
}


function Scout({ onGoToProfile, plan, onUpgrade, actingFor }) {
  const { t, lang } = useLang();
  const [msgs, setMsgs] = useState(sb ? null : [{ role: "assistant", text: t("scout_greeting") }]);
  const [loaded, setLoaded] = useState(!sb); // no backend at all -> nothing to wait for, show demo greeting immediately
  const [profile, setProfile] = useState({});
  // Flattened {field: value} view of athletes.scout_context (migration 050,
  // Phase 2a) — the "softer" qualification facts (goal, gap, urgency, etc.)
  // Scout has picked up, as opposed to `profile`'s hard Passport facts.
  const [scoutContext, setScoutContext] = useState({});
  // The athlete's CURRENT Pathway, held here only so a proposed rebuild can
  // be previewed against it. addSuggestedPathway() upserts milestones as a
  // straight REPLACE, so an athlete with six milestones and three ticked off
  // loses all of it in one tap. Showing the incoming Pathway alone does not
  // prevent that; showing what is being destroyed does.
  const [currentPathway, setCurrentPathway] = useState(null);
  // Latest value per metric from athlete_benchmarks (migration 071) — a
  // compact summary (not the full retest history) so the development/
  // nutrition specialist can reference real recorded numbers ("your
  // 40-yard dash is 4.5s") instead of generic advice. Loaded once on
  // mount alongside profile/scout_context; never refreshed mid-
  // conversation since Scout itself doesn't write to this table.
  const [benchmarkSummary, setBenchmarkSummary] = useState({});
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  // Separate from `busy`: `busy` drives the in-chat "thinking" bubble, which
  // should only appear once the user's own message bubble is already in
  // `msgs` (right after moderation passes) — not before, or the thinking
  // bubble visibly renders ahead of the question that triggered it. `pending`
  // exists purely to disable the send button/input the instant a send starts,
  // independent of when the chat log itself updates. See send()'s comments.
  const [pending, setPending] = useState(false);
  const [conversationId, setConversationId] = useState(() => newScoutConvId());
  // Running summary of this conversation so far (migration 049, Phase 2b of
  // the AI Scout architecture plan) — lets send() bound how much history it
  // resends instead of the whole ever-growing transcript. Server-maintained
  // (classifyIntent() in api/scout.js updates it every turn); this is just
  // where the client holds the latest value between turns.
  const [summary, setSummary] = useState("");
  // { remaining, limit } from the Multi-Model Cost-Control System's
  // scout_usage response field (api/scout.js) — null until the first real
  // reply/limit-reached response arrives, or forever null for an admin/
  // unlimited account (server omits scout_usage in that case).
  const [scoutUsage, setScoutUsage] = useState(null);
  const [showHistory, setShowHistory] = useState(false);
  const [history, setHistory] = useState(null);
  const [photo, setPhoto] = useState(null); // { dataUrl, mediaType, data } — one pending attachment
  const [photoErr, setPhotoErr] = useState("");
  const [modErr, setModErr] = useState("");
  const uidRef = useRef(null);
  const endRef = useRef(null);
  const fileRef = useRef(null);
  const baseProfileRef = useRef({});
  const sendingRef = useRef(false);
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs, busy]);

  // Seed Scout's working profile from the athlete's real Passport data (so
  // it already knows who it's helping instead of re-asking basics the
  // athlete already filled in), then restore their most recent Scout
  // conversation, if any. Real scout_history is (id, user_id,
  // conversation_id, messages jsonb, created_at) — each transcript row's
  // `messages` is a one-element [{role,content}] array; metering rows
  // (written server-side by increment_scout_usage) are `[]` and flatten to
  // nothing here, so no separate filtering is needed. Only the latest
  // conversation is loaded on mount — older ones are reachable via
  // History, not auto-flattened into one ever-growing chat like before.
  useEffect(() => {
    if (!sb) return;
    // Clear first. Without this, switching between two managed athletes left
    // the previous child's transcript on screen until the fetch returned —
    // and a parent reading one child's conversation under the other child's
    // name is exactly the confusion the Managing banner exists to prevent.
    setMsgs(null);
    setLoaded(false);
    setSummary("");
    setBenchmarkSummary({});
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { setMsgs([{ role: "assistant", text: t("scout_greeting") }]); return; }
        // P0-4. When a parent is managing an under-16 athlete, the whole
        // conversation is about the CHILD: their Passport seeds the greeting,
        // their benchmarks go in the prompt, their scout_history is what gets
        // written, and their daily allowance is what is spent. RLS and
        // api/_acting-for.js each verify the link independently — this only
        // decides which rows the client asks for.
        const who = actingFor ? actingFor.id : user.id;
        uidRef.current = who;

        const [{ data: prof }, { data: ath }, { data: benchmarks }, { data: pathwayNow }] = await Promise.all([
          sb.from("profiles").select("full_name, dob, occupation").eq("id", who).single(),
          sb.from("athletes").select("sport, position, grad_year, gpa, country, club_name, recruiting_status, license, looking_for_players, education_level, scout_context").eq("id", who).single(),
          sb.from("athlete_benchmarks").select("metric, value, unit, recorded_date").eq("user_id", who).order("recorded_date", { ascending: false }),
          sb.from("pathway_plan").select("pathway_type, target_timeline, milestones").eq("user_id", who).maybeSingle(),
        ]);
        setCurrentPathway(pathwayNow || null);
        if (Array.isArray(benchmarks) && benchmarks.length) {
          // First row per metric (already newest-first) wins — latest
          // reading only, not the whole retest history, to keep the
          // prompt compact.
          const latest = {};
          for (const b of benchmarks) if (!latest[b.metric]) latest[b.metric] = `${b.value}${b.unit ? " " + b.unit : ""}`;
          setBenchmarkSummary(latest);
        }
        const seeded = {};
        if (prof && prof.full_name) seeded.name = prof.full_name;
        if (prof && prof.occupation) seeded.occupation = prof.occupation;
        if (prof && prof.dob) {
          const b = new Date(prof.dob), t = new Date();
          let a = t.getFullYear() - b.getFullYear();
          if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
          seeded.age = a;
        }
        if (ath) {
          if (ath.sport) seeded.sport = ath.sport;
          if (ath.position) seeded.position = ath.position;
          if (ath.country) { seeded.location = ath.country; seeded.citizenship = ath.country; }
          if (ath.club_name) seeded.club = ath.club_name;
          if (ath.recruiting_status) seeded.level = ath.recruiting_status;
          if (ath.grad_year) seeded.grad_year = ath.grad_year;
          if (ath.gpa) seeded.gpa = ath.gpa;
          if (ath.license) seeded.license = ath.license;
          if (ath.looking_for_players != null) seeded.looking_for_players = ath.looking_for_players;
          if (ath.education_level) seeded.education_level = ath.education_level;
        }
        baseProfileRef.current = seeded;
        if (Object.keys(seeded).length) setProfile((p) => ({ ...seeded, ...p }));

        // Flatten scout_context's {field: {value, source, confidence, updated_at}}
        // shape down to {field: value} for prompt purposes — the full shape
        // (migration 050) is what api/scout.js reads/writes; the client only
        // ever needs the plain values to give Scout visibility into what it
        // already knows, same role PROFILE SO FAR already plays for hard facts.
        if (ath && ath.scout_context && typeof ath.scout_context === "object") {
          const flatContext = {};
          for (const [k, entry] of Object.entries(ath.scout_context)) {
            if (k === "ai_meta") continue;
            const v = (entry && typeof entry === "object") ? entry.value : entry;
            if (v != null && v !== "") flatContext[k] = v;
          }
          if (Object.keys(flatContext).length) setScoutContext(flatContext);
        }

        const { data, error } = await sb
          .from("scout_history")
          .select("conversation_id, messages, created_at")
          .eq("user_id", who)
          .order("created_at", { ascending: true })
          .limit(1000);
        if (error) throw error;
        const rows = (data || []).filter((r) => Array.isArray(r.messages) && r.messages.length);
        if (rows.length) {
          const lastConvId = rows[rows.length - 1].conversation_id;
          const restored = rows.filter((r) => r.conversation_id === lastConvId).flatMap((r) => r.messages);
          setConversationId(lastConvId);
          setMsgs(restored.map((m) => ({ role: m.role, text: m.content })));
          try {
            const { data: summaryRow } = await sb.from("scout_conversation_summaries").select("summary").eq("conversation_id", lastConvId).maybeSingle();
            if (summaryRow && summaryRow.summary) setSummary(summaryRow.summary);
          } catch (e) { console.error("GOLSZ scout summary restore error:", e); }
        } else {
          setMsgs([{ role: "assistant", text: scoutGreetingFor(seeded, t) }]);
        }
      } catch (e) {
        console.error("GOLSZ scout history load error:", e);
        setMsgs((m) => m || [{ role: "assistant", text: t("scout_greeting") }]);
      } finally { setLoaded(true); }
    })();
  // Keyed on the managed athlete: switching from one child to another (or
  // back to the parent's own account) must reload the whole conversation, not
  // leave the previous athlete's transcript on screen.
  }, [actingFor && actingFor.id]);

  async function logTurn(role, text) {
    if (!sb || !uidRef.current) return;
    try { await sb.from("scout_history").insert({ user_id: uidRef.current, conversation_id: conversationId, messages: [{ role, content: text }] }); }
    catch (e) { console.error("GOLSZ scout history write error:", e); }
  }

  function newChat() {
    setMsgs([{ role: "assistant", text: scoutGreetingFor(baseProfileRef.current, t) }]);
    setProfile(baseProfileRef.current);
    setConversationId(newScoutConvId());
    setSummary("");
    setShowHistory(false);
  }

  async function loadHistoryList() {
    if (!sb || !uidRef.current) return;
    try {
      const { data, error } = await sb
        .from("scout_history")
        .select("conversation_id, messages, created_at")
        .eq("user_id", uidRef.current)
        .order("created_at", { ascending: true })
        .limit(1000);
      if (error) throw error;
      const byConv = new Map();
      for (const r of data || []) {
        if (!Array.isArray(r.messages) || !r.messages.length) continue;
        if (!byConv.has(r.conversation_id)) byConv.set(r.conversation_id, { lastAt: r.created_at, turns: 0, preview: "" });
        const entry = byConv.get(r.conversation_id);
        entry.lastAt = r.created_at;
        entry.turns += r.messages.length;
        if (!entry.preview) {
          const firstUser = r.messages.find((m) => m.role === "user");
          if (firstUser) entry.preview = firstUser.content.slice(0, 60);
        }
      }
      const list = [...byConv.entries()].map(([id, v]) => ({ id, ...v })).sort((a, b) => new Date(b.lastAt) - new Date(a.lastAt));
      setHistory(list);
    } catch (e) { console.error("GOLSZ scout history list error:", e); setHistory([]); }
  }

  function openHistory() {
    if (showHistory) { setShowHistory(false); return; }
    setShowHistory(true);
    loadHistoryList();
  }

  async function loadConversation(id) {
    if (!sb || !uidRef.current) return;
    try {
      const { data, error } = await sb
        .from("scout_history").select("messages, created_at")
        .eq("user_id", uidRef.current).eq("conversation_id", id)
        .order("created_at", { ascending: true });
      if (error) throw error;
      const restored = (data || []).flatMap((r) => Array.isArray(r.messages) ? r.messages : []);
      setMsgs(restored.length ? restored.map((m) => ({ role: m.role, text: m.content })) : [{ role: "assistant", text: t("scout_greeting") }]);
      setConversationId(id);
      setSummary("");
      try {
        const { data: summaryRow } = await sb.from("scout_conversation_summaries").select("summary").eq("conversation_id", id).maybeSingle();
        if (summaryRow && summaryRow.summary) setSummary(summaryRow.summary);
      } catch (e) { console.error("GOLSZ scout summary load error:", e); }
      setShowHistory(false);
    } catch (e) { console.error("GOLSZ scout load conversation error:", e); }
  }

  async function deleteConversation(id) {
    if (!sb || !uidRef.current) return;
    setHistory((h) => (h || []).filter((c) => c.id !== id));
    try {
      const { error } = await sb.from("scout_history").delete().eq("user_id", uidRef.current).eq("conversation_id", id);
      if (error) throw error;
      if (id === conversationId) {
        // the open conversation was deleted — reset to a fresh chat rather
        // than leaving the transcript on screen with nothing behind it
        const fresh = newScoutConvId();
        setConversationId(fresh);
        setProfile(baseProfileRef.current);
        setMsgs([{ role: "assistant", text: scoutGreetingFor(baseProfileRef.current, t) }]);
      }
    } catch (e) {
      console.error("GOLSZ delete conversation error:", e);
      loadHistoryList(); // reload the real list on failure, undoing the optimistic removal
    }
  }

  function pickPhoto() { fileRef.current?.click(); }

  function onPhotoChange(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // allow picking the same file again after removing it
    if (!file) return;
    if (!file.type.startsWith("image/")) { setPhotoErr(t("feed_image_type_err")); return; }
    if (file.size > 8 * 1024 * 1024) { setPhotoErr(t("feed_image_size_err")); return; }
    setPhotoErr("");
    const reader = new FileReader();
    reader.onload = () => {
      const m = /^data:([^;]+);base64,(.+)$/.exec(String(reader.result || ""));
      if (m) setPhoto({ dataUrl: reader.result, mediaType: m[1], data: m[2] });
    };
    reader.readAsDataURL(file);
  }
  function clearPhoto() { setPhoto(null); setPhotoErr(""); }

  async function send(text) {
    const content = text.trim(); if ((!content && !photo) || pending || !loaded || sendingRef.current) return;
    // React state (pending/busy) doesn't actually block a second call until
    // a re-render lands — and moderateContent() below awaits a real network
    // round-trip before either one ever gets set, leaving a real window
    // where a fast double-click/double-Enter fires send() twice, each one
    // passing the check above and going on to hit Scout's API separately.
    // That's what "answers back to back" actually was: two full replies to
    // one real question, not a formatting bug. sendingRef is a plain ref,
    // so setting it here takes effect immediately (not batched like state),
    // closing that window for any call that arrives before the first one
    // finishes — reset in the `finally` below.
    sendingRef.current = true;
    setModErr("");
    // Disables the button/input the instant a real send starts — separate
    // from `busy` (see its declaration above) specifically so this doesn't
    // wait on moderateContent()'s network round-trip below. Without this,
    // a real click looked completely unhandled during that gap (button
    // still enabled, nothing on screen yet), which is what made pressing
    // send again — sometimes a few times — feel necessary even though the
    // first press was already in flight.
    setPending(true);
    try {
    // Check before anything else touches state — a flagged message should
    // never clear the input, appear as a sent bubble, or reach Scout's own
    // conversation history at all, same as Feed/Messages/Passport below.
    if (content) {
      // No human recipient here (recipientId omitted) — Scout is a
      // private 1:1 exchange with an AI, which "direct_message" fits
      // more honestly than any of the other content types.
      const { decision } = await moderateContent({ text: content, contentType: "direct_message", surface: "private_thread" });
      if (decision === "block") { setModErr(t("moderation_blocked")); return; }
    }
    setInput("");
    const attached = photo; setPhoto(null);
    const next = [...(msgs || []), { role: "user", text: content, photo: attached ? attached.dataUrl : null, at: Date.now() }];
    // Set together, in the same render, so the user's own bubble and the
    // "thinking" bubble appear in the same update — never the thinking
    // bubble alone first (that was the bug: busy used to flip true back
    // where `pending` now does, before this message existed in `msgs`).
    setMsgs(next);
    setBusy(true);
    logTurn("user", content || "[photo]");
    try {
      // Only the last RECENT_TURNS messages go to the model — the running
      // `summary` (server-maintained, migration 049) covers everything
      // older instead of resending an ever-growing full transcript every
      // turn. See CLAUDE.md's AI Scout architecture note for why.
      const RECENT_TURNS = 6;
      const api = next.slice(-RECENT_TURNS).map((m) => ({ role: m.role, content: m.text }));
      const speakerLabel = profile.occupation && profile.occupation !== "Player" ? profile.occupation.toUpperCase() : "ATHLETE";
      const benchmarksLine = Object.keys(benchmarkSummary).length ? `\n\nLATEST RECORDED BENCHMARKS: ${JSON.stringify(benchmarkSummary)}` : "";
      // PROFILE SO FAR / SCOUT CONTEXT SO FAR are deliberately NOT sent any
      // more. api/scout.js now builds an AUTHORITATIVE ATHLETE STATE block
      // server-side from the database (buildAuthoritativeContext) and treats
      // it as the record. Sending a second, client-assembled copy of the
      // same facts was how a stale or partial client view could contradict
      // the database — the exact confusion this whole pass fixed. Benchmarks
      // and the running summary still come from here: neither is an identity
      // fact, and neither is loaded server-side yet.
      // The running summary is NO LONGER pasted in here. It used to sit in
      // the user message, so Scout read its own note as something the
      // athlete had just said — and in production answered "that summary
      // doesn't match what we've actually discussed", arguing with a
      // message nobody sent. It still goes to the server in the request
      // body (`summary`), which now injects it into the system prompt,
      // clearly labelled as Scout's own note.
      const promptText = `${benchmarksLine ? benchmarksLine.trim() + "\n\n" : ""}${speakerLabel}: ${content}`;
      api[api.length - 1] = attached
        ? { role: "user", content: [
            { type: "image", source: { type: "base64", media_type: attached.mediaType, data: attached.data } },
            { type: "text", text: promptText },
          ] }
        : { role: "user", content: promptText };
      let _hdr = { "Content-Type": "application/json" };
      try { if (typeof sb !== "undefined" && sb) { const _s = await sb.auth.getSession(); if (_s && _s.data && _s.data.session) _hdr["Authorization"] = "Bearer " + _s.data.session.access_token; } } catch (e) {}
      // requestId lets the server (api/scout.js) reject an exact duplicate
      // submission (double-click, retry-storm) without double-charging —
      // crypto.randomUUID() is available in every browser this app targets.
      const requestId = (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random();
      // model/system/tools are NOT sent — api/scout.js owns the model
      // choice, the real SYSTEM_PROMPT, and tool wiring server-side; the
      // client only ever supplies the conversation itself.
      // Give the request a real ceiling slightly ABOVE the server's own
      // budget (SCOUT_BUDGET_MS in api/scout.js, 50s, inside its 60s
      // maxDuration) so the server always gets the chance to answer for
      // itself first — this only fires if the request is genuinely stuck
      // (dropped connection, dead tunnel), and it turns an indefinite spinner
      // into an honest message the athlete can act on. Falls back to no
      // timeout on the rare browser without AbortSignal.timeout.
      const timeoutSignal = (typeof AbortSignal !== "undefined" && AbortSignal.timeout) ? AbortSignal.timeout(58000) : undefined;
      const res = await fetch(SCOUT_ENDPOINT, {
        method: "POST", headers: _hdr,
        signal: timeoutSignal,
        // athleteId (P0-4) asks the server to treat this conversation as being
        // about a managed under-16 athlete. It is a REQUEST, not a grant:
        // api/scout.js re-derives the caller from the bearer token and
        // requires an approved parent_links row before honouring it, and
        // returns 403 otherwise (api/_acting-for.js). Sending it from here
        // grants nothing on its own.
        body: JSON.stringify({ messages: api, lang, conversationId, summary, requestId, athleteId: actingFor ? actingFor.id : null }),
      });
      const data = await res.json();
      // scout_usage ({remaining, limit}) is present on both success and
      // limit-reached (402) responses — capture it either way so the
      // header's "questions left today" count updates even on a refusal.
      if (data && data.scout_usage && typeof data.scout_usage === "object") setScoutUsage(data.scout_usage);
      // A non-2xx response (rate limit, auth hiccup, upstream 5xx) still
      // arrives here as valid JSON — without this check data.content is
      // undefined, raw ends up "", and an empty assistant bubble gets
      // added with no visible error, which looked like Scout just never
      // replied. Throwing here routes it through the catch below instead.
      if (!res.ok) {
        const e = new Error((data && data.error) || t("scout_connection_dropped"));
        e.code = "SCOUT_HTTP_ERROR";
        throw e;
      }
      // The SERVER now derives the clean reply text (deriveReplyText in
      // api/scout.js) and sends it as data.reply_text. The client does not
      // parse the envelope any more — it used to, and a reply with any
      // preamble before the "{" slipped past the guard and rendered the whole
      // JSON object into the chat bubble. Parsing lives in exactly one place
      // now, server-side, where it is already done for every other field.
      const raw = (data.content || []).map((b) => (b.type === "text" ? b.text : "")).filter(Boolean).join("");
      let reply = typeof data.reply_text === "string" && data.reply_text.trim() ? data.reply_text.trim() : null;
      let updates = null, contextUpdates = null;
      try {
        const clean = raw.replace(/```json|```/g, "").trim();
        const parsed = JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}") + 1));
        if (!reply && typeof parsed.reply === "string") reply = parsed.reply;
        updates = parsed.profile_updates || null;
        contextUpdates = parsed.scout_context_updates || null;
      } catch { /* server already gave us reply_text */ }
      // Last line of defence: never render the envelope. If we somehow have
      // no clean text, show honest copy rather than braces.
      if (!reply || reply.includes('"reply"') || /^\s*[\{\[]/.test(reply)) {
        reply = (raw && !raw.includes('"reply"') && !/^\s*[\{\[]/.test(raw.trim())) ? raw : t("scout_connection_dropped");
      }
      if (updates && typeof updates === "object") setProfile((p) => ({ ...p, ...updates }));
      if (contextUpdates && typeof contextUpdates === "object") {
        // Same flatten-to-plain-value logic as the mount-time load above —
        // the server already validated/persisted the real {value,source,
        // confidence} shape via merge_scout_context(); this just keeps the
        // client's own working copy (used for the next prompt) in sync
        // without a second round-trip.
        setScoutContext((c) => {
          const next = { ...c };
          for (const [k, entry] of Object.entries(contextUpdates)) {
            const v = (entry && typeof entry === "object") ? entry.value : entry;
            if (v != null && v !== "") next[k] = v;
          }
          return next;
        });
      }
      if (typeof data.scout_summary === "string") setSummary(data.scout_summary);
      // suggested_targets/suggested_dev_items (brief §2B "persistent
      // actions") are already server-validated/capped — attached straight
      // to this specific message so the "add these" buttons render right
      // under the reply that generated them, not as a separate object.
      setMsgs((m) => [...m, { role: "assistant", at: Date.now(), text: reply, suggestedTargets: data.suggested_targets || null, suggestedDevItems: data.suggested_dev_items || null, suggestedPathway: data.suggested_pathway || null, draftedEmail: data.drafted_email || null }]);
      logTurn("assistant", reply);
    } catch (e) {
      // TimeoutError/AbortError come from the AbortSignal.timeout above —
      // "took too long" is the honest description there; "connection
      // dropped" would be actively misleading since the request did reach
      // the server, it just never came back in time.
      const isTimeout = e && (e.name === "TimeoutError" || e.name === "AbortError");
      const msg = e && e.code === "SCOUT_HTTP_ERROR" ? e.message
        : isTimeout ? t("scout_timed_out")
        : t("scout_connection_dropped");
      // failedInput carries the athlete's own text so the bubble can offer a
      // retry. Without it a failure was a dead end: three "Upstream model
      // call failed" bubbles in a row on 2026-08-08, and the only way
      // forward was retyping the question. A photo is deliberately not
      // retried — it is no longer in scope by then, and silently sending
      // the text without the image would be worse than making them redo it.
      setMsgs((m) => [...m, { role: "assistant", text: msg, at: Date.now(), failedInput: photo ? null : content }]);
      // Persist the fallback the same way a real reply is persisted below —
      // without this, a failed call left the user's own message logged
      // (logTurn above, before the request even went out) with no trace of
      // Scout's side, so scout_history had one dangling user-only row
      // forever. On the next load, "does scout_history have any rows?"
      // (the greeting-vs-restore check further up) said yes, so the app
      // restored that orphaned question instead of ever greeting properly
      // again — the user saw their own message sitting there with total
      // silence, permanently, no matter how many times they reloaded.
      logTurn("assistant", msg);
    }
    } finally { setBusy(false); setPending(false); sendingRef.current = false; }
  }

  // Drops the failure bubble and sends the same text again. The bubble is
  // removed first so a second failure does not stack — the athlete should
  // see one error at a time, not a growing wall of them.
  function retryFailed(msgIndex, text) {
    if (!text || pending || sendingRef.current) return;
    setMsgs((m) => m.filter((_, i) => i !== msgIndex));
    send(text);
  }

  // Brief §2B "persistent actions": one tap turns Scout's suggested_targets/
  // suggested_dev_items (already server-validated/capped) into real rows,
  // instead of the athlete re-typing what Scout just said. Marks the
  // message's own suggestions consumed afterward (msgIndex) so the button
  // can't double-insert on a re-render or a slow double-tap.
  // P1-8. These used to console.error and stop. The athlete tapped "add
  // these", the insert failed, the buttons stayed put and nothing said why —
  // the same class of silent lie as Scout announcing a save that never
  // happened (fixed 2026-08-09). A failure now stays visible on the message
  // it belongs to, and the buttons remain so the tap can be retried.
  async function addSuggestedTargets(msgIndex, targets) {
    if (!sb || !uidRef.current || !targets || !targets.length) return;
    try {
      const rows = targets.map((t) => ({ user_id: uidRef.current, name: t.name, fit_reasoning: t.reasoning || null }));
      const { error } = await sb.from("outreach_targets").insert(rows);
      if (error) throw error;
      setMsgs((m) => m.map((msg, i) => (i === msgIndex ? { ...msg, suggestedTargets: null, targetsAdded: true, actionError: null } : msg)));
    } catch (e) {
      console.error("GOLSZ add suggested targets error:", e);
      setMsgs((m) => m.map((msg, i) => (i === msgIndex ? { ...msg, actionError: t("action_add_failed") } : msg)));
    }
  }
  async function addSuggestedDevItems(msgIndex, items) {
    if (!sb || !uidRef.current || !items || !items.length) return;
    try {
      const rows = items.map((i) => ({ user_id: uidRef.current, focus_area: i.focus_area, goal: i.goal }));
      const { error } = await sb.from("development_plan_items").insert(rows);
      if (error) throw error;
      setMsgs((m) => m.map((msg, i) => (i === msgIndex ? { ...msg, suggestedDevItems: null, devItemsAdded: true, actionError: null } : msg)));
    } catch (e) {
      console.error("GOLSZ add suggested dev items error:", e);
      setMsgs((m) => m.map((msg, i) => (i === msgIndex ? { ...msg, actionError: t("action_add_failed") } : msg)));
    }
  }
  // Same one-tap pattern as the two above, for Scout's suggested_pathway
  // (GOLSZ Final Product directive §5 "personalized Pathway" — a Basic+
  // feature, see FEATURE_MIN_PLAN). pathway_plan is one row per athlete
  // (user_id is its primary key — migration 093), so this upserts rather
  // than inserts, safe whether this is a first Pathway or a rebuild.
  // baseline_complete is set true in the same write: building a real
  // Pathway is the moment GOLSZ actually has enough about the athlete to
  // call their baseline established — no separate "record a baseline"
  // flow exists (or is needed) beyond this.
  async function addSuggestedPathway(msgIndex, pathway) {
    if (!sb || !uidRef.current || !pathway) return;
    try {
      const { error } = await sb.from("pathway_plan").upsert(
        { user_id: uidRef.current, pathway_type: pathway.pathway_type, target_timeline: pathway.target_timeline || null, milestones: pathway.milestones, baseline_complete: true, updated_at: new Date().toISOString() },
        { onConflict: "user_id" }
      );
      if (error) throw error;
      // What is now on file, so a SECOND proposal in the same conversation
      // previews against the Pathway they actually have rather than the one
      // they had when Scout loaded.
      setCurrentPathway({ pathway_type: pathway.pathway_type, target_timeline: pathway.target_timeline || null, milestones: pathway.milestones });
      setMsgs((m) => m.map((msg, i) => (i === msgIndex ? { ...msg, suggestedPathway: null, pathwayAdded: true, actionError: null } : msg)));
    } catch (e) {
      console.error("GOLSZ add suggested pathway error:", e);
      setMsgs((m) => m.map((msg, i) => (i === msgIndex ? { ...msg, actionError: t("action_add_failed") } : msg)));
    }
  }

  // Brief §8: "AI Scout should be able to create professional introduction/
  // email drafts" — saves a Scout-drafted email straight onto an existing
  // target's draft_email column instead of manual copy-paste. Target list
  // fetched lazily (only once the athlete actually opens the picker) since
  // most Scout replies never need it.
  const [emailTargets, setEmailTargets] = useState(null);
  const [savingEmailFor, setSavingEmailFor] = useState(null);
  const [selectedEmailTarget, setSelectedEmailTarget] = useState("");
  async function openSaveEmailPicker(msgIndex) {
    setSavingEmailFor(msgIndex);
    setSelectedEmailTarget("");
    if (emailTargets !== null || !sb || !uidRef.current) return;
    try {
      const { data, error } = await sb.from("outreach_targets").select("id, name").eq("user_id", uidRef.current).order("created_at", { ascending: false });
      if (error) throw error;
      setEmailTargets(data || []);
    } catch (e) { console.error("GOLSZ load targets for email save error:", e); setEmailTargets([]); }
  }
  async function saveDraftedEmail(msgIndex, emailText) {
    if (!sb || !selectedEmailTarget) return;
    try {
      const { error } = await sb.from("outreach_targets").update({ draft_email: emailText, updated_at: new Date().toISOString() }).eq("id", selectedEmailTarget).eq("user_id", uidRef.current);
      if (error) throw error;
      setSavingEmailFor(null);
      setMsgs((m) => m.map((msg, i) => (i === msgIndex ? { ...msg, draftedEmail: null, emailSaved: true, actionError: null } : msg)));
    } catch (e) {
      console.error("GOLSZ save drafted email error:", e);
      setMsgs((m) => m.map((msg, i) => (i === msgIndex ? { ...msg, actionError: t("action_add_failed") } : msg)));
    }
  }

  const isPlayerChat = !profile.occupation || profile.occupation === "Player";
  const CHIPS = chipsFor(t, isPlayerChat);
  // Topic rows (Master UX/UI redesign — "Scout should be visually the
  // CLEANEST section") replace the old 2x2 icon-chip grid for the very
  // first empty state only; the horizontal scrolling CHIPS row further
  // down (ongoing conversations) is untouched. Each row sends a natural
  // topic-starter sentence, same send() path a typed message uses.
  const TOPICS = [
    { Icon: SlidersHorizontal, label: t("scout_topic_situation"), prompt: t("scout_topic_situation_prompt") },
    { Icon: Target, label: t("scout_topic_goals"), prompt: t("scout_topic_goals_prompt") },
    { Icon: Flame, label: t("scout_topic_game"), prompt: t("scout_topic_game_prompt") },
  ];
  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      {/* One compact row. This was a stacked column — 48px ring, wordmark,
          then a 200px waveform — roughly 130px of chrome above the first
          message, which on a phone ate about half the visible conversation.
          The identity is the ring plus the wordmark; everything else was
          decoration competing with the thing people came for. The waveform
          now appears ONLY while a reply is in flight, which is the one moment
          it says something true. */}
      <div style={{ padding: "9px 14px", borderBottom: `1px solid ${C.line}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
          <div style={{ width: 26, height: 26, borderRadius: 99, border: `1.5px solid ${C.lime}`, background: "#D4AF3714", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <Radar size={13} color={C.lime} />
          </div>
          <span style={{ fontWeight: 800, letterSpacing: "0.1em", fontSize: 11.5, flexShrink: 0 }}>{t("scout_header")}</span>
          {busy && (
            <svg viewBox="0 0 240 28" width="64" height="13" aria-hidden="true" style={{ flexShrink: 0 }}>
              <path d="M2 14 H52 l6 -9 l7 18 l6 -13 l6 8 l8 -11 l9 15 l7 -7 h18 l6 -10 l7 16 l6 -12 l7 7 l8 -9 l8 12 l6 -6 H238"
                fill="none" stroke={C.lime} strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round">
                <animate attributeName="opacity" values="0.4;1;0.4" dur="1.1s" repeatCount="indefinite" />
              </path>
            </svg>
          )}
          <span style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
            <span style={{ fontSize: 9, color: C.slate, fontFamily: "'Space Mono', monospace", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
              {scoutUsage ? `${scoutUsage.remaining} ${t("scout_questions_left")}` : t("scout_live_agent")}
            </span>
            <button onClick={openHistory} title={t("scout_history_title")} style={iconBtn(showHistory ? C.lime : C.slate)}><History size={15} /></button>
            <button onClick={newChat} title={t("scout_new_chat")} style={iconBtn(C.lime)}><Plus size={16} /></button>
          </span>
        </div>
      </div>

      {showHistory ? (
        <div style={{ flex: 1, overflowY: "auto", padding: "14px 12px 6px" }}>
          {history === null && <div style={{ color: C.slate, fontSize: 13 }}>{t("loading")}</div>}
          {history && history.length === 0 && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "30px 0" }}>{t("scout_no_past")}</div>}

                >
                  <RotateCcw size={13} /> {t("scout_try_again")}

                // The upsert replaces milestones wholesale. Until this panel

                // with no warning and no undo, because Scout was merely asked
                // (in the prompt) to describe the change and, after the

                        {cur.map((ms, k) => (
                          <div key={k} style={{ fontSize: 11.5, color: ms && ms.done ? C.slate : C.chalk, marginTop: 2, textDecoration: ms && ms.done ? "line-through" : "none" }}>

                    <div style={{ fontSize: 11.5, fontWeight: 700, color: cur.length ? C.amber : C.slate, marginTop: 8 }}>

                  {emailTargets && emailTargets.length === 0 && <div style={{ fontSize: 11.5, color: C.slate, width: "100%" }}>{t("scout_save_email_no_targets")}</div>}
                </div>

              {msgTime(m.at) && (
                <div style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 3, marginTop: 4, fontSize: 9.5, fontWeight: 600, color: m.role === "user" ? "#0D121099" : C.slate }}>
                  {msgTime(m.at)}
                  {m.role === "user" && <CheckCheck size={11} />}
                </div>
              )}
            </div>
          ))}
          {loaded && !pending && msgs && msgs.length <= 1 && (
            <div style={{ marginTop: 6 }}>
              {TOPICS.map((tp) => (
                <button key={tp.label} onClick={() => send(tp.prompt)} style={{
                  display: "flex", alignItems: "center", gap: 10, width: "100%", textAlign: "left",
                  background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 14px",
                  marginBottom: 8, cursor: "pointer", fontFamily: "inherit", color: C.chalk,
                }}>
                  <tp.Icon size={16} color={C.lime} style={{ flexShrink: 0 }} />
                  <span style={{ flex: 1, fontSize: 13, fontWeight: 700 }}>{tp.label}</span>

              ))}
            </div>
          )}
          {busy && <div style={bubbleAgent}><div className="running"><span /><span /><span /></div></div>}
          <div ref={endRef} />
