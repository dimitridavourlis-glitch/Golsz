/* ============ BLOCKED ACCOUNTS ============
   Blocking someone (Feed's Block button) silently drops their posts from
   your feed with no way back — this is the way back. blocks_delete RLS
   (blocker_id = auth.uid()) already allows unblocking; there was just no
   UI for it before now. */
function BlockedAccounts() {
  const { t } = useLang();
  const [uid, setUid] = useState(null);
  const [blocked, setBlocked] = useState(null);
  const [removingId, setRemovingId] = useState(null);

  async function load() {
    if (!sb) return;
    try {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return;
      setUid(user.id);
      const { data: rows, error } = await sb.from("blocks").select("blocked_id").eq("blocker_id", user.id);
      if (error) throw error;
      const ids = (rows || []).map((r) => r.blocked_id);
      let nameById = {};
      if (ids.length) {
        const { data: names } = await sb.from("public_profile_names").select("id, full_name").in("id", ids);
        nameById = Object.fromEntries((names || []).map((r) => [r.id, r.full_name]));
      }
      setBlocked(ids.map((id) => ({ id, name: nameById[id] || "GOLSZ User" })));
    } catch (e) { console.error("GOLSZ blocked-accounts load error:", e); setBlocked((b) => b || []); }
  }
  useEffect(() => { load(); }, []);

  async function unblock(id) {
    if (!sb || !uid || removingId) return;
    setRemovingId(id);
    try {
      const { error } = await sb.from("blocks").delete().eq("blocker_id", uid).eq("blocked_id", id);
      if (error) throw error;
      setBlocked((list) => (list || []).filter((b) => b.id !== id));
    } catch (e) { console.error("GOLSZ unblock error:", e); }
    finally { setRemovingId(null); }
  }

  if (!sb) return null;
  const count = blocked === null ? null : blocked.length;

  return (
    <div style={{ ...card, border: `1px solid ${count ? C.amber + "44" : C.line}` }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Ban size={16} color={count ? C.amber : C.slate} />
        <span style={{ fontSize: 13.5, fontWeight: 800, color: C.chalk }}>{t("blocked_title")}</span>
        {count > 0 && (
          <span style={{ fontSize: 11, fontWeight: 800, color: C.ink, background: C.amber, borderRadius: 999, padding: "1px 8px" }}>{count}</span>
        )}
      </div>
      {blocked === null && <div style={{ fontSize: 12.5, color: C.slate }}>{t("loading")}</div>}
      {blocked && blocked.length === 0 && <div style={{ fontSize: 12.5, color: C.slate }}>{t("blocked_empty")}</div>}
      {blocked && blocked.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
          {blocked.map((b) => (
            <div key={b.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 0" }}>
              <Avatar init={initials(b.name)} size={30} />
              <span style={{ fontSize: 13, fontWeight: 600, flex: 1 }}>{b.name}</span>
              <button onClick={() => unblock(b.id)} disabled={removingId === b.id} style={{
                fontSize: 11, fontWeight: 700, padding: "5px 10px", borderRadius: 999, cursor: "pointer",
                fontFamily: "inherit", background: "transparent", color: C.lime, border: `1px solid ${C.limeBorder}`,
                opacity: removingId === b.id ? 0.5 : 1,
              }}>{removingId === b.id ? "…" : t("blocked_unblock")}</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============ ADMIN PANEL ============
   Gated entirely by server-side RLS (is_admin(), migration 009) — every
   query and mutation here only succeeds if the signed-in user's own
   profiles.is_admin is true, regardless of how this component is reached.
   The UI check below (authorized state) is just for a clean "not
   authorized" message instead of a wall of empty/failed queries. */
function AdminPanel({ onBack }) {
  const { t } = useLang();
  const [authorized, setAuthorized] = useState(null);
  const [tab, setTab] = useState("reports");
  const [stats, setStats] = useState(null);
  const [reports, setReports] = useState(null);
  const [users, setUsers] = useState(null);
  const [userQuery, setUserQuery] = useState("");
  const [events, setEvents] = useState(null);
  const [evTitle, setEvTitle] = useState(""); const [evSport, setEvSport] = useState("Soccer");
  const [evLoc, setEvLoc] = useState(""); const [evLevel, setEvLevel] = useState("");
  const [evDate, setEvDate] = useState(""); const [evSpots, setEvSpots] = useState("");

  async function loadStats() {
    try {
      const [{ count: userCount }, { count: postCount }, { count: eventCount }, { count: pendingReports }] = await Promise.all([
        sb.from("profiles").select("id", { count: "exact", head: true }),
        sb.from("posts").select("id", { count: "exact", head: true }),
        sb.from("events").select("id", { count: "exact", head: true }),
        sb.from("post_reports").select("id", { count: "exact", head: true }).is("resolved_at", null),
      ]);
      setStats({ userCount: userCount || 0, postCount: postCount || 0, eventCount: eventCount || 0, pendingReports: pendingReports || 0 });
    } catch (e) { console.error("GOLSZ admin stats error:", e); }
  }

  async function loadReports() {
    try {
      const { data, error } = await sb.from("post_reports").select("id, post_id, reporter_id, reason, created_at, resolved_at").order("created_at", { ascending: false }).limit(100);
      if (error) throw error;
      const postIds = [...new Set((data || []).map((r) => r.post_id))];
      const { data: posts } = postIds.length ? await sb.from("posts").select("id, author_id, headline, body").in("id", postIds) : { data: [] };
      const postById = Object.fromEntries((posts || []).map((p) => [p.id, p]));
      const peopleIds = [...new Set([...(data || []).map((r) => r.reporter_id), ...(posts || []).map((p) => p.author_id)])];
      const { data: names } = peopleIds.length ? await sb.from("public_profile_names").select("id, full_name").in("id", peopleIds) : { data: [] };
      const nameById = Object.fromEntries((names || []).map((n) => [n.id, n.full_name]));
      setReports((data || []).map((r) => {
        const post = postById[r.post_id];
        return { ...r, post, reporterName: nameById[r.reporter_id] || "Unknown", authorName: post ? (nameById[post.author_id] || "Unknown") : "(post deleted)" };
      }));
    } catch (e) { console.error("GOLSZ admin reports error:", e); setReports([]); }

      {tab === "events" && (

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
              <input value={evLoc} onChange={(e) => setEvLoc(e.target.value)} placeholder={t("admin_location_ph")} style={field} />
              <input value={evLevel} onChange={(e) => setEvLevel(e.target.value)} placeholder={t("admin_level_ph")} style={field} />
            </div>
            <input type="number" value={evSpots} onChange={(e) => setEvSpots(e.target.value)} placeholder={t("admin_spots_ph")} style={{ ...field, width: "100%", boxSizing: "border-box", marginBottom: 10 }} />
            <button onClick={createEvent} disabled={!evTitle.trim() || !evDate} style={{

            }}>{t("admin_create_event")}</button>

          {events === null && <div style={{ color: C.slate, fontSize: 13 }}>{t("loading")}</div>}
          {events && events.map((e) => (

                <div style={{ fontSize: 10.5, color: C.slate, fontFamily: "'Space Mono', monospace" }}>{e.event_date} · {e.sport} · {e.location || "—"}</div>

              <button onClick={() => deleteEvent(e.id)} style={iconBtn(C.amber)}><Trash2 size={15} /></button>

/* ============ AI SCOUT (live agent) ============ */
const SYS = `You are GOLSZ Scout, an AI sports agent. Tagline: "Every Goal Has a Path."
You are the personal agent for ONE athlete: learn who they are (age, sport, position, location, club/level, grad year, academics, budget, citizenship, goal), build a career roadmap, suggest realistic target programs (reach/match/safety, honest), and draft coach outreach emails on request (draft-only; the athlete sends them).
Some fields may already be filled in from the athlete's real GOLSZ Passport (profile they built themselves) — treat those as trustworthy and confirmed, not something to re-ask. Open by briefly acknowledging what you already know about them (sport/position/club/grad year if present) instead of asking generic intro questions, then move straight to something useful.
Be warm, direct, honest — never overpromise. If a target looks unrealistic, say so kindly and show the realistic path. If the athlete seems to be a minor, remind them once to involve a parent/guardian. Use web search for real current programs, coaches, showcases, and eligibility rules. Ask at most ONE question per reply. Keep replies tight for a phone screen.
If asked what AI model or company powers you, who made you, or whether you're ChatGPT/OpenAI/Claude/Anthropic/Gemini/etc., always answer that you are GOLSZ Scout, built by GOLSZ — never name or confirm any underlying model or provider, and don't explain that you're declining to say. Just answer as GOLSZ Scout and move on.
OUTPUT ONLY valid JSON, no markdown fences: {"reply":"conversational text","profile_updates":{...only newly-learned fields or null}}
Allowed keys: name, age, sport, position, location, club, level, grad_year, gpa, budget, citizenship, goal. Do not repeat known fields.`;

const CHIP_ICONS = [Compass, Radar, MessageSquare, CalendarDays];
function chipsFor(t) { return [t("scout_chip1"), t("scout_chip2"), t("scout_chip3"), t("scout_chip4")]; }

function scoutGreetingFor(seeded, t) {
  const who = [seeded.sport, seeded.position].filter(Boolean).join(" · ");
  if (!who && !seeded.name) return t("scout_greeting");
  const first = seeded.name ? seeded.name.split(" ")[0] : null;
  const hello = first ? `${t("scout_hey")} ${first} — ` : `${t("scout_hey")} — `;
  const context = who
    ? `${t("scout_got_you_down_pre")}${who}${seeded.club ? `${t("scout_at")}${seeded.club}` : ""}${seeded.grad_year ? `${t("scout_class_of")}${seeded.grad_year}` : ""}. `
    : "";
  return `${hello}${t("scout_im_your_scout")} ${context}\n\n${t("scout_whats_plan")}`;
}
function newScoutConvId() {
  return (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
}

function Scout() {
  const { t, lang } = useLang();
  const [msgs, setMsgs] = useState(sb ? null : [{ role: "assistant", text: t("scout_greeting") }]);
  const [loaded, setLoaded] = useState(!sb); // no backend at all -> nothing to wait for, show demo greeting immediately
  const [profile, setProfile] = useState({});
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [conversationId, setConversationId] = useState(() => newScoutConvId());
  const [showHistory, setShowHistory] = useState(false);
  const [history, setHistory] = useState(null);
  const uidRef = useRef(null);
  const endRef = useRef(null);
  const baseProfileRef = useRef({});
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs, busy]);

  // Seed Scout's working profile from the athlete's real Passport data (so
  // it already knows who it's helping instead of re-asking basics the
  // athlete already filled in), then restore their most recent Scout
  // conversation, if any. Real scout_history is (id, user_id,
  // conversation_id, messages jsonb, created_at) — each transcript row's
  // `messages` is a one-element [{role,content}] array; metering rows
  // (written server-side by increment_scout_usage) are `[]` and flatten to
  // nothing here, so no separate filtering is needed. Only the latest
  // conversation is loaded on mount — older ones are reachable via
  // History, not auto-flattened into one ever-growing chat like before.
  useEffect(() => {
    if (!sb) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { setMsgs([{ role: "assistant", text: t("scout_greeting") }]); return; }
        uidRef.current = user.id;

        const [{ data: prof }, { data: ath }] = await Promise.all([
          sb.from("profiles").select("full_name, dob").eq("id", user.id).single(),
          sb.from("athletes").select("sport, position, grad_year, gpa, country, club_name, recruiting_status").eq("id", user.id).single(),
        ]);
        const seeded = {};
        if (prof && prof.full_name) seeded.name = prof.full_name;
        if (prof && prof.dob) {
          const b = new Date(prof.dob), t = new Date();
          let a = t.getFullYear() - b.getFullYear();
          if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
          seeded.age = a;
        }
        if (ath) {
          if (ath.sport) seeded.sport = ath.sport;
          if (ath.position) seeded.position = ath.position;
          if (ath.country) { seeded.location = ath.country; seeded.citizenship = ath.country; }
          if (ath.club_name) seeded.club = ath.club_name;
          if (ath.recruiting_status) seeded.level = ath.recruiting_status;
          if (ath.grad_year) seeded.grad_year = ath.grad_year;
          if (ath.gpa) seeded.gpa = ath.gpa;
        }
        baseProfileRef.current = seeded;
        if (Object.keys(seeded).length) setProfile((p) => ({ ...seeded, ...p }));

        const { data, error } = await sb
          .from("scout_history")
          .select("conversation_id, messages, created_at")
          .eq("user_id", user.id)
          .order("created_at", { ascending: true })
          .limit(1000);
        if (error) throw error;
        const rows = (data || []).filter((r) => Array.isArray(r.messages) && r.messages.length);
        if (rows.length) {
          const lastConvId = rows[rows.length - 1].conversation_id;
          const restored = rows.filter((r) => r.conversation_id === lastConvId).flatMap((r) => r.messages);
          setConversationId(lastConvId);
          setMsgs(restored.map((m) => ({ role: m.role, text: m.content })));
        } else {
          setMsgs([{ role: "assistant", text: scoutGreetingFor(seeded, t) }]);
        }
      } catch (e) {
        console.error("GOLSZ scout history load error:", e);
        setMsgs((m) => m || [{ role: "assistant", text: t("scout_greeting") }]);
      } finally { setLoaded(true); }
    })();
  }, []);

  async function logTurn(role, text) {
    if (!sb || !uidRef.current) return;
    try { await sb.from("scout_history").insert({ user_id: uidRef.current, conversation_id: conversationId, messages: [{ role, content: text }] }); }
    catch (e) { console.error("GOLSZ scout history write error:", e); }
  }

  function newChat() {
    setMsgs([{ role: "assistant", text: scoutGreetingFor(baseProfileRef.current, t) }]);
    setProfile(baseProfileRef.current);
    setConversationId(newScoutConvId());
    setShowHistory(false);
  }

  async function loadHistoryList() {
    if (!sb || !uidRef.current) return;
    try {
      const { data, error } = await sb
        .from("scout_history")
        .select("conversation_id, messages, created_at")
        .eq("user_id", uidRef.current)
        .order("created_at", { ascending: true })
        .limit(1000);
      if (error) throw error;
      const byConv = new Map();
      for (const r of data || []) {
        if (!Array.isArray(r.messages) || !r.messages.length) continue;
        if (!byConv.has(r.conversation_id)) byConv.set(r.conversation_id, { lastAt: r.created_at, turns: 0, preview: "" });
        const entry = byConv.get(r.conversation_id);
        entry.lastAt = r.created_at;
        entry.turns += r.messages.length;
        if (!entry.preview) {
          const firstUser = r.messages.find((m) => m.role === "user");
          if (firstUser) entry.preview = firstUser.content.slice(0, 60);
        }
      }
      const list = [...byConv.entries()].map(([id, v]) => ({ id, ...v })).sort((a, b) => new Date(b.lastAt) - new Date(a.lastAt));
      setHistory(list);
    } catch (e) { console.error("GOLSZ scout history list error:", e); setHistory([]); }
  }

  function openHistory() {
    if (showHistory) { setShowHistory(false); return; }
    setShowHistory(true);
    loadHistoryList();
  }

  async function loadConversation(id) {
    if (!sb || !uidRef.current) return;
    try {
      const { data, error } = await sb
        .from("scout_history").select("messages, created_at")
        .eq("user_id", uidRef.current).eq("conversation_id", id)
        .order("created_at", { ascending: true });
      if (error) throw error;
      const restored = (data || []).flatMap((r) => Array.isArray(r.messages) ? r.messages : []);
      setMsgs(restored.length ? restored.map((m) => ({ role: m.role, text: m.content })) : [{ role: "assistant", text: t("scout_greeting") }]);
      setConversationId(id);
      setShowHistory(false);
    } catch (e) { console.error("GOLSZ scout load conversation error:", e); }
  }

  async function deleteConversation(id) {
    if (!sb || !uidRef.current) return;
    setHistory((h) => (h || []).filter((c) => c.id !== id));
    try {
      const { error } = await sb.from("scout_history").delete().eq("user_id", uidRef.current).eq("conversation_id", id);
      if (error) throw error;
      if (id === conversationId) {
        // the open conversation was deleted — reset to a fresh chat rather
        // than leaving the transcript on screen with nothing behind it
        const fresh = newScoutConvId();
        setConversationId(fresh);
        setProfile(baseProfileRef.current);
        setMsgs([{ role: "assistant", text: scoutGreetingFor(baseProfileRef.current, t) }]);
      }
    } catch (e) {
      console.error("GOLSZ delete conversation error:", e);
      loadHistoryList(); // reload the real list on failure, undoing the optimistic removal
    }
  }

  async function send(text) {
    const content = text.trim(); if (!content || busy || !loaded) return;
    setInput("");
    const next = [...(msgs || []), { role: "user", text: content }];
    setMsgs(next); setBusy(true);
    logTurn("user", content);
    try {
      const api = next.map((m) => ({ role: m.role, content: m.text }));
      api[api.length - 1] = { role: "user", content: `PROFILE SO FAR: ${JSON.stringify(profile)}\n\nATHLETE: ${content}` };
      let _hdr = { "Content-Type": "application/json" };
      try { if (typeof sb !== "undefined" && sb) { const _s = await sb.auth.getSession(); if (_s && _s.data && _s.data.session) _hdr["Authorization"] = "Bearer " + _s.data.session.access_token; } } catch (e) {}
      const _endpoint = (typeof SCOUT_ENDPOINT !== "undefined" && SCOUT_ENDPOINT) ? SCOUT_ENDPOINT : "https://api.anthropic.com/v1/messages";
      const res = await fetch(_endpoint, {
        method: "POST", headers: _hdr,
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, system: SYS, messages: api, lang, tools: [{ type: "web_search_20250305", name: "web_search" }] }),
      });
      const data = await res.json();
      const raw = (data.content || []).map((b) => (b.type === "text" ? b.text : "")).filter(Boolean).join("\n");
      let reply = raw, updates = null;
      try {
        const clean = raw.replace(/```json|```/g, "").trim();
        const parsed = JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}") + 1));
        reply = parsed.reply || raw; updates = parsed.profile_updates || null;
      } catch { /* raw */ }
      if (updates && typeof updates === "object") setProfile((p) => ({ ...p, ...updates }));
      setMsgs((m) => [...m, { role: "assistant", text: reply }]);
      logTurn("assistant", reply);
    } catch {
      setMsgs((m) => [...m, { role: "assistant", text: t("scout_connection_dropped") }]);
    } finally { setBusy(false); }
  }

  const known = Object.keys(profile).filter((k) => profile[k]);
  const CHIPS = chipsFor(t);
  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>

          {history && history.length === 0 && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "30px 0" }}>{t("scout_no_past")}</div>}
          {history && history.map((h) => (
            <div key={h.id} style={{
              ...card, display: "flex", alignItems: "center", gap: 8,
              border: `1px solid ${h.id === conversationId ? C.lime : C.line}`,

              <button onClick={() => loadConversation(h.id)} style={{ flex: 1, minWidth: 0, textAlign: "left", background: "none", border: "none", cursor: "pointer", fontFamily: "inherit", padding: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 3, color: C.chalk }}>{h.preview || t("scout_new_conversation")}</div>
                <div style={{ fontSize: 10.5, color: C.slate, fontFamily: "'Space Mono', monospace" }}>{timeAgo(h.lastAt)} ago ·{t("scout_ago_messages")} {h.turns}</div>
              </button>
              <button onClick={() => deleteConversation(h.id)} title={t("scout_delete_conv")} style={{ background: "none", border: "none", color: C.slate, cursor: "pointer", padding: 4, flexShrink: 0, display: "flex" }}>
                <Trash2 size={15} />

        </div>

        <div style={{ flex: 1, overflowY: "auto", padding: "14px 12px 6px" }}>
          {!loaded && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "30px 0" }}>{t("loading")}</div>}
          {msgs && msgs.map((m, i) => (

              {m.role === "assistant" && <div style={{ fontSize: 9, letterSpacing: "0.22em", color: C.lime, fontWeight: 800, marginBottom: 4 }}>{t("scout_scout_label")}</div>}
              <div style={{ whiteSpace: "pre-wrap" }}>{m.text}</div>

          {loaded && !busy && msgs && msgs.length <= 1 && (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 6 }}>

      )}
    </div>
  );

    && dobNum.d >= 1 && dobNum.d <= 31
    && dobNum.m >= 1 && dobNum.m <= 12
    && String(dobYear).length === 4 && dobNum.y >= 1900 && dobNum.y <= new Date().getFullYear();
  const dobIso = dobOk ? `${dobYear}-${String(dobNum.m).padStart(2, "0")}-${String(dobNum.d).padStart(2, "0")}` : "";
  const age = dobOk ? (() => {
    const today = new Date(); const b = new Date(dobIso);
    let a = today.getFullYear() - b.getFullYear();
    const notYet = (today.getMonth() < b.getMonth()) || (today.getMonth() === b.getMonth() && today.getDate() < b.getDate());
    if (notYet) a--;
    return a;
  })() : null;
  const isMinor = age !== null && age < 18;
  const parentEmailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(parentEmail.trim());

  const ok = email.trim() && pw.trim() && (!isSignup || (name.trim() && dobOk && (!isMinor || parentEmailOk)));
  const selected = PLANS.find((p) => p.id === plan) || PLANS[1];
  const field = { width: "100%", background: C.turf, border: "1px solid " + C.line2, borderRadius: 12, color: C.chalk, padding: "13px 14px", fontSize: 15, fontFamily: "inherit", outline: "none", marginBottom: 12, boxSizing: "border-box" };
  const dobField = { ...field, marginBottom: 0, textAlign: "center" };

  async function submit() {
    if (!ok || busy) return;
    setErr("");
    setNotice("");
    // preview mode: no backend configured -> behave like the demo
    if (!sb) {
      if (isSignup && selected.price > 0 && STRIPE_LINKS[plan]) { window.location.href = STRIPE_LINKS[plan]; return; }
      onDone(); return;
    }
    setBusy(true);
    try {
      if (isSignup) {
        const { data, error } = await sb.auth.signUp({ email: email.trim(), password: pw, options: { data: {
          full_name: name.trim(), plan: selected.id, date_of_birth: dobIso,
          parent_email: isMinor ? parentEmail.trim() : "",
        } } });
        if (error) throw error;
        if (selected.price > 0 && STRIPE_LINKS[plan] && data.user) {
          // attribute the checkout back to this account for the Stripe webhook
          const checkoutUrl = new URL(STRIPE_LINKS[plan]);
          checkoutUrl.searchParams.set("client_reference_id", data.user.id);
          checkoutUrl.searchParams.set("prefilled_email", email.trim());
          window.location.href = checkoutUrl.toString();
          return; // account exists -> pay
        }
        if (data.session) { onDone(true); } else { setNotice("Account created — check " + email.trim() + " for a confirmation link, then come back and log in."); }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
        if (error) throw error;
        onDone();
      }
    } catch (e) {
      console.error("GOLSZ auth error:", e);
      let msg = "Something went wrong. Try again.";
      if (e && typeof e.message === "string" && e.message.trim()) {
        msg = e.message;
      } else if (e instanceof TypeError) {
        msg = "Couldn't reach Supabase — check your internet connection, that the project isn't paused, and that this page is served over http(s), not opened as a local file.";
      } else if (e) {
        try { msg = "Unexpected error: " + JSON.stringify(e); } catch { msg = "Unexpected error (see browser console for details)."; }
      }
      setErr(msg);
    } finally {
      setBusy(false);
    }
  }

  const cta = busy ? t("auth_working")
    : !isSignup ? t("auth_login")
    : selected.price === 0 ? t("auth_create_free")
    : t("auth_continue_payment") + "$" + selected.price + t("auth_per_month");

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "28px 18px", background: "radial-gradient(1100px 560px at 50% -12%, " + C.turf + ", " + C.pitch + ")", fontFamily: "'Archivo', system-ui, sans-serif", color: C.chalk }}>
      <style>{CSS}</style>
      <div style={{ width: "100%", maxWidth: (isSignup && !forgotMode && isDesktop) ? 920 : 430 }}>
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <div style={{ fontWeight: 900, fontSize: 40, letterSpacing: "0.03em", fontStretch: "expanded" }}>GOLSZ<span style={{ color: C.lime }}>.</span></div>
          <div style={{ fontSize: 10, letterSpacing: "0.3em", color: C.slate, fontWeight: 700, marginTop: 4 }}>{t("auth_tagline")}</div>
        </div>

        <div style={{ display: "flex", background: C.card, border: "1px solid " + C.line, borderRadius: 12, padding: 4, marginBottom: 16 }}>
          {[["signup", t("auth_signup")], ["login", t("auth_login")]].map(([m, l]) => (
            <button key={m} onClick={() => { setMode(m); setErr(""); setNotice(""); }} style={{ flex: 1, padding: "10px", borderRadius: 9, border: "none", cursor: "pointer", fontFamily: "inherit", fontWeight: 700, fontSize: 14, background: mode === m ? C.lime : "transparent", color: mode === m ? C.ink : C.slate }}>{l}</button>
          ))}
        </div>

        <div style={{ background: C.card, border: "1px solid " + C.line, borderRadius: 18, padding: 20 }}>
          {forgotMode ? (
            resetSent ? (
              <>
                <div style={{ background: "#C8F1351a", border: "1px solid #C8F13544", borderRadius: 10, padding: "10px 12px", marginBottom: 14 }}>
                  <div style={{ fontSize: 10, letterSpacing: "0.12em", color: C.lime, fontWeight: 800, marginBottom: 4 }}>{t("auth_check_email")}</div>
                  <div style={{ color: C.chalk, fontSize: 12.5, lineHeight: 1.4 }}>{t("auth_reset_sent_pre")}{email.trim()}{t("auth_reset_sent_post")}</div>
                </div>
                <button onClick={() => { setForgotMode(false); setResetSent(false); setErr(""); }} style={{ width: "100%", background: "transparent", border: `1px solid ${C.line2}`, color: C.chalk, borderRadius: 12, padding: "13px", fontWeight: 700, fontSize: 14, cursor: "pointer", fontFamily: "inherit" }}>{t("auth_back_to_login")}</button>
              </>
            ) : (
              <>
                <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 6 }}>{t("auth_reset_title")}</div>
                <div style={{ fontSize: 12.5, color: C.slate, marginBottom: 14, lineHeight: 1.4 }}>{t("auth_reset_desc")}</div>
                <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder={t("auth_email")} type="email" style={field} />
                {err && (
                  <div style={{ background: "#C89B3C1a", border: "1px solid #C89B3C44", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
                    <div style={{ color: C.warnText, fontSize: 12.5, lineHeight: 1.4 }}>{err}</div>
                  </div>
                )}
                <button disabled={!email.trim() || busy} onClick={sendReset} style={{ width: "100%", background: C.lime, color: C.ink, border: "none", borderRadius: 12, padding: "14px", fontWeight: 800, fontSize: 15, cursor: (!email.trim() || busy) ? "default" : "pointer", opacity: (!email.trim() || busy) ? 0.45 : 1, fontFamily: "inherit" }}>{busy ? t("auth_sending") : t("auth_send_reset")}</button>
                <div style={{ textAlign: "center", marginTop: 14, fontSize: 13, color: C.slate }}>
                  <span onClick={() => { setForgotMode(false); setErr(""); }} style={{ color: C.lime, fontWeight: 700, cursor: "pointer" }}>{t("auth_back_to_login")}</span>
                </div>
              </>
            )
          ) : (
          <>
          {isSignup && (
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 10, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 10 }}>{t("auth_choose_plan")}</div>
              <div className="pricing-grid" style={{ display: "grid", gridTemplateColumns: "1fr", gap: 10 }}>
                {PLANS.map((pl) => {
                  const on = plan === pl.id;
                  return (
                    <button key={pl.id} onClick={() => setPlan(pl.id)} style={{
                      textAlign: "left", cursor: "pointer", fontFamily: "inherit", position: "relative",
                      background: on ? "#C8F1351a" : C.turf, border: `1.5px solid ${on ? C.lime : C.line2}`,
                      borderRadius: 14, padding: 16, display: "flex", flexDirection: "column", gap: 10,
                    }}>
                      {pl.id === "pro" && (
                        <span style={{ position: "absolute", top: -10, left: 14, background: C.lime, color: C.ink, fontSize: 9, fontWeight: 800, letterSpacing: "0.06em", padding: "3px 9px", borderRadius: 999 }}>{t("auth_most_popular")}</span>
                      )}
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                        <span style={{ fontSize: 15, fontWeight: 800, color: C.chalk }}>{pl.name}</span>
                        <div style={{ width: 18, height: 18, borderRadius: 99, border: `2px solid ${on ? C.lime : C.line2}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                          {on && <div style={{ width: 8, height: 8, borderRadius: 99, background: C.lime }} />}
                        </div>
                      </div>
                      <div>
                        <span style={{ fontSize: 24, fontWeight: 900, fontFamily: "'Space Mono', monospace", color: C.chalk }}>{pl.price === 0 ? "Free" : "$" + pl.price}</span>
                        {pl.price > 0 && <span style={{ fontSize: 12, color: C.slate }}> /mo</span>}
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 2 }}>
                        {t(`plan_${pl.id}_tag`) && (
                          <div style={{ fontSize: 11.5, color: C.slate, fontStyle: "italic" }}>{t(`plan_${pl.id}_tag`)}</div>
                        )}
                        {pl.featKeys.map((fk) => (
                          <div key={fk} style={{ display: "flex", alignItems: "flex-start", gap: 7, fontSize: 12, color: C.body, lineHeight: 1.35 }}>
                            <BadgeCheck size={13} color={C.lime} style={{ flexShrink: 0, marginTop: 1 }} /> {t(fk)}
                          </div>
                        ))}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {isSignup && <input value={name} onChange={(e) => setName(e.target.value)} placeholder={t("auth_full_name")} style={field} />}
          <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder={t("auth_email")} type="email" style={field} />
          <input value={pw} onChange={(e) => setPw(e.target.value)} placeholder={t("auth_password")} type="password" style={{ ...field, marginBottom: isSignup ? 12 : 4 }} />
          {!isSignup && (
            <div style={{ textAlign: "right", marginBottom: 10 }}>
              <span onClick={() => { setForgotMode(true); setErr(""); setResetSent(false); }} style={{ color: C.slate, fontSize: 12, cursor: "pointer" }}>{t("auth_forgot")}</span>
            </div>
          )}

          {isSignup && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 11, color: C.slate, fontWeight: 700, marginBottom: 6 }}>{t("auth_dob")}</div>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={dobDay} onChange={(e) => setDobDay(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} placeholder="DD" inputMode="numeric" maxLength={2} style={{ ...dobField, flex: 1 }} />
                <input value={dobMonth} onChange={(e) => setDobMonth(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} placeholder="MM" inputMode="numeric" maxLength={2} style={{ ...dobField, flex: 1 }} />
                <input value={dobYear} onChange={(e) => setDobYear(e.target.value.replace(/[^0-9]/g, "").slice(0, 4))} placeholder="YYYY" inputMode="numeric" maxLength={4} style={{ ...dobField, flex: 1.4 }} />
              </div>
              {isMinor && (
                <div style={{ marginTop: 10 }}>
                  <div style={{ fontSize: 11.5, color: C.amber, marginBottom: 8, lineHeight: 1.4 }}>
                    {t("auth_minor_notice")}
                  </div>
                  <input value={parentEmail} onChange={(e) => setParentEmail(e.target.value)} placeholder={t("auth_parent_email")} type="email" style={{ ...field, marginBottom: 0 }} />
                </div>
              )}
            </div>
          )}

          {notice && (
            <div style={{ background: "#C8F1351a", border: "1px solid #C8F13544", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
              <div style={{ fontSize: 10, letterSpacing: "0.12em", color: C.lime, fontWeight: 800, marginBottom: 4 }}>{t("auth_check_email")}</div>
              <div style={{ color: C.chalk, fontSize: 12.5, lineHeight: 1.4 }}>{notice}</div>
            </div>
          )}

          {err && (
            <div style={{ background: "#C89B3C1a", border: "1px solid #C89B3C44", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
              <div style={{ fontSize: 10, letterSpacing: "0.12em", color: C.amber, fontWeight: 800, marginBottom: 4 }}>{isSignup ? t("auth_couldnt_signup") : t("auth_couldnt_login")}</div>
              <div style={{ color: C.warnText, fontSize: 12.5, lineHeight: 1.4 }}>{err}</div>
            </div>
          )}

          <button disabled={!ok || busy} onClick={submit} style={{ width: "100%", background: C.lime, color: C.ink, border: "none", borderRadius: 12, padding: "14px", fontWeight: 800, fontSize: 15, cursor: (!ok || busy) ? "default" : "pointer", opacity: (!ok || busy) ? 0.45 : 1, fontFamily: "inherit" }}>{cta}</button>

          {isSignup && selected.price > 0 && (
            <div style={{ textAlign: "center", marginTop: 10, fontSize: 11, color: C.slate }}>{t("auth_secure_checkout")}</div>
          )}

          <div style={{ textAlign: "center", marginTop: 14, fontSize: 13, color: C.slate }}>
            {isSignup ? t("auth_already_have") : t("auth_new_to_golsz")}
            <span onClick={() => { setMode(isSignup ? "login" : "signup"); setErr(""); }} style={{ color: C.lime, fontWeight: 700, cursor: "pointer" }}>{isSignup ? t("auth_login") : t("auth_signup")}</span>
          </div>
          </>
          )}
        </div>
      </div>
    </div>
  );
}

/* Reached only via the PASSWORD_RECOVERY auth event, fired when the user
   opens the link from a "Forgot password?" email — Supabase's client
   auto-detects the recovery token in the URL and starts a real session
   scoped just enough to call updateUser({ password }). */
function ResetPassword({ onDone }) {
  const { t } = useLang();
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [done, setDone] = useState(false);
  const field = { width: "100%", background: C.turf, border: "1px solid " + C.line2, borderRadius: 12, color: C.chalk, padding: "13px 14px", fontSize: 15, fontFamily: "inherit", outline: "none", marginBottom: 12, boxSizing: "border-box" };

  async function save() {
    if (busy) return;
    if (!pw || pw.length < 6) { setErr(t("reset_pw_min_len")); return; }
    if (pw !== pw2) { setErr(t("reset_pw_mismatch")); return; }
    setBusy(true); setErr("");
    try {
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) throw error;
      setDone(true);
    } catch (e) {
      setErr((e && e.message) || t("reset_pw_err"));
    } finally { setBusy(false); }
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "28px 18px", background: "radial-gradient(1100px 560px at 50% -12%, " + C.turf + ", " + C.pitch + ")", fontFamily: "'Archivo', system-ui, sans-serif", color: C.chalk }}>
      <style>{CSS}</style>
      <div style={{ width: "100%", maxWidth: 430 }}>
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <div style={{ fontWeight: 900, fontSize: 40, letterSpacing: "0.03em", fontStretch: "expanded" }}>GOLSZ<span style={{ color: C.lime }}>.</span></div>
        </div>
        <div style={{ background: C.card, border: "1px solid " + C.line, borderRadius: 18, padding: 20 }}>
          {done ? (
            <>
              <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 6, color: C.lime }}>{t("reset_pw_updated")}</div>
              <div style={{ fontSize: 13, color: C.slate, marginBottom: 16 }}>{t("reset_pw_allset")}</div>
              <button onClick={onDone} style={{ width: "100%", background: C.lime, color: C.ink, border: "none", borderRadius: 12, padding: "14px", fontWeight: 800, fontSize: 15, cursor: "pointer", fontFamily: "inherit" }}>{t("reset_pw_continue")}</button>
            </>
          ) : (
            <>
              <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 6 }}>{t("reset_pw_set_new")}</div>
              <div style={{ fontSize: 12.5, color: C.slate, marginBottom: 14 }}>{t("reset_pw_choose")}</div>
              <input value={pw} onChange={(e) => setPw(e.target.value)} placeholder={t("reset_pw_new_ph")} type="password" style={field} />
              <input value={pw2} onChange={(e) => setPw2(e.target.value)} placeholder={t("reset_pw_confirm_ph")} type="password" style={{ ...field, marginBottom: 14 }} />
              {err && (
                <div style={{ background: "#C89B3C1a", border: "1px solid #C89B3C44", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
                  <div style={{ color: C.warnText, fontSize: 12.5, lineHeight: 1.4 }}>{err}</div>
                </div>
              )}
              <button disabled={busy} onClick={save} style={{ width: "100%", background: C.lime, color: C.ink, border: "none", borderRadius: 12, padding: "14px", fontWeight: 800, fontSize: 15, cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1, fontFamily: "inherit" }}>{busy ? t("events_saving") : t("reset_pw_update_btn")}</button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function Root() {
  const paidReturn = typeof window !== "undefined" && /checkout=success/.test(window.location.search);
  const [authed, setAuthed] = useState(false);
  const [ready, setReady] = useState(false);
  const [freshSignup, setFreshSignup] = useState(false);
  const [recovering, setRecovering] = useState(false);

  useEffect(() => {
    // paidReturn only auto-authenticates in no-backend preview mode (no real
    // accounts exist to check). With a real backend, a URL param alone must
    // never grant access — that would let anyone skip signup entirely by
    // appending ?checkout=success. A real Stripe return still lands here
    // without a session if email confirmation is pending; Auth shows a
    // "payment received, confirm your email" notice for that case instead.
    if (!sb) { setAuthed(paidReturn); setReady(true); return; }
    let subscription;
    sb.auth.getSession().then(({ data }) => { setAuthed(!!(data && data.session)); setReady(true); });
    const r = sb.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") { setRecovering(true); return; }
      setAuthed(!!session);
    });
    subscription = r && r.data ? r.data.subscription : null;
    return () => { if (subscription) subscription.unsubscribe(); };
  }, []);

  async function signOut() { if (sb) { try { await sb.auth.signOut(); } catch (e) {} } setAuthed(false); setRecovering(false); }

  if (!ready) return React.createElement("div", { style: { minHeight: "100vh", background: C.pitch } });
  if (recovering) return React.createElement(ResetPassword, { onDone: () => setRecovering(false) });
  return authed
    ? React.createElement(GolszApp, { onSignOut: signOut, startOnboarding: freshSignup })
    : React.createElement(Auth, { onDone: (fresh) => { setFreshSignup(!!fresh); setAuthed(true); }, paidReturn });
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(LangProvider, null, React.createElement(Root)));
</script>
</body>
</html>
