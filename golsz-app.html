        {/* data grid */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 1, background: C.line, borderTop: `1px solid ${C.line}`, borderBottom: `1px solid ${C.line}` }}>
          {(real
            ? [[p.prefLabel, p.foot], ["HEIGHT", p.height], ["GRAD", p.grad], ["GPA", p.gpa], ["WEIGHT", p.weight], ["STATUS", p.status]]
            : [["FOOT", p.foot], ["HEIGHT", p.height], ["GRAD", p.grad], ["GPA", p.gpa], ["TOP SPEED", p.pace], ["STATUS", p.level]]
          ).map(([k, v]) => (
            <div key={k} style={{ background: C.card, padding: "9px 12px" }}>
              <div style={{ fontSize: 8.5, letterSpacing: "0.1em", color: C.slate, fontWeight: 700 }}>{k}</div>
              <div style={{ fontSize: 13, fontWeight: 700, fontFamily: "'Space Mono', monospace", marginTop: 2 }}>{v}</div>
            </div>
          ))}
        </div>

        {/* trust stamps — not backed by a real verification system yet, demo only */}
        {!real && (
          <div style={{ padding: "12px 14px" }}>
            <div style={{ fontSize: 9, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 8 }}>TRUST STAMPS</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {p.badges.map((b) => (
                <span key={b.label} style={{
                  display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, fontWeight: 700,
                  padding: "5px 9px", borderRadius: 6, transform: "rotate(-1.5deg)",
                  color: b.on ? C.lime : C.slate,
                  background: b.on ? "#C8F1351a" : "transparent",
                  border: `1.5px solid ${b.on ? C.lime : C.line2}`,
                  opacity: b.on ? 1 : 0.55,
                }}>
                  <BadgeCheck size={12} /> {b.label} {b.on ? "✓" : "—"}
                </span>
              ))}
            </div>
          </div>
        )}

        {/* MRZ machine-readable strip */}
        <div style={{
          background: C.pitch, borderTop: `1px solid ${C.line2}`, padding: "10px 12px",
          fontFamily: "'Space Mono', monospace", fontSize: 10.5, letterSpacing: "0.08em",
          color: C.slate, wordBreak: "break-all", lineHeight: 1.7,
        }}>{mrz}</div>
      </div>

      {/* bio */}
      <div style={{ ...card, marginTop: 14 }}>
        <div style={{ fontSize: 9, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 6 }}>SCOUTING BIO</div>
        <div style={{ fontSize: 13.5, lineHeight: 1.55, color: "#C9D6CD" }}>{p.bio}</div>
      </div>

      {/* following + followers */}
      {real && (
        <FollowListCard
          title={(n) => n === null ? "FOLLOWING" : `${n} FOLLOWING`}
          list={followingList} onViewProfile={onViewProfile}
          emptyText={viewingOther ? "Not following anyone yet." : "Not following anyone yet — check out Discover."}
        />
      )}
      {real && (
        <FollowListCard
          title={(n) => n === null ? "FOLLOWERS" : `${n} ${n === 1 ? "FOLLOWER" : "FOLLOWERS"}`}
          list={followers} onViewProfile={onViewProfile}
          emptyText={viewingOther ? "No followers yet." : "No followers yet — your Discover and Feed activity is how people find you."}
        />
      )}

      {/* media */}
      <Highlights viewUserId={viewingOther ? viewUserId : null} />

      {/* timeline — not backed by a real data model yet, demo only */}
      {!real && (
        <div style={{ ...card, marginBottom: 8 }}>
          <div style={{ fontSize: 9, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 10 }}>CAREER TIMELINE</div>
          {p.timeline.map((e, i) => (
            <div key={i} style={{ display: "flex", gap: 12, marginBottom: i < p.timeline.length - 1 ? 12 : 0 }}>
              <div style={{ fontFamily: "'Space Mono', monospace", fontWeight: 800, color: C.lime, fontSize: 13, width: 40 }}>{e.yr}</div>
              <div style={{ fontSize: 13, color: "#C9D6CD", flex: 1, borderLeft: `2px solid ${C.line2}`, paddingLeft: 12 }}>{e.txt}</div>
            </div>
          ))}
        </div>
      )}

      {!viewingOther && <RestrictedBanner />}
      {!viewingOther && <FamilyAccess />}

      {!viewingOther && profile && profile.is_admin && (
        <button onClick={onOpenAdmin} style={{
          width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
          background: "transparent", border: `1px solid ${C.amber}66`, color: C.amber, borderRadius: 10,
          padding: "11px 14px", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", marginTop: 16,
        }}><ShieldAlert size={15} /> Admin panel</button>
      )}

      {!viewingOther && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 14, marginTop: 16, paddingTop: 16, borderTop: `1px solid ${C.line}` }}>
          <a href="terms.html" style={{ fontSize: 12.5, color: C.slate, cursor: "pointer", textDecoration: "none" }}>Terms & Conditions</a>
          <span style={{ color: C.line2 }}>·</span>
          <a href="index.html" style={{ fontSize: 12.5, color: C.slate, cursor: "pointer", textDecoration: "none" }}>golsz.com</a>
          <span style={{ color: C.line2 }}>·</span>
          <button onClick={onSignOut} style={{ background: "transparent", border: `1px solid ${C.line2}`, color: C.lime, borderRadius: 8, padding: "7px 14px", fontSize: 12.5, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>Sign out</button>
        </div>
      )}
    </div>
  );
}
function PassRow({ k, v, mono }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "2.5px 0" }}>
      <span style={{ fontSize: 9.5, color: C.slate, fontWeight: 700, letterSpacing: "0.08em", alignSelf: "center" }}>{k}</span>
      <span style={{ fontSize: 12.5, fontWeight: 700, fontFamily: mono ? "'Space Mono', monospace" : "inherit", textAlign: "right" }}>{v}</span>
    </div>
  );
}
function FollowListCard({ title, list, onViewProfile, emptyText }) {
  const [expanded, setExpanded] = useState(false);
  const count = list === null ? null : list.length;
  return (
    <div style={{ ...card }}>
      <button
        onClick={() => count > 0 && setExpanded((e) => !e)}
        disabled={!count}
        style={{
          background: "none", border: "none", padding: 0, cursor: count ? "pointer" : "default",
          fontFamily: "inherit", fontSize: 9, letterSpacing: "0.16em", color: C.slate, fontWeight: 700,
          marginBottom: expanded ? 8 : 0, display: "flex", alignItems: "center", gap: 5,
        }}
      >
        {title(count)}
        {count > 0 && (expanded ? <ChevronUp size={12} /> : <ChevronDown size={12} />)}
      </button>
      {list === null && <div style={{ fontSize: 12.5, color: C.slate, marginTop: 8 }}>Loading…</div>}
      {list && list.length === 0 && <div style={{ fontSize: 12.5, color: C.slate, marginTop: 8 }}>{emptyText}</div>}
      {expanded && list && list.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
          {list.map((f) => (
            <div key={f.id}
              onClick={() => onViewProfile && onViewProfile(f.id)}
              style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 0", cursor: onViewProfile ? "pointer" : "default" }}
            >
              <Avatar init={initials(f.name)} size={30} />
              <span style={{ fontSize: 13, fontWeight: 600 }}>{f.name}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============ ADMIN PANEL ============
   Gated entirely by server-side RLS (is_admin(), migration 009) — every
   query and mutation here only succeeds if the signed-in user's own
   profiles.is_admin is true, regardless of how this component is reached.
   The UI check below (authorized state) is just for a clean "not
   authorized" message instead of a wall of empty/failed queries. */
function AdminPanel({ onBack }) {
  const [authorized, setAuthorized] = useState(null);
  const [tab, setTab] = useState("reports");
  const [stats, setStats] = useState(null);
  const [reports, setReports] = useState(null);
  const [users, setUsers] = useState(null);
  const [userQuery, setUserQuery] = useState("");
  const [events, setEvents] = useState(null);
  const [evTitle, setEvTitle] = useState(""); const [evSport, setEvSport] = useState("Soccer");
  const [evLoc, setEvLoc] = useState(""); const [evLevel, setEvLevel] = useState("");
  const [evDate, setEvDate] = useState(""); const [evSpots, setEvSpots] = useState("");

  async function loadStats() {
    try {
      const [{ count: userCount }, { count: postCount }, { count: eventCount }, { count: pendingReports }] = await Promise.all([
        sb.from("profiles").select("id", { count: "exact", head: true }),
        sb.from("posts").select("id", { count: "exact", head: true }),
        sb.from("events").select("id", { count: "exact", head: true }),
        sb.from("post_reports").select("id", { count: "exact", head: true }).is("resolved_at", null),
      ]);
      setStats({ userCount: userCount || 0, postCount: postCount || 0, eventCount: eventCount || 0, pendingReports: pendingReports || 0 });
    } catch (e) { console.error("GOLSZ admin stats error:", e); }
  }

  async function loadReports() {
    try {
      const { data, error } = await sb.from("post_reports").select("id, post_id, reporter_id, reason, created_at, resolved_at").order("created_at", { ascending: false }).limit(100);
      if (error) throw error;
      const postIds = [...new Set((data || []).map((r) => r.post_id))];
      const { data: posts } = postIds.length ? await sb.from("posts").select("id, author_id, headline, body").in("id", postIds) : { data: [] };
      const postById = Object.fromEntries((posts || []).map((p) => [p.id, p]));
      const peopleIds = [...new Set([...(data || []).map((r) => r.reporter_id), ...(posts || []).map((p) => p.author_id)])];
      const { data: names } = peopleIds.length ? await sb.from("public_profile_names").select("id, full_name").in("id", peopleIds) : { data: [] };
      const nameById = Object.fromEntries((names || []).map((n) => [n.id, n.full_name]));
      setReports((data || []).map((r) => {
        const post = postById[r.post_id];
        return { ...r, post, reporterName: nameById[r.reporter_id] || "Unknown", authorName: post ? (nameById[post.author_id] || "Unknown") : "(post deleted)" };
      }));
    } catch (e) { console.error("GOLSZ admin reports error:", e); setReports([]); }
  }
  async function resolveReport(id) {
    try { await sb.from("post_reports").update({ resolved_at: new Date().toISOString() }).eq("id", id); loadReports(); loadStats(); }
    catch (e) { console.error("GOLSZ admin resolve report error:", e); }
  }
  async function deleteReportedPost(postId, reportId) {
    try {
      await sb.from("posts").delete().eq("id", postId);
      await sb.from("post_reports").update({ resolved_at: new Date().toISOString() }).eq("id", reportId);
      loadReports(); loadStats();
    } catch (e) { console.error("GOLSZ admin delete post error:", e); }
  }

  async function loadUsers(query) {
    try {
      let q = sb.from("profiles").select("id, full_name, plan, is_minor, is_admin, created_at").order("created_at", { ascending: false }).limit(100);
      if (query && query.trim()) q = q.ilike("full_name", `%${query.trim()}%`);
      const { data, error } = await q;
      if (error) throw error;
      setUsers(data || []);
    } catch (e) { console.error("GOLSZ admin users error:", e); setUsers([]); }
  }
  async function setUserAdmin(id, val) {
    try { await sb.from("profiles").update({ is_admin: val }).eq("id", id); loadUsers(userQuery); }
    catch (e) { console.error("GOLSZ admin set-admin error:", e); }
  }
  async function setUserPlan(id, val) {
    try { await sb.from("profiles").update({ plan: val }).eq("id", id); loadUsers(userQuery); }
    catch (e) { console.error("GOLSZ admin set-plan error:", e); }
  }

  async function loadEvents() {
    try {
      const { data, error } = await sb.from("events").select("id, title, sport, location, level, event_date, spots_available").order("event_date", { ascending: true }).limit(100);
      if (error) throw error;
      setEvents(data || []);
    } catch (e) { console.error("GOLSZ admin events error:", e); setEvents([]); }
  }
  async function deleteEvent(id) {
    try { await sb.from("events").delete().eq("id", id); loadEvents(); loadStats(); }
    catch (e) { console.error("GOLSZ admin delete event error:", e); }
  }
  async function createEvent() {
    if (!evTitle.trim() || !evDate) return;
    try {
      const { data: { user } } = await sb.auth.getUser();
      const { error } = await sb.from("events").insert({
        title: evTitle.trim(), sport: evSport, location: evLoc.trim() || null,
        level: evLevel.trim() || null, event_date: evDate,
        spots_available: evSpots ? Number(evSpots) : null, created_by: user.id,
      });
      if (error) throw error;
      setEvTitle(""); setEvLoc(""); setEvLevel(""); setEvDate(""); setEvSpots("");
      loadEvents(); loadStats();
    } catch (e) { console.error("GOLSZ admin create event error:", e); }
  }

  useEffect(() => {
    if (!sb) { setAuthorized(false); return; }
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { setAuthorized(false); return; }
        const { data: prof } = await sb.from("profiles").select("is_admin").eq("id", user.id).single();
        const ok = !!(prof && prof.is_admin);
        setAuthorized(ok);
        if (ok) { loadStats(); loadReports(); loadUsers(); loadEvents(); }
      } catch (e) { console.error("GOLSZ admin auth-check error:", e); setAuthorized(false); }
    })();
  }, []);

  const field = { background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 9, color: C.chalk, padding: "8px 10px", fontSize: 13, fontFamily: "inherit", outline: "none" };
  const tabBtn = (id, label) => (
    <button onClick={() => setTab(id)} style={{
      flex: 1, padding: "9px 0", borderRadius: 9, border: "none", cursor: "pointer", fontFamily: "inherit",
      fontSize: 12.5, fontWeight: 700, background: tab === id ? C.lime : "transparent", color: tab === id ? C.pitch : C.slate,
    }}>{label}</button>
  );

  if (authorized === null) return <div style={{ padding: 20, color: C.slate, fontSize: 13 }}>Checking access…</div>;
  if (!authorized) return (
    <div style={{ padding: 20 }}>
      <div style={{ fontSize: 13, color: C.slate }}>Admins only.</div>
      <button onClick={onBack} style={{ ...iconBtn(C.lime), marginTop: 10 }}><ChevronLeft size={16} /> Back</button>
    </div>
  );

  return (
    <div style={{ padding: "8px 12px 20px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "4px 2px 12px" }}>
        <button onClick={onBack} style={iconBtn(C.chalk)}><ChevronLeft size={20} /></button>
        <SectionTitle noMargin>Admin panel</SectionTitle>
      </div>

      {stats && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginBottom: 14 }}>
          {[["Users", stats.userCount], ["Posts", stats.postCount], ["Events", stats.eventCount], ["Pending", stats.pendingReports]].map(([k, v]) => (
            <div key={k} style={{ ...card, margin: 0, padding: "10px 8px", textAlign: "center" }}>
              <div style={{ fontSize: 18, fontWeight: 900, fontFamily: "'Space Mono', monospace", color: k === "Pending" && v > 0 ? C.amber : C.lime }}>{v}</div>
              <div style={{ fontSize: 9, letterSpacing: "0.08em", color: C.slate, fontWeight: 700 }}>{k.toUpperCase()}</div>
            </div>
          ))}
        </div>
      )}

      <div style={{ display: "flex", gap: 4, background: C.turf, borderRadius: 11, padding: 4, marginBottom: 14 }}>
        {tabBtn("reports", "Reports")}
        {tabBtn("users", "Users")}
        {tabBtn("events", "Events")}
      </div>

      {tab === "reports" && (
        <div>
          {reports === null && <div style={{ color: C.slate, fontSize: 13 }}>Loading…</div>}
          {reports && reports.length === 0 && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "20px 0" }}>No reports yet.</div>}
          {reports && reports.map((r) => (
            <div key={r.id} style={{ ...card, opacity: r.resolved_at ? 0.5 : 1 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10.5, color: C.slate, marginBottom: 6 }}>
                <span>Reported by {r.reporterName}{r.reason ? ` — "${r.reason}"` : ""}</span>
                <span>{timeAgo(r.created_at)}</span>
              </div>
              {r.post ? (
                <div style={{ fontSize: 13, marginBottom: 8 }}>
                  <b>{r.authorName}:</b> {r.post.headline}{r.post.body ? ` — ${r.post.body}` : ""}
                </div>
              ) : <div style={{ fontSize: 13, color: C.slate, marginBottom: 8, fontStyle: "italic" }}>Post already removed.</div>}
              {!r.resolved_at ? (
                <div style={{ display: "flex", gap: 8 }}>
                  {r.post && (
                    <button onClick={() => deleteReportedPost(r.post_id, r.id)} style={{ ...iconBtn(C.amber), fontSize: 11.5 }}><Trash2 size={13} /> Delete post</button>
                  )}
                  <button onClick={() => resolveReport(r.id)} style={{ ...iconBtn(C.slate), fontSize: 11.5 }}>Dismiss</button>
                </div>
              ) : <div style={{ fontSize: 10.5, color: C.lime }}>Resolved</div>}
            </div>
          ))}
        </div>
      )}

      {tab === "users" && (
        <div>
          <input value={userQuery} onChange={(e) => setUserQuery(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") loadUsers(userQuery); }}
            placeholder="Search by name…" style={{ ...field, width: "100%", boxSizing: "border-box", marginBottom: 10 }} />
          {users === null && <div style={{ color: C.slate, fontSize: 13 }}>Loading…</div>}
          {users && users.map((u) => (
            <div key={u.id} style={{ ...card, display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 700, fontSize: 13.5, display: "flex", alignItems: "center", gap: 6 }}>
                  {u.full_name || "(no name)"}
                  {u.is_minor && <span style={{ fontSize: 9, color: C.amber, border: `1px solid ${C.amber}66`, borderRadius: 5, padding: "1px 5px" }}>MINOR</span>}
                  {u.is_admin && <span style={{ fontSize: 9, color: C.lime, border: `1px solid ${C.lime}66`, borderRadius: 5, padding: "1px 5px" }}>ADMIN</span>}
                </div>
                <div style={{ fontSize: 10.5, color: C.slate, fontFamily: "'Space Mono', monospace" }}>joined {timeAgo(u.created_at)} ago</div>
              </div>
              <select value={u.plan} onChange={(e) => setUserPlan(u.id, e.target.value)} style={{ ...field, padding: "5px 7px", fontSize: 11.5 }}>
                <option value="starter">starter</option><option value="pro">pro</option><option value="elite">elite</option>
              </select>
              <button onClick={() => setUserAdmin(u.id, !u.is_admin)} style={{
                fontSize: 10.5, fontWeight: 700, padding: "5px 9px", borderRadius: 7, cursor: "pointer", fontFamily: "inherit",
                background: u.is_admin ? "#C8F1351a" : "transparent", color: u.is_admin ? C.lime : C.slate, border: `1px solid ${u.is_admin ? C.lime : C.line2}`,
              }}>{u.is_admin ? "Revoke admin" : "Make admin"}</button>
            </div>
          ))}
        </div>
      )}

      {tab === "events" && (
        <div>
          <div style={{ ...card }}>
            <div style={{ fontSize: 9, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 8 }}>ADD EVENT</div>
            <input value={evTitle} onChange={(e) => setEvTitle(e.target.value)} placeholder="Title" style={{ ...field, width: "100%", boxSizing: "border-box", marginBottom: 8 }} />
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
              <select value={evSport} onChange={(e) => setEvSport(e.target.value)} style={field}>
                {SPORTS.filter((s) => s !== "All").map((s) => <option key={s} value={s}>{s}</option>)}
              </select>
              <input type="date" value={evDate} onChange={(e) => setEvDate(e.target.value)} style={field} />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
              <input value={evLoc} onChange={(e) => setEvLoc(e.target.value)} placeholder="Location" style={field} />
              <input value={evLevel} onChange={(e) => setEvLevel(e.target.value)} placeholder="Level" style={field} />
            </div>
            <input type="number" value={evSpots} onChange={(e) => setEvSpots(e.target.value)} placeholder="Spots available" style={{ ...field, width: "100%", boxSizing: "border-box", marginBottom: 10 }} />
            <button onClick={createEvent} disabled={!evTitle.trim() || !evDate} style={{
              width: "100%", background: C.lime, color: C.pitch, border: "none", borderRadius: 10, padding: "11px", fontWeight: 800, fontSize: 13.5, cursor: "pointer", fontFamily: "inherit",
              opacity: !evTitle.trim() || !evDate ? 0.5 : 1,
            }}>Create event</button>
          </div>
          {events === null && <div style={{ color: C.slate, fontSize: 13 }}>Loading…</div>}
          {events && events.map((e) => (
            <div key={e.id} style={{ ...card, display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 700, fontSize: 13.5 }}>{e.title}</div>
                <div style={{ fontSize: 10.5, color: C.slate, fontFamily: "'Space Mono', monospace" }}>{e.event_date} · {e.sport} · {e.location || "—"}</div>
              </div>
              <button onClick={() => deleteEvent(e.id)} style={iconBtn(C.amber)}><Trash2 size={15} /></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============ AI SCOUT (live agent) ============ */
const SYS = `You are GOLSZ Scout, an AI sports agent. Tagline: "Every Goal Has a Path."
You are the personal agent for ONE athlete: learn who they are (age, sport, position, location, club/level, grad year, academics, budget, citizenship, goal), build a career roadmap, suggest realistic target programs (reach/match/safety, honest), and draft coach outreach emails on request (draft-only; the athlete sends them).
Some fields may already be filled in from the athlete's real GOLSZ Passport (profile they built themselves) — treat those as trustworthy and confirmed, not something to re-ask. Open by briefly acknowledging what you already know about them (sport/position/club/grad year if present) instead of asking generic intro questions, then move straight to something useful.
Be warm, direct, honest — never overpromise. If a target looks unrealistic, say so kindly and show the realistic path. If the athlete seems to be a minor, remind them once to involve a parent/guardian. Use web search for real current programs, coaches, showcases, and eligibility rules. Ask at most ONE question per reply. Keep replies tight for a phone screen.
If asked what AI model or company powers you, who made you, or whether you're ChatGPT/OpenAI/Claude/Anthropic/Gemini/etc., always answer that you are GOLSZ Scout, built by GOLSZ — never name or confirm any underlying model or provider, and don't explain that you're declining to say. Just answer as GOLSZ Scout and move on.
OUTPUT ONLY valid JSON, no markdown fences: {"reply":"conversational text","profile_updates":{...only newly-learned fields or null}}
Allowed keys: name, age, sport, position, location, club, level, grad_year, gpa, budget, citizenship, goal. Do not repeat known fields.`;

const CHIPS = ["Build my target school list", "Create my career roadmap", "Draft an email to a coach", "What should I do this month?"];
const CHIP_ICONS = [Compass, Radar, MessageSquare, CalendarDays];

const SCOUT_GREETING = "I'm your GOLSZ Scout.\n\nTell me about yourself like you'd tell a scout — age, sport, position, where you play, and where you want to end up. I'll build your path from there.";
function scoutGreetingFor(seeded) {
  const who = [seeded.sport, seeded.position].filter(Boolean).join(" · ");
  if (!who && !seeded.name) return SCOUT_GREETING;
  const first = seeded.name ? seeded.name.split(" ")[0] : null;
  const hello = first ? `Hey ${first} — ` : "Hey — ";
  const context = who
    ? `I've got you down as a ${who}${seeded.club ? ` at ${seeded.club}` : ""}${seeded.grad_year ? `, class of ${seeded.grad_year}` : ""}. `
    : "";
  return `${hello}I'm your GOLSZ Scout. ${context}\n\nWhat's the plan — your target school list, this season's roadmap, or something else?`;
}
function newScoutConvId() {
  return (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
}

function Scout() {
  const [msgs, setMsgs] = useState(sb ? null : [{ role: "assistant", text: SCOUT_GREETING }]);
  const [loaded, setLoaded] = useState(!sb); // no backend at all -> nothing to wait for, show demo greeting immediately
  const [profile, setProfile] = useState({});
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [conversationId, setConversationId] = useState(() => newScoutConvId());
  const [showHistory, setShowHistory] = useState(false);
  const [history, setHistory] = useState(null);
  const uidRef = useRef(null);
  const endRef = useRef(null);
  const baseProfileRef = useRef({});
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs, busy]);

  // Seed Scout's working profile from the athlete's real Passport data (so
  // it already knows who it's helping instead of re-asking basics the
  // athlete already filled in), then restore their most recent Scout
  // conversation, if any. Real scout_history is (id, user_id,
  // conversation_id, messages jsonb, created_at) — each transcript row's
  // `messages` is a one-element [{role,content}] array; metering rows
  // (written server-side by increment_scout_usage) are `[]` and flatten to
  // nothing here, so no separate filtering is needed. Only the latest
  // conversation is loaded on mount — older ones are reachable via
  // History, not auto-flattened into one ever-growing chat like before.
  useEffect(() => {
    if (!sb) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { setMsgs([{ role: "assistant", text: SCOUT_GREETING }]); return; }
        uidRef.current = user.id;

        const [{ data: prof }, { data: ath }] = await Promise.all([
          sb.from("profiles").select("full_name, dob").eq("id", user.id).single(),
          sb.from("athletes").select("sport, position, grad_year, gpa, country, club_name, recruiting_status").eq("id", user.id).single(),
        ]);
        const seeded = {};
        if (prof && prof.full_name) seeded.name = prof.full_name;
        if (prof && prof.dob) {
          const b = new Date(prof.dob), t = new Date();
          let a = t.getFullYear() - b.getFullYear();
          if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
          seeded.age = a;
        }
        if (ath) {
          if (ath.sport) seeded.sport = ath.sport;
          if (ath.position) seeded.position = ath.position;
          if (ath.country) { seeded.location = ath.country; seeded.citizenship = ath.country; }
          if (ath.club_name) seeded.club = ath.club_name;
          if (ath.recruiting_status) seeded.level = ath.recruiting_status;
          if (ath.grad_year) seeded.grad_year = ath.grad_year;
          if (ath.gpa) seeded.gpa = ath.gpa;
        }
        baseProfileRef.current = seeded;
        if (Object.keys(seeded).length) setProfile((p) => ({ ...seeded, ...p }));

        const { data, error } = await sb
          .from("scout_history")
          .select("conversation_id, messages, created_at")
          .eq("user_id", user.id)
          .order("created_at", { ascending: true })
          .limit(1000);
        if (error) throw error;
        const rows = (data || []).filter((r) => Array.isArray(r.messages) && r.messages.length);
        if (rows.length) {
          const lastConvId = rows[rows.length - 1].conversation_id;
          const restored = rows.filter((r) => r.conversation_id === lastConvId).flatMap((r) => r.messages);
          setConversationId(lastConvId);
          setMsgs(restored.map((m) => ({ role: m.role, text: m.content })));
        } else {
          setMsgs([{ role: "assistant", text: scoutGreetingFor(seeded) }]);
        }
      } catch (e) {
        console.error("GOLSZ scout history load error:", e);
        setMsgs((m) => m || [{ role: "assistant", text: SCOUT_GREETING }]);
      } finally { setLoaded(true); }
    })();
  }, []);

  async function logTurn(role, text) {
    if (!sb || !uidRef.current) return;
    try { await sb.from("scout_history").insert({ user_id: uidRef.current, conversation_id: conversationId, messages: [{ role, content: text }] }); }
    catch (e) { console.error("GOLSZ scout history write error:", e); }
  }

  function newChat() {
    setMsgs([{ role: "assistant", text: scoutGreetingFor(baseProfileRef.current) }]);
    setProfile(baseProfileRef.current);
    setConversationId(newScoutConvId());
    setShowHistory(false);
  }

  async function loadHistoryList() {
    if (!sb || !uidRef.current) return;
    try {
      const { data, error } = await sb
        .from("scout_history")
        .select("conversation_id, messages, created_at")
        .eq("user_id", uidRef.current)
        .order("created_at", { ascending: true })
        .limit(1000);
      if (error) throw error;
      const byConv = new Map();
      for (const r of data || []) {
        if (!Array.isArray(r.messages) || !r.messages.length) continue;
        if (!byConv.has(r.conversation_id)) byConv.set(r.conversation_id, { lastAt: r.created_at, turns: 0, preview: "" });
        const entry = byConv.get(r.conversation_id);
        entry.lastAt = r.created_at;
        entry.turns += r.messages.length;
        if (!entry.preview) {
          const firstUser = r.messages.find((m) => m.role === "user");
          if (firstUser) entry.preview = firstUser.content.slice(0, 60);
        }
      }
      const list = [...byConv.entries()].map(([id, v]) => ({ id, ...v })).sort((a, b) => new Date(b.lastAt) - new Date(a.lastAt));
      setHistory(list);
    } catch (e) { console.error("GOLSZ scout history list error:", e); setHistory([]); }
  }

  function openHistory() {
    if (showHistory) { setShowHistory(false); return; }
    setShowHistory(true);
    loadHistoryList();
  }

  async function loadConversation(id) {
    if (!sb || !uidRef.current) return;
    try {
      const { data, error } = await sb
        .from("scout_history").select("messages, created_at")
        .eq("user_id", uidRef.current).eq("conversation_id", id)
        .order("created_at", { ascending: true });
      if (error) throw error;
      const restored = (data || []).flatMap((r) => Array.isArray(r.messages) ? r.messages : []);
      setMsgs(restored.length ? restored.map((m) => ({ role: m.role, text: m.content })) : [{ role: "assistant", text: SCOUT_GREETING }]);
      setConversationId(id);
      setShowHistory(false);
    } catch (e) { console.error("GOLSZ scout load conversation error:", e); }
  }

  async function deleteConversation(id) {
    if (!sb || !uidRef.current) return;
    setHistory((h) => (h || []).filter((c) => c.id !== id));
    try {
      const { error } = await sb.from("scout_history").delete().eq("user_id", uidRef.current).eq("conversation_id", id);
      if (error) throw error;
      if (id === conversationId) {
        // the open conversation was deleted — reset to a fresh chat rather
        // than leaving the transcript on screen with nothing behind it
        const fresh = newScoutConvId();
        setConversationId(fresh);
        setProfile(baseProfileRef.current);
        setMsgs([{ role: "assistant", text: scoutGreetingFor(baseProfileRef.current) }]);
      }
    } catch (e) {
      console.error("GOLSZ delete conversation error:", e);
      loadHistoryList(); // reload the real list on failure, undoing the optimistic removal
    }
  }

  async function send(text) {
    const content = text.trim(); if (!content || busy || !loaded) return;
    setInput("");
    const next = [...(msgs || []), { role: "user", text: content }];
    setMsgs(next); setBusy(true);
    logTurn("user", content);
    try {
      const api = next.map((m) => ({ role: m.role, content: m.text }));
      api[api.length - 1] = { role: "user", content: `PROFILE SO FAR: ${JSON.stringify(profile)}\n\nATHLETE: ${content}` };
      let _hdr = { "Content-Type": "application/json" };
      try { if (typeof sb !== "undefined" && sb) { const _s = await sb.auth.getSession(); if (_s && _s.data && _s.data.session) _hdr["Authorization"] = "Bearer " + _s.data.session.access_token; } } catch (e) {}
      const _endpoint = (typeof SCOUT_ENDPOINT !== "undefined" && SCOUT_ENDPOINT) ? SCOUT_ENDPOINT : "https://api.anthropic.com/v1/messages";
      const res = await fetch(_endpoint, {
        method: "POST", headers: _hdr,
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, system: SYS, messages: api, tools: [{ type: "web_search_20250305", name: "web_search" }] }),
      });
      const data = await res.json();
      const raw = (data.content || []).map((b) => (b.type === "text" ? b.text : "")).filter(Boolean).join("\n");
      let reply = raw, updates = null;
      try {
        const clean = raw.replace(/```json|```/g, "").trim();
        const parsed = JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}") + 1));
        reply = parsed.reply || raw; updates = parsed.profile_updates || null;
      } catch { /* raw */ }
      if (updates && typeof updates === "object") setProfile((p) => ({ ...p, ...updates }));
      setMsgs((m) => [...m, { role: "assistant", text: reply }]);
      logTurn("assistant", reply);
    } catch {
      setMsgs((m) => [...m, { role: "assistant", text: "Connection dropped mid-play. Send that again and I'm on it." }]);
    } finally { setBusy(false); }
  }

  const known = Object.keys(profile).filter((k) => profile[k]);
  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      <div style={{ padding: "10px 14px", borderBottom: `1px solid ${C.line}`, display: "flex", alignItems: "center", gap: 8 }}>
        <Radar size={18} color={C.lime} />
        <span style={{ fontWeight: 800, letterSpacing: "0.04em" }}>AI SCOUT</span>
        <span style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 12 }}>
          <span style={{ fontSize: 10, color: C.slate, fontFamily: "'Space Mono', monospace" }}>
            {known.length ? `${known.length} FIELDS ON FILE` : "LIVE AGENT"}
          </span>
          <button onClick={openHistory} title="History" style={iconBtn(showHistory ? C.lime : C.slate)}><History size={16} /></button>
          <button onClick={newChat} title="New chat" style={iconBtn(C.lime)}><Plus size={17} /></button>
        </span>
      </div>

      {showHistory ? (
        <div style={{ flex: 1, overflowY: "auto", padding: "14px 12px 6px" }}>
          {history === null && <div style={{ color: C.slate, fontSize: 13 }}>Loading…</div>}
          {history && history.length === 0 && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "30px 0" }}>No past conversations yet.</div>}
          {history && history.map((h) => (
            <div key={h.id} style={{
              ...card, display: "flex", alignItems: "center", gap: 8,
              border: `1px solid ${h.id === conversationId ? C.lime : C.line}`,
            }}>
              <button onClick={() => loadConversation(h.id)} style={{ flex: 1, minWidth: 0, textAlign: "left", background: "none", border: "none", cursor: "pointer", fontFamily: "inherit", padding: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 3, color: "#FFFFFF" }}>{h.preview || "New conversation"}</div>
                <div style={{ fontSize: 10.5, color: C.slate, fontFamily: "'Space Mono', monospace" }}>{timeAgo(h.lastAt)} ago · {h.turns} messages</div>
              </button>
              <button onClick={() => deleteConversation(h.id)} title="Delete conversation" style={{ background: "none", border: "none", color: C.slate, cursor: "pointer", padding: 4, flexShrink: 0, display: "flex" }}>
                <Trash2 size={15} />
              </button>
            </div>
          ))}
        </div>
      ) : (
        <div style={{ flex: 1, overflowY: "auto", padding: "14px 12px 6px" }}>
          {!loaded && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "30px 0" }}>Loading…</div>}
          {msgs && msgs.map((m, i) => (
            <div key={i} className="msg" style={m.role === "user" ? bubbleUser : bubbleAgent}>
              {m.role === "assistant" && <div style={{ fontSize: 9, letterSpacing: "0.22em", color: C.lime, fontWeight: 800, marginBottom: 4 }}>SCOUT</div>}
              <div style={{ whiteSpace: "pre-wrap" }}>{m.text}</div>
            </div>
          ))}
          {loaded && !busy && msgs && msgs.length <= 1 && (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 6 }}>
              {CHIPS.map((q, i) => {
                const Icon = CHIP_ICONS[i];
                return (
                  <button key={q} onClick={() => send(q)} style={{
                    display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 8, textAlign: "left",
                    background: C.card, border: `1px solid ${C.line2}`, borderRadius: 12, padding: 12,
                    cursor: "pointer", fontFamily: "inherit", color: C.chalk,
                  }}>
                    <Icon size={17} color={C.lime} />
                    <span style={{ fontSize: 12.5, fontWeight: 700, lineHeight: 1.3 }}>{q}</span>
                  </button>
                );
              })}
            </div>
          )}
          {busy && <div style={bubbleAgent}><div className="running"><span /><span /><span /></div></div>}
          <div ref={endRef} />
        </div>
      )}

      {!showHistory && (
        <>
          {msgs && msgs.length > 1 && (
            <div style={{ display: "flex", gap: 8, overflowX: "auto", padding: "6px 12px", scrollbarWidth: "none" }} className="noscroll">
              {CHIPS.map((q) => <button key={q} onClick={() => send(q)} disabled={busy || !loaded} style={{ flex: "0 0 auto", background: "transparent", border: `1px solid ${C.line2}`, color: C.lime, borderRadius: 999, padding: "7px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap" }}>{q}</button>)}
            </div>
          )}
          <div style={{ display: "flex", gap: 8, padding: "10px 12px 14px", borderTop: `1px solid ${C.line}` }}>
            <textarea rows={1} value={input} placeholder="Talk to your scout…" onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input); } }}
              style={{ flex: 1, background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 12, color: C.chalk, padding: "11px 13px", fontSize: 14, fontFamily: "inherit", resize: "none", outline: "none" }} />
            <button onClick={() => send(input)} disabled={busy || !loaded || !input.trim()} style={{ background: C.lime, color: C.pitch, border: "none", borderRadius: 12, width: 46, cursor: "pointer", opacity: busy || !loaded || !input.trim() ? 0.4 : 1 }}><Send size={17} /></button>
          </div>
        </>
      )}
    </div>
  );
}

/* ============ shell ============ */
function SectionTitle({ children, noMargin }) {
  return <h2 style={{ fontSize: 13, fontWeight: 800, letterSpacing: "0.12em", color: C.slate, textTransform: "uppercase", margin: noMargin ? 0 : "6px 2px 10px" }}>{children}</h2>;
}
const card = { background: C.card, border: `1px solid ${C.line}`, borderRadius: 16, padding: 14, marginBottom: 12, boxShadow: "0 6px 18px -12px rgba(0,0,0,0.6)" };
const iconBtn = (color) => ({ display: "inline-flex", alignItems: "center", gap: 5, background: "none", border: "none", color, fontSize: 12.5, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", padding: 0 });
const bubbleAgent = { background: C.turf, border: `1px solid ${C.line2}`, borderRadius: "2px 14px 14px 14px", padding: "10px 13px", margin: "0 30px 12px 0", fontSize: 14, lineHeight: 1.55 };
const bubbleUser = { background: C.lime, color: C.pitch, borderRadius: "14px 2px 14px 14px", padding: "10px 13px", margin: "0 0 12px 30px", fontSize: 14, lineHeight: 1.55, fontWeight: 500 };

function GolszApp({ onSignOut, startOnboarding }) {
  const [page, setPage] = useState(() => {
    if (startOnboarding) return "profile";
    try {
      const p = new URLSearchParams(window.location.search).get("page");
      const valid = ["feed", "discover", "scout", "events", "profile", "messages", "admin"];
      return valid.includes(p) ? p : "feed";
    } catch (e) { return "feed"; }
  });
  const [thread, setThread] = useState(null);
  const [hasUnreadMsgs, setHasUnreadMsgs] = useState(false);
  const [onboarding, setOnboarding] = useState(!!startOnboarding);
  const [viewProfileId, setViewProfileId] = useState(null);
  const isDesktop = useIsDesktop();

  const NAV = [
    { id: "feed", icon: Home, label: "Feed" },
    { id: "discover", icon: Compass, label: "Discover" },
    { id: "scout", icon: Radar, label: "Scout", center: true },
    { id: "events", icon: CalendarDays, label: "Events" },
    { id: "profile", icon: User, label: "Passport" },
  ];

  const SIDEBAR_NAV = [
    { id: "feed", icon: Home, label: "Home" },
    { id: "discover", icon: Compass, label: "Discover" },
    { id: "scout", icon: Radar, label: "AI Scout" },
    { id: "events", icon: CalendarDays, label: "Events" },
    { id: "messages", icon: MessageSquare, label: "Messages", badge: hasUnreadMsgs },
    { id: "profile", icon: User, label: "Profile" },
  ];

  const go = (id) => { setPage(id); if (id !== "messages") setThread(null); setViewProfileId(null); };
  const openThread = (id) => { setThread(id); setPage("messages"); };
  const viewProfile = (id) => { setViewProfileId(id); setPage("profile"); };

  useEffect(() => {
    if (!sb) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) return;
        const { count } = await sb.from("messages").select("id", { count: "exact", head: true }).eq("recipient_id", user.id).is("read_at", null);
        setHasUnreadMsgs((count || 0) > 0);
      } catch (e) { console.error("GOLSZ unread check error:", e); }
    })();
  }, [page]);

  if (isDesktop) {
    return (
      <div style={{ display: "flex", minHeight: "100vh", background: C.pitch, color: C.chalk, fontFamily: "'Archivo', system-ui, sans-serif" }}>
        <style>{CSS}</style>

        {/* sidebar */}
        <aside style={{ width: 232, flexShrink: 0, borderRight: `1px solid ${C.line}`, display: "flex", flexDirection: "column", padding: "22px 14px", position: "sticky", top: 0, height: "100vh" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 10px", marginBottom: 26 }}>
            <a href="index.html" style={{ fontWeight: 900, fontSize: 22, letterSpacing: "0.03em", fontStretch: "expanded", color: "inherit", textDecoration: "none" }}>GOLSZ<span style={{ color: C.lime }}>.</span></a>
            <NotificationBell />
          </div>
          <nav style={{ display: "flex", flexDirection: "column", gap: 2, flex: 1 }}>
            {SIDEBAR_NAV.map((n) => {
              const active = page === n.id;
              return (
                <button key={n.id} onClick={() => go(n.id)} style={{
                  display: "flex", alignItems: "center", gap: 12, padding: "10px 12px", borderRadius: 10,
                  background: active ? "#C8F1351a" : "transparent", border: "none", cursor: "pointer", fontFamily: "inherit",
                  color: active ? C.lime : C.chalk, fontSize: 14, fontWeight: active ? 700 : 600, textAlign: "left",
                }}>
                  <n.icon size={19} strokeWidth={active ? 2.4 : 2} />
                  {n.label}
                  {n.badge && <span style={{ width: 7, height: 7, borderRadius: 99, background: C.lime, marginLeft: "auto" }} />}
                </button>
              );
            })}
          </nav>
          <button onClick={onSignOut} style={{
            display: "flex", alignItems: "center", gap: 12, padding: "10px 12px", borderRadius: 10,
            background: "transparent", border: `1px solid ${C.line2}`, cursor: "pointer", fontFamily: "inherit",
            color: C.slate, fontSize: 13, fontWeight: 600, textAlign: "left", marginTop: 8,
          }}>Sign out</button>
        </aside>

        {/* main content */}
        <main style={{ flex: 1, overflowY: "auto" }} className="noscroll">
          <div style={{ maxWidth: 720, margin: "0 auto", padding: "28px 32px 60px" }}>
            {page === "feed" && <Feed onMessage={openThread} onViewProfile={viewProfile} />}
            {page === "discover" && <Discover onMessage={openThread} onViewProfile={viewProfile} />}
            {page === "scout" && <div style={{ height: "calc(100vh - 88px)", border: `1px solid ${C.line}`, borderRadius: 16, overflow: "hidden" }}><Scout /></div>}
            {page === "events" && <Events />}
            {page === "profile" && <Passport onSignOut={onSignOut} autoEdit={onboarding} onAutoEditConsumed={() => setOnboarding(false)} onOpenAdmin={() => setPage("admin")} viewUserId={viewProfileId} onBack={() => setViewProfileId(null)} onMessage={openThread} onViewProfile={viewProfile} />}
            {page === "messages" && <div style={{ height: "calc(100vh - 88px)", border: `1px solid ${C.line}`, borderRadius: 16, overflow: "hidden" }}><Messages thread={thread} setThread={setThread} /></div>}
            {page === "admin" && <AdminPanel onBack={() => setPage("profile")} />}
          </div>
        </main>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100vh", background: C.pitch, color: C.chalk, fontFamily: "'Archivo', system-ui, sans-serif", maxWidth: 480, margin: "0 auto", position: "relative" }}>
      <style>{CSS}</style>

      {/* top bar */}
      <header style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px 10px", borderBottom: `1px solid ${C.line}`, flexShrink: 0 }}>

/* Reached only via the PASSWORD_RECOVERY auth event, fired when the user
   opens the link from a "Forgot password?" email — Supabase's client
   auto-detects the recovery token in the URL and starts a real session
   scoped just enough to call updateUser({ password }). */
function ResetPassword({ onDone }) {
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");

  async function save() {
    if (busy) return;
    if (!pw || pw.length < 6) { setErr("Password must be at least 6 characters."); return; }
    if (pw !== pw2) { setErr("Passwords don't match."); return; }
    setBusy(true); setErr("");
    try {
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) throw error;
      setDone(true);
    } catch (e) {
      setErr((e && e.message) || "Couldn't update password.");
    } finally { setBusy(false); }
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "28px 18px", background: "radial-gradient(1100px 560px at 50% -12%, #16241C, " + C.pitch + ")", fontFamily: "'Archivo', system-ui, sans-serif", color: C.chalk }}>
      <style>{CSS}</style>
      <div style={{ width: "100%", maxWidth: 430 }}>
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <div style={{ fontWeight: 900, fontSize: 40, letterSpacing: "0.03em", fontStretch: "expanded" }}>GOLSZ<span style={{ color: C.lime }}>.</span></div>
        </div>
        <div style={{ background: C.card, border: "1px solid " + C.line, borderRadius: 18, padding: 20 }}>
          {done ? (
            <>
              <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 6, color: C.lime }}>Password updated</div>
              <div style={{ fontSize: 13, color: C.slate, marginBottom: 16 }}>You're all set — continue into GOLSZ.</div>
              <button onClick={onDone} style={{ width: "100%", background: C.lime, color: C.pitch, border: "none", borderRadius: 12, padding: "14px", fontWeight: 800, fontSize: 15, cursor: "pointer", fontFamily: "inherit" }}>Continue</button>
            </>
          ) : (
            <>
              <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 6 }}>Set a new password</div>
              <div style={{ fontSize: 12.5, color: C.slate, marginBottom: 14 }}>Choose a new password for your GOLSZ account.</div>
              <input value={pw} onChange={(e) => setPw(e.target.value)} placeholder="New password" type="password" style={field} />
              <input value={pw2} onChange={(e) => setPw2(e.target.value)} placeholder="Confirm new password" type="password" style={{ ...field, marginBottom: 14 }} />
              {err && (
                <div style={{ background: "#C89B3C1a", border: "1px solid #C89B3C44", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
                  <div style={{ color: "#E7C56B", fontSize: 12.5, lineHeight: 1.4 }}>{err}</div>
                </div>
              )}
              <button disabled={busy} onClick={save} style={{ width: "100%", background: C.lime, color: C.pitch, border: "none", borderRadius: 12, padding: "14px", fontWeight: 800, fontSize: 15, cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1, fontFamily: "inherit" }}>{busy ? "Saving…" : "Update password"}</button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function Root() {
  const paidReturn = typeof window !== "undefined" && /checkout=success/.test(window.location.search);
  const [authed, setAuthed] = useState(false);
  const [ready, setReady] = useState(false);
  const [freshSignup, setFreshSignup] = useState(false);
  const [recovering, setRecovering] = useState(false);

  useEffect(() => {
    // paidReturn only auto-authenticates in no-backend preview mode (no real
    // accounts exist to check). With a real backend, a URL param alone must
    // never grant access — that would let anyone skip signup entirely by
    // appending ?checkout=success. A real Stripe return still lands here
    // without a session if email confirmation is pending; Auth shows a
    // "payment received, confirm your email" notice for that case instead.
    if (!sb) { setAuthed(paidReturn); setReady(true); return; }
    let subscription;
    sb.auth.getSession().then(({ data }) => { setAuthed(!!(data && data.session)); setReady(true); });
    const r = sb.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") { setRecovering(true); return; }
      setAuthed(!!session);
    });
    subscription = r && r.data ? r.data.subscription : null;
    return () => { if (subscription) subscription.unsubscribe(); };
  }, []);

  async function signOut() { if (sb) { try { await sb.auth.signOut(); } catch (e) {} } setAuthed(false); setRecovering(false); }

  if (!ready) return React.createElement("div", { style: { minHeight: "100vh", background: C.pitch } });
  if (recovering) return React.createElement(ResetPassword, { onDone: () => setRecovering(false) });
  return authed
    ? React.createElement(GolszApp, { onSignOut: signOut, startOnboarding: freshSignup })
    : React.createElement(Auth, { onDone: (fresh) => { setFreshSignup(!!fresh); setAuthed(true); }, paidReturn });
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Root));
</script>
</body>
</html>
