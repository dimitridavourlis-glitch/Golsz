/* ============ MESSAGES ============ */
/* Real DMs, Instagram-style (migration 037): anyone can message anyone
   (no follow relationship required) — but the very first message
   between two people creates a "request" the recipient must explicitly
   accept before it's a normal, freely-flowing conversation. Enforced
   server-side by can_message()/message_requests, not just hidden in
   the UI. `thread` is a real profile uuid (string) once a conversation
   is open, or null for the list view — always real data, no demo
   fallback. */
function Messages({ thread, setThread, onViewProfile }) {
  const { t } = useLang();
  const [uid, setUid] = useState(null);
  const [conversations, setConversations] = useState(null);
  const [query, setQuery] = useState("");
  const [threadMsgs, setThreadMsgs] = useState([]);
  const [counterpart, setCounterpart] = useState(null);
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [savingEvent, setSavingEvent] = useState(null);
  const [threadReqStatus, setThreadReqStatus] = useState(null); // 'pending_sent' | 'pending_received' | 'accepted' | null
  const [reportedThread, setReportedThread] = useState(false);
  const threadRef = useRef(thread);
  useEffect(() => { threadRef.current = thread; }, [thread]);
  useEffect(() => { setReportedThread(false); }, [thread]);

  useEffect(() => {
    if (!sb) return;
    (async () => {
      const { data: { user } } = await sb.auth.getUser();
      if (user) setUid(user.id);
    })();
  }, []);

  // live delivery: without this a conversation only ever refreshed on an
  // explicit action (opening it, hitting send) — postgres_changes respects
  // messages_read RLS, so this only ever fires for rows this user can
  // already see (see supabase-migration-015-realtime-messages.sql).
  useEffect(() => {
    if (!sb || !uid) return;
    const channel = sb
      .channel(`messages-inbox-${uid}`)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: `recipient_id=eq.${uid}` }, (payload) => {
        const m = payload.new;
        if (threadRef.current === m.sender_id) {
          setThreadMsgs((list) => (list.some((x) => x.id === m.id) ? list : [...list, m]));
          sb.from("messages").update({ read_at: new Date().toISOString() }).eq("id", m.id).then(() => {});
        }
        loadConversations();
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [uid]);

  async function loadConversations() {
    if (!sb || !uid) return;
    try {
      // message_requests (migration 037) — one row per (sender, recipient)
      // pair, tracking whether the recipient has accepted messages from
      // that specific sender yet. Fetched alongside messages so each
      // conversation can be tagged as needing my decision ("request"),
      // still waiting on them, or already a normal open conversation.
      const [{ data, error }, { data: reqs }] = await Promise.all([
        sb.from("messages").select("id, sender_id, recipient_id, body, created_at, read_at")
          .or(`sender_id.eq.${uid},recipient_id.eq.${uid}`)
          .order("created_at", { ascending: false })
          .limit(300),
        sb.from("message_requests").select("sender_id, recipient_id, status").or(`sender_id.eq.${uid},recipient_id.eq.${uid}`),
      ]);
      if (error) throw error;
      const reqByCounterpart = new Map();
      for (const r of reqs || []) {
        const other = r.sender_id === uid ? r.recipient_id : r.sender_id;
        reqByCounterpart.set(other, { status: r.status, iSent: r.sender_id === uid });
      }
      const byCounterpart = new Map();
      for (const m of data || []) {
        const other = m.sender_id === uid ? m.recipient_id : m.sender_id;
        if (!byCounterpart.has(other)) byCounterpart.set(other, { last: m, unread: 0 });
        if (m.recipient_id === uid && !m.read_at) byCounterpart.get(other).unread += 1;
      }
      // a hidden conversation ("delete conversation") stays hidden until a
      // new message arrives after it was hidden — same as most DM apps'
      // delete/archive-thread behavior, without destroying any messages.
      const { data: hidden } = await sb.from("hidden_conversations").select("other_id, hidden_at").eq("user_id", uid);
      const hiddenAt = Object.fromEntries((hidden || []).map((h) => [h.other_id, h.hidden_at]));
      const ids = [...byCounterpart.keys()].filter((id) => {
        const h = hiddenAt[id];
        return !h || new Date(byCounterpart.get(id).last.created_at) > new Date(h);
      });
      let names = {};
      if (ids.length) {
        const { data: ppl } = await sb.from("public_profile_names").select("id, full_name").in("id", ids);
        names = Object.fromEntries((ppl || []).map((p) => [p.id, p.full_name]));
      }
      const list = ids.map((id) => {
        const { last, unread } = byCounterpart.get(id);
        const name = names[id] || "GOLSZ User";
        const req = reqByCounterpart.get(id);
        const isPendingReceived = !!(req && req.status === "pending" && !req.iSent);
        return { id, who: name, init: initials(name), last: last.body, ago: timeAgo(last.created_at), unread: unread > 0, isPendingReceived };
      });
      // requests needing my decision float to the top, same as Instagram's
      // separate Requests inbox, just without a second screen to build.
      list.sort((a, b) => (b.isPendingReceived ? 1 : 0) - (a.isPendingReceived ? 1 : 0));
      setConversations(list);
    } catch (e) { console.error("GOLSZ messages load error:", e); setConversations([]); }
  }
  useEffect(() => { if (uid) loadConversations(); }, [uid]);

  async function hideConversation(otherId) {
    if (!sb || !uid) return;
    setConversations((list) => (list || []).filter((c) => c.id !== otherId));
    try {
      const { error } = await sb.from("hidden_conversations").upsert({ user_id: uid, other_id: otherId, hidden_at: new Date().toISOString() });
      if (error) throw error;
    } catch (e) {
      console.error("GOLSZ hide conversation error:", e);
      loadConversations(); // revert the optimistic removal on failure
    }
  }

  // Only the real recipient (auth.uid() inside the RPC) can ever accept
  // or decline a request addressed to them — otherId here just selects
  // which pending request, it can't be used to approve one on someone
  // else's behalf. Declining just hides the thread the same way deleting
  // a conversation already does — can_message() already stops that
  // sender from reaching this person again once declined, so there's
  // nothing left to reveal by bringing it back.
  async function respondToRequest(otherId, accept) {
    if (!sb || !uid) return;
    try {
      const { error } = await sb.rpc("respond_to_message_request", { p_sender: otherId, p_accept: accept });
      if (error) throw error;
      if (accept) {
        loadConversations();
        if (thread === otherId) loadThread(otherId);
      } else {
        hideConversation(otherId);
      }
    } catch (e) { console.error("GOLSZ respond to message request error:", e); }
  }

  async function loadThread(otherId) {
    if (!sb || !uid || !otherId) return;
    try {
      const [{ data: ppl }, { data: msgs, error }, { data: reqRow }] = await Promise.all([
        sb.from("public_profile_names").select("id, full_name").eq("id", otherId).maybeSingle(),
        sb.from("messages").select("id, sender_id, recipient_id, body, created_at, read_at")
          .or(`and(sender_id.eq.${uid},recipient_id.eq.${otherId}),and(sender_id.eq.${otherId},recipient_id.eq.${uid})`)
          .order("created_at", { ascending: true }),
        sb.from("message_requests").select("sender_id, status")
          .or(`and(sender_id.eq.${uid},recipient_id.eq.${otherId}),and(sender_id.eq.${otherId},recipient_id.eq.${uid})`)
          .maybeSingle(),
      ]);
      if (error) throw error;
      setCounterpart({ id: otherId, name: (ppl && ppl.full_name) || "GOLSZ User" });
      setThreadMsgs(msgs || []);
      setThreadReqStatus(
        !reqRow ? null
        : reqRow.status !== "pending" ? "accepted"
        : reqRow.sender_id === otherId ? "pending_received"
        : "pending_sent"
      );
      const unreadIds = (msgs || []).filter((m) => m.recipient_id === uid && !m.read_at).map((m) => m.id);
      if (unreadIds.length) {
        await sb.from("messages").update({ read_at: new Date().toISOString() }).in("id", unreadIds);
        loadConversations();
      }
    } catch (e) { console.error("GOLSZ thread load error:", e); }
  }
  useEffect(() => { if (typeof thread === "string" && uid) loadThread(thread); }, [thread, uid]);

  async function send() {
    if (!sb || !uid || typeof thread !== "string" || !text.trim() || busy) return;
    setBusy(true); setErr("");
    const body = text.trim().slice(0, 2000);
    try {
      const { decision } = await moderateContent({ text: body, contentType: "direct_message", surface: "private_thread", recipientId: thread });
      if (decision === "block") { setErr(t("moderation_blocked")); setBusy(false); return; }
      // Idempotent (migration 037) — no-ops if a request already exists in
      // either direction. Required before the very first message to
      // someone new; messages_write's RLS rejects the insert below
      // without it, since can_message() now checks for this row instead
      // of a follow relationship.
      await sb.rpc("ensure_message_request", { p_recipient: thread });
      const { error } = await sb.from("messages").insert({ sender_id: uid, recipient_id: thread, body });
      if (error) throw error;
      setText("");
      loadThread(thread);
      loadConversations();
    } catch (e) {
      console.error("GOLSZ send message error:", e);
      setErr(t("messages_cant_send"));
    } finally { setBusy(false); }
  }

  async function deleteMessage(id) {
    if (!sb || !uid) return;
    setThreadMsgs((list) => list.filter((m) => m.id !== id));
    try {
      const { error } = await sb.from("messages").delete().eq("id", id).eq("sender_id", uid);
      if (error) throw error;
    } catch (e) {
      console.error("GOLSZ delete message error:", e);
      loadThread(thread); // revert the optimistic removal on failure
    }
  }

  // Trust & Safety Moderation System — generalized report path (migration
  // 060, content_reports) alongside the existing post_reports-only
  // reportPost() elsewhere in this file. target_id is the counterpart's
  // user id — there's no single message id that represents a whole
  // conversation, and that's what a DM report is actually about.
  async function reportThread(counterpartId) {
    if (!sb || !uid || !counterpartId || reportedThread) return;
    try {
      await sb.from("content_reports").insert({ reporter_id: uid, target_type: "message", target_id: counterpartId, reason: "reported from message thread" });
      setReportedThread(true);
    } catch (e) { console.error("GOLSZ thread report error:", e); }
  }

  if (typeof thread === "string") {
    const name = (counterpart && counterpart.name) || "…";
    return (
      <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", borderBottom: `1px solid ${C.line}` }}>
          <button onClick={() => setThread(null)} style={iconBtn(C.chalk)}><ChevronLeft size={20} /></button>
          <button
            onClick={() => onViewProfile && onViewProfile(thread)}
            title={t("messages_view_passport")}
            style={{ display: "flex", alignItems: "center", gap: 10, background: "none", border: "none", padding: 0, cursor: onViewProfile ? "pointer" : "default", fontFamily: "inherit" }}
          >
            <Avatar init={initials(name)} size={36} />
            <div style={{ fontWeight: 700, fontSize: 14, color: C.msgName }}>{name}</div>
          </button>
          <button onClick={() => reportThread(thread)} style={{ ...iconBtn(reportedThread ? C.amber : C.slate), fontSize: 11, marginLeft: "auto" }}>
            {reportedThread ? t("action_reported") : t("action_report")}
          </button>
        </div>
        <div style={{ flex: 1, overflowY: "auto", padding: 14 }}>
          {threadMsgs.length === 0 && (
            <div style={{ textAlign: "center", color: C.slate, fontSize: 12.5, marginTop: 20 }}>
              {t("messages_say_hello_pre")}{name}{t("messages_say_hello_post")}
            </div>
          )}
          {threadMsgs.map((m) => (
            <div key={m.id} style={{ display: "flex", alignItems: "flex-end", gap: 6, marginBottom: 10, justifyContent: m.sender_id === uid ? "flex-end" : "flex-start" }}>
              {m.sender_id !== uid && hasDateMention(m.body) && (
                <button onClick={() => setSavingEvent(m)} title={t("messages_save_to_events")} style={{ background: "none", border: "none", color: C.slate, cursor: "pointer", padding: 4, flexShrink: 0 }}>
                  <CalendarPlus size={14} />
                </button>
              )}
              <div style={{
                maxWidth: "78%",
                background: m.sender_id === uid ? C.lime : C.turf, color: m.sender_id === uid ? C.ink : C.chalk,
                padding: "9px 12px", fontSize: 13.5, lineHeight: 1.45,
                borderRadius: m.sender_id === uid ? "12px 2px 12px 12px" : "2px 12px 12px 12px",
                border: m.sender_id === uid ? "none" : `1px solid ${C.line2}`, fontWeight: m.sender_id === uid ? 500 : 400,
              }}>{m.body}</div>
              {m.sender_id === uid && (
                <button onClick={() => deleteMessage(m.id)} title={t("messages_delete_msg")} style={{ background: "none", border: "none", color: C.slate, cursor: "pointer", padding: 4, flexShrink: 0 }}>
                  <Trash2 size={14} />
                </button>
              )}
            </div>
          ))}
        </div>
        {savingEvent && (
          <AddToEventsModal
            initialTitle={`${t("messages_opportunity_from")}${name}`}
            initialNotes={savingEvent.body}
            onClose={() => setSavingEvent(null)}
            onSaved={() => setSavingEvent(null)}
          />
        )}
        {err && <div style={{ padding: "0 12px 8px", color: C.amber, fontSize: 11.5 }}>{err}</div>}
        {threadReqStatus === "pending_received" ? (
          <div style={{ padding: "12px", borderTop: `1px solid ${C.line}` }}>
            <div style={{ fontSize: 12.5, color: C.slate, marginBottom: 10, textAlign: "center" }}>
              {t("messages_request_banner_pre")}{name}{t("messages_request_banner_post")}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => respondToRequest(thread, false)} style={{
                flex: 1, background: "transparent", border: `1px solid ${C.line2}`, borderRadius: 10,
                color: C.chalk, padding: "10px 0", fontSize: 13.5, fontWeight: 700, cursor: "pointer", fontFamily: "inherit",
              }}>{t("messages_decline")}</button>
              <button onClick={() => respondToRequest(thread, true)} style={{
                flex: 1, background: C.lime, border: "none", borderRadius: 10,
                color: C.ink, padding: "10px 0", fontSize: 13.5, fontWeight: 700, cursor: "pointer", fontFamily: "inherit",
              }}>{t("messages_accept")}</button>
            </div>
          </div>
        ) : (
          <>
            {threadReqStatus === "pending_sent" && (
              <div style={{ padding: "0 12px 8px", color: C.slate, fontSize: 11.5, textAlign: "center" }}>{t("messages_request_pending_hint")}</div>
            )}
            <div style={{ display: "flex", gap: 8, padding: "10px 12px", borderTop: `1px solid ${C.line}` }}>
              <input value={text} onChange={(e) => setText(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") send(); }}
                placeholder={t("messages_placeholder")} style={{
                flex: 1, background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 10,
                color: C.chalk, padding: "10px 12px", fontSize: 13.5, fontFamily: "inherit", outline: "none",
              }} />
              <button onClick={send} disabled={busy || !text.trim()} style={{
                background: C.lime, border: "none", borderRadius: 10, width: 44, color: C.ink,
                cursor: busy || !text.trim() ? "default" : "pointer", opacity: busy || !text.trim() ? 0.5 : 1,
              }}><Send size={16} /></button>
            </div>
          </>
        )}
      </div>
    );
  }

  const q = query.trim().toLowerCase();
  const visibleConversations = conversations && (q ? conversations.filter((t) => t.who.toLowerCase().includes(q)) : conversations);

  return (
    <div style={{ padding: "8px 12px 16px" }}>
      <SectionTitle>{t("messages_title")}</SectionTitle>
      {conversations && conversations.length > 0 && (
        <div style={{ position: "relative", marginBottom: 12 }}>
          <Search size={16} color={C.slate} style={{ position: "absolute", left: 13, top: "50%", transform: "translateY(-50%)" }} />
          <input
            value={query} onChange={(e) => setQuery(e.target.value)}
            placeholder={t("messages_search")}
            style={{
              width: "100%", background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 12,
              color: C.chalk, padding: "11px 14px 11px 38px", fontSize: 13.5, fontFamily: "inherit",
              outline: "none", boxSizing: "border-box",
            }}
          />
        </div>
      )}
      {conversations === null && <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "30px 0" }}>{t("loading")}</div>}
      {conversations && conversations.length === 0 && (
        <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "30px 0" }}>
          {t("messages_empty")}
        </div>
      )}
      {conversations && conversations.length > 0 && visibleConversations.length === 0 && (
        <div style={{ color: C.slate, fontSize: 13, textAlign: "center", padding: "30px 0" }}>{t("messages_no_match")}</div>
      )}
      {visibleConversations && visibleConversations.map((conv) => (
        <div key={conv.id} style={{
          ...card, display: "flex", flexDirection: "column", gap: 8,
          border: `1px solid ${conv.isPendingReceived ? C.limeBorder : conv.unread ? C.line2 : C.line}`,
        }}>
          <div style={{ display: "flex", gap: 11, alignItems: "center" }}>
            <button onClick={() => setThread(conv.id)} style={{
              display: "flex", gap: 11, alignItems: "center", flex: 1, minWidth: 0,
              textAlign: "left", cursor: "pointer", background: "none", border: "none", padding: 0, fontFamily: "inherit",
            }}>
              <Avatar init={conv.init} ring={conv.v ? C.lime : C.line2} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                  <span style={{ fontWeight: 700, fontSize: 14, color: C.msgName }}>{conv.who}</span>
                  {conv.v && <BadgeCheck size={13} color={C.lime} />}
                  {conv.unread && <span style={{ width: 8, height: 8, borderRadius: 99, background: C.lime, flexShrink: 0, marginLeft: 4 }} />}
                  <span style={{ marginLeft: "auto", fontSize: 10.5, color: C.slate }}>{conv.ago}</span>
                </div>
                {conv.isPendingReceived ? (
                  <div style={{ fontSize: 10.5, color: C.lime, fontWeight: 700, marginBottom: 3 }}>{t("messages_new_request")}</div>
                ) : conv.role && <div style={{ fontSize: 10.5, color: C.slate, fontFamily: "'Space Mono', monospace", marginBottom: 3 }}>{conv.role}</div>}
                <div style={{ fontSize: 12.5, color: conv.unread ? C.chalk : C.slate, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", fontWeight: conv.unread ? 600 : 400 }}>
                  {conv.last}
                </div>
              </div>
            </button>
            {!conv.isPendingReceived && (
              <button onClick={() => hideConversation(conv.id)} title={t("messages_delete_conv")} style={{ background: "none", border: "none", color: C.slate, cursor: "pointer", padding: 4, flexShrink: 0, display: "flex" }}>
                <Trash2 size={16} />
              </button>
            )}
          </div>
          {conv.isPendingReceived && (
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => respondToRequest(conv.id, false)} style={{
                flex: 1, background: "transparent", border: `1px solid ${C.line2}`, borderRadius: 8,
                color: C.chalk, padding: "7px 0", fontSize: 12.5, fontWeight: 700, cursor: "pointer", fontFamily: "inherit",
              }}>{t("messages_decline")}</button>
              <button onClick={() => respondToRequest(conv.id, true)} style={{
                flex: 1, background: C.lime, border: "none", borderRadius: 8,
                color: C.ink, padding: "7px 0", fontSize: 12.5, fontWeight: 700, cursor: "pointer", fontFamily: "inherit",
              }}>{t("messages_accept")}</button>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

/* ============ FAMILY & PARENT ACCESS ============
   Lets a parent (their own account) request access to a child's account by
   email, and lets the child approve/deny — the child is the only one who
   can set parent_links.approved_at (enforced server-side by RLS, see
   supabase-migration-003-parent-verification.sql). This is mutual in-app
   consent, not identity-verified parental consent. */
function FamilyAccess() {
  const { t } = useLang();
  const [uid, setUid] = useState(null);
  const [email, setEmail] = useState("");
  const [relationship, setRelationship] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [pending, setPending] = useState([]);
  const [grantedToMe, setGrantedToMe] = useState([]);
  const [myLinks, setMyLinks] = useState([]);

  async function load() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return;
    setUid(user.id);
    try {
      // real parent_links is (id, parent_id, athlete_id, relationship, approved_at, created_at) —
      // fetch both directions, then resolve counterpart names in a second pass instead of
      // embedding via a guessed FK constraint name.
      const [{ data: asChild }, { data: asParent }] = await Promise.all([
        sb.from("parent_links").select("id, relationship, approved_at, parent_id").eq("athlete_id", user.id),
        sb.from("parent_links").select("id, relationship, approved_at, athlete_id").eq("parent_id", user.id),
      ]);
      const otherIds = [...new Set([...(asChild || []).map((r) => r.parent_id), ...(asParent || []).map((r) => r.athlete_id)])];
      let names = {};
      if (otherIds.length) {
        const { data: ppl } = await sb.from("profiles").select("id, full_name").in("id", otherIds);
        if (ppl) names = Object.fromEntries(ppl.map((p) => [p.id, p.full_name]));
      }
      if (asChild) {
        const withNames = asChild.map((r) => ({ ...r, name: names[r.parent_id] }));
        setPending(withNames.filter((r) => !r.approved_at));
        setGrantedToMe(withNames.filter((r) => r.approved_at));
      }
      if (asParent) setMyLinks(asParent.map((r) => ({ ...r, name: names[r.athlete_id] })));
    } catch (e) { console.error("GOLSZ family load error:", e); }
  }
  useEffect(() => { if (sb) load(); }, []);

  async function requestLink() {
    if (!email.trim() || busy) return;
    setBusy(true); setMsg("");
    try {
      const { data, error } = await sb.rpc("request_parent_link", { p_child_email: email.trim(), p_relationship: relationship.trim() || null });
      if (error) throw error;
      setMsg(data ? t("family_sent_msg") : t("family_not_found_msg"));
      setEmail(""); setRelationship("");
      load();
    } catch (e) { setMsg(e.message || t("family_couldnt_send")); }
    finally { setBusy(false); }
  }
  async function approve(id) { try { await sb.from("parent_links").update({ approved_at: new Date().toISOString() }).eq("id", id); load(); } catch (e) { console.error("GOLSZ approve error:", e); } }
  async function remove(id) { try { await sb.from("parent_links").delete().eq("id", id); load(); } catch (e) { console.error("GOLSZ remove link error:", e); } }

  if (!sb || !uid) return null;
  const rowStyle = { display: "flex", alignItems: "center", gap: 8, padding: "6px 0" };
  const smallBtn = (outline) => ({ background: outline ? "transparent" : C.lime, color: outline ? C.slate : C.ink, border: outline ? `1px solid ${C.line2}` : "none", borderRadius: 7, padding: "5px 10px", fontSize: 11, fontWeight: 800, cursor: "pointer", fontFamily: "inherit" });

  return (
    <div style={{ ...card, marginBottom: 8 }}>
      <div style={{ fontSize: 9, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 10 }}>{t("family_title")}</div>

      {pending.length > 0 && (
        <div style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 11, color: C.amber, fontWeight: 700, marginBottom: 6 }}>{t("family_pending")}</div>
          {pending.map((r) => (
            <div key={r.id} style={rowStyle}>
              <span style={{ flex: 1, fontSize: 13 }}>{r.name || t("family_someone")}{t("family_wants_access")}{r.relationship ? ` (${r.relationship})` : ""}</span>
              <button onClick={() => approve(r.id)} style={smallBtn(false)}>{t("family_approve")}</button>
              <button onClick={() => remove(r.id)} style={smallBtn(true)}>{t("family_deny")}</button>
            </div>
          ))}
        </div>
      )}

      {grantedToMe.length > 0 && (
        <div style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 11, color: C.slate, fontWeight: 700, marginBottom: 6 }}>{t("family_granted_title")}</div>
          {grantedToMe.map((r) => (
            <div key={r.id} style={rowStyle}>
              <span style={{ flex: 1, fontSize: 13 }}>{r.name || t("family_parent_fallback")}{r.relationship ? ` · ${r.relationship}` : ""}</span>
              <button onClick={() => remove(r.id)} style={smallBtn(true)}>{t("family_revoke")}</button>
            </div>
          ))}
        </div>
      )}

      {myLinks.length > 0 && (
        <div style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 11, color: C.slate, fontWeight: 700, marginBottom: 6 }}>{t("family_mylinks_title")}</div>
          {myLinks.map((r) => (
            <div key={r.id} style={rowStyle}>
              <span style={{ flex: 1, fontSize: 13 }}>{r.name || t("family_athlete_fallback")}{r.relationship ? ` · ${r.relationship}` : ""}</span>
              <span style={{ fontSize: 10.5, color: r.approved_at ? C.lime : C.amber, fontWeight: 700 }}>{r.approved_at ? t("family_approved") : t("family_pending_status")}</span>
            </div>
          ))}
        </div>
      )}

      <div style={{ fontSize: 11, color: C.slate, fontWeight: 700, marginBottom: 6 }}>{t("family_request_title")}</div>
      <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
        <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder={t("family_email_ph")} style={{ flex: 1, background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 9, color: C.chalk, padding: "9px 11px", fontSize: 13, fontFamily: "inherit", outline: "none" }} />
      </div>
      <div style={{ display: "flex", gap: 6 }}>
        <input value={relationship} onChange={(e) => setRelationship(e.target.value)} placeholder={t("family_relationship_ph")} style={{ flex: 1, background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 9, color: C.chalk, padding: "9px 11px", fontSize: 13, fontFamily: "inherit", outline: "none" }} />
        <button onClick={requestLink} disabled={busy || !email.trim()} style={{ background: C.lime, color: C.ink, border: "none", borderRadius: 9, padding: "9px 14px", fontWeight: 800, fontSize: 12.5, cursor: "pointer", fontFamily: "inherit", opacity: busy || !email.trim() ? 0.5 : 1 }}>{t("family_send")}</button>
      </div>
      {msg && <div style={{ fontSize: 11.5, color: C.slate, marginTop: 8 }}>{msg}</div>}
      <div style={{ fontSize: 10.5, color: C.slate, marginTop: 10, lineHeight: 1.4 }}>
        {t("family_disclaimer")}
      </div>
    </div>
  );
}

/* ============ VERIFIED MEDIA (highlight reels) ============
   Link-based, not hosted video — athletes paste a link to footage already
   hosted elsewhere (YouTube, Veo, Hudl...). Stored in the athletes.highlights
   jsonb column. Always real data — no demo placeholders — and each entry
   only ever shows its title and link, nothing fabricated. */
function Highlights({ viewUserId, manageMode }) {
  const { t } = useLang();
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [uid, setUid] = useState(null);
  const [title, setTitle] = useState("");
  const [url, setUrl] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  // The "VERIFIED MEDIA" label used to show unconditionally — every
  // account's self-submitted, AI-moderated links, whether or not the
  // account itself was ever actually verified. Now it only claims
  // "verified" when the owner has real identity verification
  // (profiles.identity_verified, migration 058's admin-reviewed
  // workflow) — anyone else sees a neutral "Media" header instead.
  const [ownerVerified, setOwnerVerified] = useState(false);
  // manageMode = an approved parent managing this under-16 athlete (P0-4).
  // They are not the account owner, but they ARE the person responsible for
  // it, and RLS already grants them write access (profiles_self /
  // athletes_rw include is_parent_of). targetId is the row being edited —
  // the child's, not the parent's.
  const isOwner = !!(uid && (!viewUserId || viewUserId === uid || manageMode));
  const targetId = viewUserId || uid;

  useEffect(() => {
    if (!sb) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) return;
        setUid(user.id);
        const targetId = viewUserId || user.id;
        const [{ data, error }, { data: prof }] = await Promise.all([
          sb.from("athletes").select("highlights").eq("id", targetId).single(),
          sb.from("profiles").select("identity_verified").eq("id", targetId).maybeSingle(),
        ]);
        if (error) throw error;
        setItems(Array.isArray(data && data.highlights) ? data.highlights : []);
        setOwnerVerified(!!(prof && prof.identity_verified));
        setLoaded(true);
      } catch (e) { console.error("GOLSZ highlights load error:", e); }
    })();
  }, [viewUserId]);

  async function saveList(list) {
    if (!sb || !uid || !isOwner) return;
    try { await sb.from("athletes").update({ highlights: list }).eq("id", targetId); }
    catch (e) { console.error("GOLSZ highlights save error:", e); }
  }

  async function addHighlight() {
    if (!sb || !uid || !isOwner || !title.trim() || !url.trim() || busy) return;
    setBusy(true); setErr("");
    try {
      let parsed;
      // new URL() only rejects malformed strings, not unsafe schemes —
      // javascript:/data:/vbscript: all parse successfully and would
      // otherwise get stored and later rendered as a real <a href>,
      // executing on click. Restricting to http(s) here is what actually
      // enforces the "must start with https://" this already claimed.
      try {
        parsed = new URL(url.trim());
        if (parsed.protocol !== "http:" && parsed.protocol !== "https:") throw new Error("bad protocol");
      } catch { throw new Error(t("highlights_invalid_url")); }
      const { decision } = await moderateContent({ text: title, contentType: "media_caption", surface: "profile" });
      if (decision === "block") throw new Error(t("moderation_blocked"));
      const entry = {
        id: (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()),
        title: title.trim(), url: parsed.toString(),
      };
      const next = [...items, entry];
      await saveList(next);
      setItems(next);
      setTitle(""); setUrl("");
      // also share it to Feed as a clip post, same as any other post — the
      // 'clip' kind already existed in posts' schema and the original demo
      // Feed data for exactly this ("New defensive highlight reel is live")
      try { await sb.from("posts").insert({ author_id: targetId, kind: "clip", headline: entry.title, body: entry.url }); }
      catch (e) { console.error("GOLSZ clip post error:", e); }
    } catch (e) {
      setErr((e && e.message) ? e.message : t("highlights_add_err"));
    } finally { setBusy(false); }
  }

  async function removeHighlight(id) {
    if (!sb || !uid || !isOwner) return;
    const next = items.filter((m) => m.id !== id);
    setItems(next);
    await saveList(next);
  }

  return (
    <div style={{ ...card }}>
      <div style={{ fontSize: 9, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 8, display: "flex", alignItems: "center", gap: 6 }}>
        {ownerVerified && <BadgeCheck size={11} color={C.lime} />}
        {ownerVerified ? t("highlights_title") : t("highlights_title_unverified")}
      </div>
      {loaded && items.length === 0 && (
        <div style={{ fontSize: 12.5, color: C.slate }}>{t("highlights_empty")}</div>
      )}
      {items.map((m, i) => (
        <div key={m.id || i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 0", borderBottom: i < items.length - 1 ? `1px solid ${C.line}` : "none" }}>
          <div style={{ width: 6, height: 6, borderRadius: 99, background: C.lime, flexShrink: 0 }} />
          {m.url && safeHref(m.url) ? (
            <a href={safeHref(m.url)} target="_blank" rel="noopener noreferrer" style={{ fontSize: 13, flex: 1, color: C.chalk, textDecoration: "none" }}>{m.title}</a>
          ) : (
            <span style={{ fontSize: 13, flex: 1 }}>{m.title}</span>
          )}
          {isOwner && m.id && (
            <button onClick={() => removeHighlight(m.id)} style={{ background: "none", border: "none", color: C.slate, cursor: "pointer", padding: 0, marginLeft: 4, display: "flex" }}><X size={13} /></button>
          )}
        </div>
      ))}
      {sb && isOwner && (
        <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.line}` }}>
          <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder={t("highlights_title_ph")}
            style={{ width: "100%", background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 9, color: C.chalk, padding: "9px 11px", fontSize: 12.5, fontFamily: "inherit", outline: "none", marginBottom: 6, boxSizing: "border-box" }} />
          <div style={{ display: "flex", gap: 6 }}>
            <input value={url} onChange={(e) => setUrl(e.target.value)} placeholder={t("highlights_link_ph")}
              style={{ flex: 1, background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 9, color: C.chalk, padding: "9px 11px", fontSize: 12.5, fontFamily: "inherit", outline: "none", boxSizing: "border-box" }} />
            <button onClick={addHighlight} disabled={!title.trim() || !url.trim() || busy} style={{ background: C.lime, color: C.ink, border: "none", borderRadius: 9, padding: "9px 14px", fontWeight: 800, fontSize: 12.5, cursor: "pointer", fontFamily: "inherit", opacity: (!title.trim() || !url.trim() || busy) ? 0.5 : 1 }}>
              {busy ? "…" : t("highlights_add")}
            </button>
          </div>
          {err && <div style={{ fontSize: 11.5, color: C.amber, marginTop: 6 }}>{err}</div>}
        </div>
      )}
    </div>
  );
}

/* ============ CAREER TIMELINE ============
   Same viewUserId convention and jsonb-list pattern as Highlights above —
   self-service entries {id, year, text} on athletes.timeline (migration
   065). Replaces the old hardcoded, demo-only "CAREER TIMELINE" card that
   never showed on a real account. */
function Timeline({ viewUserId, manageMode }) {
  const { t } = useLang();
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [uid, setUid] = useState(null);
  const [year, setYear] = useState("");
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const isOwner = !!(uid && (!viewUserId || viewUserId === uid || manageMode));
  const targetId = viewUserId || uid;

  useEffect(() => {
    if (!sb) return;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) return;
        setUid(user.id);
        const targetId = viewUserId || user.id;
        const { data, error } = await sb.from("athletes").select("timeline").eq("id", targetId).single();
        if (error) throw error;
        const list = Array.isArray(data && data.timeline) ? data.timeline : [];
        // Newest first — a coach skimming a shared Passport should see the
        // most recent milestone (this season, a commitment) before older
        // ones, not have to scroll past years of history first.
        setItems([...list].sort((a, b) => String(b.year).localeCompare(String(a.year))));
        setLoaded(true);
      } catch (e) { console.error("GOLSZ timeline load error:", e); }
    })();
  }, [viewUserId]);

  async function saveList(list) {
    if (!sb || !uid || !isOwner) return;
    try { await sb.from("athletes").update({ timeline: list }).eq("id", targetId); }
    catch (e) { console.error("GOLSZ timeline save error:", e); }
  }

  async function addEntry() {
    if (!sb || !uid || !isOwner || !year.trim() || !text.trim() || busy) return;
    setBusy(true); setErr("");
    try {
      const { decision } = await moderateContent({ text: text.trim(), contentType: "profile_field", surface: "profile" });
      if (decision === "block") throw new Error(t("moderation_blocked"));
      const entry = {
        id: (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()),
        year: year.trim().slice(0, 20), text: text.trim().slice(0, 200),
      };
      const next = [...items, entry];
      const sorted = [...next].sort((a, b) => String(b.year).localeCompare(String(a.year)));
      await saveList(next);
      setItems(sorted);
      setYear(""); setText("");
    } catch (e) {
      setErr((e && e.message) ? e.message : t("timeline_add_err"));
    } finally { setBusy(false); }
  }

  async function removeEntry(id) {
    if (!sb || !uid || !isOwner) return;
    const next = items.filter((m) => m.id !== id);
    setItems(next);
    await saveList(next);
  }

  return (
    <div style={{ ...card }}>
      <div style={{ fontSize: 9, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 8 }}>{t("timeline_title")}</div>
      {loaded && items.length === 0 && (
        <div style={{ fontSize: 12.5, color: C.slate }}>{t("timeline_empty")}</div>
      )}
      {items.map((e, i) => (
        <div key={e.id || i} style={{ display: "flex", gap: 12, alignItems: "flex-start", padding: "7px 0", borderBottom: i < items.length - 1 ? `1px solid ${C.line}` : "none" }}>
          <div style={{ fontFamily: "'Space Mono', monospace", fontWeight: 800, color: C.lime, fontSize: 13, width: 56, flexShrink: 0, paddingTop: 1 }}>{e.year}</div>
          <div style={{ fontSize: 13, color: C.body, flex: 1, lineHeight: 1.5 }}>{e.text}</div>
          {isOwner && e.id && (
            <button onClick={() => removeEntry(e.id)} style={{ background: "none", border: "none", color: C.slate, cursor: "pointer", padding: 0, marginLeft: 4, display: "flex", flexShrink: 0 }}><X size={13} /></button>
          )}
        </div>
      ))}
      {sb && isOwner && (
        <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.line}` }}>
          <div style={{ display: "flex", gap: 6 }}>
            <input value={year} onChange={(e) => setYear(e.target.value)} placeholder={t("timeline_year_ph")}
              style={{ width: 90, background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 9, color: C.chalk, padding: "9px 11px", fontSize: 12.5, fontFamily: "inherit", outline: "none", boxSizing: "border-box" }} />
            <input value={text} onChange={(e) => setText(e.target.value)} placeholder={t("timeline_text_ph")}
              style={{ flex: 1, background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 9, color: C.chalk, padding: "9px 11px", fontSize: 12.5, fontFamily: "inherit", outline: "none", boxSizing: "border-box" }} />
            <button onClick={addEntry} disabled={!year.trim() || !text.trim() || busy} style={{ background: C.lime, color: C.ink, border: "none", borderRadius: 9, padding: "9px 14px", fontWeight: 800, fontSize: 12.5, cursor: "pointer", fontFamily: "inherit", opacity: (!year.trim() || !text.trim() || busy) ? 0.5 : 1 }}>
              {busy ? "…" : t("timeline_add")}
            </button>
          </div>
          {err && <div style={{ fontSize: 11.5, color: C.amber, marginTop: 6 }}>{err}</div>}
        </div>
      )}
    </div>
  );
}

/* ============ BENCHMARKS (record + retest history) ============
   Backed by a real table (athlete_benchmarks, migration 071), not a jsonb
   array like Highlights/Timeline above — same reasoning as that
   migration's own comment. Private to the owner: unlike Highlights/
   Timeline, this never renders on someone else's viewed Passport (v1
   scope, see the migration comment) — viewUserId is accepted only so the
   render call site doesn't need special-casing, not because another
   viewer's benchmarks are ever fetched or shown. */
// P1-2. Sport-aware benchmark entry. MIRRORS api/scout.js's SPORT_SCHEMAS
// performance_indicators exactly — same keys, same labels, same units — for
// the two sports that actually have a schema. tests/test_benchmark_input.cjs
// diffs the two at run time and fails if they drift, which is the only thing
// making a second copy acceptable here (the client has no build step and
// cannot import from the serverless function).
//
// A sport that is NOT in this table falls through to free-text entry,
// unchanged. That is deliberate: 39 of the 41 sports GOLSZ offers have no
// schema, and forcing them through a picker built for soccer would be worse
// than the free text they have today.
const BENCHMARK_METRICS_BY_SPORT = {
  Soccer: [
    { key: "sprint_10m", label: "10m sprint", unit: "s" },
    { key: "sprint_40m", label: "40m sprint", unit: "s" },
    { key: "vertical_jump", label: "Vertical jump", unit: "cm" },
    { key: "yo_yo", label: "Yo-Yo intermittent recovery", unit: "level" },
    { key: "match_minutes", label: "Competitive minutes this season", unit: "min" },
    { key: "goals", label: "Goals", unit: "count" },
    { key: "assists", label: "Assists", unit: "count" },
    { key: "clean_sheets", label: "Clean sheets", unit: "count" },
  ],
  Basketball: [
    { key: "vertical_jump", label: "Max vertical", unit: "cm" },
    { key: "lane_agility", label: "Lane agility drill", unit: "s" },
    { key: "three_quarter_sprint", label: "3/4 court sprint", unit: "s" },
    { key: "ppg", label: "Points per game", unit: "pts" },
    { key: "rpg", label: "Rebounds per game", unit: "reb" },
    { key: "apg", label: "Assists per game", unit: "ast" },
    { key: "fg_pct", label: "Field goal %", unit: "%" },
    { key: "three_pt_pct", label: "Three-point %", unit: "%" },
    { key: "ft_pct", label: "Free throw %", unit: "%" },
  ],
};

// Which protocol dimensions actually change the number for a given metric.
// Drawn from PROTOCOL_INCOMPATIBILITIES in api/scout.js — only dimensions
// that appear there as MATERIAL are asked about, because every extra question
// costs an athlete something and an unasked question is honestly recorded as
// unknown. A metric absent from this map needs no protocol at all (goals
// scored is goals scored).
const METRIC_PROTOCOL_FIELDS = {
  sprint_10m: ["timing_method", "start_type"],
  sprint_40m: ["timing_method", "start_type"],
  three_quarter_sprint: ["timing_method", "start_type"],
  lane_agility: ["timing_method"],
  vertical_jump: ["jump_protocol"],
};

// The option lists match the exact values PROTOCOL_INCOMPATIBILITIES compares
// against — a label mismatch here would silently make everything look
// incompatible later. "" is the honest "I don't know" and stores NOTHING.
const PROTOCOL_OPTIONS = {
  timing_method: [["electronic", "bench_timing_electronic"], ["hand", "bench_timing_hand"]],
  start_type: [["standing", "bench_start_standing"], ["flying", "bench_start_flying"]],
  jump_protocol: [["standing_vertical", "bench_jump_standing"], ["max_vertical", "bench_jump_max"]],
};

function Benchmarks({ viewUserId, manageId }) {
  const { t } = useLang();
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [uid, setUid] = useState(null);
  const [metric, setMetric] = useState("");
  const [value, setValue] = useState("");
  const [unit, setUnit] = useState("");
  // P1-2. The athlete's sport decides whether they get a canonical metric
  // picker or the original free-text field. null until loaded; "" (no sport
  // on the Passport yet) also falls through to free text.
  const [sport, setSport] = useState(null);
  const [metricKey, setMetricKey] = useState("");
  // Only the protocol dimensions the athlete actually answered. A dimension
  // left on "" is NOT stored — unknown stays unknown rather than defaulting
  // to whatever is most common, which would be inventing provenance.
  const [protocol, setProtocol] = useState({});
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const isOwner = !!(uid && !viewUserId);

  useEffect(() => {
    if (!sb || viewUserId) return; // private in v1 — never fetched for another athlete's viewed Passport
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) return;
        // manageId = the under-16 athlete a parent is managing (P0-4). Their
        // benchmarks are the ones on screen and the ones written; RLS
        // (athlete_benchmarks' own is_parent_of policy) authorises it.
        setUid(manageId || user.id);
        const [{ data, error }, { data: ath }] = await Promise.all([
          sb.from("athlete_benchmarks").select("id, metric, metric_key, protocol, value, unit, recorded_date").eq("user_id", manageId || user.id).order("recorded_date", { ascending: false })
            .then((r) => (r.error ? sb.from("athlete_benchmarks").select("id, metric, value, unit, recorded_date").eq("user_id", manageId || user.id).order("recorded_date", { ascending: false }) : r)),
          sb.from("athletes").select("sport").eq("id", manageId || user.id).maybeSingle(),
        ]);
        if (error) throw error;
        setItems(data || []);
        setSport((ath && ath.sport) || "");
      } catch (e) { console.error("GOLSZ benchmarks load error:", e); }
      setLoaded(true);
    })();
  }, [viewUserId, manageId]);

  // Selecting a canonical metric fills the display name and unit from the
  // schema, so an athlete cannot record "10m sprint" in metres. Switching
  // metric clears the protocol answers: they belong to the metric that was
  // selected when they were given, and carrying them over would attach a
  // timing method to a jump.
  function pickMetric(key) {
    setMetricKey(key);
    setProtocol({});
    if (!key || key === "__other") { setMetric(""); setUnit(""); return; }
    const m = (sportMetrics || []).find((x) => x.key === key);
    if (m) { setMetric(m.label); setUnit(m.unit); }
  }

  async function addEntry() {
    if (!sb || !uid || !isOwner || !metric.trim() || !value.trim() || busy) return;
    setBusy(true); setErr("");
    try {
      const numValue = Number(value);
      if (!Number.isFinite(numValue)) throw new Error(t("benchmarks_invalid_value"));
      // Strip empty answers before storing. An absent key means "not
      // recorded" everywhere downstream (protocolCompatible treats it as a
      // caveat, never as agreement) — storing "" would turn a genuine
      // unknown into a value.
      const cleanProtocol = {};
      for (const [k, v] of Object.entries(protocol)) if (v) cleanProtocol[k] = v;
      const base = { user_id: uid, metric: metric.trim().slice(0, 60), value: numValue, unit: unit.trim().slice(0, 20) || null };
      let { data, error } = await sb.from("athlete_benchmarks").insert({
        ...base,
        // Only set when the athlete picked from their sport's canonical list.
        // A free-text metric stays NULL rather than being guessed into a key.
        metric_key: metricKey || null,
        protocol: Object.keys(cleanProtocol).length ? cleanProtocol : null,
      }).select("id, metric, metric_key, protocol, value, unit, recorded_date").single();
      // Same hand-applied-migration tolerance as GoalCard above (114). The
      // measurement is recorded either way; only its protocol is lost, and
      // an unrecorded protocol is already treated everywhere as unknown, so
      // this degrades to exactly the pre-P1-2 behaviour rather than to a
      // wrong value.
      if (error && (error.code === "PGRST204" || /metric_key|protocol/.test(error.message || ""))) {
        console.warn("GOLSZ benchmark protocol columns missing (migration 114 not applied) — saving without them.");
        ({ data, error } = await sb.from("athlete_benchmarks").insert(base)
          .select("id, metric, value, unit, recorded_date").single());
      }
      if (error) throw error;
      setItems((prev) => [data, ...prev]);
      setMetric(""); setValue(""); setUnit(""); setMetricKey(""); setProtocol({});
    } catch (e) {
      setErr((e && e.message) || t("benchmarks_add_err"));
    } finally { setBusy(false); }
  }

  async function removeEntry(id) {
    if (!sb || !uid || !isOwner) return;
    setItems((prev) => prev.filter((b) => b.id !== id));
    try { await sb.from("athlete_benchmarks").delete().eq("id", id).eq("user_id", uid); }
    catch (e) { console.error("GOLSZ benchmark delete error:", e); }
  }

  if (viewUserId) return null;

  const grouped = {};
  for (const b of items) { (grouped[b.metric] = grouped[b.metric] || []).push(b); }
  const inputStyle = { background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 9, color: C.chalk, padding: "9px 11px", fontSize: 12.5, fontFamily: "inherit", outline: "none", boxSizing: "border-box" };
  // null for a sport GOLSZ has no schema for (39 of the 41 offered), which is
  // the free-text path this component has always had.
  const sportMetrics = sport ? (BENCHMARK_METRICS_BY_SPORT[sport] || null) : null;
  const protocolFields = (metricKey && metricKey !== "__other" && METRIC_PROTOCOL_FIELDS[metricKey]) || [];

  return (
    <div style={{ ...card }}>
      <div style={{ fontSize: 9, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 8 }}>{t("benchmarks_title")}</div>
      {loaded && items.length === 0 && <div style={{ fontSize: 12.5, color: C.slate }}>{t("benchmarks_empty")}</div>}
      {Object.entries(grouped).map(([m, entries]) => (
        <div key={m} style={{ marginBottom: 10 }}>
          <div style={{ fontSize: 12.5, fontWeight: 700, color: C.chalk, marginBottom: 4 }}>{m}</div>
          {entries.map((e, i) => (
            <div key={e.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "5px 0", borderBottom: i < entries.length - 1 ? `1px solid ${C.line}` : "none" }}>
              <div style={{ fontFamily: "'Space Mono', monospace", fontWeight: 800, color: C.lime, fontSize: 13 }}>{e.value}{e.unit ? ` ${e.unit}` : ""}</div>
              <div style={{ fontSize: 11, color: C.slate, marginLeft: "auto" }}>{e.recorded_date}</div>
              <button onClick={() => removeEntry(e.id)} style={{ background: "none", border: "none", color: C.slate, cursor: "pointer", padding: 0, display: "flex", flexShrink: 0 }}><X size={13} /></button>
            </div>
          ))}
        </div>
      ))}
      {sb && (
        <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.line}` }}>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {/* P1-2. A sport with a real schema gets its canonical metric
                list; everything else keeps the original free-text field. */}
            {sportMetrics ? (
              <select value={metricKey} onChange={(e) => pickMetric(e.target.value)} style={{ flex: "1 1 150px", ...inputStyle }}>
                <option value="">{t("bench_pick_metric")}</option>
                {sportMetrics.map((m) => <option key={m.key} value={m.key}>{m.label} ({m.unit})</option>)}
                <option value="__other">{t("bench_other_metric")}</option>
              </select>
            ) : (
              <input value={metric} onChange={(e) => setMetric(e.target.value)} placeholder={t("benchmarks_metric_ph")} style={{ flex: "1 1 120px", ...inputStyle }} />
            )}
            {sportMetrics && metricKey === "__other" && (
              <input value={metric} onChange={(e) => setMetric(e.target.value)} placeholder={t("benchmarks_metric_ph")} style={{ flex: "1 1 120px", ...inputStyle }} />
            )}
            <input value={value} onChange={(e) => setValue(e.target.value)} placeholder={t("benchmarks_value_ph")} inputMode="decimal" style={{ width: 90, ...inputStyle }} />
            <input value={unit} onChange={(e) => setUnit(e.target.value)} placeholder={t("benchmarks_unit_ph")} style={{ width: 70, ...inputStyle }} />
            <button onClick={addEntry} disabled={!metric.trim() || !value.trim() || busy} style={{ background: C.lime, color: C.ink, border: "none", borderRadius: 9, padding: "9px 14px", fontWeight: 800, fontSize: 12.5, cursor: "pointer", fontFamily: "inherit", opacity: (!metric.trim() || !value.trim() || busy) ? 0.5 : 1 }}>
              {busy ? "…" : t("benchmarks_add")}
            </button>
          </div>

          {/* Protocol questions, asked only for the metrics where the answer
              actually changes whether two numbers can be compared (hand vs
              electronic timing, standing vs approach vertical). Every one
              defaults to "not recorded" and stays that way unless answered —
              GOLSZ never guesses how a measurement was taken. */}
          {protocolFields.length > 0 && (
            <div style={{ marginTop: 8 }}>
              <div style={{ fontSize: 10, color: C.slate, fontWeight: 700, marginBottom: 5 }}>{t("bench_protocol_title")}</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {protocolFields.map((dim) => (
                  <select key={dim} value={protocol[dim] || ""} onChange={(e) => setProtocol((prev) => ({ ...prev, [dim]: e.target.value }))} style={{ flex: "1 1 140px", ...inputStyle }}>
                    <option value="">{t("bench_protocol_unknown")} — {t("bench_dim_" + dim)}</option>
                    {(PROTOCOL_OPTIONS[dim] || []).map(([val, key]) => <option key={val} value={val}>{t(key)}</option>)}
                  </select>
                ))}
              </div>
              <div style={{ fontSize: 10, color: C.slate, marginTop: 5, lineHeight: 1.4 }}>{t("bench_protocol_hint")}</div>
            </div>
          )}
          {err && <div style={{ fontSize: 11.5, color: C.amber, marginTop: 6 }}>{err}</div>}
        </div>
      )}
    </div>
  );
}

// Passport Strength (was "GOLSZ Readiness") — brief §6's 5 named sub-scores (Recruitment/Pathway
// Readiness, Performance, Profile Quality, Development Progress,
// Verification), every one computed entirely from data that already
// exists — nothing invented, no black-box "readiness algorithm". Always
// explainable: every missing item is named, not folded into an opaque
// percentage — see HomeTab's render of `missing` and the "why" breakdown.
function computeProfileQuality(ath, prof) {
  if (!ath) return { score: 0, filled: 0, total: 0, missing: [] };
  const isPlayerLike = !prof || !prof.occupation || prof.occupation === "Player";
  const needsPosition = isPlayerLike && ath.sport && !SPORTS_WITHOUT_POSITION.includes(ath.sport);
  const checks = [
    { label: "Sport", ok: !!ath.sport },
    { label: "Club", ok: !!ath.club_name },
    { label: "Grad year", ok: !!ath.grad_year },
    { label: "Country", ok: !!ath.country },
    { label: "Recruiting status", ok: !!ath.recruiting_status },
    { label: "Bio", ok: !!(ath.bio && ath.bio.trim()) },
    { label: "Photo", ok: !!(prof && prof.avatar_url) },
    { label: "Highlights", ok: Array.isArray(ath.highlights) && ath.highlights.length > 0 },
    { label: "Career timeline", ok: Array.isArray(ath.timeline) && ath.timeline.length > 0 },
  ];
  if (needsPosition) checks.splice(1, 0, { label: SPORT_POSITION_LABEL[ath.sport] || "Position", ok: !!ath.position });
  const filled = checks.filter((c) => c.ok).length;
  const total = checks.length;
  return { score: total ? Math.round((filled / total) * 100) : 0, filled, total, missing: checks.filter((c) => !c.ok).map((c) => c.label) };
}

// Performance sub-score — rewards both breadth (metrics actually tracked)
// and depth (retested at least once, i.e. real progression data exists,
// not just a single snapshot) — matches brief §4's "record benchmarks,
// retest them and see progression over time."
function computePerformanceScore(benchmarks) {
  if (!benchmarks || !benchmarks.length) return { score: 0, metricsTracked: 0, metricsRetested: 0 };
  const byMetric = {};
  for (const b of benchmarks) (byMetric[b.metric] = byMetric[b.metric] || []).push(b);
  const metricsTracked = Object.keys(byMetric).length;
  const metricsRetested = Object.values(byMetric).filter((arr) => arr.length >= 2).length;
  const score = Math.min(100, metricsTracked * 20 + metricsRetested * 10);
  return { score, metricsTracked, metricsRetested };
}

// Development Progress sub-score — 30 base for having a plan at all (the
// brief's "development planning" is about actively working a plan, not
// finishing one instantly), scaling up to 100 as items get marked done.
function computeDevelopmentScore(items) {
  if (!items || !items.length) return { score: 0, done: 0, total: 0 };
  const done = items.filter((i) => i.status === "done").length;
  const score = Math.round(30 + 70 * (done / items.length));
  return { score, done, total: items.length };
}

// Recruitment/Pathway Readiness sub-score — has a stated pathway (brief
// §7's "Where do you want to go?"), progress on that pathway's own
// milestones, and active outreach toward it (targets).
function computePathwayScore(pathway, targetsCount) {
  let score = 0;
  const milestones = (pathway && Array.isArray(pathway.milestones)) ? pathway.milestones : [];
  if (pathway) score += 40;
  if (milestones.length > 0) score += Math.round(30 * (milestones.filter((m) => m.done).length / milestones.length));
  if (targetsCount > 0) score += 30;
  // D — a pathway_plan row with zero milestones is a shell, not a Pathway:
  // it carries a category and nothing the athlete can act on. Found live on
  // 2026-08-10, where Home showed Pathway as a completed step while the Plan
  // tab said "No milestones yet" directly underneath. hasPathway therefore
  // means "a Pathway worth calling built"; pathwayStarted keeps the weaker
  // "a row exists" sense for anything that still needs it. api/scout.js
  // computes the same thing as pathwayComplete so Scout cannot disagree.
  const started = !!pathway;
  const complete = started && milestones.length > 0;
  return {
    score: Math.min(100, score), hasPathway: complete, pathwayStarted: started,
    milestonesDone: milestones.filter((m) => m.done).length, milestonesTotal: milestones.length, targetsCount,
  };
}

// Plan-gating — re-mapped per the GOLSZ Final Product / AI Scout / Pathway
// / Elite Architecture directive §5/§6: FREE = "understand me" (Passport +
// capped Scout only, unchanged). BASIC = "build my path" — Pathway, My
// Next Move, target identification/basic outreach, and PDF export all move
// down from Pro to Starter here, since the directive explicitly lists them
// as Basic-tier deliverables ("personalized Pathway," "baseline
// assessment," "My Next Move," "target identification," "basic outreach
// strategy," "Passport PDF export" — all under §5 BASIC). PRO = "manage my
// journey" — the Passport Strength breakdown and the Development Plan stay at Pro; the
// directive's §6 PRO list explicitly names it (as "GOLSZ Readiness") as a Pro
// capability and never mentions Pathway/targets/benchmarks/PDF as newly
// unlocked there (they're already unlocked one tier down). Anything not
// listed here (Passport itself, Scout chat) stays ungated — differentiated
// by usage caps elsewhere, not feature access.
const PLAN_RANK = { free: 0, starter: 1, pro: 2, elite: 3 };
const FEATURE_MIN_PLAN = {
  pdf_export: "starter",
  // Master UX/UI redesign §5/§12: "what should I do next" is Home's core
  // job for every athlete, not a paywalled add-on — Free must never feel
  // like a crippled demo. readiness stays Pro+ for the DEEP numeric
  // sub-score breakdown + "why this score" reasoning, but the composite
  // score + plain-language status words now render for every plan (see
  // HomeTab) — featureUnlocked(plan, "readiness") below only gates the deeper
  // interpretation layer, not Readiness itself existing.
  readiness: "pro",
  targets: "starter",
  benchmarks: "starter",
  development_plan: "pro",
  pathway_plan: "starter",
};
// ---- ENTITLEMENT IS THREE-VALUED IN THE UI, NOT TWO --------------------
//
// This replaces hasFeature(), which did `PLAN_RANK[plan || "free"]`. That
// coercion is CORRECT for enforcement — deny until proven entitled — and it
// still happens server-side in api/_entitlements.js, which is where
// enforcement belongs. In the client there is no enforcement: every call site
// is DISPLAY. And for display, "we have not loaded the subscription yet" is
// not the same fact as "this athlete is on Free".
//
// userPlan starts null and is filled by a fetch. Coerced to "free", it made
// every gated surface render its paywall first and the real content second,
// so a PAYING athlete was shown "Upgrade to unlock" on page load. That is
// close to the worst display bug this product can have, and it was invisible
// because it lasted two seconds and nobody screenshots a loading frame.
//
// Fixing the call sites one by one would leave the next gated surface to
// inherit the bug. So the ambiguity is absorbed HERE, at the boundary where
// it enters: THERE IS NO FUNCTION THAT RETURNS "LOCKED" WHEN THE PLAN IS
// UNKNOWN. featureLocked() is false while loading, so no branch guarded by it
// can render an upsell. hasFeature() is deliberately gone rather than kept as
// an alias — an old-style call is now a loud ReferenceError, not a silent
// paywall.
//
//   featureUnlocked -> true only when the plan is KNOWN and sufficient
//   featureLocked   -> true only when the plan is KNOWN and insufficient
//   both false       -> still loading; render a skeleton or nothing, never a lock
function planKnown(plan) { return plan != null && plan !== ""; }

// scout_context stores {value, source, confidence} per field. `source` is
// either "athlete_stated" or "ai_inferred", and the difference matters:
// something GOLSZ INFERRED must never be shown back to the athlete as their
// own goal. Same rule that stopped Scout attaching an unverified division to
// a real university — do not assert as their fact what they did not say.
//
// This exists because the "SECONDARY GOAL: NCAA" card was not read from here
// at all. It was derived from SPORT_PATHWAY_STAGES.altBranch, so EVERY Soccer
// athlete whose pathway was not NCAA was told NCAA was their secondary goal,
// whether or not college had ever come up.
function statedContextValue(scoutContext, field) {
  const entry = scoutContext && scoutContext[field];
  if (!entry) return null;
  const value = (typeof entry === "object" && entry !== null) ? entry.value : entry;
  if (typeof value !== "string" || !value.trim()) return null;
  const source = (typeof entry === "object" && entry !== null) ? entry.source : null;
  // Absent source = legacy row written before sourcing existed; treat as stated.
  if (source && source !== "athlete_stated") return null;
  return value.trim();
}

function featureUnlocked(plan, feature) {
  if (!planKnown(plan)) return false;
  const min = FEATURE_MIN_PLAN[feature];
  if (!min) return true;
  return PLAN_RANK[plan] >= PLAN_RANK[min];
}

function featureLocked(plan, feature) {
  return planKnown(plan) && !featureUnlocked(plan, feature);
}

// Reusable "visibly locked" placeholder (brief §11: paywall should show
// "additional recommendations/features visibly locked", not hide them
// silently) — swapped in wherever a gated feature's real content would go.
// Master UX/UI redesign §14: "avoid stacking large UPGRADE TO UNLOCK
// cards... demonstrate value first." teaser is optional, specific copy
// about what THIS feature would actually show; falls back to the old
// generic body text at call sites that don't pass one yet rather than
// forcing every one of them to change at once.
function FeatureLock({ label, teaser, onUpgrade }) {
  const { t } = useLang();
  return (
    <div style={{ background: C.turf, border: `1px dashed ${C.line2}`, borderRadius: 14, padding: "22px 18px", textAlign: "center", display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}>
      <Lock size={20} color={C.slate} />
      <div style={{ fontSize: 13, fontWeight: 800, color: C.chalk }}>{label}</div>
      <div style={{ fontSize: 12, color: C.slate, lineHeight: 1.5 }}>{teaser || t("feature_lock_body")}</div>
      <button onClick={onUpgrade} style={{ marginTop: 4, background: C.lime, color: C.pitch, border: "none", borderRadius: 10, padding: "8px 16px", fontSize: 12.5, fontWeight: 800, cursor: "pointer", fontFamily: "inherit" }}>{t("feature_lock_cta")}</button>
    </div>
  );
}

/* ============ PROFILE — Digital Sports Passport (signature) ============ */
/* profiles.full_name + athletes(*) merged into the passport's shape. Real
   numeric/text fields fall back to "—" when unset rather than showing
   demo values — a half-real, half-fake profile would undermine trust in
   a recruiting tool. */
function toPassport(profile, ath, uid, t) {
  const name = (profile && profile.full_name) || t("passport_athlete_fallback");
  const dash = (v) => (v === null || v === undefined || v === "" ? "—" : v);
  const country = (ath && ath.country) || "";
  const shortId = uid ? uid.replace(/-/g, "").slice(0, 5).toUpperCase() : "00000";
  return {
    name, occupation: (profile && profile.occupation) || "",
    verifiedTier: (profile && profile.verified_tier) || "none",
    avatarUrl: (profile && profile.avatar_url) || null,
    handle: "@" + name.trim().toLowerCase().replace(/[^a-z0-9]+/g, ".").replace(/^\.+|\.+$/g, ""),
    id: `GLS·${(country ? country.slice(0, 2) : "XX").toUpperCase()}·${dash(ath && ath.grad_year)}·${shortId}`,
    initials: initials(name), nat: `${flagFor(country)} ${dash(country)}`,
    sport: dash(ath && ath.sport), position: dash(ath && ath.position), club: dash(ath && ath.club_name),
    positionLabel: SPORT_POSITION_LABEL[ath && ath.sport] || "POSITION",
    foot: dash(ath && ath.foot), prefLabel: (SPORT_PREFERENCE[ath && ath.sport] || {}).label || "FOOT",
    height: ath && ath.height_cm ? `${ath.height_cm} cm` : "—",
    grad: [ath && ath.grad_year, ath && ath.education_level].filter(Boolean).join(" · ") || "—",
    gpa: dash(ath && ath.gpa),
    weight: ath && ath.weight_kg ? `${ath.weight_kg} kg` : "—",
    status: dash(ath && ath.recruiting_status),
    license: dash(ath && ath.license),
    lookingForPlayers: ath && ath.looking_for_players === true ? t("yes") : ath && ath.looking_for_players === false ? t("no") : "—",
    bio: (ath && ath.bio) || t("passport_no_bio"),
  };
}

/* ============ PUBLIC PASSPORT (shareable, no account required) ============
   Reached via ?public=<id> (see Root()), which short-circuits the whole
   auth flow — this renders before Auth/GolszApp even mount, so someone
   without a GOLSZ account can open a shared link. Backed entirely by
   get_public_passport() (migration 046), a narrow anon-readable RPC —
   never a direct table select — so it can never accidentally expose more
   than that RPC deliberately returns, and returns null outright for a
   restricted (unapproved) minor, same gate as everywhere else in the app. */
function PublicPassport({ userId, token }) {
  const { t } = useLang();
  const [state, setState] = useState("loading"); // loading | ok | private | error
  const [p, setP] = useState(null);

  useEffect(() => {
    if (!sb || (!userId && !token)) { setState("error"); return; }
    (async () => {
      try {
        // token mode (migration 078, revocable per-link sharing) is the
        // current share flow; userId mode (?public=<uid>, migration 046)
        // is kept working for any link shared before this change.
        const { data, error } = token
          ? await sb.rpc("get_public_passport_by_token", { p_token: token })
          : await sb.rpc("get_public_passport", { p_user: userId });
        if (error) throw error;
        if (!data) { setState("private"); return; }
        setP(data);
        setState("ok");
      } catch (e) { console.error("GOLSZ public passport error:", e); setState("error"); }
    })();
  }, [userId, token]);

  const dash = (v) => (v === null || v === undefined || v === "" ? "—" : v);

  return (
    <div style={{ minHeight: "100vh", background: C.pitch, color: C.chalk, fontFamily: "'Archivo', system-ui, sans-serif", padding: "28px 16px" }}>
      <div style={{ maxWidth: 420, margin: "0 auto" }}>
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <img src="/assets/logo-mark.png" alt="" style={{ width: 40, height: 40, marginBottom: 6 }} />
          <div style={{ fontWeight: 900, fontSize: 24, letterSpacing: "0.03em", fontStretch: "expanded" }}>GOLSZ<span style={{ color: C.lime }}>.</span></div>
        </div>

        {state === "loading" && <div style={{ textAlign: "center", color: C.slate, fontSize: 13, padding: "40px 0" }}>{t("loading")}</div>}
        {state === "error" && <div style={{ textAlign: "center", color: C.slate, fontSize: 13, padding: "40px 0" }}>{t("public_passport_not_found")}</div>}
        {state === "private" && <div style={{ textAlign: "center", color: C.slate, fontSize: 13, padding: "40px 0" }}>{t("public_passport_private")}</div>}

        {state === "ok" && p && (
          <div style={{
            background: `linear-gradient(160deg, ${C.card}, ${C.turf})`,
            border: `1px solid ${C.line2}`, borderRadius: 16, overflow: "hidden",
            boxShadow: `0 0 0 1px ${C.pitch}, 0 20px 40px -20px #000`,
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", borderBottom: `1px dashed ${C.line2}`, background: C.passportStrip }}>
              <span style={{ fontSize: 10, letterSpacing: "0.22em", fontWeight: 800, color: C.lime }}>DIGITAL SPORTS PASSPORT</span>
              <span style={{ fontSize: 9.5, color: C.slate, fontFamily: "'Space Mono', monospace" }}>{flagFor(p.country)} {dash(p.country)}</span>
            </div>
            <div style={{ display: "flex", gap: 14, padding: 16 }}>
              <div style={{
                width: 84, height: 100, borderRadius: 10, flexShrink: 0,
                background: p.avatar_url ? undefined : `linear-gradient(135deg, ${C.turf}, ${C.line2})`,
                border: `1px solid ${C.lime}`, display: "flex", alignItems: "center", justifyContent: "center",
                overflow: "hidden", fontFamily: "'Space Mono', monospace", fontWeight: 800, fontSize: 34, color: C.lime,
              }}>
                {p.avatar_url ? <img src={p.avatar_url} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : initials(p.full_name || "?")}
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 5, flexWrap: "wrap" }}>
                  <div style={{ fontSize: 20, fontWeight: 900, lineHeight: 1.05, fontStretch: "expanded" }}>{p.full_name || t("passport_athlete_fallback")}</div>
                  {p.identity_verified && (
                    <BadgeCheck size={17} color={C.pitch} fill={p.verified_tier === "elite" ? C.elite : C.lime} strokeWidth={2.5} />
                  )}
                </div>
                {p.occupation && (
                  <span style={{ fontSize: 9.5, fontWeight: 800, letterSpacing: "0.06em", color: C.lime, border: `1px solid ${C.limeBorder}`, borderRadius: 999, padding: "2px 8px", display: "inline-block", marginTop: 4 }}>{p.occupation.toUpperCase()}</span>
                )}
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px 10px", marginTop: 10, fontSize: 11.5 }}>
                  <div><span style={{ color: C.slate }}>{t("passport_sport")}: </span>{dash(p.sport)}</div>
                  <div><span style={{ color: C.slate }}>{SPORT_POSITION_LABEL[p.sport] || "POSITION"}: </span>{dash(p.position)}</div>
                  <div><span style={{ color: C.slate }}>{t("passport_club")}: </span>{dash(p.club_name)}</div>
                  <div><span style={{ color: C.slate }}>{t("passport_grad")}: </span>{dash(p.grad_year)}</div>

                  <div><span style={{ color: C.slate }}>{t("passport_foot")}: </span>{dash(p.foot)}</div>
                </div>
              </div>
            </div>
            {p.bio && (
              <div style={{ padding: "0 16px 16px", fontSize: 12.5, color: C.body, lineHeight: 1.5 }}>{p.bio}</div>
            )}
            {Array.isArray(p.highlights) && p.highlights.length > 0 && (
              <div style={{ padding: "0 16px 16px" }}>
                <div style={{ fontSize: 9, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 8, borderTop: `1px dashed ${C.line2}`, paddingTop: 14 }}>{p.identity_verified ? t("highlights_title") : t("highlights_title_unverified")}</div>
                {p.highlights.map((m, i) => (
                  <a key={m.id || i} href={m.url} target="_blank" rel="noopener noreferrer" style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 0", color: C.chalk, textDecoration: "none", borderBottom: i < p.highlights.length - 1 ? `1px solid ${C.line}` : "none" }}>
                    <Video size={13} color={C.lime} style={{ flexShrink: 0 }} />
                    <span style={{ fontSize: 12.5 }}>{m.title}</span>

          <a href="/" style={{ fontSize: 12, color: C.slate, textDecoration: "none" }}>{t("public_passport_cta")}</a>
        </div>
      </div>

  );
}

// targetId (P0-4) is the athlete whose rows are written — the signed-in
// user normally, an approved parent's managed under-16 child in manage mode.
// It comes from Passport's editId, which is itself derived from actingFor;
// RLS is what authorises the write, so a wrong id here fails closed rather
// than editing a stranger.
function ProfileEditor({ initial, targetId, locked, onClose, onSaved }) {
  const { t, tv } = useLang();
  const [form, setForm] = useState(initial);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const field = { width: "100%", background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 10, color: C.chalk, padding: "10px 12px", fontSize: 13.5, fontFamily: "inherit", outline: "none", boxSizing: "border-box" };
  const label = { fontSize: 9.5, letterSpacing: "0.1em", color: C.slate, fontWeight: 700, marginBottom: 5, display: "block" };
  const row = (children) => <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>{children}</div>;
  const group = (lbl, children) => <div style={{ marginBottom: 12 }}><span style={label}>{lbl}</span>{children}</div>;
  const isPlayer = !form.occupation || form.occupation === "Player";
  // A parent isn't an athlete themselves — nothing athlete-shaped
  // (sport/position/club/stats) applies to their own account at all.

  const isParent = form.occupation === "Parent";

  async function save() {
    if (!sb || busy) return;
    const name = (form.full_name || "").trim();
    if (!name) { setErr(t("editor_name_required")); return; }
    if (!form.occupation) { setErr(t("auth_occupation_required")); return; }

      if (!form.sport) { setErr(t("editor_sport_required")); return; }
      if (!isPlayer && !(form.club_name || "").trim()) { setErr(t("editor_team_required")); return; }
    }
    setBusy(true); setErr("");
    try {
      const { decision } = await moderateContent({ text: form.bio || "", contentType: "profile_field", surface: "profile" });
      if (decision === "block") { setErr(t("moderation_blocked")); setBusy(false); return; }
      const { data: { user } } = await sb.auth.getUser();

      const writeId = targetId || user.id;
      const { error: e1 } = await sb.from("profiles").update({ full_name: name, occupation: form.occupation || null }).eq("id", writeId);
      if (e1) throw e1;
      const { error: e2 } = await sb.from("athletes").update({
        sport: form.sport || null,
        position: (form.position || "").trim() || null,
        gender: form.gender || null,
        grad_year: form.grad_year ? Number(form.grad_year) : null,

        height_cm: form.height_cm ? Number(form.height_cm) : null,
        weight_kg: form.weight_kg ? Number(form.weight_kg) : null,
        foot: form.foot || null,
        recruiting_status: form.recruiting_status || null,
        education_level: form.education_level || null,
        country: (form.country || "").trim() || null,
        club_name: (form.club_name || "").trim() || null,
        license: (form.license || "").trim() || null,
        looking_for_players: form.looking_for_players === "" || form.looking_for_players == null ? null : form.looking_for_players === "true",
        bio: (form.bio || "").trim().slice(0, 600) || null,

      if (e2) throw e2;
      onSaved();

      console.error("GOLSZ profile save error:", e);
