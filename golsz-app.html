  }

  const dobNum = { d: parseInt(dobDay, 10), m: parseInt(dobMonth, 10), y: parseInt(dobYear, 10) };
  const dobOk = dobDay && dobMonth && dobYear
    && dobNum.d >= 1 && dobNum.d <= 31
    && dobNum.m >= 1 && dobNum.m <= 12
    && String(dobYear).length === 4 && dobNum.y >= 1900 && dobNum.y <= new Date().getFullYear();
  const dobIso = dobOk ? `${dobYear}-${String(dobNum.m).padStart(2, "0")}-${String(dobNum.d).padStart(2, "0")}` : "";
  const age = dobOk ? ageFromDobIso(dobIso) : null;
  // Corrected pre-launch directive: 16+ signs up and controls their own
  // account (unchanged below); under 16 may NOT — self-signup is blocked
  // outright and routed to parent-signup mode instead (see the JSX below
  // and api/create-child-account.js for why a parent creates that account,
  // not the child).
  const requiresParentAccount = age !== null && age < 16;

  const isParentSignup = mode === "parent-signup";
  const isSignupLike = isSignup || isParentSignup; // shared fields (honeypot, Turnstile) render for both real signup flows
  const childDobNum = { d: parseInt(childDobDay, 10), m: parseInt(childDobMonth, 10), y: parseInt(childDobYear, 10) };
  const childDobOk = childDobDay && childDobMonth && childDobYear
    && childDobNum.d >= 1 && childDobNum.d <= 31
    && childDobNum.m >= 1 && childDobNum.m <= 12
    && String(childDobYear).length === 4 && childDobNum.y >= 1900 && childDobNum.y <= new Date().getFullYear();
  const childDobIso = childDobOk ? `${childDobYear}-${String(childDobNum.m).padStart(2, "0")}-${String(childDobNum.d).padStart(2, "0")}` : "";
  const childAge = childDobOk ? ageFromDobIso(childDobIso) : null;
  const childAgeOk = childAge !== null && childAge < 16;

  // isSignupLike, not isSignup: the parent-signup flow renders the Turnstile
  // widget (see the JSX below, which gates on isSignupLike) but this check
  // used isSignup, so a parent could submit without ever completing the
  // challenge — the one signup path a bot creating throwaway accounts would
  // find first, since it also creates a second account for the "child".
  const turnstileOk = !TURNSTILE_SITE_KEY || !isSignupLike || !!turnstileToken;
  const ok = isParentSignup
    ? (email.trim() && pw.trim() && turnstileOk && name.trim() && childName.trim() && childDobOk && childAgeOk)
    : (email.trim() && pw.trim() && turnstileOk && (!isSignup || (name.trim() && dobOk && !requiresParentAccount)));
  const selected = PLANS.find((p) => p.id === plan) || PLANS[0];
  const field = { width: "100%", background: C.turf, border: "1px solid " + C.line2, borderRadius: 12, color: C.chalk, padding: "13px 14px", fontSize: 15, fontFamily: "inherit", outline: "none", marginBottom: 12, boxSizing: "border-box" };
  const dobField = { ...field, marginBottom: 0, textAlign: "center" };

  async function submit() {
    if (!ok || busy || confirmPolling) return;
    // P0-2. Checkout is not live yet (see isLiveStripeLink / STRIPE_LINKS).
    // Stopping here rather than creating the account matters more than it
    // looks: migration 116 makes every new account start on 'free', so
    // without this an athlete would pick Pro, pay nothing, be given Free,
    // and never be told why. Say so before anything is created.
    if (isSignup && selected.price > 0 && !stripeLinkFor(plan)) {
      setErr(t("settings_plan_checkout_unavailable"));
      return;
    }
    // Honeypot: a real user never sees or fills this field, so anything in
    // it means an automated script filled every input on the page. Trust &
    // Safety Moderation System pass: this used to silently no-op the whole
    // signup client-side — real, but a client-only gate a bot hitting
    // Supabase's signup API directly (skipping this component entirely)
    // trivially bypasses. Now the signup still proceeds (so a bot gets no
    // signal telling it apart from a real submission, same as before) but
    // the honeypot's value is passed through in signup metadata below, and
    // handle_new_user() (server-side, migration 063) sets a rock-bottom
    // trust_score on the new account when it arrives non-empty — additive
    // and non-blocking, never risks rejecting a real signup outright.
    setErr("");
    setNotice("");
    setUnconfirmedEmail("");
    setResendSent(false);
    // preview mode: no backend configured -> behave like the demo
    if (!sb) {
      if (isSignup && selected.price > 0 && stripeLinkFor(plan)) { window.location.href = stripeLinkFor(plan); return; }
      onDone(); return;
    }
    // Open a blank tab synchronously, before any `await` — browsers only
    // allow window.open() without treating it as a blocked popup when it's
    // called directly inside the click's call stack, and signUp() below is
    // async so we don't have the real checkout URL yet. We point this tab
    // at the real URL once signUp() resolves. Keeping checkout in a
    // separate tab (instead of navigating this one away) is what lets this
    // tab stay alive and keep polling for email confirmation the whole time.
    let checkoutTab = null;
    if (isSignup && selected.price > 0 && stripeLinkFor(plan)) {
      checkoutTab = window.open("", "_blank");
    }
    setBusy(true);
    try {
      if (isSignup) {
        // IP-based rate limit (migration 074) — server-side, reads the real
        // caller IP from Vercel's x-forwarded-for header (never trusted
        // from anything the client sends), so unlike the honeypot above a
        // script hitting Supabase's signup API directly still hits this if
        // it goes through Auth's own submit() to get here, and repeated
        // attempts from the same IP get capped regardless of email used.
        try {
          const guardRes = await fetch("/api/signup-guard", { method: "POST", headers: { "Content-Type": "application/json" } });
          const guardData = await guardRes.json().catch(() => ({ allowed: true }));
          if (guardData && guardData.allowed === false) throw new Error("Too many signup attempts from this network. Please try again later.");
        } catch (e) {
          if (e instanceof Error && e.message.startsWith("Too many signup attempts")) throw e;
          // network/endpoint hiccup — fail open, same as the server side does
        }
        // Real bot-blocking layer, on top of (not instead of) the honeypot
        // above — verified server-side via api/verify-turnstile.js, which
        // holds the actual secret key. No-ops (never blocks) whenever
        // TURNSTILE_SITE_KEY is unset, so this is dormant until activated.
        if (TURNSTILE_SITE_KEY) {
          const verifyRes = await fetch("/api/verify-turnstile", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: turnstileToken }),
          });
          const verifyData = await verifyRes.json().catch(() => ({}));
          if (!verifyRes.ok || !verifyData.success) {
            // A 503 with turnstile_misconfigured means the site key is live
            // but the server has no secret — retrying the challenge cannot
            // fix that, so don't tell the athlete to. Show what the server
            // actually said.
            throw new Error((verifyData && verifyData.error) || "Verification failed — please retry the challenge below and try again.");
          }
        }
        const signupEmail = email.trim();
        const signupPw = pw;
        const { data, error } = await sb.auth.signUp({ email: signupEmail, password: signupPw, options: { data: {
          full_name: name.trim(), plan: selected.id, date_of_birth: dobIso,
          hp: website.trim(),
        } } });
        if (error) throw error;
        if (selected.price > 0 && stripeLinkFor(plan) && data.user) {
          // attribute the checkout back to this account for the Stripe webhook
          const checkoutUrl = new URL(stripeLinkFor(plan));
          checkoutUrl.searchParams.set("client_reference_id", data.user.id);
          checkoutUrl.searchParams.set("prefilled_email", signupEmail);
          if (checkoutTab) {
            try { checkoutTab.location.href = checkoutUrl.toString(); }
            catch (e) { checkoutTab = null; }
          }
          if (!checkoutTab) {
            // popup blocked or the tab got closed — fall back to the old
            // same-tab redirect; checkout still works, this tab just won't
            // be around afterward to auto-detect confirmation.
            window.location.href = checkoutUrl.toString();
            return;
          }
          if (data.session) {
            onDone(true);
          } else {
            setNotice("Complete your payment in the new tab. This page will sign you in automatically the moment your email is confirmed — from whatever device you use to confirm it.");
            startConfirmPolling(signupEmail, signupPw);
          }
          return;
        }
        if (data.session) {
          onDone(true);
        } else {
          setNotice("Account created — check " + signupEmail + " for a confirmation link. This page will sign you in automatically once you confirm it — no need to come back and log in by hand.");
          startConfirmPolling(signupEmail, signupPw);
        }
      } else if (isParentSignup) {
        // Corrected pre-launch directive: the PARENT'S account is created
        // here (normal signUp, no date_of_birth — this is the parent's own
        // adult account); the athlete's own account only gets created
        // server-side, by api/create-child-account.js, once this parent
        // account is real and (if needed) confirmed — see createChildAccount
        // above and the sessionStorage fallback below for why this can't
        // always happen in the same breath as signUp.
        try { const guardRes = await fetch("/api/signup-guard", { method: "POST", headers: { "Content-Type": "application/json" } });
          const guardData = await guardRes.json().catch(() => ({ allowed: true }));
          if (guardData && guardData.allowed === false) throw new Error("Too many signup attempts from this network. Please try again later.");
        } catch (e) {
          if (e instanceof Error && e.message.startsWith("Too many signup attempts")) throw e;
        }
        if (TURNSTILE_SITE_KEY) {
          const verifyRes = await fetch("/api/verify-turnstile", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: turnstileToken }),
          });
          const verifyData = await verifyRes.json().catch(() => ({}));
          if (!verifyRes.ok || !verifyData.success) {
            // A 503 with turnstile_misconfigured means the site key is live
            // but the server has no secret — retrying the challenge cannot
            // fix that, so don't tell the athlete to. Show what the server
            // actually said.
            throw new Error((verifyData && verifyData.error) || "Verification failed — please retry the challenge below and try again.");
          }
        }
        const parentEmail = email.trim();
        const parentPw = pw;
        const { data, error } = await sb.auth.signUp({ email: parentEmail, password: parentPw, options: { data: {
          full_name: name.trim(), hp: website.trim(),
        } } });
        if (error) throw error;
        if (data.session) {
          try {
            await createChildAccount(childName.trim(), childDobIso);
            onDone(true);
          } catch (childErr) {
            // The parent's own account is real either way — surface the
            // failure but still let them into the app; they can add the
            // athlete again from Account (see Settings' own "add athlete"
            // form, which calls the same createChildAccount()).
            setChildCreateErr((childErr && childErr.message) || "Couldn't add your athlete — you can try again from Account.");
            onDone(true);
          }
        } else {
          // Email confirmation required — can't call create-child-account
          // without a real session yet. Stashed here and picked up by
          // GolszApp's own mount effect once this parent is actually
          // signed in (see that effect's own comment for why).
          try { sessionStorage.setItem("golsz_pending_child", JSON.stringify({ childName: childName.trim(), childDobIso })); } catch (e) {}
          setNotice("Account created — check " + parentEmail + " for a confirmation link. Once confirmed, we'll finish setting up " + childName.trim() + "'s profile automatically.");
          startConfirmPolling(parentEmail, parentPw);
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
        if (error) throw error;
        onDone();
      }
    } catch (e) {
      if (checkoutTab) { try { checkoutTab.close(); } catch (e2) {} }
      console.error("GOLSZ auth error:", e);
      let msg = "Something went wrong. Try again.";
      // The exact failure a real user hit: signed up, the confirmation
      // email never arrived, came back later to log in and got stuck with
      // no way forward. Supabase surfaces this as code "email_not_confirmed"
      // (checked first — message text has changed across supabase-js
      // versions, the code hasn't) or the message "Email not confirmed".
      // Give a real recovery path here instead of just showing the error.
      const isUnconfirmed = e && (e.code === "email_not_confirmed" || /email.*not.*confirmed/i.test(e.message || ""));
      if (isUnconfirmed) {
        setUnconfirmedEmail(email.trim());
        msg = "Your email address hasn't been confirmed yet, so we can't sign you in. This usually means the confirmation email never reached your inbox — resend it below.";
      } else if (e && typeof e.message === "string" && e.message.trim()) {
        msg = e.message;
      } else if (e instanceof TypeError) {
        msg = "Couldn't reach Supabase — check your internet connection, that the project isn't paused, and that this page is served over http(s), not opened as a local file.";
      } else if (e) {
        try { msg = "Unexpected error: " + JSON.stringify(e); } catch { msg = "Unexpected error (see browser console for details)."; }
      }
      setErr(msg);
    } finally {
      setBusy(false);
    }
  }

  const cta = confirmPolling ? "Waiting for you to confirm your email…"
    : busy ? t("auth_working")
    : isParentSignup ? t("auth_create_athlete_account")
    : !isSignup ? t("auth_login")
    : selected.price === 0 ? t("auth_create_free")
    : t("auth_continue_payment") + planPrice(selected.price) + t("auth_per_month");

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "calc(28px + env(safe-area-inset-top, 0px)) 18px 28px", background: "radial-gradient(1100px 560px at 50% -12%, " + C.turf + ", " + C.pitch + ")", fontFamily: "'Archivo', system-ui, sans-serif", color: C.chalk }}>
      <style>{CSS}</style>
      <div style={{ width: "100%", maxWidth: (isSignup && !forgotMode && isDesktop) ? 920 : 430 }}>
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <img src="/assets/logo-mark.png" alt="" className="logo-mark" style={{ width: 56, height: 56, marginBottom: 8 }} />
          <div style={{ fontWeight: 900, fontSize: 40, letterSpacing: "0.03em", fontStretch: "expanded" }}>GOLSZ<span style={{ color: C.lime }}>.</span></div>
          <div style={{ fontSize: 10, letterSpacing: "0.3em", color: C.slate, fontWeight: 700, marginTop: 4 }}>{t("auth_tagline")}</div>
        </div>

        <div style={{ display: "flex", background: C.card, border: "1px solid " + C.line, borderRadius: 12, padding: 4, marginBottom: 16 }}>
          {[["signup", t("auth_signup")], ["login", t("auth_login")]].map(([m, l]) => (
            <button key={m} onClick={() => { setMode(m); setErr(""); setNotice(""); }} style={{ flex: 1, padding: "10px", borderRadius: 9, border: "none", cursor: "pointer", fontFamily: "inherit", fontWeight: 700, fontSize: 14, background: mode === m ? C.lime : "transparent", color: mode === m ? C.ink : C.slate }}>{l}</button>
          ))}
        </div>

        <div style={{ background: C.card, border: "1px solid " + C.line, borderRadius: 18, padding: 20 }}>
          {forgotMode ? (
            resetSent ? (
              <>
                <div style={{ background: "#D4AF371a", border: "1px solid #D4AF3744", borderRadius: 10, padding: "10px 12px", marginBottom: 14 }}>
                  <div style={{ fontSize: 10, letterSpacing: "0.12em", color: C.lime, fontWeight: 800, marginBottom: 4 }}>{t("auth_check_email")}</div>
                  <div style={{ color: C.chalk, fontSize: 12.5, lineHeight: 1.4 }}>{t("auth_reset_sent_pre")}{email.trim()}{t("auth_reset_sent_post")}</div>
                </div>
                <button onClick={() => { setForgotMode(false); setResetSent(false); setErr(""); }} style={{ width: "100%", background: "transparent", border: `1px solid ${C.line2}`, color: C.chalk, borderRadius: 12, padding: "13px", fontWeight: 700, fontSize: 14, cursor: "pointer", fontFamily: "inherit" }}>{t("auth_back_to_login")}</button>
              </>
            ) : (
              <>
                <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 6 }}>{t("auth_reset_title")}</div>
                <div style={{ fontSize: 12.5, color: C.slate, marginBottom: 14, lineHeight: 1.4 }}>{t("auth_reset_desc")}</div>
                <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder={t("auth_email")} type="email" style={field} />
                {err && (
                  <div style={{ background: "#B58A1A1a", border: "1px solid #B58A1A44", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
                    <div style={{ color: C.warnText, fontSize: 12.5, lineHeight: 1.4 }}>{err}</div>
                  </div>
                )}
                <button disabled={!email.trim() || busy} onClick={sendReset} style={{ width: "100%", background: C.lime, color: C.ink, border: "none", borderRadius: 12, padding: "14px", fontWeight: 800, fontSize: 15, cursor: (!email.trim() || busy) ? "default" : "pointer", opacity: (!email.trim() || busy) ? 0.45 : 1, fontFamily: "inherit" }}>{busy ? t("auth_sending") : t("auth_send_reset")}</button>
                <div style={{ textAlign: "center", marginTop: 14, fontSize: 13, color: C.slate }}>
                  <span onClick={() => { setForgotMode(false); setErr(""); }} style={{ color: C.lime, fontWeight: 700, cursor: "pointer" }}>{t("auth_back_to_login")}</span>
                </div>
              </>
            )
          ) : (
          <>
          {isSignup && (
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 10, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 10 }}>{t("auth_choose_plan")}</div>
              <div className="pricing-grid" style={{ display: "grid", gridTemplateColumns: "1fr", gap: 10 }}>
                {PLANS.map((pl) => {
                  const on = plan === pl.id;
                  return (
                    <button key={pl.id} onClick={() => setPlan(pl.id)} style={{
                      textAlign: "left", cursor: "pointer", fontFamily: "inherit", position: "relative",
                      background: on ? "#D4AF371a" : C.turf, border: `1.5px solid ${on ? C.lime : C.line2}`,
                      borderRadius: 14, padding: 16, display: "flex", flexDirection: "column", gap: 10,
                    }}>
                      {pl.id === "pro" && (
                        <span style={{ position: "absolute", top: -10, left: 14, background: C.lime, color: C.ink, fontSize: 9, fontWeight: 800, letterSpacing: "0.06em", padding: "3px 9px", borderRadius: 999 }}>{t("auth_most_popular")}</span>
                      )}
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                        <span style={{ fontSize: 15, fontWeight: 800, color: C.chalk }}>{pl.name}</span>
                        <div style={{ width: 18, height: 18, borderRadius: 99, border: `2px solid ${on ? C.lime : C.line2}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                          {on && <div style={{ width: 8, height: 8, borderRadius: 99, background: C.lime }} />}
                        </div>
                      </div>
                      <div>
                        <span style={{ fontSize: 24, fontWeight: 900, fontFamily: "'Space Mono', monospace", color: C.chalk }}>{pl.price === 0 ? "Free" : planPrice(pl.price)}</span>
                        {pl.price > 0 && <span style={{ fontSize: 12, color: C.slate }}> /mo</span>}
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 2 }}>
                        {t(`plan_${pl.id}_tag`) && (
                          <div style={{ fontSize: 11.5, color: C.slate, fontStyle: "italic" }}>{t(`plan_${pl.id}_tag`)}</div>
                        )}
                        {pl.featKeys.map((fk) => (
                          <div key={fk} style={{ display: "flex", alignItems: "flex-start", gap: 7, fontSize: 12, color: C.body, lineHeight: 1.35 }}>
                            <BadgeCheck size={13} color={C.lime} style={{ flexShrink: 0, marginTop: 1 }} /> {t(fk)}
                          </div>
                        ))}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {isSignupLike && (
            <input
              value={website} onChange={(e) => setWebsite(e.target.value)}
              name="website" autoComplete="off" tabIndex={-1} aria-hidden="true"
              style={{ position: "absolute", left: "-9999px", width: 1, height: 1, opacity: 0 }}
            />
          )}
          {isSignupLike && <input value={name} onChange={(e) => setName(e.target.value)} placeholder={isParentSignup ? t("auth_your_name") : t("auth_full_name")} style={field} />}
          <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder={isParentSignup ? t("auth_your_email") : t("auth_email")} type="email" style={field} />
          <input value={pw} onChange={(e) => setPw(e.target.value)} placeholder={t("auth_password")} type="password" style={{ ...field, marginBottom: isSignupLike ? 12 : 4 }} />
          {!isSignupLike && (
            <div style={{ textAlign: "right", marginBottom: 10 }}>
              <span onClick={() => { setForgotMode(true); setErr(""); setResetSent(false); }} style={{ color: C.slate, fontSize: 12, cursor: "pointer" }}>{t("auth_forgot")}</span>
            </div>
          )}

          {isSignup && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 11, color: C.slate, fontWeight: 700, marginBottom: 6 }}>{t("auth_dob")}</div>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={dobDay} onChange={(e) => setDobDay(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} placeholder="DD" inputMode="numeric" maxLength={2} style={{ ...dobField, flex: 1 }} />
                <input value={dobMonth} onChange={(e) => setDobMonth(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} placeholder="MM" inputMode="numeric" maxLength={2} style={{ ...dobField, flex: 1 }} />
                <input value={dobYear} onChange={(e) => setDobYear(e.target.value.replace(/[^0-9]/g, "").slice(0, 4))} placeholder="YYYY" inputMode="numeric" maxLength={4} style={{ ...dobField, flex: 1.4 }} />
              </div>
              {/* Corrected pre-launch directive: under 16 cannot self-signup
                  at all — this replaces the old "self-signup + note a
                  parent's email" pattern with a hard block + a real path
                  into the parent-creates-the-account flow instead. */}
              {requiresParentAccount && (
                <div style={{ marginTop: 10, background: "#B58A1A1a", border: `1px solid ${C.amberBorder || "#B58A1A44"}`, borderRadius: 10, padding: "10px 12px" }}>
                  <div style={{ fontSize: 12, color: C.warnText, marginBottom: 8, lineHeight: 1.4 }}>{t("auth_under16_notice")}</div>
                  <button onClick={() => { setMode("parent-signup"); setErr(""); setChildName(name); setChildDobDay(dobDay); setChildDobMonth(dobMonth); setChildDobYear(dobYear); setName(""); }} style={{ background: "none", border: "none", color: C.lime, fontWeight: 700, fontSize: 12.5, cursor: "pointer", fontFamily: "inherit", padding: 0 }}>{t("auth_switch_to_parent")}</button>
                </div>
              )}
              {!requiresParentAccount && (
                <div style={{ marginTop: 8, textAlign: "right" }}>
                  <span onClick={() => { setMode("parent-signup"); setErr(""); }} style={{ color: C.slate, fontSize: 11.5, cursor: "pointer" }}>{t("auth_signing_up_for_minor")}</span>
                </div>
              )}
            </div>
          )}

          {isParentSignup && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 11, color: C.slate, fontWeight: 700, marginBottom: 6 }}>{t("auth_athlete_info")}</div>
              <input value={childName} onChange={(e) => setChildName(e.target.value)} placeholder={t("auth_athlete_name")} style={field} />
              <div style={{ fontSize: 11, color: C.slate, fontWeight: 700, marginBottom: 6 }}>{t("auth_athlete_dob")}</div>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={childDobDay} onChange={(e) => setChildDobDay(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} placeholder="DD" inputMode="numeric" maxLength={2} style={{ ...dobField, flex: 1 }} />
                <input value={childDobMonth} onChange={(e) => setChildDobMonth(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} placeholder="MM" inputMode="numeric" maxLength={2} style={{ ...dobField, flex: 1 }} />
                <input value={childDobYear} onChange={(e) => setChildDobYear(e.target.value.replace(/[^0-9]/g, "").slice(0, 4))} placeholder="YYYY" inputMode="numeric" maxLength={4} style={{ ...dobField, flex: 1.4 }} />
              </div>
              {childDobOk && !childAgeOk && (
                <div style={{ marginTop: 8, fontSize: 11.5, color: C.amber, lineHeight: 1.4 }}>{t("auth_athlete_16_notice")}</div>
              )}
              <div style={{ marginTop: 10, textAlign: "right" }}>
                <span onClick={() => { setMode("signup"); setErr(""); }} style={{ color: C.slate, fontSize: 11.5, cursor: "pointer" }}>{t("auth_back_to_athlete_signup")}</span>
              </div>
            </div>
          )}

          {isSignupLike && TURNSTILE_SITE_KEY && <TurnstileWidget onToken={setTurnstileToken} />}

          {notice && (
            <div style={{ background: "#D4AF371a", border: "1px solid #D4AF3744", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
              <div style={{ fontSize: 10, letterSpacing: "0.12em", color: C.lime, fontWeight: 800, marginBottom: 4 }}>{t("auth_check_email")}</div>
              <div style={{ color: C.chalk, fontSize: 12.5, lineHeight: 1.4 }}>{notice}</div>
            </div>
          )}

          {err && (
            <div style={{ background: "#B58A1A1a", border: "1px solid #B58A1A44", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
              <div style={{ fontSize: 10, letterSpacing: "0.12em", color: C.amber, fontWeight: 800, marginBottom: 4 }}>{isSignupLike ? t("auth_couldnt_signup") : t("auth_couldnt_login")}</div>
              <div style={{ color: C.warnText, fontSize: 12.5, lineHeight: 1.4 }}>{err}</div>
              {unconfirmedEmail && !resendSent && (
                <button onClick={resendConfirmation} disabled={resendBusy} style={{
                  marginTop: 10, width: "100%", background: "transparent", border: `1px solid ${C.amber}`, color: C.warnText,
                  borderRadius: 9, padding: "9px", fontWeight: 700, fontSize: 12.5, cursor: resendBusy ? "default" : "pointer",
                  fontFamily: "inherit", opacity: resendBusy ? 0.6 : 1,
                }}>{resendBusy ? "Resending…" : "Resend confirmation email"}</button>
              )}
              {resendSent && (
                <div style={{ marginTop: 8, color: C.lime, fontSize: 12.5, fontWeight: 600 }}>
                  Sent — check {unconfirmedEmail} (and spam). This page will sign you in automatically once you confirm it.
                </div>
              )}
            </div>
          )}

          <button disabled={!ok || busy || confirmPolling} onClick={submit} style={{ width: "100%", background: C.lime, color: C.ink, border: "none", borderRadius: 12, padding: "14px", fontWeight: 800, fontSize: 15, cursor: (!ok || busy || confirmPolling) ? "default" : "pointer", opacity: (!ok || busy || confirmPolling) ? 0.45 : 1, fontFamily: "inherit" }}>{cta}</button>

          {isSignup && selected.price > 0 && (
            <div style={{ textAlign: "center", marginTop: 10, fontSize: 11, color: C.slate }}>{t("auth_secure_checkout")}</div>
          )}
          {isSignup && (
            <div style={{ textAlign: "center", marginTop: 6, fontSize: 11, color: C.slate }}>{t("prices_currency_note")}</div>
          )}

          {/* P0-3. Signup previously showed no Terms and no Privacy notice at
              all, and privacy.html was linked only from the marketing site —
              so an athlete handing over their date of birth, school, club and
              physical measurements never saw either document. Deliberately
              plain text with two real links rather than a pre-ticked box: a
              checkbox that is already ticked is not consent, and one more
              tap between an athlete and their account is not worth a dark
              pattern. Rendered for both the athlete and parent signup flows. */}
          {isSignupLike && (
            <div style={{ textAlign: "center", marginTop: 12, fontSize: 11, color: C.slate, lineHeight: 1.5 }}>
              {t("auth_legal_pre")}
              <a href="terms.html" target="_blank" rel="noopener noreferrer" style={{ color: C.lime, fontWeight: 700, textDecoration: "underline" }}>{t("auth_legal_terms")}</a>
              {t("auth_legal_mid")}
              <a href="privacy.html" target="_blank" rel="noopener noreferrer" style={{ color: C.lime, fontWeight: 700, textDecoration: "underline" }}>{t("auth_legal_privacy")}</a>
              {t("auth_legal_post")}
            </div>
          )}

          <div style={{ textAlign: "center", marginTop: 14, fontSize: 13, color: C.slate }}>
            {isSignup ? t("auth_already_have") : t("auth_new_to_golsz")}
            <span onClick={() => { setMode(isSignup ? "login" : "signup"); setErr(""); }} style={{ color: C.lime, fontWeight: 700, cursor: "pointer" }}>{isSignup ? t("auth_login") : t("auth_signup")}</span>
          </div>
          </>
          )}
        </div>
      </div>
    </div>
  );
}

/* Reached only via the PASSWORD_RECOVERY auth event, fired when the user
   opens the link from a "Forgot password?" email — Supabase's client
   auto-detects the recovery token in the URL and starts a real session
   scoped just enough to call updateUser({ password }). */
function ResetPassword({ onDone }) {
  const { t } = useLang();
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [done, setDone] = useState(false);
  const field = { width: "100%", background: C.turf, border: "1px solid " + C.line2, borderRadius: 12, color: C.chalk, padding: "13px 14px", fontSize: 15, fontFamily: "inherit", outline: "none", marginBottom: 12, boxSizing: "border-box" };

  async function save() {
    if (busy) return;
    if (!pw || pw.length < 6) { setErr(t("reset_pw_min_len")); return; }
    if (pw !== pw2) { setErr(t("reset_pw_mismatch")); return; }
    setBusy(true); setErr("");
    try {
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) throw error;
      setDone(true);
    } catch (e) {
      setErr((e && e.message) || t("reset_pw_err"));
    } finally { setBusy(false); }
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "calc(28px + env(safe-area-inset-top, 0px)) 18px 28px", background: "radial-gradient(1100px 560px at 50% -12%, " + C.turf + ", " + C.pitch + ")", fontFamily: "'Archivo', system-ui, sans-serif", color: C.chalk }}>
      <style>{CSS}</style>
      <div style={{ width: "100%", maxWidth: 430 }}>
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <div style={{ fontWeight: 900, fontSize: 40, letterSpacing: "0.03em", fontStretch: "expanded" }}>GOLSZ<span style={{ color: C.lime }}>.</span></div>
        </div>
        <div style={{ background: C.card, border: "1px solid " + C.line, borderRadius: 18, padding: 20 }}>
          {done ? (
            <>
              <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 6, color: C.lime }}>{t("reset_pw_updated")}</div>
              <div style={{ fontSize: 13, color: C.slate, marginBottom: 16 }}>{t("reset_pw_allset")}</div>
              <button onClick={onDone} style={{ width: "100%", background: C.lime, color: C.ink, border: "none", borderRadius: 12, padding: "14px", fontWeight: 800, fontSize: 15, cursor: "pointer", fontFamily: "inherit" }}>{t("reset_pw_continue")}</button>
            </>
          ) : (
            <>
              <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 6 }}>{t("reset_pw_set_new")}</div>
              <div style={{ fontSize: 12.5, color: C.slate, marginBottom: 14 }}>{t("reset_pw_choose")}</div>
              <input value={pw} onChange={(e) => setPw(e.target.value)} placeholder={t("reset_pw_new_ph")} type="password" style={field} />
              <input value={pw2} onChange={(e) => setPw2(e.target.value)} placeholder={t("reset_pw_confirm_ph")} type="password" style={{ ...field, marginBottom: 14 }} />
              {err && (
                <div style={{ background: "#B58A1A1a", border: "1px solid #B58A1A44", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
                  <div style={{ color: C.warnText, fontSize: 12.5, lineHeight: 1.4 }}>{err}</div>
                </div>
              )}
              <button disabled={busy} onClick={save} style={{ width: "100%", background: C.lime, color: C.ink, border: "none", borderRadius: 12, padding: "14px", fontWeight: 800, fontSize: 15, cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1, fontFamily: "inherit" }}>{busy ? t("events_saving") : t("reset_pw_update_btn")}</button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function BannedScreen({ onSignOut }) {
  const { t } = useLang();
  const [uid, setUid] = useState(null);
  const [showAppeal, setShowAppeal] = useState(false);
  const [reason, setReason] = useState("");
  const [submitted, setSubmitted] = useState(false);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (!sb) return;
    (async () => {
      const { data: { user } } = await sb.auth.getUser();
      if (user) setUid(user.id);
    })();
  }, []);

  // Trust & Safety Moderation System — appeals (migration 059). A banned
  // account is exactly the case the spec's "track appeals" ask is really
  // about, and this screen is the one place a banned user can still reach.
  async function submitAppeal() {
    if (!sb || !uid || !reason.trim() || busy) return;
    setBusy(true);
    try {
      await sb.from("moderation_appeals").insert({ user_id: uid, ban_related: true, reason: reason.trim().slice(0, 1000) });
      setSubmitted(true);
    } catch (e) { console.error("GOLSZ appeal submit error:", e); }
    setBusy(false);
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "calc(28px + env(safe-area-inset-top, 0px)) 18px 28px", background: "radial-gradient(1100px 560px at 50% -12%, " + C.turf + ", " + C.pitch + ")", fontFamily: "'Archivo', system-ui, sans-serif", color: C.chalk }}>
      <style>{CSS}</style>
      <div style={{ width: "100%", maxWidth: 430 }}>
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <div style={{ fontWeight: 900, fontSize: 40, letterSpacing: "0.03em", fontStretch: "expanded" }}>GOLSZ<span style={{ color: C.lime }}>.</span></div>
        </div>
        <div style={{ background: C.card, border: "1px solid " + C.line, borderRadius: 18, padding: 20, textAlign: "center" }}>
          <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 8, color: C.amber }}>{t("banned_title")}</div>
          <div style={{ fontSize: 13, color: C.slate, lineHeight: 1.5, marginBottom: 16 }}>{t("banned_message")}</div>
          {submitted ? (
            <div style={{ fontSize: 12.5, color: C.lime, marginBottom: 16 }}>{t("appeal_submitted")}</div>
          ) : showAppeal ? (
            <div style={{ marginBottom: 16, textAlign: "left" }}>
              <textarea value={reason} onChange={(e) => setReason(e.target.value)} rows={4} placeholder={t("appeal_placeholder")}
                style={{ width: "100%", background: C.turf, border: "1px solid " + C.line2, borderRadius: 10, color: C.chalk, padding: 10, fontSize: 13, fontFamily: "inherit", boxSizing: "border-box", marginBottom: 8 }} />
              <button onClick={submitAppeal} disabled={!reason.trim() || busy} style={{ width: "100%", background: C.lime, color: C.ink, border: "none", borderRadius: 10, padding: "11px", fontWeight: 700, fontSize: 13, cursor: reason.trim() ? "pointer" : "default", opacity: reason.trim() ? 1 : 0.5, fontFamily: "inherit" }}>
                {t("appeal_submit")}
              </button>
            </div>
          ) : (
            <button onClick={() => setShowAppeal(true)} style={{ width: "100%", background: "transparent", color: C.amber, border: `1px solid ${C.amberBorder}`, borderRadius: 12, padding: "12px", fontWeight: 700, fontSize: 13, cursor: "pointer", fontFamily: "inherit", marginBottom: 10 }}>
              {t("appeal_start")}
            </button>
          )}
          <button onClick={onSignOut} style={{ width: "100%", background: "transparent", color: C.chalk, border: `1px solid ${C.line2}`, borderRadius: 12, padding: "13px", fontWeight: 700, fontSize: 14, cursor: "pointer", fontFamily: "inherit" }}>{t("nav_signout")}</button>
        </div>
      </div>
    </div>
  );
}

function Root() {
  // A shared Passport link has to work for someone with no GOLSZ account at
  // all, so this short-circuits before any auth check — PublicPassport
  // never touches Auth/GolszApp/session state. ?share=<token> (migration
  // 078, revocable per-link sharing) is the current share flow;
  // ?public=<uid> (migration 046) is kept working for any link shared
  // before this change, both routed to the same component.
  const shareToken = typeof window !== "undefined" ? new URLSearchParams(window.location.search).get("share") : null;
  if (shareToken) return React.createElement(PublicPassport, { token: shareToken });
  const publicPassportId = typeof window !== "undefined" ? new URLSearchParams(window.location.search).get("public") : null;
  if (publicPassportId) return React.createElement(PublicPassport, { userId: publicPassportId });

  const paidReturn = typeof window !== "undefined" && /checkout=success/.test(window.location.search);
  const [authed, setAuthed] = useState(false);
  const [ready, setReady] = useState(false);
  const [freshSignup, setFreshSignup] = useState(false);
  const [recovering, setRecovering] = useState(false);
  const [banned, setBanned] = useState(false);
  const [banChecked, setBanChecked] = useState(false);

  useEffect(() => {
    // paidReturn only auto-authenticates in no-backend preview mode (no real
    // accounts exist to check). With a real backend, a URL param alone must
    // never grant access — that would let anyone skip signup entirely by
    // appending ?checkout=success. A real Stripe return still lands here
    // without a session if email confirmation is pending; Auth shows a
    // "payment received, confirm your email" notice for that case instead.
    if (!sb) { setAuthed(paidReturn); setReady(true); return; }
    let subscription;
    sb.auth.getSession().then(({ data }) => { setAuthed(!!(data && data.session)); setReady(true); });
    const r = sb.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") { setRecovering(true); return; }
      setAuthed(!!session);
    });
    subscription = r && r.data ? r.data.subscription : null;
    return () => { if (subscription) subscription.unsubscribe(); };
  }, []);

  // Runs whenever a session becomes active (fresh sign-in, or resuming an
  // existing one) — a banned account gets signed straight back out instead
  // of ever reaching GolszApp. This only stops them from *using* the app;
  // it doesn't touch their underlying Supabase Auth login (see migration
  // 019's notes in CLAUDE.md) — an admin ban is enforced here plus via RLS
  // (posts_write/athletes_read), not by disabling the credential itself.
  useEffect(() => {
    if (!sb || !authed) { setBanChecked(true); return; }
    setBanChecked(false);
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) return;
        const { data: prof } = await sb.from("profiles").select("is_banned").eq("id", user.id).single();
        if (prof && prof.is_banned) {
          setBanned(true);
          await sb.auth.signOut();
          setAuthed(false);
        }
      } catch (e) { console.error("GOLSZ ban check error:", e); }
      finally { setBanChecked(true); }
    })();
  }, [authed]);

  async function signOut() { if (sb) { try { await sb.auth.signOut(); } catch (e) {} } setAuthed(false); setRecovering(false); setBanned(false); }

  if (!ready) return React.createElement("div", { style: { minHeight: "100vh", background: C.pitch } });
  if (recovering) return React.createElement(ResetPassword, { onDone: () => setRecovering(false) });
  if (banned) return React.createElement(BannedScreen, { onSignOut: signOut });
  if (authed && !banChecked) return React.createElement("div", { style: { minHeight: "100vh", background: C.pitch } });
  return authed
    ? React.createElement(GolszApp, { onSignOut: signOut, startOnboarding: freshSignup })
    : React.createElement(Auth, { onDone: (fresh) => { setFreshSignup(!!fresh); setAuthed(true); }, paidReturn });
}


// Without this, any single component throwing during render (a bad
// API response shape, an unexpected null, etc.) unmounts the entire
// React tree — the whole app goes blank with nothing on screen and no
// way back except an actual page reload the person has to think to
// do themselves. This catches that at the root and offers a reload
// button instead of a silent blank screen. No error-tracking service
// (e.g. Sentry) is wired up yet — see CLAUDE.md's known gaps — so this
// only logs to the console, it doesn't report anywhere.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("GOLSZ uncaught render error:", error, info); }
  render() {
    if (this.state.error) {
      return React.createElement("div", {
        style: { minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, padding: 24, background: "#0B0F0C", color: "#F5F7F5", fontFamily: "'Archivo', system-ui, sans-serif", textAlign: "center" },
      },
        React.createElement("div", { style: { fontSize: 17, fontWeight: 800 } }, "Something went wrong."),
        React.createElement("div", { style: { fontSize: 13.5, color: "#9AA39C", maxWidth: 320 } }, "GOLSZ hit an unexpected error. Reloading usually fixes it."),
        React.createElement("button", {
          onClick: () => window.location.reload(),
          style: { background: "#D4AF37", color: "#0B0F0C", border: "none", borderRadius: 12, padding: "12px 22px", fontWeight: 800, fontSize: 14, cursor: "pointer", fontFamily: "inherit" },
        }, "Reload"),
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ErrorBoundary, null, React.createElement(LangProvider, null, React.createElement(Root))));
</script>
</body>
