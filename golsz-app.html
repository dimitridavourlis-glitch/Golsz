      )}

      {!showHistory && (
        <>
          {msgs && msgs.length > 1 && (
            <div style={{ display: "flex", gap: 8, overflowX: "auto", padding: "6px 12px", scrollbarWidth: "none" }} className="noscroll">
              {CHIPS.map((q) => <button key={q} onClick={() => send(q)} disabled={pending || !loaded} style={{ flex: "0 0 auto", background: "transparent", border: `1px solid ${C.line2}`, color: C.lime, borderRadius: 999, padding: "7px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap" }}>{q}</button>)}
            </div>
          )}
          {photoErr && <div style={{ fontSize: 11.5, color: C.amber, padding: "0 12px 6px" }}>{photoErr}</div>}
          {modErr && <div style={{ fontSize: 11.5, color: C.amber, padding: "0 12px 6px" }}>{modErr}</div>}
          {photo && (
            <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "0 12px 8px" }}>
              <div style={{ position: "relative", flexShrink: 0 }}>
                <img src={photo.dataUrl} style={{ width: 48, height: 48, objectFit: "cover", borderRadius: 10, border: `1px solid ${C.line2}`, display: "block" }} />
                <button onClick={clearPhoto} title={t("feed_remove_photo")} style={{ position: "absolute", top: -6, right: -6, background: "#000000cc", border: "none", borderRadius: "50%", width: 18, height: 18, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: C.chalk, padding: 0 }}>
                  <X size={11} />
                </button>
              </div>
              <span style={{ fontSize: 11, color: C.slate }}>{t("scout_photo_attached")}</span>
            </div>
          )}
          <div style={{ display: "flex", gap: 8, padding: "10px 12px 14px", borderTop: `1px solid ${C.line}` }}>
            <input ref={fileRef} type="file" accept="image/*" onChange={onPhotoChange} style={{ display: "none" }} />
            <button onClick={pickPhoto} disabled={pending || !loaded} title={t("scout_attach_photo")}
              style={{ flexShrink: 0, background: "none", border: `1px solid ${C.line2}`, borderRadius: 12, width: 46, color: C.lime, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", opacity: pending || !loaded ? 0.4 : 1 }}>
              <Plus size={19} />
            </button>
            {/* Send sits INSIDE the field (mockup) — one input affordance
                instead of a separate adjacent button. */}
            <div style={{ flex: 1, position: "relative", display: "flex" }}>
              <textarea rows={1} value={input} placeholder={t("scout_input_ph")} onChange={(e) => setInput(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input); } }}
                style={{ flex: 1, background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 12, color: C.chalk, padding: "11px 44px 11px 13px", fontSize: 14, fontFamily: "inherit", resize: "none", outline: "none" }} />
              <button onClick={() => send(input)} disabled={pending || !loaded || (!input.trim() && !photo)} title={t("scout_send")}
                style={{ position: "absolute", right: 6, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: C.lime, cursor: "pointer", padding: 6, display: "flex", opacity: pending || !loaded || (!input.trim() && !photo) ? 0.35 : 1 }}>
                <Send size={18} />
              </button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ============ shell ============ */
function SectionTitle({ children, noMargin }) {
  return <h2 style={{ fontSize: 13, fontWeight: 800, letterSpacing: "0.12em", color: C.slate, textTransform: "uppercase", margin: noMargin ? 0 : "6px 2px 10px" }}>{children}</h2>;
}
const card = { background: C.card, border: `1px solid ${C.line}`, borderRadius: 16, padding: 14, marginBottom: 12, boxShadow: "0 6px 18px -12px rgba(0,0,0,0.6)" };
// Cream "highlight" card (Helios theme) — reserved for the one or two most
// important cards on a screen (the Readiness composite score, My Next
// Move), never the default, so it reads as emphasis against the
// surrounding dark navy cards rather than becoming the new baseline.
// Text inside must use C.ink (dark), not C.chalk/C.slate — those are the
// dark-card light-text colors and would be unreadable on this light bg.
const highlightCard = { background: C.chalk, border: "none", borderRadius: 16, padding: 14, marginBottom: 12, boxShadow: "0 6px 18px -12px rgba(0,0,0,0.6)" };
const iconBtn = (color) => ({ display: "inline-flex", alignItems: "center", gap: 5, background: "none", border: "none", color, fontSize: 12.5, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", padding: 0 });
// Assistant bubbles sit on the near-black card surface, not the navy one —
// the mockup keeps the transcript quiet so only the athlete's own gold
// bubbles carry colour. Timestamps live inside the bubble, bottom-right.
const bubbleAgent = { background: C.card, border: `1px solid ${C.line}`, borderRadius: "4px 16px 16px 16px", padding: "11px 14px 8px", margin: "0 34px 10px 0", fontSize: 14, lineHeight: 1.55 };
const bubbleUser = { background: C.lime, color: C.ink, borderRadius: "16px 4px 16px 16px", padding: "11px 14px 8px", margin: "0 0 10px 34px", fontSize: 14, lineHeight: 1.55, fontWeight: 500 };
// Local-time HH:MM for a message. Scout messages are ephemeral in state
// (only role/text are persisted to scout_history), so a restored history
// has no per-message timestamp to show — this returns "" there rather
// than inventing a plausible-looking wrong time.
function msgTime(at) {
  if (!at) return "";
  try { return new Date(at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; }
}

function ReadinessCard({ label, score, sub }) {
  const color = score >= 70 ? C.lime : score >= 40 ? C.amber : C.slate;
  return (
    <div style={{ ...card, marginBottom: 0, textAlign: "center", padding: "16px 10px" }}>
      <div style={{ fontSize: 24, fontWeight: 900, color, fontFamily: "'Space Mono', monospace" }}>{score}</div>
      <div style={{ fontSize: 10.5, fontWeight: 700, color: C.chalk, marginTop: 4 }}>{label}</div>
      {sub && <div style={{ fontSize: 10, color: C.slate, marginTop: 2 }}>{sub}</div>}
    </div>
  );
}

// Home dashboard tab — Passport Strength (brief §6's 5 named sub-scores, all
// computed from data that already exists elsewhere in the app — nothing
// invented) + a read-only preview of My Next Move (the interactive version
// — filling the composer, etc. — stays on Scout, its natural home; tapping
// this preview just navigates there) + entry points into Scout/Passport.
// Its own fetch, not a subscriber to Scout's or Passport's state, since it
// can be the very first thing a returning athlete sees before either of
// those mount.
const READINESS_DIMENSIONS = ["profile_quality", "verification", "performance", "development", "pathway"];
// Icon per Free-tier categorical Readiness row (see readinessStatus in
// HomeTab) — purely presentational, same 4 real signals as before.
const READINESS_STATUS_ICON = { profile: User, film: Video, performance: Flame, pathway: Compass };
// Compact "YOUR PATH" strip (Master UX/UI redesign §5) — a snapshot, not
// the full branching map (that lives on the Plan tab's PathwayMap, §8/§9).
// Built entirely from data Home already fetches: no new schema. "Current"
// prefers the athlete's own club (a real, stated fact) over recruiting
// status (a category) over a plain "Developing" fallback so it never
// shows an empty node. The goal node stays muted/tappable-to-Scout when
// no pathway exists yet, rather than inventing a fake goal.
// Icon per node role (Master UX/UI redesign visual reference) — Home icon
// for the athlete's current position, Shield for their club/organization,
// Star for the stated goal, GraduationCap for the alternate branch (NCAA
// in practice, but driven by SPORT_PATHWAY_STAGES' altBranch, not
// hardcoded). Purely presentational — same underlying data as before.
function PathNode({ Icon, label, sub, filled, current, onClick, size, color }) {
  const accent = color || C.lime;
  const d = size || 30;
  return (
    <div onClick={onClick} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 5, minWidth: 0, cursor: onClick ? "pointer" : "default", flexShrink: 0 }}>
      <div style={{
        width: d, height: d, borderRadius: 99, display: "flex", alignItems: "center", justifyContent: "center",
        background: filled ? (color ? "#4A9EFF1a" : "#D4AF371a") : "transparent",
        border: `2px solid ${filled ? accent : C.line2}`,
        // The athlete's current position gets a soft halo — the mockup's
        // "YOU / NOW" node is the one thing that should catch the eye first.
        boxShadow: current ? `0 0 0 4px ${color ? "#4A9EFF1f" : "#D4AF371f"}` : "none",
      }}>
        <Icon size={d * 0.52} color={filled ? accent : C.slate} />
      </div>
      <div style={{ fontSize: 10, fontWeight: 800, color: filled ? C.chalk : C.slate, textAlign: "center", width: "100%", lineHeight: 1.2, overflowWrap: "anywhere" }}>{label}</div>
      {sub && <div style={{ fontSize: 8.5, fontWeight: 700, letterSpacing: "0.04em", color: current ? accent : C.slate, textAlign: "center", width: "100%", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{sub}</div>}
    </div>
  );
}
// P0-5. The athlete's own goal — profiles.goal_text — was stored, gated
// goal_defined, drove the conversion screen, and appeared in exactly one
// place in the entire client: an admin debug row. The Plan tab showed the
// pathway CATEGORY ("NCAA") in its place, which is a different thing: a
// category is GOLSZ's classification of the goal, not the goal. So an
// athlete could never read back what GOLSZ believed they were aiming for,
// and if Scout had misheard it there was no correction path anywhere.
//
// This is the one component that owns goal_text end to end. It renders the
// athlete's own sentence first, the pathway category underneath as
// secondary metadata, and it can be edited.
//
// It fetches its own row rather than taking one as a prop: Home and Plan
// both show it, and threading one copy of the value through both would let
// them drift after an edit on the other screen. One tiny select per mount
// is the cheaper mistake.
//
// `actingFor` is the parent-managed-child id (Phase 2) — null for an
// athlete editing their own goal. RLS (profiles_self: "(id = auth.uid()) OR
// is_parent_of(id)") is what actually authorises the write; passing the id
// here only decides which row we ask for.
// `readOnly` is what separates Home from Plan.
//
// Home and Plan both rendered this card, identically, edit button and all —
// which is most of why the two pages felt like the same page twice and why
// neither felt like it owned anything. Home is now a dashboard: it SHOWS the
// goal and hands you to Plan to change it. Plan is the workspace: it owns
// editing. Same component, one prop, so the two can never drift out of sync
// the way two copies would.
function GoalCard({ actingFor, onSaved, compact, readOnly, onOpenPlan }) {
  const { t } = useLang();
  const [uid, setUid] = useState(null);
  const [goalText, setGoalText] = useState("");
  const [goalSource, setGoalSource] = useState(null);
  const [pathwayType, setPathwayType] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [okMsg, setOkMsg] = useState("");

  useEffect(() => {
    if (!sb) { setLoaded(true); return; }
    let alive = true;
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { if (alive) setLoaded(true); return; }
        const target = actingFor || user.id;
        if (alive) setUid(target);
        const [{ data: prof }, { data: pw }] = await Promise.all([
          sb.from("profiles").select("goal_text, goal_source").eq("id", target).single(),
          sb.from("pathway_plan").select("pathway_type").eq("user_id", target).maybeSingle(),
        ]);
        if (!alive) return;
        setGoalText((prof && prof.goal_text) || "");
        setGoalSource((prof && prof.goal_source) || null);
        setPathwayType((pw && pw.pathway_type) || null);
      } catch (e) { console.error("GOLSZ goal load error:", e); }
      if (alive) setLoaded(true);
    })();
    return () => { alive = false; };
  }, [actingFor]);

  function startEdit() { setDraft(goalText); setErr(""); setOkMsg(""); setEditing(true); }

  async function save() {
    if (busy) return;
    // Sanitize before validating so a whitespace-only entry is caught as
    // empty rather than saved as " ".
    const clean = draft.replace(/\s+/g, " ").trim().slice(0, 300);
    if (!clean) { setErr(t("goal_card_required")); return; }
    // Short enough to be meaningless ("D1", "pro") gives Scout and the
    // pathway classifier nothing to work with, and would sit on the Passport
    // looking like a real goal.
    if (clean.length < 8) { setErr(t("goal_card_too_short")); return; }
    if (!sb || !uid) { setErr(t("goal_card_save_err")); return; }
    setBusy(true); setErr(""); setOkMsg("");
    try {
      // goal_defined is derived from the text in the same write, exactly as
      // api/scout.js's persistProfileUpdates() does it — the two writers must
      // never disagree about what "defined" means. goal_source marks this as
      // the athlete's own words, which is what stops Scout overwriting it
      // later (applyGoalAuthorship in api/scout.js).
      let { error } = await sb.from("profiles").update({
        goal_text: clean,
        goal_defined: true,
        goal_source: "athlete_edited",
        goal_updated_at: new Date().toISOString(),
      }).eq("id", uid);
      // Migrations in this project are applied by hand, so code can reach
      // production before its SQL does. Without this, an athlete typing their
      // goal on that day would get "couldn't save" for a column problem that
      // has nothing to do with them. PostgREST reports an unknown column as
      // PGRST204; retry with just the columns that have always existed.
      // The goal is saved either way — it simply isn't marked as
      // athlete-authored until 113 lands, which fails toward Scout being
      // allowed to update it rather than toward losing the athlete's words.
      if (error && (error.code === "PGRST204" || /goal_source|goal_updated_at/.test(error.message || ""))) {
        console.warn("GOLSZ goal authorship columns missing (migration 113 not applied) — saving without them.");
        ({ error } = await sb.from("profiles").update({ goal_text: clean, goal_defined: true }).eq("id", uid));
      }
      if (error) throw error;
      setGoalText(clean);
      setGoalSource("athlete_edited");
      setEditing(false);
      setOkMsg(t("goal_card_saved"));
      // Home's Passport-Strength strip, the Plan's pathway map and the
      // guided-onboarding gate all read goal_defined, so they have to be
      // told rather than left showing pre-edit state.
      if (onSaved) onSaved(clean);
    } catch (e) {
      // Never silent. A goal that looks saved but isn't is the exact failure
      // this whole item exists to fix.
      console.error("GOLSZ goal save error:", e);
      setErr((e && e.message) ? `${t("goal_card_save_err")} (${String(e.message).slice(0, 80)})` : t("goal_card_save_err"));
    } finally { setBusy(false); }
  }

  // A hole in the page reads as broken; a placeholder reads as pending.
  if (!loaded) return <SkeletonCard height={compact ? 84 : 92} compact={compact} />;
  const hasGoal = !!goalText;
  const inputStyle = { width: "100%", background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 10, color: C.chalk, padding: "10px 12px", fontSize: 13.5, fontFamily: "inherit", outline: "none", boxSizing: "border-box", resize: "vertical", minHeight: 66 };
  const btn = (bg, fg) => ({ background: bg, color: fg, border: "none", borderRadius: 9, padding: "7px 13px", fontSize: 12, fontWeight: 800, fontFamily: "inherit", cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1 });

  return (
    <div style={{ ...card, margin: compact ? 0 : undefined, marginBottom: compact ? 10 : undefined }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
        <Trophy size={13} color={C.lime} />
        <span style={{ fontSize: 8.5, letterSpacing: "0.1em", color: C.slate, fontWeight: 700 }}>{t("goal_card_title")}</span>
        {!editing && (readOnly ? (
          <button onClick={() => onOpenPlan && onOpenPlan()} style={{ marginLeft: "auto", background: "none", border: "none", color: C.slate, fontSize: 11, fontWeight: 800, fontFamily: "inherit", cursor: "pointer", padding: 0, display: "flex", alignItems: "center", gap: 4 }}>
            {t("goal_card_open_plan")}<ChevronRight size={13} color={C.slate} />
          </button>
        ) : (
          <button onClick={startEdit} style={{ marginLeft: "auto", background: "none", border: "none", color: C.lime, fontSize: 11, fontWeight: 800, fontFamily: "inherit", cursor: "pointer", padding: 0 }}>
            {hasGoal ? t("goal_card_edit") : t("goal_card_set")}
          </button>
        ))}
      </div>

      {editing ? (
        <div>
          <textarea value={draft} onChange={(e) => setDraft(e.target.value)} placeholder={t("goal_card_placeholder")} maxLength={300} style={inputStyle} />
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <button onClick={save} disabled={busy} style={btn(C.lime, C.ink)}>{busy ? t("goal_card_saving") : t("goal_card_save")}</button>
            <button onClick={() => { setEditing(false); setErr(""); }} disabled={busy} style={btn("transparent", C.slate)}>{t("goal_card_cancel")}</button>
          </div>
        </div>
      ) : hasGoal ? (
        <div>
          {/* The athlete's own sentence, first and largest. The pathway
              category below it is metadata ABOUT the goal, never a stand-in
              for it. */}
          <div style={{ fontSize: 14, fontWeight: 800, color: C.chalk, lineHeight: 1.35 }}>{goalText}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 7, flexWrap: "wrap" }}>
            {pathwayType && (
              <span style={{ fontSize: 10, fontWeight: 700, color: C.slate }}>
                {t("goal_card_pathway")}: <span style={{ color: C.info }}>{t("pathway_type_" + pathwayType)}</span>
              </span>
            )}
            <span style={{ fontSize: 10, fontWeight: 700, color: C.slate }}>
              {goalSource === "athlete_edited" ? t("goal_card_by_you") : t("goal_card_by_scout")}
            </span>
          </div>
        </div>
      ) : (
        <div>
          <div style={{ fontSize: 13, fontWeight: 700, color: C.chalk }}>{t("goal_card_empty")}</div>
          <div style={{ fontSize: 11.5, color: C.slate, marginTop: 4, lineHeight: 1.45 }}>{t("goal_card_empty_hint")}</div>
        </div>
      )}

      {err && <div style={{ color: C.amber, fontSize: 11.5, marginTop: 8, lineHeight: 1.4 }}>{err}</div>}
      {okMsg && !err && <div style={{ color: C.lime, fontSize: 11.5, marginTop: 8 }}>{okMsg}</div>}
    </div>
  );
}

function PathwayStrip({ athlete, pathwayRow, t, onNavigate }) {
  const current = (athlete && (athlete.club_name || athlete.recruiting_status)) || t("home_path_developing");
  const hasGoal = !!pathwayRow;
  const goalLabel = hasGoal ? t("pathway_type_" + pathwayRow.pathway_type) : t("home_path_goal_placeholder");
  const config = SPORT_PATHWAY_STAGES[athlete && athlete.sport] || SPORT_PATHWAY_STAGES.__default;
  // A ROUTE THIS SPORT HAS IS NOT A GOAL THIS ATHLETE SET.
  // This branch used to render for every Soccer athlete whose pathway was not
  // NCAA, labelled only "NCAA" and hanging off a dashed line — and Plan called
  // the same derivation "SECONDARY GOAL". Nobody had said it. It is shown now
  // as what it actually is: another route that exists for this sport, muted,
  // clearly not theirs. If they HAVE told Scout a secondary goal, that is a
  // real fact and gets said in their own words instead.
  const statedSecondary = statedContextValue(athlete && athlete.scout_context, "secondary_goal");
  const showAltBranch = config.altBranch && (!hasGoal || pathwayRow.pathway_type !== config.altBranch);
  const Line = () => <div style={{ width: 10, flexShrink: 0, height: 2, background: C.line2, marginTop: 15 }} />;
  return (
    <div style={{ padding: "6px 4px 14px" }}>
      <div style={{ display: "flex", alignItems: "flex-start" }}>
        <div style={{ flex: "1 1 0", minWidth: 0 }}><PathNode Icon={Home} label={t("home_path_you")} sub={t("home_path_now")} filled current /></div>
        <Line />
        <div style={{ flex: "1 1 0", minWidth: 0 }}><PathNode Icon={Shield} label={current} filled={!!(athlete && athlete.club_name)} /></div>
        <Line />
        <div style={{ flex: "1 1 0", minWidth: 0 }}><PathNode Icon={Star} label={goalLabel} filled={hasGoal} onClick={hasGoal ? undefined : () => onNavigate("scout")} /></div>
      </div>
      {statedSecondary ? (
        <div style={{ display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 8, marginTop: 4 }}>
          <div aria-hidden="true" style={{ width: 30, height: 16, marginRight: 4, borderLeft: `2px dashed ${C.info}`, borderBottom: `2px dashed ${C.info}`, borderBottomLeftRadius: 12 }} />
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 8.5, letterSpacing: "0.1em", color: C.slate, fontWeight: 700 }}>{t("plan_secondary_goal")}</div>
            <div style={{ fontSize: 12, fontWeight: 800, color: C.info }}>{statedSecondary}</div>
          </div>
        </div>
      ) : showAltBranch && (
        <div style={{ display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 6, marginTop: 4, opacity: 0.62 }}>
          <span style={{ fontSize: 9.5, color: C.slate, fontWeight: 700 }}>{t("home_path_also_possible")}</span>
          <GraduationCap size={13} color={C.slate} />
          <span style={{ fontSize: 10.5, color: C.slate, fontWeight: 800 }}>{t("pathway_type_" + config.altBranch)}</span>
        </div>
      )}
    </div>
  );
}

function HomeTab({ onNavigate, plan, onUpgrade, actingFor }) {
  const { t, tv } = useLang();
  const [loaded, setLoaded] = useState(!sb);
  const [athlete, setAthlete] = useState(null);
  const [quality, setQuality] = useState(null);
  const [verification, setVerification] = useState(null);
  const [performance, setPerformance] = useState(null);
  const [development, setDevelopment] = useState(null);
  const [pathway, setPathway] = useState(null);
  const [pathwayRow, setPathwayRow] = useState(null);
  const [recentBenchmarks, setRecentBenchmarks] = useState([]);
  const [monthly, setMonthly] = useState(null);
  const [name, setName] = useState("");
  const [avatarUrl, setAvatarUrl] = useState("");
  // Deterministic state-machine inputs (directive §11) — profileComplete
  // mirrors the exact same minimal heuristic GolszApp already gates the
  // whole app behind (!!athlete.sport), goalDefined comes straight off
  // the new profiles.goal_defined column (migration 093).
  const [profileComplete, setProfileComplete] = useState(false);
  const [goalDefined, setGoalDefined] = useState(false);

  // Extracted out of the mount effect so the goal editor can refresh Home
  // after a save — goal_defined feeds the pathway strip, the guided-onboarding
  // gate and computeNextMove(), all of which would otherwise keep rendering
  // pre-edit state until the athlete navigated away and back.
  // `who` is actingFor when a parent is managing a child (Phase 2), the
  // signed-in user otherwise. RLS decides whether the read is allowed; this
  // only chooses which row to ask for.
  const reload = React.useCallback(async () => {
    if (!sb) return;
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { setLoaded(true); return; }
        const who = actingFor || user.id;
        const [{ data: prof }, { data: ath }, { data: reqs }, { data: benchmarks }, { data: devItems }, { data: pathwayRow }, { data: targets }] = await Promise.all([
          sb.from("profiles").select("full_name, occupation, avatar_url, identity_verified, goal_defined, plan").eq("id", who).single(),
          sb.from("athletes").select("sport, position, club_name, grad_year, height_cm, weight_kg, country, recruiting_status, bio, highlights, timeline, scout_context").eq("id", who).single(),
          sb.from("verification_requests").select("status").eq("user_id", who).order("created_at", { ascending: false }).limit(1),
          sb.from("athlete_benchmarks").select("metric, value, unit, recorded_date").eq("user_id", who).order("recorded_date", { ascending: false }),
          sb.from("development_plan_items").select("status").eq("user_id", who),
          sb.from("pathway_plan").select("pathway_type, milestones, baseline_complete").eq("user_id", who).maybeSingle(),
          sb.from("outreach_targets").select("id, status, updated_at").eq("user_id", who),
        ]);
        if (prof && prof.full_name) setName(prof.full_name);
        if (prof && prof.avatar_url) setAvatarUrl(prof.avatar_url);
        setAthlete(ath || null);
        setProfileComplete(!!(ath && ath.sport));
        setGoalDefined(!!(prof && prof.goal_defined));
        setQuality(computeProfileQuality(ath, prof));
        const pendingReq = !!(reqs && reqs[0] && reqs[0].status === "pending");
        const isVerified = !!(prof && prof.identity_verified);
        setVerification({ score: isVerified ? 100 : pendingReq ? 50 : 0, status: isVerified ? "verified" : pendingReq ? "pending" : "none" });
        setPerformance(computePerformanceScore(benchmarks));
        setDevelopment(computeDevelopmentScore(devItems));
        setPathway(computePathwayScore(pathwayRow, (targets || []).length));
        setPathwayRow(pathwayRow || null);
        // Most-recently-recorded entry per metric, top 3 — "recent benchmark
        // progress" for the command-center card (brief §14).
        const latestByMetric = {};
        for (const b of (benchmarks || [])) if (!latestByMetric[b.metric]) latestByMetric[b.metric] = b;
        setRecentBenchmarks(Object.values(latestByMetric).slice(0, 3));
        // "This month" is deliberately a derived summary over data that
        // already exists (brief task note: "derived summary preferred over
        // heavy new schema") rather than a new monthly-plan table — active
        // development items + targets stuck in an outreach status long
        // enough to need a follow-up (same 7-day threshold
        // api/target-followup-reminders.js uses server-side for the actual
        // push reminder, kept in sync here for the on-screen count).
        const staleCutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
        const followUpStatuses = new Set(["preparing", "contacted", "follow_up"]);
        const staleTargets = (targets || []).filter((tg) => followUpStatuses.has(tg.status) && new Date(tg.updated_at).getTime() < staleCutoff).length;
        setMonthly({ activeDevItems: (devItems || []).filter((i) => i.status === "active").length, staleTargets });
      } catch (e) { console.error("GOLSZ home load error:", e); }
      setLoaded(true);
  }, [actingFor]);

  useEffect(() => { reload(); }, [reload]);

  if (!loaded) return <div style={{ padding: "40px 20px", textAlign: "center", color: C.slate, fontSize: 13 }}>{t("loading")}</div>;

  // Time-of-day greeting ("Good morning, Harry" — §5) — local device time,
  // no server round trip needed for something this low-stakes.
  const greetingHour = new Date().getHours();
  const greetingKey = greetingHour < 12 ? "home_greeting_morning" : greetingHour < 18 ? "home_greeting_afternoon" : "home_greeting_evening";
  // Composite Passport Strength — a plain average of the 5 named sub-scores,
  // shown alongside its own breakdown (never just the number alone) so it
  // stays explainable per brief §6's "WHY IS MY SCORE 72? / HOW DO I
  // IMPROVE IT?" requirement, rather than reading as an opaque judgment.
  const subScores = {
    profile_quality: quality ? quality.score : 0,
    verification: verification ? verification.score : 0,
    performance: performance ? performance.score : 0,
    development: development ? development.score : 0,
    pathway: pathway ? pathway.score : 0,
  };
  const composite = Math.round(READINESS_DIMENSIONS.reduce((sum, d) => sum + subScores[d], 0) / READINESS_DIMENSIONS.length);
  const weakest = READINESS_DIMENSIONS.reduce((min, d) => (subScores[d] < subScores[min] ? d : min), READINESS_DIMENSIONS[0]);
  const compositeColor = composite >= 70 ? C.lime : composite >= 40 ? C.amber : C.slate;
  // Same 3-tier score color, but readable on the cream highlightCard
  // background instead of the usual dark card — C.slate (steel blue) has
  // plenty of contrast on cream already; only the lowest tier needs a
  // darker swap since C.slate was originally picked for a dark background.
  const compositeColorOnCream = composite >= 70 ? C.lime : composite >= 40 ? C.amber : C.ink;

  // Categorical Readiness (Master UX/UI redesign §5/§12) — every plan,
  // including Free, sees the composite number and four plain-language
  // status words. Never "LOCK / UPGRADE TO UNLOCK" as the primary Free
  // experience. All four derive from data already fetched here, nothing
  // invented: FILM reuses profile_quality's own "Highlights" check
  // (athlete.highlights), the other three reuse their existing sub-score
  // objects directly.
  const filmAdded = !!(athlete && Array.isArray(athlete.highlights) && athlete.highlights.length > 0);
  const readinessStatus = [
    // "Strong", not "Complete". The threshold is 70% of Passport quality, so
    // an athlete could see PROFILE: Complete on Home while Scout was still
    // saying it did not know their age — which was live on 2026-08-08 and is
    // the kind of contradiction that makes both numbers untrustworthy.
    { key: "profile", ok: !!(quality && quality.score >= 70) },
    { key: "film", ok: filmAdded },
    { key: "performance", ok: !!(performance && performance.metricsTracked > 0) },
    // THREE STATES, NOT TWO — same lesson as the PROFILE row above.
    // computePathwayScore() returns pathwayStarted ("a pathway row exists")
    // AND hasPathway ("...and it has milestones"). Rendering that through a
    // single boolean collapsed the middle state onto "Not set", so an athlete
    // with a real pathway and no milestones yet saw the goal card say
    // "Pathway: Professional pathway" and this tile say "PATHWAY — Not set"
    // ON THE SAME SCREEN. The paid ReadinessCard below already handled all
    // three; only this free-tier tile was binary, so the page disagreed with
    // itself depending on plan.
    { key: "pathway", ok: !!(pathway && pathway.hasPathway), started: !!(pathway && pathway.pathwayStarted) },
  ];
  return (
    <div style={{ padding: "8px 12px 20px" }}>
      {name && (
        <div style={{ margin: "4px 2px 10px" }}>
          <div style={{ fontSize: 12, color: C.slate, fontWeight: 700 }}>{t(greetingKey)}</div>
          <div style={{ fontSize: 22, fontWeight: 900 }}>{name.split(" ")[0]}</div>
        </div>
      )}
      {athlete && (athlete.sport || athlete.club_name) && (
        // The identity row IS the Passport, summarised — so it opens it.
        <div onClick={() => onNavigate("profile")} role="button" tabIndex={0}
          onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onNavigate("profile"); } }}
          style={{ display: "flex", alignItems: "center", gap: 12, margin: "0 2px 16px", cursor: "pointer" }}>
          <div style={{ width: 52, height: 52, borderRadius: "50%", flexShrink: 0, overflow: "hidden", border: `1.5px solid ${C.lime}`, display: "flex", alignItems: "center", justifyContent: "center", background: `linear-gradient(135deg, ${C.turf}, ${C.line2})`, fontWeight: 800, fontSize: 17, color: C.lime, fontFamily: "'Space Mono', monospace" }}>
            {avatarUrl ? <img src={avatarUrl} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : initials(name || "?")}
          </div>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 14, fontWeight: 800, color: C.chalk, display: "flex", alignItems: "center", gap: 5 }}>
              {name}{verification && verification.status === "verified" && <BadgeCheck size={14} color={C.lime} />}
            </div>
            <div style={{ fontSize: 11.5, color: C.slate, lineHeight: 1.5 }}>
              {[tv(athlete.sport), athlete.position].filter(Boolean).join(" · ")}
              {athlete.club_name && <><br />{athlete.club_name}</>}
              {(athlete.height_cm || athlete.weight_kg || athlete.grad_year) && <><br />
                {[athlete.height_cm && `${athlete.height_cm} cm`, athlete.weight_kg && `${athlete.weight_kg} kg`, athlete.grad_year && t("home_grad_prefix") + athlete.grad_year].filter(Boolean).join(" · ")}
              </>}
            </div>
          </div>
        </div>
      )}

      {/* P0-5: the athlete's goal in their own words, above the path strip
          it is supposed to explain. The strip below shows the pathway
          CATEGORY as a node; without this card that category was the only
          representation of the goal anywhere in the product. */}
      <GoalCard actingFor={actingFor} readOnly onOpenPlan={() => onNavigate("targets")} />

      <SectionTitle>{t("home_path_title")}</SectionTitle>
      <PathwayStrip athlete={athlete} pathwayRow={pathwayRow} t={t} onNavigate={onNavigate} />

      <SectionTitle>{t("home_readiness_title")}</SectionTitle>
      {/* Home is a dashboard: every card is a way INTO the page that owns the
          thing it is describing. Passport Strength is computed from Passport
          content, so the card opens Passport. Without this the score was a
          dead end — an athlete could see FILM: Needed and have nowhere to go. */}
      <div onClick={() => onNavigate("profile")} role="button" tabIndex={0}
        onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onNavigate("profile"); } }}
        style={{ ...card, marginBottom: 10, cursor: "pointer" }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 8 }}>
          <span style={{ fontSize: 26, fontWeight: 900, color: compositeColor, fontFamily: "'Space Mono', monospace" }}>{composite}%</span>
          <span style={{ fontSize: 9, letterSpacing: "0.14em", color: C.slate, fontWeight: 700, display: "flex", alignItems: "center", gap: 4 }}>{t("home_readiness_composite")}<ChevronRight size={12} color={C.slate} /></span>
        </div>
        <div style={{ height: 6, borderRadius: 99, background: C.turf, overflow: "hidden", marginBottom: 16 }}>
          <div style={{ height: "100%", width: `${composite}%`, borderRadius: 99, background: compositeColor, transition: "width .3s ease" }} />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 8 }}>
          {readinessStatus.map((s) => {
            const Icon = READINESS_STATUS_ICON[s.key];
            return (
              <div key={s.key} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4, textAlign: "center" }}>
                <Icon size={17} color={s.ok ? C.lime : s.started ? C.amber : C.slate} />
                <span style={{ fontSize: 9, color: C.slate, fontWeight: 700, letterSpacing: "0.03em" }}>{t("home_readiness_row_" + s.key)}</span>
                <span style={{ fontSize: 9.5, fontWeight: 800, color: s.ok ? C.lime : s.started ? C.amber : C.slate }}>{t("home_readiness_status_" + s.key + "_" + (s.ok ? "ok" : s.started ? "started" : "no"))}</span>
              </div>
            );
          })}
        </div>
      </div>

      {!planKnown(plan) ? null : featureUnlocked(plan, "readiness") ? (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
            <ReadinessCard label={t("home_profile_quality")} score={subScores.profile_quality} sub={quality ? `${quality.filled}/${quality.total}` : ""} />
            <ReadinessCard label={t("home_verification")} score={subScores.verification} sub={t("home_verify_status_" + (verification ? verification.status : "none"))} />
            <ReadinessCard label={t("home_performance")} score={subScores.performance} sub={performance ? t("home_performance_sub").replace("{n}", performance.metricsTracked) : ""} />
            <ReadinessCard label={t("home_development")} score={subScores.development} sub={development ? `${development.done}/${development.total}` : ""} />
            <div style={{ gridColumn: "1 / -1" }}>
              <ReadinessCard label={t("home_pathway")} score={subScores.pathway} sub={pathway && pathway.hasPathway ? t("home_pathway_sub").replace("{n}", pathway.targetsCount) : pathway && pathway.pathwayStarted ? t("home_pathway_empty") : t("home_pathway_none")} />
            </div>
          </div>
          <div style={{ ...card, marginBottom: 14 }}>
            <div style={{ fontSize: 9, letterSpacing: "0.16em", color: C.slate, fontWeight: 700, marginBottom: 8 }}>{t("home_readiness_why_title")}</div>
            <div style={{ fontSize: 12.5, color: C.chalk, lineHeight: 1.6, marginBottom: 10 }}>{t("home_readiness_weakest_" + weakest)}</div>

                  <span style={{ fontSize: 12.5, fontWeight: 800, color: C.lime, fontFamily: "'Space Mono', monospace" }}>{b.value}{b.unit ? ` ${b.unit}` : ""}</span>

        </>
      ) : (
        // Value-first, not a blank lock box (§14): names the SPECIFIC
        // deeper thing paid unlocks, using the athlete's own weakest real
        // dimension rather than generic "upgrade" copy.
        <div onClick={onUpgrade} style={{ ...card, cursor: "pointer", marginBottom: 14, borderStyle: "dashed" }}>
          <div style={{ fontSize: 12.5, color: C.chalk, lineHeight: 1.6, marginBottom: 8 }}>{t("home_readiness_teaser_" + weakest)}</div>
          <div style={{ fontSize: 12, fontWeight: 800, color: C.lime }}>{t("feature_lock_cta")} →</div>

      {quality && quality.missing.length > 0 && (

          <div style={{ fontSize: 12.5, color: C.chalk, lineHeight: 1.6, marginBottom: 10 }}>{quality.missing.join(" · ")}</div>

        </div>
      )}

      {/* Scout entry (§5: "[ Ask Scout anything... ]") — a tappable field-
          styled row, not another square tile, so it reads as "type here"
          the way the real composer on Scout itself does. */}
      <div onClick={() => onNavigate("scout")} style={{ display: "flex", alignItems: "center", gap: 10, background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 12, padding: "12px 14px", marginTop: 6, marginBottom: 14, cursor: "pointer" }}>
        <Radar size={16} color={C.lime} style={{ flexShrink: 0 }} />
        <span style={{ fontSize: 13, color: C.slate }}>{t("home_scout_ask_ph")}</span>
      </div>

      <div style={{ display: "flex", gap: 18, padding: "0 2px" }}>
        <button onClick={() => onNavigate("profile")} style={{ background: "none", border: "none", color: C.slate, fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", padding: 0, display: "flex", alignItems: "center", gap: 5 }}><User size={14} color={C.lime} />{t("nav_passport")}</button>
        <button onClick={() => onNavigate("targets")} style={{ background: "none", border: "none", color: C.slate, fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", padding: 0, display: "flex", alignItems: "center", gap: 5 }}><Target size={14} color={C.lime} />{t("nav_plan")}</button>
      </div>
    </div>
  );
}

// Target school/club list + outreach status pipeline (migration 072) — the
// brief's "MOVE" phase, turning a plan into real outreach. status is a
// simple linear pipeline the athlete drives themselves; notes/draft_email
// save on blur (not on every keystroke) to avoid a network round trip per
// character while still never requiring an explicit "save" click.
const TARGET_STATUSES = ["researching", "preparing", "contacted", "responded", "follow_up", "opportunity"];
// Collapsible counter row (Master UX/UI redesign §9 — "NEXT 30 DAYS ...
// 0/3" style rows) — a thin header that expands to reveal real content,
// reused for all four Plan-tab sections instead of four separate
// always-open cards.
// ---- THREE STATES, DECIDED ONCE: loading / empty / content ---------------
//
// Plan could not tell an athlete apart "still loading", "nothing scheduled
// yet" and "something is broken" — all three rendered as absence. Deep-linking
// straight to Plan showed three grey bars and no goal, no map, for as long as
// the fetches took, which reads as a broken page rather than a loading one.
//
// SkeletonCard is what LOADING looks like: it holds the same space the real
// card will occupy, so nothing jumps, and it is visibly inert rather than
// missing. Components that fetch their own data must render this instead of
// returning null — GoalCard and PathwayPlan both returned null, which is why
// the top of Plan was simply a hole.
function SkeletonCard({ height, compact }) {
  return (
    <div aria-busy="true" style={{ ...card, margin: compact ? 0 : undefined, marginBottom: 10, height, opacity: 0.45,
      background: `linear-gradient(90deg, ${C.turf} 0%, ${C.line2} 50%, ${C.turf} 100%)`,
      backgroundSize: "200% 100%", animation: "golszShimmer 1.4s ease-in-out infinite" }} />
  );
}

// EMPTY is not a score. `0/0` was rendered in C.lime — the same green as
// "2/3" — so "nothing here yet" looked exactly like "all done", which is the
// opposite meaning. An empty row now shows a muted dash and, when opened,
// says what would put something in it.
function CollapsibleRow({ title, count, total, expanded, onToggle, children, emptyLabel }) {
  const isEmpty = total === 0 || total == null;
  return (
    <div style={{ ...card, marginBottom: 10 }}>
      <div onClick={onToggle} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", cursor: "pointer" }}>
        <span style={{ fontSize: 9, letterSpacing: "0.14em", color: C.slate, fontWeight: 700 }}>{title}</span>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          {total != null && (
            isEmpty
              ? <span style={{ fontSize: 11, fontWeight: 800, color: C.slate, fontFamily: "'Space Mono', monospace" }}>—</span>
              : <span style={{ fontSize: 11, fontWeight: 800, color: C.lime, fontFamily: "'Space Mono', monospace" }}>{count != null ? `${count}/${total}` : total}</span>
          )}
          {expanded ? <ChevronUp size={15} color={C.slate} /> : <ChevronDown size={15} color={C.slate} />}
        </div>
      </div>
      {expanded && (
        <div style={{ marginTop: 12 }}>
          {isEmpty && emptyLabel
            ? <div style={{ fontSize: 12.5, color: C.slate, lineHeight: 1.45 }}>{emptyLabel}</div>
            : children}
        </div>
      )}
    </div>
  );
}
// The athlete's backup plan. Theirs, not the sport's.
//
// Three states, three different renders, because they are three different
// facts and collapsing them is how this card got it wrong before:
//   STATED   (source athlete_stated) — say it back verbatim, attributed
//   INFERRED (source ai_inferred)    — a QUESTION, never a claim
//   ABSENT                           — an invitation, never a warning
//
// Written through set_athlete_context_field() (migration 125), which forces
// source: 'athlete_stated' server-side. The client cannot claim the athlete
// said something; it can only actually be them saying it.
//
// Suggestion chips come from the pathway_type_* vocabulary that already
// exists and is already translated — not an invented per-sport route list.
const BACKUP_ROUTE_SUGGESTIONS = ["ncaa", "naia", "juco", "canadian_university", "european_club", "professional"];

function BackupPlanCard({ athlete, actingFor, onSaved }) {
  const { t } = useLang();
  const [editing, setEditing] = React.useState(false);
  const [draft, setDraft] = React.useState("");
  const [busy, setBusy] = React.useState(false);
  const [err, setErr] = React.useState("");

  const ctx = (athlete && athlete.scout_context) || {};
  const stated = statedContextValue(ctx, "secondary_goal");
  const rawEntry = ctx.secondary_goal;
  // Only an INFERENCE is offered as a question. statedContextValue() already
  // refuses it as a value, so this is the one place it may surface at all.
  const inferred = (!stated && rawEntry && typeof rawEntry === "object" && rawEntry.source === "ai_inferred"
    && typeof rawEntry.value === "string" && rawEntry.value.trim()) ? rawEntry.value.trim() : null;
  const declined = !!ctx.secondary_goal_declined;

  async function write(field, value) {
    setBusy(true); setErr("");
    try {
      const { data: { user } } = await sb.auth.getUser();
      const target = actingFor || (user && user.id);
      if (!target) throw new Error("no athlete");
      const { error } = await sb.rpc("set_athlete_context_field", { p_athlete: target, p_field: field, p_value: value });
      if (error) throw error;
      setEditing(false);
      if (onSaved) onSaved();
    } catch (e) {
      setErr((e && e.message) || t("plan_backup_err"));
    } finally { setBusy(false); }
  }

  const label = (
    <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
      <GraduationCap size={13} color={C.info} />
      <span style={{ fontSize: 8.5, letterSpacing: "0.1em", color: C.slate, fontWeight: 700 }}>{t("plan_backup_title")}</span>
      {stated && !editing && (
        <button onClick={() => { setDraft(stated); setEditing(true); }} style={{ marginLeft: "auto", background: "none", border: "none", color: C.lime, fontSize: 11, fontWeight: 800, fontFamily: "inherit", cursor: "pointer", padding: 0 }}>{t("goal_card_edit")}</button>
      )}
    </div>
  );
  const btn = (bg, fg) => ({ background: bg, color: fg, border: "none", borderRadius: 9, padding: "7px 13px", fontSize: 12, fontWeight: 800, fontFamily: "inherit", cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1 });
  const errLine = err ? <div style={{ fontSize: 11.5, color: C.amber, marginTop: 8 }}>{err}</div> : null;

  if (editing) {
    const sport = athlete && athlete.sport;
    return (
      <div style={{ ...card }}>
        {label}
        <textarea value={draft} onChange={(e) => setDraft(e.target.value)} placeholder={t("plan_backup_placeholder")} maxLength={300}
          style={{ width: "100%", background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 10, color: C.chalk, padding: "10px 12px", fontSize: 13.5, fontFamily: "inherit", outline: "none", boxSizing: "border-box", resize: "vertical", minHeight: 58 }} />
        <div style={{ fontSize: 8.5, letterSpacing: "0.1em", color: C.slate, fontWeight: 700, margin: "10px 0 6px" }}>
          {t("plan_backup_suggestions").replace("{sport}", sport || t("plan_backup_your_sport"))}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {BACKUP_ROUTE_SUGGESTIONS.map((k) => (
            <button key={k} onClick={() => setDraft(t("pathway_type_" + k))}
              style={{ background: C.turf, color: C.chalk, border: `1px solid ${C.line2}`, borderRadius: 99, padding: "5px 11px", fontSize: 11.5, fontWeight: 700, fontFamily: "inherit", cursor: "pointer" }}>
              {t("pathway_type_" + k)}
            </button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
          <button disabled={busy} onClick={() => write("secondary_goal", draft)} style={btn(C.lime, C.ink)}>{busy ? t("goal_card_saving") : t("goal_card_save")}</button>
          <button disabled={busy} onClick={() => { setEditing(false); setErr(""); }} style={btn("transparent", C.slate)}>{t("goal_card_cancel")}</button>
        </div>
        {errLine}
      </div>
    );
  }

  if (stated) {
    return (
      <div style={{ ...card }}>
        {label}
        <div style={{ fontSize: 12.5, fontWeight: 800, color: C.chalk, lineHeight: 1.35 }}>{stated}</div>
        <div style={{ fontSize: 10, color: C.slate, fontWeight: 700, marginTop: 6 }}>{t("goal_card_by_you")}</div>
        {errLine}
      </div>
    );
  }

  // An inference earns its keep as a prompt and nowhere else. Once declined,
  // it is not asked again — clearing alone would let Scout re-infer and ask
  // a second time, which teaches the athlete the product does not listen.
  if (inferred && !declined) {
    return (
      <div style={{ ...card }}>
        {label}
        <div style={{ fontSize: 12.5, color: C.slate, lineHeight: 1.45 }}>{t("plan_backup_ask").replace("{x}", inferred)}</div>
        <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
          <button disabled={busy} onClick={() => write("secondary_goal", inferred)} style={btn(C.lime, C.ink)}>{t("plan_backup_yes")}</button>
          <button disabled={busy} onClick={() => write("secondary_goal_declined", "declined")} style={btn(C.turf, C.chalk)}>{t("plan_backup_no")}</button>
          <button disabled={busy} onClick={() => { setDraft(""); setEditing(true); }} style={btn("transparent", C.slate)}>{t("plan_backup_unsure")}</button>
        </div>
        {errLine}
      </div>
    );
  }

  return (
    <div style={{ ...card }}>
      {label}
      <div style={{ fontSize: 12.5, color: C.slate, lineHeight: 1.45 }}>{t("plan_backup_none")}</div>
      <div style={{ fontSize: 11.5, color: C.slate, opacity: 0.8, marginTop: 4 }}>{t("plan_backup_none_hint")}</div>
      <button onClick={() => { setDraft(""); setEditing(true); }} style={{ ...btn(C.turf, C.chalk), marginTop: 10 }}>{t("plan_backup_add")}</button>
      {errLine}
    </div>
  );
}

function Targets({ plan, onUpgrade, actingFor }) {
  const { t } = useLang();
  const [uid, setUid] = useState(null);
  // Bumped by GoalCard on a successful save so PathwayPlan below re-reads
  // (a new goal can change which pathway the athlete is on).
  const [goalVersion, setGoalVersion] = useState(0);
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [name, setName] = useState("");
  const [contactName, setContactName] = useState("");
  const [contactEmail, setContactEmail] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [expandedId, setExpandedId] = useState(null);
  // Master UX/UI redesign §9 — "+ ADD TARGET rather than exposing a large
  // CRM contact form immediately." Collapsed by default; opens on tap,
  // closes itself after a successful add.
  const [showAddTarget, setShowAddTarget] = useState(false);
  // Goal-summary cards + Season counter mirror PathwayPlan's own state
  // (see that component's onChange) rather than a second, independently
  // fetched copy of the same row.
  const [pathwayState, setPathwayState] = useState({ pathwayType: null, milestones: [], athlete: null });
  // "NEXT 30 DAYS" is deliberately the SAME readiness-gap signals Home
  // already computes (missing Passport fields, no highlights, no
  // benchmarks) — real data, not an invented task list. "NEXT 90 DAYS"
  // reuses development_plan_items. Own fetch here since Targets mounts
  // independently of Home.
  const [quality, setQuality] = useState(null);
  const [filmAdded, setFilmAdded] = useState(false);
  const [benchmarkCount, setBenchmarkCount] = useState(0);
  const [devItems, setDevItems] = useState([]);
  // NEXT 30 DAYS starts open — it is the row the athlete is meant to act
  // on now, and the mockup shows it expanded by default.
  const [expandedSection, setExpandedSection] = useState("30");

  useEffect(() => {
    if (!sb) { setLoaded(true); return; }
    (async () => {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { setLoaded(true); return; }
        setUid(user.id);
        const [{ data: targetsData, error }, { data: prof }, { data: ath }, { data: benchmarks }, { data: devItemsData }] = await Promise.all([
          sb.from("outreach_targets").select("id, name, contact_name, contact_email, status, notes, draft_email, fit_reasoning, created_at").eq("user_id", user.id).order("created_at", { ascending: false }),
          sb.from("profiles").select("full_name, occupation, avatar_url").eq("id", user.id).single(),
          sb.from("athletes").select("sport, position, club_name, grad_year, country, recruiting_status, bio, highlights, timeline, scout_context").eq("id", user.id).single(),
          sb.from("athlete_benchmarks").select("id").eq("user_id", user.id),
          sb.from("development_plan_items").select("id, focus_area, goal, status").eq("user_id", user.id),
        ]);
        if (error) throw error;
        setItems(targetsData || []);
        setQuality(computeProfileQuality(ath, prof));
        setFilmAdded(!!(ath && Array.isArray(ath.highlights) && ath.highlights.length > 0));
        setBenchmarkCount((benchmarks || []).length);
        setDevItems(devItemsData || []);
      } catch (e) { console.error("GOLSZ targets load error:", e); }
      setLoaded(true);
    })();
  }, []);

  async function addTarget() {
    if (!sb || !uid || !name.trim() || busy) return;
    setBusy(true); setErr("");
    try {
      const { data, error } = await sb.from("outreach_targets").insert({
        user_id: uid, name: name.trim().slice(0, 120),
        contact_name: contactName.trim().slice(0, 120) || null,
        contact_email: contactEmail.trim().slice(0, 200) || null,
      }).select("id, name, contact_name, contact_email, status, notes, draft_email, fit_reasoning, created_at").single();
      if (error) throw error;
      setItems((prev) => [data, ...prev]);
      setName(""); setContactName(""); setContactEmail("");
      setShowAddTarget(false);
    } catch (e) {
      setErr((e && e.message) || t("targets_add_err"));
    } finally { setBusy(false); }
  }

  async function updateTarget(id, updates) {
    setItems((prev) => prev.map((it) => (it.id === id ? { ...it, ...updates } : it)));
    try { await sb.from("outreach_targets").update({ ...updates, updated_at: new Date().toISOString() }).eq("id", id).eq("user_id", uid); }
    catch (e) { console.error("GOLSZ target update error:", e); }
  }

  async function removeTarget(id) {
    setItems((prev) => prev.filter((it) => it.id !== id));
    try { await sb.from("outreach_targets").delete().eq("id", id).eq("user_id", uid); }
    catch (e) { console.error("GOLSZ target delete error:", e); }
  }

  if (!loaded) return <div style={{ padding: "40px 20px", textAlign: "center", color: C.slate, fontSize: 13 }}>{t("loading")}</div>;

  // PLAN UNKNOWN IS NOT PLAN FREE.
  //
  // userPlan starts as null and is filled by a fetch, but hasFeature() does
  // `PLAN_RANK[plan || "free"]` — so a null plan scores as free and this gate
  // fires. A paying athlete opening Plan was shown "Upgrade to unlock", with
  // an upgrade button, for as long as the subscription took to load, and only
  // then saw their own Plan. Caught on a 4-second screenshot of a deep link.
  //
  // Coercing null to free is the right default for ENFORCEMENT (deny until
  // proven entitled). It is the wrong default for DISPLAY, where the honest
  // answer is "not known yet". Same distinction the rest of this page now
  // makes between loading, empty and absent.
  if (plan == null) return <SkeletonCard height={240} />;

  if (featureLocked(plan, "targets")) {
    return (
      <div style={{ padding: "8px 12px 20px" }}>
        <SectionTitle>{t("nav_targets")}</SectionTitle>
        <FeatureLock label={t("nav_targets")} teaser={t("targets_locked_teaser")} onUpgrade={onUpgrade} />
      </div>
    );
  }

  const inputStyle = { background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 9, color: C.chalk, padding: "9px 11px", fontSize: 12.5, fontFamily: "inherit", outline: "none", boxSizing: "border-box" };
  const sport = pathwayState.athlete && pathwayState.athlete.sport;
  const next30 = [
    { key: "profile", done: !!(quality && quality.score >= 70), label: t("plan_next30_profile") },
    { key: "film", done: filmAdded, label: t("plan_next30_film") },
    { key: "benchmark", done: benchmarkCount > 0, label: t("plan_next30_benchmark") },
  ];
  const next30Done = next30.filter((i) => i.done).length;
  const next90Done = devItems.filter((i) => i.status === "done").length;
  const seasonMilestones = pathwayState.milestones || [];
  const seasonDone = seasonMilestones.filter((m) => m.done).length;
  // Real season label ("2026 / 27 SEASON") from the current date rather than
  // a hardcoded year — northern-hemisphere seasons roll over mid-year, so
  // anything from July onward belongs to the season starting this year.
  const seasonStart = new Date().getMonth() >= 6 ? new Date().getFullYear() : new Date().getFullYear() - 1;
  const seasonLabel = t("plan_season_title").replace("{a}", seasonStart).replace("{b}", String((seasonStart + 1) % 100).padStart(2, "0"));

  return (
    <div style={{ padding: "8px 12px 20px" }}>
      <SectionTitle>{t("plan_page_title")}</SectionTitle>

      {/* P0-5. The PRIMARY GOAL card used to render the pathway CATEGORY
          ("NCAA") as the goal. It isn't one — it's GOLSZ's classification of
          the goal. GoalCard shows profiles.goal_text, the athlete's own
          sentence, and carries the category underneath as metadata. The
          secondary-goal card below is unchanged: it is genuinely about the
          alternate pathway branch, not about the athlete's stated aim. */}
      <GoalCard actingFor={actingFor} onSaved={() => setGoalVersion((v) => v + 1)} compact />
      {/* Same card shape as MY GOAL above, one step down the hierarchy —
          a backup plan that looked structurally different would read as a
          different KIND of thing, when it is the same kind with less weight. */}
      <BackupPlanCard athlete={pathwayState.athlete} actingFor={actingFor} onSaved={() => setGoalVersion((v) => v + 1)} />

      {/* Pathway plan (migration 076) lives on this same "Pathway/Plan" nav
          destination now (brief §14's nav concept) rather than buried on
          Passport — pathway_plan and targets share the same Pro+ minimum
          plan, so the page-level gate above already covers both. */}
      <PathwayPlan key={goalVersion} viewUserId={null} onChange={setPathwayState} />

      <CollapsibleRow title={t("plan_next_30_title")} count={next30Done} total={next30.length} expanded={expandedSection === "30"} onToggle={() => setExpandedSection(expandedSection === "30" ? null : "30")}>
        {next30.map((i) => (
          <div key={i.key} style={{ display: "flex", alignItems: "center", gap: 8, padding: "5px 0" }}>
            {i.done ? <BadgeCheck size={15} color={C.lime} /> : <div style={{ width: 14, height: 14, borderRadius: 4, border: `1.5px solid ${C.line2}`, flexShrink: 0 }} />}
            <span style={{ fontSize: 12.5, color: i.done ? C.slate : C.chalk, textDecoration: i.done ? "line-through" : "none" }}>{i.label}</span>
          </div>
        ))}
      </CollapsibleRow>

      <CollapsibleRow title={t("plan_next_90_title")} emptyLabel={t("plan_empty_90")} count={next90Done} total={devItems.length} expanded={expandedSection === "90"} onToggle={() => setExpandedSection(expandedSection === "90" ? null : "90")}>
        {devItems.length === 0 && <div style={{ fontSize: 12, color: C.slate }}>{t("dev_plan_empty")}</div>}
        {devItems.map((i) => (

      <CollapsibleRow title={t("targets_title")} emptyLabel={t("plan_empty_targets")} count={null} total={items.length} expanded={expandedSection === "targets"} onToggle={() => setExpandedSection(expandedSection === "targets" ? null : "targets")}>
        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>
          {!showAddTarget && <button onClick={() => setShowAddTarget(true)} style={{ ...iconBtn(C.lime), fontSize: 12 }}><Plus size={13} /> {t("targets_add")}</button>}
        </div>
        {showAddTarget && (
          <div style={{ ...card }}>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              <input autoFocus value={name} onChange={(e) => setName(e.target.value)} placeholder={t("targets_name_ph")} style={{ flex: "1 1 160px", ...inputStyle }} />
              <input value={contactName} onChange={(e) => setContactName(e.target.value)} placeholder={t("targets_contact_name_ph")} style={{ flex: "1 1 120px", ...inputStyle }} />
              <input value={contactEmail} onChange={(e) => setContactEmail(e.target.value)} placeholder={t("targets_contact_email_ph")} type="email" style={{ flex: "1 1 140px", ...inputStyle }} />
              <button onClick={addTarget} disabled={!name.trim() || busy} style={{ background: C.lime, color: C.ink, border: "none", borderRadius: 9, padding: "9px 14px", fontWeight: 800, fontSize: 12.5, cursor: "pointer", fontFamily: "inherit", opacity: (!name.trim() || busy) ? 0.5 : 1 }}>
                {busy ? "…" : t("targets_add")}
              </button>
              <button onClick={() => setShowAddTarget(false)} style={{ ...iconBtn(C.slate), fontSize: 12.5 }}>{t("pathway_collapse")}</button>
            </div>
            {err && <div style={{ fontSize: 11.5, color: C.amber, marginTop: 6 }}>{err}</div>}
          </div>

        {items.length === 0 && <div style={{ fontSize: 12.5, color: C.slate, padding: "10px 2px" }}>{t("targets_empty")}</div>}

        {items.map((it) => (
          <div key={it.id} style={{ ...card }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13.5, fontWeight: 800, color: C.chalk }}>{it.name}</div>
                {(it.contact_name || it.contact_email) && <div style={{ fontSize: 11.5, color: C.slate }}>{[it.contact_name, it.contact_email].filter(Boolean).join(" · ")}</div>}
                {it.fit_reasoning && <div style={{ fontSize: 11, color: C.lime, marginTop: 2 }}>{it.fit_reasoning}</div>}
              </div>
              <select value={it.status} onChange={(e) => updateTarget(it.id, { status: e.target.value })} style={{ background: C.turf, border: `1px solid ${C.line2}`, borderRadius: 8, color: C.chalk, padding: "6px 8px", fontSize: 11, fontFamily: "inherit", flexShrink: 0 }}>
                {TARGET_STATUSES.map((s) => <option key={s} value={s}>{t("targets_status_" + s)}</option>)}
