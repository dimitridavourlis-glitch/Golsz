<style>

  #root{min-height:100vh;min-height:100dvh;}
  /* MEASURED 2026-08-24: domContentLoaded 1313ms, first-contentful-paint
     3132ms. The ~1.8s gap is Babel compiling 884KB of JSX in the browser,
     and until now every one of those milliseconds was a blank screen — on a
     mid-range phone, several times longer. This does not make the app load
     faster; it stops the wait from looking like a broken page, which is the

  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;}

     the whole point of this screen is to paint before anything is fetched.
     Not text either — the wordmark is set in Archivo, which has not loaded

  #boot .b{width:132px;height:3px;border-radius:3px;background:rgba(247,244,234,0.10);overflow:hidden;}

<script>
// Boot-screen copy in the saved language. It sits RIGHT AFTER #boot, before the huge inert JSX block,
// so a fr/es/el visitor never sees the English line first: the browser can paint while it parses.
// The app (and its I18N) has not loaded yet, so this reads golsz-lang itself. bootFailed() at the
// bottom of the page reuses it. Plain text only: these strings go into innerHTML there.
// [failure message, Reload button, loading line]
var BOOT_COPY = {
  en: ["Something stopped GOLSZ loading.", "Reload", "Loading…"],
  fr: ["Quelque chose a empêché GOLSZ de se charger.", "Recharger", "Chargement…"],
  es: ["Algo impidió que GOLSZ se cargara.", "Recargar", "Cargando…"],
  el: ["Κάτι εμπόδισε τη φόρτωση του GOLSZ.", "Επαναφόρτωση", "Φόρτωση…"]
};
function bootCopy() {
  var lang = "en";
  try { var saved = localStorage.getItem("golsz-lang"); if (saved && BOOT_COPY.hasOwnProperty(saved)) lang = saved; } catch (e) {}
  return BOOT_COPY[lang];
}
(function () {
  var line = document.querySelector("#boot .m");
  if (line) line.textContent = bootCopy()[2];
})();
</script>
<!-- The app itself is golsz-app.jsx. `npm run compile` (tools/precompile.cjs) builds it into js/app.js, which the loader below runs. -->
<script>
(function () {
  // THE LOADER: IT RUNS js/app.js ONLY AFTER THE BOOT SCREEN HAS PAINTED.
  //
  // A boot state that the main thread never lets paint is not a boot state. When the
  // app was compiled in the browser (Babel, ~1.8 s of blocked main thread), the compile
  // began before the first frame and the athlete watched a WHITE SCREEN for all of it
  // (measured: first paint 3336ms). The app is compiled ahead of time now
  // (tools/precompile.cjs builds golsz-app.jsx into js/app.js), and the same rule
  // still holds: the three libraries in <head> are `defer`red so the boot logo paints
  // while they download, <link rel="preload"> fetches js/app.js alongside them, and
  // compile() below injects it two animation frames later. See compile().
  var started = false, domReady = false;
  // The libraries in <head> are deferred, so they have not necessarily run yet. They run, in order,
  // just before DOMContentLoaded; a script injected earlier could run first and find no React.
  // readyState "interactive" is NOT enough: it is already set while deferred scripts are still
  // downloading. So compile() waits for DOMContentLoaded itself (or readyState "complete", for a
  // page that has already finished). The rAF and 300 ms triggers below just call it again.
  function compile() {
    if (started) return;
    if (document.readyState !== "complete" && !domReady) return;
    started = true;
    // THE APP IS ALREADY COMPILED. This used to hand 985,000 characters of JSX
    // to babel-standalone and block the main thread for ~1.8s; tools/precompile.cjs
    // now does that once, at author time, and this loads the result.
    // An EXTERNAL script rather than an inline one on purpose: V8 can
    // stream-parse it during download and code-cache it across loads, neither
    // of which it can do for a string embedded in the HTML.
    // ONE version string for the whole build. precompile stamps the app.js
    // reference; the dictionary derives its own from that, so the two can
    // never disagree about which build they belong to. Stamping only one
    // would eventually serve a fresh bundle beside a dictionary cached from
    // a previous deploy - and a stale dictionary is SILENT, because every
    // missing key falls back to English rather than erroring.
    var APP_SRC = "js/app.js?v=a62778635c825de4";
    var BUILD = APP_SRC.slice(APP_SRC.indexOf("?v=") + 3);
    function loadApp() {
      var s = document.createElement("script");
      s.src = APP_SRC;
      // A blank screen with a running loading bar is the worst failure this page
      // has, because it is indistinguishable from "slow". If the script cannot
      // load, say so and offer the one action that helps.
      s.onerror = function () { bootFailed("load"); };
      document.body.appendChild(s);
    }
    // THE DICTIONARY FIRST, AND ONLY THE ONE IN USE.
    //
    // js/app.js carries English only; `npm run compile` writes French, Spanish
    // and Greek to js/i18n/<lang>.js beside it, and this is what puts the
    // athlete's own language on the page.
    //
    // onerror loads the app ANYWAY. Every lookup already falls back to
    // I18N.en, so a dictionary that fails to arrive means a working app in
    // English - never a blank screen, and never raw key names.
    // WHICH LANGUAGE, decided once and here. The app is four languages but
    // used to start in English for everybody who had not already picked one,
    // so a Quebec visitor met an English app next to a French-speaking
    // operator. Order: a remembered choice always wins, then ?lang=, then the
    // browser's own preference list in order (so "fr-CA" is French and
    // ["de","es"] is Spanish), then English. The result is SAVED when nothing
    // was, so LangProvider, the error boundary and the boot copy, which all
    // read "golsz-lang", agree with the dictionary fetched below.
    function pickLang() {
      var supported = { en: 1, fr: 1, es: 1, el: 1 };
      try {
        var saved = localStorage.getItem("golsz-lang");
        if (saved && supported.hasOwnProperty(saved)) return saved;
      } catch (e) {}
      try {
        var q = /[?&]lang=([a-z]{2})(?![a-z])/i.exec(location.search);
        if (q && supported.hasOwnProperty(q[1].toLowerCase())) return q[1].toLowerCase();
      } catch (e) {}
      try {
        var prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
        for (var i = 0; i < prefs.length; i++) {
          var pref = String(prefs[i] || "").slice(0, 2).toLowerCase();
          if (supported.hasOwnProperty(pref)) return pref;
        }
      } catch (e) {}
      return "en";
    }
    var want = pickLang();
    try { if (!localStorage.getItem("golsz-lang")) localStorage.setItem("golsz-lang", want); } catch (e) {}
    if (want === "en") { loadApp(); return; }
    var d = document.createElement("script");
    d.src = "js/i18n/" + want + ".js?v=" + BUILD;
    d.onload = loadApp;
    d.onerror = loadApp;
    document.body.appendChild(d);
  }
  // Nothing above can detect the script loading but THROWING. The watchdog
  // can: if React has not mounted by now, something is wrong and the athlete
  // is looking at an animation that will never end.
  // BOOT_COPY / bootCopy() (failure text in the saved language) are defined in
  // the small script right after #boot, so the loading line is translated before first paint.
  function bootFailed(why) {
    var boot = document.getElementById("boot");
    if (!boot || boot.getAttribute("data-failed")) return;
    boot.setAttribute("data-failed", why);
    var copy = bootCopy();
    boot.innerHTML = '<div style="padding:28px 22px;text-align:center;font:600 14px/1.55 Archivo,system-ui,sans-serif;color:#8B96A8">'
      + copy[0]
      + '<div style="margin-top:14px"><button onclick="location.reload()" style="font:800 13px Archivo,system-ui,sans-serif;padding:11px 20px;border-radius:10px;border:1px solid #D4AF37;background:none;color:#D4AF37;cursor:pointer">' + copy[1] + '</button></div></div>';
  }
  // THE TEST IS "IS THE BOOT STATE STILL THERE", not "does #root have a child".
  // The boot animation LIVES inside #root, so root.firstChild is truthy from
  // the first byte — the first version of this watchdog could never fire, and
  // a deliberately broken bundle sat on a blank screen for as long as I let it.
  // React's createRoot().render() replaces #root's children, so the boot
  // element still being in the document is the honest signal that it never ran.
  setTimeout(function () {
    if (document.getElementById("boot")) bootFailed("timeout");
  }, 12000);
  // Two frames: the first is scheduled before the paint, the second runs after
  // it, so the boot state is on screen before the main thread is taken.
  if (typeof requestAnimationFrame === "function") {
    requestAnimationFrame(function () { requestAnimationFrame(function () { compile(); }); });
  }
  // Background tabs never fire rAF. Without this the app would never boot in
  // one, which is strictly worse than the blank screen this replaces.
  setTimeout(compile, 300);
  // The gate above: deferred libraries have run by now, so start the app.
  document.addEventListener("DOMContentLoaded", function () { domReady = true; compile(); });
})();
</script>
